<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vie Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f5f5f7;
            --text-color: #1d1d1f;
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(255, 255, 255, 0.4);
            --accent-color: #0066cc;
            --secondary-text: #86868b;
            --header-bg: rgba(245, 245, 247, 0.8);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --search-bg: rgba(0, 0, 0, 0.05);
            --tag-bg: rgba(0, 102, 204, 0.1);
        }

        [data-theme="dark"] {
            --bg-color: #000000;
            --text-color: #f5f5f7;
            --card-bg: rgba(28, 28, 30, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-color: #2997ff;
            --secondary-text: #86868b;
            --header-bg: rgba(0, 0, 0, 0.8);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --search-bg: rgba(255, 255, 255, 0.1);
            --tag-bg: rgba(41, 151, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
            line-height: 1.5;
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--header-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-container {
            position: relative;
        }

        .search-input {
            background-color: var(--search-bg);
            border: none;
            border-radius: 20px;
            padding: 0.5rem 1rem 0.5rem 2.5rem;
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.9rem;
            width: 250px;
            transition: width 0.3s ease, background-color 0.3s ease;
            outline: none;
        }
        
        .search-input:focus {
            background-color: var(--search-bg);
            box-shadow: 0 0 0 2px var(--accent-color);
        }

        .search-icon {
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: var(--secondary-text);
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .theme-toggle:hover {
            background-color: var(--search-bg);
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .filter-btn {
            background: none;
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .filter-btn:hover {
            background-color: var(--search-bg);
        }

        .filter-btn.active {
            background-color: var(--text-color);
            color: var(--bg-color);
            border-color: var(--text-color);
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            letter-spacing: -0.01em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
        }

        .card-cover-wrapper {
            aspect-ratio: 16/10;
            background-color: rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .card-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-cover {
            transform: scale(1.05);
        }

        .card-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-type {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--secondary-text);
            margin-bottom: 1.5rem;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--secondary-text);
            border-top: 1px solid var(--card-border);
            padding-top: 1rem;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 1rem;
        }

        .tag {
            background-color: var(--tag-bg);
            color: var(--accent-color);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .placeholder-cover {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--secondary-text);
            opacity: 0.5;
            background: linear-gradient(135deg, var(--search-bg) 0%, transparent 100%);
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: row;
            }
            .search-input {
                width: 180px;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }
        }
        
        @media (max-width: 480px) {
            header {
                padding: 1rem;
            }
            .search-input {
                width: 140px;
            }
            main {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            📚 Vie Library
        </div>
        <div class="controls">
            <div class="search-container">
                <svg class="search-icon" viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Search...">
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="moonIcon">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="sunIcon" style="display:none;">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
        </div>
    </header>

    <main>
        <div class="filters" id="filters">
            <button class="filter-btn active" data-filter="all">All Items</button>
            <button class="filter-btn" data-filter="book">Books</button>
            <button class="filter-btn" data-filter="app">Apps</button>
        </div>

        <div id="libraryContainer" class="grid">
            <!-- Items will be rendered here -->
        </div>
    </main>

    <script>
        // Theme Management
        const themeToggle = document.getElementById('themeToggle');
        const moonIcon = document.getElementById('moonIcon');
        const sunIcon = document.getElementById('sunIcon');
        
        function setTheme(isDark) {
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            if (isDark) {
                moonIcon.style.display = 'none';
                sunIcon.style.display = 'block';
            } else {
                moonIcon.style.display = 'block';
                sunIcon.style.display = 'none';
            }
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Initialize Theme
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        setTheme(savedTheme === 'dark' || (!savedTheme && prefersDark));

        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            setTheme(!isDark);
        });

        // Library Data Management
        let libraryData = [];
        let currentFilter = 'all';
        let searchQuery = '';

        const libraryContainer = document.getElementById('libraryContainer');
        const filters = document.getElementById('filters');
        const searchInput = document.getElementById('searchInput');

        async function fetchLibraryData() {
            try {
                // Fetch from data/library.json
                const response = await fetch('data/library.json');
                if (!response.ok) throw new Error('Network response was not ok');
                libraryData = await response.json();
                
                // Update filter counts automatically
                const total = libraryData.length;
                const booksCount = libraryData.filter(item => item.type === 'book').length;
                const appsCount = libraryData.filter(item => item.type === 'app').length;
                
                document.querySelector('[data-filter="all"]').textContent = `All Items (${total})`;
                document.querySelector('[data-filter="book"]').textContent = `Books (${booksCount})`;
                document.querySelector('[data-filter="app"]').textContent = `Apps (${appsCount})`;

                renderLibrary();
            } catch (error) {
                console.error('Error fetching library data:', error);
                libraryContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 2rem;">Could not load library data. Ensure data/library.json exists.</p>';
            }
        }

        function createCardHTML(item) {
            const emoji = item.type === 'book' ? '📖' : '🧰';
            const typeLabel = item.type === 'book' ? 'Book' : 'App';
            const tagsHTML = item.tags ? item.tags.map(tag => `<span class="tag">${tag}</span>`).join('') : '';
            
            // Handle fallback for cover image
            const coverHTML = item.cover 
                ? `<img src="${item.cover}" alt="${item.title}" class="card-cover" onerror="this.onerror=null; this.outerHTML='<div class=\\'placeholder-cover\\'>${emoji}</div>';">`
                : `<div class="placeholder-cover">${emoji}</div>`;

            return `
                <a href="${item.url}" class="card" target="_blank" rel="noopener noreferrer">
                    <div class="card-cover-wrapper">
                        ${coverHTML}
                    </div>
                    <div class="card-content">
                        <div class="card-type">
                            <span>${emoji} ${typeLabel}</span>
                            ${item.version ? `<span style="color: var(--secondary-text); font-weight: 500;">v${item.version}</span>` : ''}
                        </div>
                        <h3 class="card-title">${item.title}</h3>
                        ${tagsHTML ? `<div class="tags">${tagsHTML}</div>` : ''}
                        <p class="card-desc">${item.description || ''}</p>
                        
                        <div class="card-meta">
                            <span>${item.author || 'Unknown'}</span>
                            <span>${item.updated ? new Date(item.updated).toLocaleDateString() : ''}</span>
                        </div>
                    </div>
                </a>
            `;
        }

        function renderLibrary() {
            const filteredData = libraryData.filter(item => {
                const matchesFilter = currentFilter === 'all' || item.type === currentFilter;
                const searchLower = searchQuery.toLowerCase();
                const matchesSearch = !searchQuery || 
                    item.title.toLowerCase().includes(searchLower) || 
                    (item.description && item.description.toLowerCase().includes(searchLower)) ||
                    (item.tags && item.tags.some(t => t.toLowerCase().includes(searchLower)));
                
                return matchesFilter && matchesSearch;
            });

            if (filteredData.length === 0) {
                libraryContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 2rem; color: var(--secondary-text);">No items found matching your criteria.</p>';
                return;
            }

            libraryContainer.innerHTML = filteredData.map(item => createCardHTML(item)).join('');
        }

        // Event Listeners
        filters.addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                renderLibrary();
            }
        });

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderLibrary();
        });

        // Initial Load
        fetchLibraryData();

    </script>
</body>
</html>

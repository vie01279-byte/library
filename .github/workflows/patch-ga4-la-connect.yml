name: Patch GA4 into LA-CONNECT

on:
  push:
    branches:
      - chore/ga4-la-connect
    paths:
      - '.github/workflows/patch-ga4-la-connect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert GA4 tag safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('books/la-connect.html')
          s = p.read_text(encoding='utf-8')
          measurement_id = 'G-FX6Q6TRYE1'
          if measurement_id in s:
              print('GA4 tag already present; no change needed.')
              raise SystemExit(0)
          marker = '<meta charset="utf-8">'
          if s.count(marker) != 1:
              raise SystemExit(f'Expected exactly one {marker!r}, found {s.count(marker)}; refusing to modify.')
          tag = '''<meta charset="utf-8">\n  <!-- Google tag (gtag.js) — Vie Library GA4 -->\n  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FX6Q6TRYE1"></script>\n  <script>\n    window.dataLayer = window.dataLayer || [];\n    function gtag(){dataLayer.push(arguments);}\n    gtag('js', new Date());\n    gtag('config', 'G-FX6Q6TRYE1');\n  </script>'''
          p.write_text(s.replace(marker, tag, 1), encoding='utf-8')
      - name: Verify only GA4 insertion
        shell: bash
        run: |
          grep -q "G-FX6Q6TRYE1" books/la-connect.html
          git diff --check
          git diff --stat
          git diff -- books/la-connect.html | head -80
      - name: Commit patched page
        shell: bash
        run: |
          if git diff --quiet -- books/la-connect.html; then
            echo "No patch to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/la-connect.html
          git commit -m "chore: add GA4 tracking to LA-CONNECT"
          git push

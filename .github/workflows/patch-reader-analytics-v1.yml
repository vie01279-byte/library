name: Patch Reader Analytics v1

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/reader-analytics-v1]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reader-analytics-v1
          fetch-depth: 0

      - name: Patch analytics as an isolated script block
        shell: bash
        run: |
          cat > /tmp/reader-analytics-v1.html <<'EOF'
          <!-- Vie Library Reader Analytics v1 -->
          <script>
          (() => {
            'use strict';
            const BOOK_ID = 'la-connect';
            const READER_VERSION = 'reader-analytics-v1';
            const MILESTONES = [25, 50, 75, 100];
            const sentProgress = new Set();
            const viewedChapters = new Set();
            let lastChapter = null;
            let pendingNav = null;
            let hasScrolled = false;
            let engagedSent = false;
            let completeSent = false;

            const clean = (v) => (v || '').replace(/\s+/g, ' ').trim();

            function detectBookVersion() {
              const meta = document.querySelector('meta[name="book-version"], meta[name="version"]');
              if (meta?.content) return clean(meta.content).replace(/^v/i, '');
              const data = document.querySelector('[data-book-version], [data-version]');
              const dataValue = data?.dataset?.bookVersion || data?.dataset?.version;
              if (dataValue) return clean(dataValue).replace(/^v/i, '');
              for (const node of document.querySelectorAll('.book-version, .version, [class*="version"], [id*="version"]')) {
                const m = clean(node.textContent).match(/(?:version|phiên\s*bản|v)\s*[:\-]?\s*v?(\d+\.\d+(?:\.\d+)?)/i);
                if (m) return m[1];
              }
              return null;
            }

            function baseParams() {
              const p = { book_id: BOOK_ID, reader_version: READER_VERSION };
              const version = detectBookVersion();
              if (version) p.book_version = version;
              return p;
            }

            function track(name, params = {}) {
              if (typeof window.gtag !== 'function') return;
              window.gtag('event', name, { ...baseParams(), ...params });
            }

            function tocLinks() {
              const links = Array.from(document.querySelectorAll('.toc-link[href^="#"]'));
              const seen = new Set();
              return links.filter((a) => {
                const id = decodeURIComponent((a.getAttribute('href') || '').slice(1));
                if (!id || seen.has(id)) return false;
                seen.add(id);
                return true;
              });
            }

            function chapterId() {
              const id = decodeURIComponent(location.hash.slice(1));
              if (!id) return null;
              return tocLinks().some((a) => decodeURIComponent(a.getAttribute('href').slice(1)) === id) ? id : null;
            }

            function chapterInfo(id) {
              const links = tocLinks();
              const index = links.findIndex((a) => decodeURIComponent(a.getAttribute('href').slice(1)) === id);
              const link = index >= 0 ? links[index] : null;
              return {
                index,
                count: links.length,
                number: index >= 0 ? index + 1 : undefined,
                title: clean(link?.querySelector('.toc-title')?.textContent || link?.textContent) || undefined
              };
            }

            function sendEngaged(timerQualified = false) {
              if (engagedSent) return;
              if ((timerQualified && hasScrolled) || viewedChapters.size >= 2) {
                engagedSent = true;
                track('reader_engaged', {
                  engagement_seconds: timerQualified ? 60 : undefined,
                  chapters_viewed: viewedChapters.size
                });
                if (sentProgress.has(100)) sendComplete();
              }
            }

            function sendComplete() {
              if (completeSent || !engagedSent || !sentProgress.has(100)) return;
              completeSent = true;
              track('book_complete', { chapters_viewed: viewedChapters.size });
            }

            function withinChapterFraction() {
              const max = Math.max(0, document.documentElement.scrollHeight - innerHeight);
              return max === 0 ? 1 : Math.max(0, Math.min(1, scrollY / max));
            }

            function globalPercent() {
              const id = chapterId();
              if (!id) return 0;
              const info = chapterInfo(id);
              if (info.index < 0 || info.count < 1) return 0;
              return ((info.index + withinChapterFraction()) / info.count) * 100;
            }

            function updateProgress() {
              const pct = globalPercent();
              const id = chapterId();
              for (const milestone of MILESTONES) {
                if (pct >= milestone && !sentProgress.has(milestone)) {
                  sentProgress.add(milestone);
                  track('reading_progress', { progress_percent: milestone, chapter_id: id || undefined });
                }
              }
              sendComplete();
            }

            function trackChapter(method = 'unknown') {
              const id = chapterId();
              if (!id || id === lastChapter) return;
              lastChapter = id;
              viewedChapters.add(id);
              const info = chapterInfo(id);
              track('chapter_view', {
                chapter_id: id,
                chapter_number: info.number,
                chapter_title: info.title,
                navigation_method: method
              });
              sendEngaged(false);
              updateProgress();
            }

            function clickMethod(target) {
              const el = target.closest('a[href^="#"], button, .toc-link, .search-result');
              if (!el) return null;
              const text = clean(el.textContent).toLowerCase();
              const cls = String(el.className || '').toLowerCase();
              if (el.closest('.search-result') || cls.includes('search-result')) return 'search';
              if (el.closest('.toc-link') || cls.includes('toc-link')) return 'toc';
              if (cls.includes('prev') || /chương trước|previous/.test(text)) return 'previous';
              if (cls.includes('next') || /chương tiếp|next/.test(text)) return 'next';
              return 'internal_link';
            }

            document.addEventListener('click', (e) => {
              const method = clickMethod(e.target);
              if (method) pendingNav = method;
            }, true);

            addEventListener('hashchange', () => {
              const method = pendingNav || 'direct_link';
              pendingNav = null;
              setTimeout(() => trackChapter(method), 0);
            });

            let ticking = false;
            addEventListener('scroll', () => {
              hasScrolled = true;
              if (!ticking) {
                ticking = true;
                requestAnimationFrame(() => {
                  ticking = false;
                  updateProgress();
                });
              }
            }, { passive: true });

            setTimeout(() => sendEngaged(true), 60000);

            addEventListener('load', () => {
              const start = chapterId();
              track('book_open', {
                start_chapter: start || 'cover',
                language: document.documentElement.lang || 'vi'
              });
              if (start) trackChapter('direct_link');
            }, { once: true });
          })();
          </script>
          <!-- /Vie Library Reader Analytics v1 -->
          EOF

          python3 - <<'PY'
          from pathlib import Path
          path = Path('books/la-connect.html')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- Vie Library Reader Analytics v1 -->'
          if marker in text:
              print('Analytics already present; leaving HTML unchanged.')
          else:
              assert '</body>' in text, 'Missing </body> anchor'
              assert 'G-FX6Q6TRYE1' in text, 'Missing GA4 base tag'
              block = Path('/tmp/reader-analytics-v1.html').read_text(encoding='utf-8')
              path.write_text(text.replace('</body>', block + '\n</body>', 1), encoding='utf-8')
          PY

      - name: Validate analytics JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('books/la-connect.html').read_text(encoding='utf-8')
          assert text.count('<!-- Vie Library Reader Analytics v1 -->') == 1
          assert text.count("track('book_open'") == 1
          assert text.count("track('chapter_view'") == 1
          assert text.count("track('reading_progress'") == 1
          assert text.count("track('reader_engaged'") == 1
          assert text.count("track('book_complete'") == 1
          assert 'function detectBookVersion()' in text
          assert "const BOOK_ID = 'la-connect';" in text
          start = text.index('<!-- Vie Library Reader Analytics v1 -->')
          end = text.index('<!-- /Vie Library Reader Analytics v1 -->', start)
          block = text[start:end]
          js = block[block.index('<script>') + 8:block.rindex('</script>')]
          Path('/tmp/analytics.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/analytics.js
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "books/la-connect.html"
          git diff --stat

      - name: Commit validated patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Vie Library Analytics Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add books/la-connect.html
          git commit -m 'feat: add Reader Analytics v1 to LA-CONNECT'
          git push origin HEAD:feature/reader-analytics-v1

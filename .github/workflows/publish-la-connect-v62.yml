name: Publish LA-CONNECT v6.2

on:
  push:
    paths:
      - '.github/workflows/publish-la-connect-v62.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish v6.2
        run: python scripts/publish_la_connect_v62.py
      - name: Commit published files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/la-connect.html data/library.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "publish: LA-CONNECT v6.2 with Appendix 2"
          git push

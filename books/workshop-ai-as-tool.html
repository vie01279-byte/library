<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Workshop — AI as Tool · Bilingual Coaching Guide</title>
<style>
/* ============================================================
   Workshop — AI as Tool · Bilingual coaching guide
   Swiss minimal grid · single-file build
   ============================================================ */
:root {
  --ink: #0A0A0A;
  --paper: #FFFFFF;
  --muted: #6B6B6B;
  --soft: #9A9A9A;
  --rule: #E5E5E5;
  --rule-strong: #0A0A0A;
  --accent: #D43F1A;
  --accent-tint: #FBEBE5;
  --accent-soft: #FFF6F2;
  --warn: #B45309;
  --warn-tint: #FEF3C7;
  --ok: #166534;
  --ok-tint: #DCFCE7;
  --grid: #F2F0EC;
  --grid-2: #FAFAF8;
  /* Vietnamese-safe font stacks (Cambria + Segoe UI prioritized — Georgia italic
     does not have precomposed glyphs for VN tone marks on many systems) */
  --font-display: "Segoe UI Variable", "Segoe UI", "Helvetica Neue", "Inter", Roboto, Helvetica, Arial, system-ui, sans-serif;
  --font-serif: "Cambria", "Times New Roman", "Liberation Serif", "Charter", Georgia, serif;
  --font-mono: "Cascadia Mono", "Consolas", ui-monospace, "SF Mono", Menlo, monospace;
  --fs: 16px;
  --sidebar-w: 296px;
  --rail-w: 56px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--font-display); font-size: var(--fs); line-height: 1.5; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; letter-spacing: -0.005em; }
body { overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
::selection { background: var(--accent); color: var(--paper); }

/* ----- topbar ----- */
.topbar { position: sticky; top: 0; z-index: 50; display: grid; grid-template-columns: var(--rail-w) 1fr auto; align-items: center; height: 56px; background: var(--paper); border-bottom: 1px solid var(--rule-strong); }
.brand-rail { height: 100%; border-right: 1px solid var(--rule-strong); display: flex; align-items: center; justify-content: center; }
.icon-btn { width: 28px; height: 28px; background: transparent; border: 1px solid var(--ink); display: grid; place-items: center; cursor: pointer; color: var(--ink); padding: 0; transition: background 120ms var(--ease); }
.icon-btn:hover { background: var(--ink); color: var(--paper); }
.icon-btn svg { width: 14px; height: 14px; }
.brand { display: flex; align-items: center; gap: 14px; padding: 0 24px; height: 100%; border-right: 1px solid var(--rule); cursor: pointer; transition: background 140ms var(--ease); color: var(--ink); text-decoration: none; }
.brand:hover { background: var(--grid); }
.brand:hover .brand-name b { color: var(--ink); }
.brand-mark { width: 22px; height: 22px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 1px; }
.brand-mark span { background: var(--ink); }
.brand-mark span:nth-child(2) { background: var(--accent); }
.brand-mark span:nth-child(3) { background: transparent; border: 1px solid var(--ink); }
.brand-mark span:nth-child(4) { background: var(--ink); }
.brand-name { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; }
.brand-name b { display: block; color: var(--accent); margin-top: 2px; font-weight: 500; }
.topbar-right { display: flex; align-items: stretch; height: 100%; }
.topbar-right > * { display: flex; align-items: center; gap: 8px; padding: 0 18px; border-left: 1px solid var(--rule); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
.progress-mini { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.progress-mini b { color: var(--ink); }
.progress-mini .bar { display: inline-block; width: 64px; height: 4px; background: var(--rule); position: relative; vertical-align: middle; margin-left: 4px; }
.progress-mini .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); transition: width 360ms var(--ease); }
.lang-toggle { padding: 0; cursor: pointer; }
.lang-toggle .lang-opt { padding: 4px 10px; color: var(--muted); transition: all 120ms var(--ease); }
.lang-toggle .lang-opt.active { color: var(--paper); background: var(--ink); }
.lang-toggle .lang-opt:hover:not(.active) { color: var(--ink); }
.print-btn { cursor: pointer; }
.print-btn:hover { background: var(--ink); color: var(--paper); }

/* ----- shell ----- */
.shell { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: calc(100vh - 56px); transition: grid-template-columns 240ms var(--ease); }
.shell.sidebar-collapsed { grid-template-columns: 0 1fr; }
.sidebar { border-right: 1px solid var(--rule-strong); overflow: hidden; background: var(--paper); transition: opacity 200ms var(--ease); }
.shell.sidebar-collapsed .sidebar { opacity: 0; pointer-events: none; }
.sidebar-inner { width: var(--sidebar-w); padding: 20px 0 80px; position: sticky; top: 56px; max-height: calc(100vh - 56px); overflow-y: auto; }
.sidebar-inner::-webkit-scrollbar { width: 4px; }
.sidebar-inner::-webkit-scrollbar-track { background: transparent; }
.sidebar-inner::-webkit-scrollbar-thumb { background: var(--rule); }
.sidebar-section { padding: 14px 24px 8px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.nav-list { list-style: none; padding: 0; margin: 0; }
.nav-item { display: grid; grid-template-columns: 32px 1fr 18px; align-items: center; padding: 11px 24px; border-top: 1px solid var(--rule); cursor: pointer; transition: background 120ms var(--ease); gap: 4px; }
.nav-item:hover { background: var(--grid); }
.nav-item.active { background: var(--ink); color: var(--paper); }
.nav-item.active .nav-num, .nav-item.active .nav-check { color: var(--paper); }
.nav-num { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
.nav-label { font-size: 13.5px; letter-spacing: -0.005em; line-height: 1.3; }
.nav-check { width: 14px; height: 14px; border: 1px solid var(--muted); display: grid; place-items: center; color: transparent; font-size: 10px; }
.nav-item.complete .nav-check { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.nav-item.appendix .nav-label { color: var(--muted); font-size: 13px; }
.nav-item.appendix.active .nav-label { color: var(--paper); }

/* ----- main / pages ----- */
.main { position: relative; min-width: 0; }
.page { display: none; }
.page.active { display: block; animation: fade-in 360ms var(--ease); }
@keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ----- hero landing ----- */
.hero { border-bottom: 1px solid var(--rule-strong); padding: 80px 64px 64px; position: relative; background: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px); background-size: 80px 80px; background-position: -1px -1px; overflow: hidden; }
.hero::after { content: ""; position: absolute; bottom: -200px; right: -200px; width: 500px; height: 500px; background: radial-gradient(circle, var(--accent-tint), transparent 70%); pointer-events: none; }
.hero-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 32px; display: flex; gap: 16px; align-items: center; position: relative; z-index: 1; }
.hero-eyebrow .dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; display: inline-block; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.6; } }
.hero-title { font-size: clamp(48px, 8vw, 112px); line-height: 0.92; letter-spacing: -0.04em; font-weight: 500; margin: 0 0 32px; max-width: 18ch; position: relative; z-index: 1; }
.hero-title em { font-style: italic; font-family: var(--font-serif); font-weight: 400; color: var(--accent); }
.hero-sub { font-size: 19px; color: var(--muted); max-width: 60ch; line-height: 1.55; margin: 0 0 40px; position: relative; z-index: 1; }
.hero-cta-row { display: flex; gap: 12px; align-items: center; position: relative; z-index: 1; }
.hero-cta { display: inline-flex; align-items: center; gap: 12px; padding: 14px 22px; background: var(--ink); color: var(--paper); border: 0; font-family: var(--font-display); font-size: 15px; letter-spacing: -0.005em; cursor: pointer; transition: transform 180ms var(--ease), background 180ms var(--ease); }
.hero-cta:hover { transform: translateX(4px); background: var(--accent); }
.hero-cta-2 { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
.hero-cta-2:hover { background: var(--ink); color: var(--paper); transform: none; }
.hero-cta .arrow { font-family: var(--font-mono); }
.hero-meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1px solid var(--rule-strong); margin-top: 64px; position: relative; z-index: 1; }
.hero-meta > div { padding: 20px 24px 20px 0; border-right: 1px solid var(--rule); }
.hero-meta > div:last-child { border-right: 0; }
.hero-meta .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.hero-meta .v { font-size: 22px; letter-spacing: -0.02em; }
.hero-meta .v em { font-style: italic; font-family: var(--font-serif); color: var(--accent); }

.landing-section { padding: 72px 64px; border-bottom: 1px solid var(--rule-strong); }
.landing-section h2 { font-size: 36px; letter-spacing: -0.025em; margin: 0 0 28px; font-weight: 500; max-width: 22ch; }
.landing-section .lead { font-size: 17px; color: var(--muted); max-width: 60ch; margin: 0 0 40px; line-height: 1.6; }
.principles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid var(--rule-strong); }
.principles > div { padding: 32px 32px 8px 0; border-right: 1px solid var(--rule); }
.principles > div:last-child { border-right: 0; padding-right: 0; }
.principles .p-num { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 16px; }
.principles .p-title { font-size: 21px; letter-spacing: -0.015em; margin-bottom: 12px; line-height: 1.25; font-weight: 500; }
.principles .p-body { color: var(--muted); font-size: 14.5px; line-height: 1.6; }

/* ----- session grid on landing ----- */
.session-grid { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--rule-strong); }
.session-card { padding: 28px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); cursor: pointer; position: relative; min-height: 220px; display: flex; flex-direction: column; justify-content: space-between; transition: background 180ms var(--ease), transform 180ms var(--ease); background: var(--paper); }
.session-card:hover { background: var(--grid); }
.session-card:hover .sc-arrow { transform: translateX(4px); color: var(--accent); }
.session-card:nth-child(4n) { border-right: 0; }
.session-card.appendix-card { background: var(--grid-2); }
.session-card .sc-num { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; color: var(--muted); }
.session-card .sc-title { font-size: 21px; line-height: 1.15; letter-spacing: -0.015em; margin: 16px 0 0; font-weight: 500; }
.session-card .sc-meta { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; margin-top: 24px; }
.session-card .sc-arrow { font-family: var(--font-mono); font-size: 16px; transition: transform 180ms var(--ease); }
.session-card.complete::after { content: "✓"; position: absolute; top: 16px; right: 20px; width: 18px; height: 18px; background: var(--accent); color: var(--paper); display: grid; place-items: center; font-size: 11px; }

/* ----- session page ----- */
.session-page { padding: 0; }
.session-header { padding: 56px 64px 40px; border-bottom: 1px solid var(--rule-strong); display: grid; grid-template-columns: 1fr 340px; gap: 48px; align-items: end; }
.session-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 20px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.session-eyebrow .badge { border: 1px solid var(--ink); padding: 3px 10px; letter-spacing: 0.08em; color: var(--ink); }
.session-eyebrow .badge.accent { border-color: var(--accent); color: var(--accent); }
.session-title { font-size: clamp(36px, 5.5vw, 72px); line-height: 0.98; letter-spacing: -0.035em; font-weight: 500; margin: 0 0 20px; max-width: 18ch; }
.session-title em { font-style: italic; font-family: var(--font-serif); color: var(--accent); font-weight: 400; }
.session-sub { font-size: 18px; color: var(--muted); max-width: 60ch; line-height: 1.55; margin: 0; }
.tldr { border: 1px solid var(--ink); padding: 20px; background: var(--grid-2); }
.tldr .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.tldr .k::before { content: ""; width: 16px; height: 1px; background: var(--ink); }
.tldr ul { margin: 0; padding-left: 16px; font-size: 14px; line-height: 1.5; }
.tldr li { margin-bottom: 8px; }
.tldr li:last-child { margin-bottom: 0; }

.session-body { padding: 56px 64px; display: grid; grid-template-columns: 1fr; gap: 56px; }

/* ----- block ----- */
.block { max-width: 100%; }
.block-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; display: flex; gap: 12px; align-items: center; }
.block-label::before { content: ""; width: 28px; height: 1px; background: var(--ink); }
.block h3 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 16px; font-weight: 500; max-width: 24ch; line-height: 1.2; }
.block .body { font-size: 16px; color: #2A2A2A; max-width: 72ch; line-height: 1.65; }
.block .body p { margin: 0 0 14px; }
.block .body p:last-child { margin-bottom: 0; }
.block .body strong { color: var(--ink); font-weight: 600; }
.block .body em { font-style: italic; }
.block .body ul, .block .body ol { padding-left: 22px; margin: 8px 0 14px; }
.block .body li { margin-bottom: 6px; }
.block .body code { font-family: var(--font-mono); font-size: 13px; background: var(--grid); padding: 1px 6px; border-radius: 2px; color: var(--ink); }
.block .body a.link { color: var(--accent); border-bottom: 1px solid var(--accent); }
.block .body blockquote { border-left: 3px solid var(--ink); margin: 16px 0; padding: 4px 18px; color: var(--muted); font-style: italic; }
.block .body .lead-q { font-family: var(--font-serif); font-style: italic; font-size: 20px; color: var(--ink); line-height: 1.4; margin: 16px 0; }

/* glossary hint */
.gloss { border-bottom: 1px dashed var(--ink); cursor: help; position: relative; color: var(--ink); }
.gloss-tip { position: absolute; bottom: calc(100% + 8px); left: 0; transform: translateY(4px); opacity: 0; pointer-events: none; background: var(--ink); color: var(--paper); padding: 10px 12px; font-size: 13px; width: 280px; z-index: 20; font-family: var(--font-display); transition: opacity 160ms var(--ease), transform 160ms var(--ease); line-height: 1.45; font-style: normal; }
.gloss:hover .gloss-tip, .gloss:focus .gloss-tip { opacity: 1; transform: translateY(0); }

/* callout */
.callout { border: 1px solid var(--ink); padding: 20px 22px; background: var(--grid-2); position: relative; margin: 4px 0; }
.callout .co-tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
.callout .co-tag::before { content: ""; width: 8px; height: 8px; background: var(--ink); display: inline-block; }
.callout.warn { background: var(--warn-tint); border-color: var(--warn); }
.callout.warn .co-tag { color: var(--warn); }
.callout.warn .co-tag::before { background: var(--warn); }
.callout.ok { background: var(--ok-tint); border-color: var(--ok); }
.callout.ok .co-tag { color: var(--ok); }
.callout.ok .co-tag::before { background: var(--ok); }
.callout.accent { background: var(--accent-soft); border-color: var(--accent); }
.callout.accent .co-tag { color: var(--accent); }
.callout.accent .co-tag::before { background: var(--accent); }
.callout .co-body { font-size: 15px; line-height: 1.55; color: #2A2A2A; }
.callout .co-body strong { color: var(--ink); }

/* accordion */
.accordion { border-top: 1px solid var(--ink); }
.acc-item { border-bottom: 1px solid var(--ink); }
.acc-head { width: 100%; background: transparent; border: 0; padding: 20px 0; display: grid; grid-template-columns: 28px 1fr 20px; align-items: center; text-align: left; cursor: pointer; font-family: var(--font-display); font-size: 17px; color: var(--ink); letter-spacing: -0.01em; line-height: 1.3; transition: background 160ms var(--ease); }
.acc-head:hover { background: var(--grid-2); padding-left: 12px; padding-right: 12px; }
.acc-head .acc-n { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.acc-head .acc-tog { font-family: var(--font-mono); font-size: 16px; color: var(--ink); text-align: center; }
.acc-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 320ms var(--ease); }
.acc-body > div { overflow: hidden; }
.acc-item.open .acc-body { grid-template-rows: 1fr; }
.acc-item.open .acc-tog::before { content: "−"; }
.acc-item:not(.open) .acc-tog::before { content: "+"; }
.acc-tog { font-size: 0; }
.acc-tog::before { font-size: 18px; }
.acc-body-inner { padding: 0 0 24px 28px; font-size: 15px; color: #2A2A2A; max-width: 70ch; line-height: 1.65; }
.acc-body-inner p { margin: 0 0 10px; }
.acc-body-inner strong { color: var(--ink); }
.acc-body-inner ul, .acc-body-inner ol { padding-left: 20px; margin: 8px 0; }
.acc-body-inner li { margin-bottom: 4px; }

/* code / prompt cards */
.prompt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.prompt-grid.single { grid-template-columns: 1fr; }
.prompt-card { border: 1px solid var(--ink); padding: 0; position: relative; background: var(--paper); display: flex; flex-direction: column; overflow: hidden; }
.prompt-card .pc-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--ink); background: var(--ink); color: var(--paper); }
.prompt-card .pc-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
.prompt-card .pc-copy { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; background: transparent; border: 1px solid var(--paper); padding: 4px 10px; cursor: pointer; color: var(--paper); transition: all 140ms var(--ease); }
.prompt-card .pc-copy:hover { background: var(--paper); color: var(--ink); }
.prompt-card.copied .pc-copy { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.prompt-card .pc-text { font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; color: var(--ink); white-space: pre-wrap; padding: 16px 18px; background: var(--grid-2); flex: 1; overflow-x: auto; }

/* compare before/after */
.ba-toggle { display: inline-flex; border: 1px solid var(--ink); margin-bottom: 20px; }
.ba-toggle button { background: transparent; border: 0; padding: 8px 16px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; color: var(--ink); transition: all 140ms var(--ease); }
.ba-toggle button.active { background: var(--ink); color: var(--paper); }
.ba-panel { display: none; }
.ba-panel.active { display: block; animation: fade-in 240ms var(--ease); }
.ba-panel .label-row { display: flex; gap: 12px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.ba-panel .label-row .tag { border: 1px solid var(--muted); padding: 2px 8px; }
.ba-panel .label-row .tag.good { border-color: var(--accent); color: var(--accent); }
.ba-prompt { border: 1px solid var(--ink); padding: 16px; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; margin-bottom: 14px; white-space: pre-wrap; background: var(--grid-2); }
.ba-response { background: var(--grid); padding: 16px; font-size: 14.5px; line-height: 1.6; color: var(--ink); border-left: 2px solid var(--ink); }
.ba-response.good { border-left-color: var(--accent); background: var(--accent-soft); }
.ba-response .meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--ink); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--rule); vertical-align: top; line-height: 1.5; }
.tbl th { background: var(--ink); color: var(--paper); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; border-bottom: 0; }
.tbl tbody tr:nth-child(even) { background: var(--grid-2); }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover { background: var(--accent-soft); }
.tbl .num { font-family: var(--font-mono); color: var(--muted); }
.tbl strong { color: var(--ink); }
.tbl .ok { color: var(--ok); font-weight: 600; }
.tbl .no { color: var(--accent); font-weight: 600; }

/* cards grid (HITL patterns etc) */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0; border: 1px solid var(--ink); }
.cards .card { padding: 24px; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); position: relative; background: var(--paper); transition: background 160ms var(--ease); }
.cards .card:hover { background: var(--grid-2); }
.cards .card:last-child { border-right: 0; }
.cards.cols-2 { grid-template-columns: 1fr 1fr; }
.cards.cols-3 { grid-template-columns: repeat(3, 1fr); }
.cards.cols-4 { grid-template-columns: repeat(4, 1fr); }
.cards .c-num { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 12px; }
.cards .c-title { font-size: 17px; letter-spacing: -0.01em; margin-bottom: 8px; font-weight: 500; }
.cards .c-body { font-size: 14px; color: var(--muted); line-height: 1.55; }
.cards .c-body strong { color: var(--ink); }

/* timeline */
.timeline { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0; border: 1px solid var(--ink); position: relative; }
.timeline .step { padding: 24px; border-right: 1px solid var(--ink); position: relative; }
.timeline .step:last-child { border-right: 0; }
.timeline .step-num { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.timeline .step-num::after { content: "→"; color: var(--muted); }
.timeline .step:last-child .step-num::after { content: "✓"; color: var(--accent); }
.timeline .step-title { font-size: 17px; letter-spacing: -0.01em; margin-bottom: 8px; font-weight: 500; }
.timeline .step-body { font-size: 13px; color: var(--muted); line-height: 1.55; }

/* checklist */
.checklist { border: 1px solid var(--ink); padding: 24px; background: var(--paper); }
.checklist .cl-title { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
.checklist .cl-title::before { content: ""; width: 24px; height: 1px; background: var(--ink); }
.checklist ul { list-style: none; padding: 0; margin: 0; }
.checklist li { padding: 10px 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; cursor: pointer; font-size: 14.5px; line-height: 1.5; transition: background 120ms var(--ease); }
.checklist li:last-child { border-bottom: 0; }
.checklist li:hover { background: var(--grid-2); padding-left: 8px; padding-right: 8px; }
.checklist li::before { content: ""; width: 16px; height: 16px; border: 1px solid var(--ink); margin-top: 2px; display: inline-block; transition: all 140ms var(--ease); }
.checklist li.checked::before { background: var(--accent); border-color: var(--accent); content: "✓"; color: var(--paper); font-size: 11px; text-align: center; line-height: 14px; }
.checklist li.checked { color: var(--muted); text-decoration: line-through; }

/* quiz */
.quiz { border: 1px solid var(--ink); padding: 28px; background: var(--paper); }
.quiz .q { font-size: 19px; letter-spacing: -0.01em; margin: 0 0 20px; max-width: 56ch; line-height: 1.35; font-weight: 500; }
.quiz .options { display: grid; gap: 0; border-top: 1px solid var(--ink); }
.quiz .opt { width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--ink); padding: 16px 0; font-family: var(--font-display); font-size: 15.5px; cursor: pointer; color: var(--ink); display: grid; grid-template-columns: 24px 1fr 20px; gap: 12px; align-items: center; transition: all 160ms var(--ease); line-height: 1.4; }
.quiz .opt .letter { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.quiz .opt .mark { font-family: var(--font-mono); font-size: 14px; color: transparent; text-align: right; }
.quiz .opt:hover:not(:disabled) { background: var(--grid); padding-left: 12px; padding-right: 12px; }
.quiz .opt.correct { background: var(--accent-tint); }
.quiz .opt.correct .mark { color: var(--accent); }
.quiz .opt.correct .letter { color: var(--accent); }
.quiz .opt.wrong { opacity: 0.45; }
.quiz .opt.wrong .mark { color: var(--muted); }
.quiz .explain { margin-top: 20px; padding: 16px; background: var(--accent-soft); border-left: 2px solid var(--accent); font-size: 14.5px; color: #2A2A2A; display: none; line-height: 1.55; }
.quiz.answered .explain { display: block; animation: fade-in 280ms var(--ease); }

/* tier-cards (3 prompt tiers visual) */
.tier-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border: 1px solid var(--ink); }
.tier-cards .tier { padding: 24px; border-right: 1px solid var(--ink); position: relative; min-height: 200px; transition: background 160ms var(--ease); }
.tier-cards .tier:last-child { border-right: 0; }
.tier-cards .tier:hover { background: var(--accent-soft); }
.tier-cards .tier-n { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; color: var(--accent); margin-bottom: 8px; }
.tier-cards .tier-t { font-size: 24px; letter-spacing: -0.02em; margin-bottom: 14px; font-weight: 500; line-height: 1.15; }
.tier-cards .tier-b { font-size: 14px; color: var(--muted); line-height: 1.55; margin-bottom: 12px; }
.tier-cards .tier-stat { position: absolute; bottom: 18px; left: 24px; font-family: var(--font-mono); font-size: 11px; color: var(--ink); }
.tier-cards .tier-stat b { color: var(--accent); }

/* role-block (Appendix B role-prompts) */
.role-block { border: 1px solid var(--ink); margin-bottom: 18px; }
.role-block .rb-head { padding: 14px 18px; background: var(--ink); color: var(--paper); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.role-block .rb-head h4 { margin: 0; font-size: 16px; font-weight: 500; letter-spacing: -0.005em; }
.role-block .rb-head .rb-tog { font-family: var(--font-mono); font-size: 18px; }
.role-block.open .rb-tog::before { content: "−"; }
.role-block:not(.open) .rb-tog::before { content: "+"; }
.role-block .rb-tog::before { display: block; }
.role-block .rb-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 320ms var(--ease); }
.role-block .rb-body > div { overflow: hidden; }
.role-block.open .rb-body { grid-template-rows: 1fr; }
.role-block .rb-inner { padding: 18px; display: grid; gap: 14px; }

/* cheatsheet (Appendix C) */
.cheat { border: 2px solid var(--ink); padding: 0; background: var(--paper); }
.cheat-head { padding: 24px; background: var(--ink); color: var(--paper); }
.cheat-head h3 { font-size: 22px; margin: 0; font-weight: 500; letter-spacing: -0.015em; }
.cheat-head .sub { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; margin-top: 8px; color: var(--soft); }
.cheat-grid { display: grid; grid-template-columns: 1fr 1fr; }
.cheat-item { padding: 20px 24px; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
.cheat-item:nth-child(2n) { border-right: 0; }
.cheat-item .ch-n { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 8px; }
.cheat-item .ch-t { font-size: 16px; letter-spacing: -0.01em; margin-bottom: 8px; font-weight: 600; line-height: 1.3; }
.cheat-item .ch-b { font-size: 13.5px; color: var(--muted); line-height: 1.55; }
.cheat-item .ch-b code { font-family: var(--font-mono); font-size: 12px; background: var(--grid); padding: 1px 5px; }

/* author footer */
.session-foot { border-top: 1px solid var(--ink); padding: 32px 64px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.session-foot a { display: block; border: 1px solid var(--ink); padding: 20px 24px; transition: background 160ms var(--ease), transform 160ms var(--ease); cursor: pointer; }
.session-foot a:hover { background: var(--ink); color: var(--paper); }
.session-foot .dir { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.session-foot a:hover .dir { color: var(--paper); }
.session-foot .nxt { font-size: 20px; letter-spacing: -0.015em; }
.session-foot .complete-btn { background: var(--ink); color: var(--paper); border: 1px solid var(--ink); }
.session-foot .complete-btn:hover { background: var(--accent); border-color: var(--accent); color: var(--paper); transform: translateX(4px); }
.session-foot .complete-btn .dir { color: var(--soft); }

/* author/colophon */
.colophon { border-top: 1px solid var(--rule-strong); padding: 56px 64px; background: var(--grid-2); }
.colophon .cl-head { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
.colophon .cl-head::before { content: ""; width: 24px; height: 1px; background: var(--ink); }
.colophon h3 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 16px; font-weight: 500; max-width: 24ch; }
.colophon p { color: var(--muted); font-size: 15px; line-height: 1.65; max-width: 70ch; margin: 0 0 10px; }
.colophon p strong { color: var(--ink); }
.colophon .meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-top: 32px; border-top: 1px solid var(--rule-strong); }
.colophon .meta-grid > div { padding: 20px 24px 0 0; border-right: 1px solid var(--rule); }
.colophon .meta-grid > div:last-child { border-right: 0; }
.colophon .meta-grid .k { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.colophon .meta-grid .v { font-size: 14px; color: var(--ink); }

/* ----- floating action button (FAB) ----- */
.fab {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 10px;
  opacity: 0;
  transform: translateY(16px);
  pointer-events: none;
  transition: opacity 240ms var(--ease), transform 240ms var(--ease);
}
.fab.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
.fab-btn {
  width: 48px; height: 48px;
  background: var(--ink);
  color: var(--paper);
  border: 1px solid var(--ink);
  border-radius: 0;
  display: grid; place-items: center;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 16px;
  line-height: 1;
  transition: background 140ms var(--ease), transform 140ms var(--ease), border-color 140ms var(--ease);
  padding: 0;
  box-shadow: 0 1px 0 var(--paper), 0 0 0 1px var(--ink);
  position: relative;
}
.fab-btn:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-2px); }
.fab-btn:active { transform: translateY(0); }
.fab-btn .fab-tip {
  position: absolute;
  right: calc(100% + 10px);
  top: 50%;
  transform: translateY(-50%);
  background: var(--ink);
  color: var(--paper);
  padding: 4px 10px;
  font-size: 11px;
  font-family: var(--font-mono);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 140ms var(--ease);
}
.fab-btn:hover .fab-tip { opacity: 1; }
.fab-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }

/* ----- sidebar backdrop (mobile drawer mode) ----- */
.sidebar-backdrop { display: none; position: fixed; inset: 56px 0 0 0; background: rgba(10,10,10,0.4); z-index: 39; opacity: 0; transition: opacity 200ms var(--ease); }
.sidebar-backdrop.visible { opacity: 1; }

/* ============================================================
   Responsive — 4 breakpoints
   1080px (tablet landscape), 800px (tablet portrait),
   640px (large phone), 480px (phone)
   ============================================================ */

/* ----- 1080px: tablet landscape ----- */
@media (max-width: 1080px) {
  :root { --sidebar-w: 256px; }
  .hero, .landing-section, .session-header, .session-body, .session-foot, .colophon { padding-left: 40px; padding-right: 40px; }
  .session-grid { grid-template-columns: repeat(3, 1fr); }
  .session-grid .session-card:nth-child(4n) { border-right: 1px solid var(--rule); }
  .session-grid .session-card:nth-child(3n) { border-right: 0; }
  .cards.cols-4 { grid-template-columns: repeat(2, 1fr); }
  .cards.cols-4 .card:nth-child(2n) { border-right: 0; }
  .tier-cards { grid-template-columns: 1fr; }
  .tier-cards .tier { border-right: 0; border-bottom: 1px solid var(--ink); }
  .tier-cards .tier:last-child { border-bottom: 0; }
  .hero { padding-top: 64px; padding-bottom: 48px; }
  .landing-section { padding-top: 56px; padding-bottom: 56px; }
  .session-header { padding-top: 48px; padding-bottom: 36px; }
  .session-body { padding-top: 48px; padding-bottom: 48px; }
}

/* ----- 800px: tablet portrait ----- */
@media (max-width: 800px) {
  .session-header { grid-template-columns: 1fr; gap: 24px; }
  .session-header .tldr { max-width: 480px; }
  .principles { grid-template-columns: 1fr; }
  .principles > div { border-right: 0; border-bottom: 1px solid var(--rule); padding: 24px 0; }
  .principles > div:last-child { border-bottom: 0; padding-bottom: 0; }
  .prompt-grid { grid-template-columns: 1fr; }
  .hero-meta { grid-template-columns: 1fr 1fr; }
  .session-grid { grid-template-columns: 1fr 1fr; }
  .session-card { border-right: 1px solid var(--rule) !important; min-height: 180px; padding: 22px; }
  .session-card:nth-child(2n) { border-right: 0 !important; }
  .cards.cols-4, .cards.cols-3 { grid-template-columns: 1fr 1fr; }
  .cards.cols-4 .card, .cards.cols-3 .card { border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .cards.cols-4 .card:nth-child(2n), .cards.cols-3 .card:nth-child(2n) { border-right: 0; }
  .cheat-grid { grid-template-columns: 1fr; }
  .cheat-item { border-right: 0; }
  .colophon .meta-grid { grid-template-columns: 1fr; }
  .colophon .meta-grid > div { border-right: 0; border-bottom: 1px solid var(--rule); padding-bottom: 16px; margin-bottom: 16px; }
  .colophon .meta-grid > div:last-child { border-bottom: 0; }
  .session-body { gap: 44px; }
  .session-foot { padding: 28px 40px; gap: 16px; }
  .session-foot .nxt { font-size: 18px; }
  /* tables: tighter cells */
  .tbl th, .tbl td { padding: 10px 12px; font-size: 13px; }
}

/* ----- 900px: drawer mode — anything narrower than a typical tablet landscape ----- */
@media (max-width: 900px) {
  /* CRITICAL: switch shell from grid to block so sidebar column doesn't steal width */
  .shell { display: block !important; grid-template-columns: none !important; }
  .main { width: 100% !important; min-width: 0; display: block; }
  /* Sidebar as fixed-position drawer */
  .sidebar { position: fixed !important; left: 0 !important; top: 56px !important; height: calc(100vh - 56px) !important; z-index: 41 !important; width: min(280px, 84vw) !important; transform: translateX(-100%); transition: transform 240ms var(--ease) !important; border-right: 1px solid var(--ink) !important; opacity: 1 !important; pointer-events: auto !important; }
  .shell:not(.sidebar-collapsed) .sidebar { transform: translateX(0); box-shadow: 8px 0 24px rgba(0,0,0,0.08); }
  .shell.sidebar-collapsed .sidebar { transform: translateX(-100%); pointer-events: none !important; }
  .shell:not(.sidebar-collapsed) ~ .sidebar-backdrop { display: block; }
  /* Topbar simplification */
  .topbar { grid-template-columns: 48px 1fr auto; }
  :root { --rail-w: 48px; }
  .brand { padding: 0 14px; gap: 10px; }
  .brand-mark { width: 18px; height: 18px; }
  .brand-name { font-size: 11px; }
  .brand-name b { display: none; }
  /* Hide print button on phone */
  .print-btn { display: none !important; }
  /* Compact progress bar */
  .progress-mini { padding: 0 10px; font-size: 10px; gap: 4px; }
  .progress-mini .bar { width: 36px; }
  .topbar-right > * { padding: 0 10px; }
  .lang-toggle .lang-opt { padding: 4px 8px; font-size: 10px; }
  /* Hero */
  .hero { padding: 48px 24px 40px; background-size: 48px 48px; }
  .hero-eyebrow { margin-bottom: 24px; font-size: 10px; letter-spacing: 0.1em; gap: 10px; }
  .hero-title { font-size: clamp(36px, 11vw, 64px); letter-spacing: -0.03em; margin-bottom: 24px; max-width: 100%; }
  .hero-sub { font-size: 16px; margin-bottom: 28px; }
  .hero-cta-row { flex-wrap: wrap; gap: 10px; }
  .hero-cta { padding: 12px 18px; font-size: 14px; }
  .hero-meta { margin-top: 40px; }
  /* Landing sections */
  .landing-section { padding: 48px 24px; }
  .landing-section h2 { font-size: 28px; margin-bottom: 20px; }
  .landing-section .lead { font-size: 15px; margin-bottom: 28px; }
  /* Session pages */
  .session-header { padding: 36px 24px 28px; gap: 20px; }
  .session-eyebrow { font-size: 10px; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .session-title { font-size: clamp(28px, 8vw, 48px); margin-bottom: 16px; max-width: 100%; }
  .session-sub { font-size: 15.5px; }
  .session-header .tldr { padding: 16px; }
  .session-header .tldr ul { font-size: 13px; }
  .session-body { padding: 36px 24px; gap: 36px; }
  .block-label { font-size: 10px; gap: 10px; }
  .block-label::before { width: 18px; }
  .block h3 { font-size: 22px; margin-bottom: 12px; }
  .block .body { font-size: 15.5px; line-height: 1.6; }
  .block .body .lead-q { font-size: 17px; }
  /* Callouts */
  .callout { padding: 16px 18px; }
  .callout .co-tag { font-size: 9.5px; margin-bottom: 6px; gap: 8px; }
  .callout .co-body { font-size: 14.5px; }
  /* Accordion */
  .acc-head { padding: 16px 0; font-size: 15px; grid-template-columns: 24px 1fr 18px; gap: 8px; }
  .acc-head:hover { padding-left: 8px; padding-right: 8px; }
  .acc-body-inner { padding: 0 0 18px 24px; font-size: 14.5px; }
  /* Quiz */
  .quiz { padding: 20px 18px; }
  .quiz .q { font-size: 16.5px; margin-bottom: 16px; }
  .quiz .opt { font-size: 14.5px; padding: 14px 0; gap: 10px; grid-template-columns: 20px 1fr 16px; }
  .quiz .opt:hover:not(:disabled) { padding-left: 8px; padding-right: 8px; }
  /* Prompt cards */
  .prompt-card .pc-head { padding: 10px 14px; }
  .prompt-card .pc-label { font-size: 10px; }
  .prompt-card .pc-copy { font-size: 9px; padding: 3px 8px; }
  .prompt-card .pc-text { font-size: 11.5px; padding: 14px 16px; line-height: 1.55; }
  /* Compare (Before/After) */
  .ba-prompt { font-size: 11.5px; padding: 12px 14px; }
  .ba-response { font-size: 13.5px; padding: 14px; }
  /* Tables — horizontal scroll guaranteed */
  .tbl-wrap { -webkit-overflow-scrolling: touch; }
  .tbl th, .tbl td { padding: 8px 10px; font-size: 12.5px; line-height: 1.45; }
  /* Cards — single column */
  .cards, .cards.cols-4, .cards.cols-3, .cards.cols-2 { grid-template-columns: 1fr; }
  .cards .card { border-right: 0 !important; padding: 20px; }
  .cards .card:last-child { border-bottom: 0; }
  /* Timeline */
  .timeline { grid-template-columns: 1fr; }
  .timeline .step { border-right: 0; border-bottom: 1px solid var(--ink); padding: 20px; }
  .timeline .step:last-child { border-bottom: 0; }
  .timeline .step-title { font-size: 16px; }
  /* Tier cards */
  .tier-cards .tier { padding: 20px; min-height: auto; }
  .tier-cards .tier-t { font-size: 20px; }
  .tier-cards .tier-stat { position: static; margin-top: 12px; }
  /* Session grid */
  .session-grid { grid-template-columns: 1fr; }
  .session-card { border-right: 0 !important; min-height: 140px; }
  .session-card .sc-title { font-size: 18px; }
  /* Session foot */
  .session-foot { grid-template-columns: 1fr; padding: 24px; gap: 12px; }
  .session-foot a { padding: 16px 18px; }
  .session-foot .nxt { font-size: 17px; }
  /* Colophon */
  .colophon { padding: 40px 24px; }
  .colophon h3 { font-size: 22px; }
  /* Checklists */
  .checklist { padding: 18px; }
  .checklist li { font-size: 14px; padding: 9px 0; }
  /* Role blocks (Appendix B) */
  .role-block .rb-head { padding: 12px 14px; }
  .role-block .rb-head h4 { font-size: 14.5px; }
  .role-block .rb-inner { padding: 14px; gap: 12px; }
  /* Cheat sheet */
  .cheat-head { padding: 18px; }
  .cheat-head h3 { font-size: 19px; }
  .cheat-item { padding: 16px 18px; }
  .cheat-item .ch-t { font-size: 15px; }
  .cheat-item .ch-b { font-size: 13px; }
  /* FAB */
  .fab { right: 16px; bottom: 16px; gap: 8px; }
  .fab-btn { width: 44px; height: 44px; }
  /* Hide tooltips on touch devices — they're not useful */
  .fab-btn .fab-tip { display: none; }
  /* Hide FAB when sidebar drawer is open */
  .shell:not(.sidebar-collapsed) ~ .fab { opacity: 0; pointer-events: none; }
}

/* ----- 480px: phone (most aggressive) ----- */
@media (max-width: 480px) {
  .hero { padding: 36px 18px 32px; }
  .hero-title { font-size: clamp(32px, 11vw, 48px); }
  .hero-sub { font-size: 15px; }
  .hero-meta { grid-template-columns: 1fr; }
  .hero-meta > div { padding: 14px 0; border-right: 0; border-bottom: 1px solid var(--rule); }
  .hero-meta > div:last-child { border-bottom: 0; }
  .landing-section, .session-header, .session-body, .session-foot, .colophon { padding-left: 18px; padding-right: 18px; }
  .session-grid { grid-template-columns: 1fr; }
  .session-card { padding: 20px; min-height: 130px; }
  .session-card .sc-title { font-size: 17px; }
  /* Prevent layout overflow from long monospace */
  .pc-text, .ba-prompt, .acc-body-inner pre { word-break: break-word; overflow-wrap: anywhere; }
  /* Tone down vermillion radial gradient (avoid color band on tiny screens) */
  .hero::after { display: none; }
}

/* print */
@media print {

        goodPrompt: "You are an operations analyst preparing a one-page weekly summary for the executive team. The attached PDF is our project tracker. Output four sections: (1) two-line headline; (2) the five most important numbers from the tracker; (3) three things that went well; (4) three risks. Professional but plain tone. Don't use vague phrases like \"strong progress\" — every claim must point to a specific number. End with: \"For internal discussion only — not a final review.\" Output in Markdown.",
        goodResponse: "# Q3 Project Tracker — Executive Summary\n\n**Headline:** All 12 projects shipped against committed scope; budget variance −3.2% (favourable); one customer-facing rollout slipped 2 weeks.\n\n## Five numbers that matter\n| Metric | Q3 | Q2 | Δ |\n|---|---|---|---|\n| On-time delivery | 92% | 87% | +5pp |\n| Budget variance | −3.2% | +1.4% | −4.6pp |\n…(continues, every number traceable to the tracker)",
        goodNote: "Specific role, specific data, specific format. AI does 80%; you verify 5 numbers and ship in 22 minutes." },
      { kind: "prose", body: "<p>Person A used AI as a <em>smarter Google</em> — generic question in, generic answer out. Person B used AI as a <strong>virtual collaborator</strong> — specific task, specific context, specific format, specific success criteria.</p><p>That is the difference between \"AI is a Q&amp;A box\" and \"AI is a tool.\" Same product. Same input data. Different in: how the command was given, and what the user thought AI could do.</p>" },
      { kind: "cards", label: "1.2 · Two modes", heading: "Two modes of working with AI.", cols: 2,
        items: [
          { num: "MODE 1", title: "AI as Q&A box", body: "<p><strong>Input:</strong> a short question, little or no context.</p><p><strong>Output:</strong> prose, often generic.</p><p><strong>You do:</strong> assemble the final product — copy a sentence, paste, reformat, re-check.</p><p><strong>AI does:</strong> ~10–20% of the work.</p><p><em>Good for:</em> quick concept lookups, brainstorming, opinion checks.</p>" },
          { num: "MODE 2", title: "AI as Tool", body: "<p><strong>Input:</strong> structured command — role, context, task, format, constraints.</p><p><strong>Output:</strong> an <em>artifact</em> — file you can download or paste into a corporate system.</p><p><strong>You do:</strong> review and edit at the end.</p><p><strong>AI does:</strong> 60–90% of the work.</p><p><em>Good for:</em> any specific deliverable, any task that repeats, any large multi-file work.</p>" }
        ]},
      { kind: "callout", tone: "accent", tag: "1.3 · Proof — capabilities you already have",
        body: "<p>As of May 2026, ChatGPT and Claude already support all this in their <strong>web interface</strong> — no plugins, no coding (actual availability depends on plan, model, workspace, region):</p><ul><li><strong>Generate files</strong> (Word, Excel, PowerPoint, PDF) with real formulas you can download.</li><li><strong>Generate code</strong> in Python, SQL, VBA, JavaScript, shell scripts.</li><li><strong>Read attachments</strong> — PDFs, Word docs, spreadsheets, screenshots, even scans. <em>Caveat: for exact numbers, prefer spreadsheets or text-based PDFs; scans can be unreliable.</em></li><li><strong>Web search / deep research</strong> with citations when enabled.</li><li><strong>Image input + ChatGPT Images</strong> for analysis and generation.</li><li><strong>Data Analysis</strong> (formerly \"Code Interpreter\"): upload CSV, AI runs Python, charts the data, writes the conclusion.</li><li><strong>Canvas</strong> (ChatGPT): a side-by-side editing surface for co-writing and reviewing.</li><li><strong>Projects</strong> (ChatGPT): a workspace for long-running work — chats, files, project-specific instructions, all in one place.</li></ul><p style='margin-bottom:0;'><strong>Self-check:</strong> in the past week, how many times did you <em>produce</em> a Word/Excel/PPT/PDF? Of those, how many <strong>could have been 70% AI-generated and 30% your review</strong>? That is your immediate value zone.</p>" },
      { kind: "prose", label: "1.4 · Why tool-mode fits most desk jobs", heading: "Three structural features make this work.",
        body: "<p><strong>1. High volume of repetitive text and document work.</strong> Marketing produces dozens of social posts and emails weekly. Sales writes hundreds of personalized outreach messages. Legal produces contracts and memos. HR produces job descriptions and offer letters. Operations produces SOPs, status reports, meeting minutes. Most of it is <strong>same skeleton, different details</strong> — exactly where AI shines.</p><p><strong>2. Many tasks follow a clear formula.</strong> Meeting summaries. Customer follow-up emails after a support call. Quarterly reviews against your manager's template. Regulatory disclosure forms. Test cases for a new feature. Formula-driven tasks are perfect candidates for AI tools or Custom GPTs.</p><p><strong>3. Time pressure and accuracy pressure simultaneously.</strong> A typo in a customer email loses trust. A wrong number in a board memo costs credibility. A delayed quarterly review misses the cycle. AI lets you <strong>produce a strong 80% draft fast, then spend your saved time on the 20% that matters most — judgment and verification.</strong></p>" },
      { kind: "callout", tag: "1.5 · Exercise 1 (5 min) — Classify your own tasks",
        body: "<p>On paper or in a notebook:</p><ol><li><strong>Three tasks</strong> you did last week where <strong>Q&amp;A mode was enough</strong> (concept lookups, brainstorming, opinion checks).</li><li><strong>Three tasks</strong> you did last week where <strong>Tool mode would have produced a real deliverable</strong> (specific output, repeatable).</li><li>From the three in #2, <strong>circle the one</strong> you will try with AI after this workshop.</li></ol>" },
      { kind: "callout", tone: "accent", tag: "1.6 · Take-home line",
        body: "<p class='lead-q' style='margin:0;'>Every time you open AI, ask one question first: <strong>\"Do I want to chat with AI, or do I want AI to hand me a deliverable?\"</strong></p><p style='margin:12px 0 0;'>If it's a deliverable — you're about to enter Tool mode. Set up your command accordingly. Chapter 3 will show you how.</p>" },
      { kind: "quiz", q: "Which of these is the cleanest signal you should switch from Q&A to Tool mode?",
        options: [
          { t: "The topic is complex and you want a long, thoughtful explanation.", correct: false },
          { t: "You need a specific artifact in a specific format that someone else will use.", correct: true },
          { t: "AI's answers keep being too short and you want more detail.", correct: false }
        ],
        explain: "Tool mode is defined by the output, not the topic. The moment your work needs a deliverable (artifact + format + someone-else uses it), you should be giving AI a Tier 2 or Tier 3 command — not chatting." }
    ]
  },

    blocks: [
      { kind: "prose", label: "1.1 · Anchor", heading: "Câu chuyện hai professional.",
        body: "<p>Hai người cùng nhận task sáng thứ Hai: <em>viết tóm tắt 1 trang kết quả dự án quý vừa rồi cho ban lãnh đạo.</em> Cả hai làm operations ở công ty cỡ trung. Cả hai đều có ChatGPT.</p>" },
      { kind: "compare",
        badPrompt: "Dự án của tụi mình quý vừa rồi sao?",
        badResponse: "Hiệu quả dự án phụ thuộc nhiều yếu tố. Các chỉ số thường gồm tuân thủ tiến độ, chênh lệch ngân sách, hoàn thành phạm vi, mức hài lòng stakeholder, velocity của team. Không có dữ liệu cụ thể, khó đánh giá chính xác. Khó khăn phổ biến gồm hạn chế nguồn lực, yêu cầu thay đổi, thiếu giao tiếp. Nhiều team thấy review quý hữu ích cho…",
        badNote: "Đoạn văn chung. AI không thấy data của bạn, nên đưa lời khuyên về cách nghĩ về hiệu quả dự án.",
        goodPrompt: "Bạn là operations analyst chuẩn bị tóm tắt 1 trang hằng tuần cho ban lãnh đạo. File PDF đính kèm là project tracker. Output 4 phần: (1) headline 2 dòng; (2) 5 con số quan trọng nhất; (3) 3 điểm tốt; (4) 3 rủi ro. Văn phong professional nhưng dễ đọc. Không dùng câu mơ hồ như \"tiến độ tốt\" — mọi nhận định phải trỏ tới một con số cụ thể. Kết bằng: \"Tài liệu nội bộ — chưa phải review chính thức\". Output dạng Markdown.",
        goodResponse: "# Q3 Project Tracker — Tóm tắt cho ban lãnh đạo\n\n**Headline:** Toàn bộ 12 dự án ship đúng scope cam kết; chênh lệch budget −3.2% (thuận lợi); một rollout customer-facing trễ 2 tuần.\n\n## 5 con số quan trọng nhất\n| Chỉ số | Q3 | Q2 | Δ |\n|---|---|---|---|\n| Giao đúng hạn | 92% | 87% | +5pp |\n| Chênh lệch budget | −3.2% | +1.4% | −4.6pp |\n…(tiếp tục, mọi số tra được trong tracker)",
        goodNote: "Role cụ thể, data cụ thể, format cụ thể. AI làm 80%; bạn verify 5 số và ship trong 22 phút." },
      { kind: "prose", body: "<p>Người A dùng AI như <em>Google nâng cấp</em> — câu hỏi chung, câu trả lời chung. Người B dùng AI như <strong>đồng nghiệp ảo</strong> — task cụ thể, có context, có format, có tiêu chí thành công.</p><p>Đây là khác biệt giữa \"AI là hộp Q&amp;A\" và \"AI là tool\". Cùng sản phẩm. Cùng dữ liệu đầu vào. Khác nhau ở: cách ra mệnh lệnh, và cách hiểu AI có thể làm gì.</p>" },
      { kind: "cards", label: "1.2 · Hai chế độ", heading: "Hai chế độ làm việc với AI.", cols: 2,
        items: [
          { num: "MODE 1", title: "AI as Q&A box", body: "<p><strong>Input:</strong> câu hỏi ngắn, ít/không context.</p><p><strong>Output:</strong> đoạn văn xuôi, thường chung chung.</p><p><strong>Bạn làm:</strong> lắp ráp sản phẩm cuối — copy 1 câu, paste, format lại, kiểm tra.</p><p><strong>AI làm:</strong> ~10–20% công việc.</p><p><em>Phù hợp:</em> tra khái niệm, brainstorm, hỏi quan điểm.</p>" },
          { num: "MODE 2", title: "AI as Tool", body: "<p><strong>Input:</strong> mệnh lệnh có cấu trúc — role, context, task, format, constraint.</p><p><strong>Output:</strong> <em>artifact</em> — file download được hoặc paste vào hệ thống.</p><p><strong>Bạn làm:</strong> review + edit cuối.</p><p><strong>AI làm:</strong> 60–90% công việc.</p><p><em>Phù hợp:</em> mọi deliverable cụ thể, mọi task lặp, mọi multi-file.</p>" }
        ]},
      { kind: "callout", tone: "accent", tag: "1.3 · Bằng chứng — khả năng bạn đã có",
        body: "<p>Tính đến 5/2026, ChatGPT và Claude đã hỗ trợ tất cả trên giao diện <strong>web</strong> — không plugin, không code (availability tuỳ plan, model, workspace, region):</p><ul><li><strong>Sinh file</strong> (Word, Excel, PPT, PDF) có công thức thật download được.</li><li><strong>Sinh code</strong> Python, SQL, VBA, JavaScript, shell script.</li><li><strong>Đọc file đính kèm</strong> — PDF, Word, spreadsheet, screenshot, scan. <em>Lưu ý: nếu cần số chính xác, ưu tiên spreadsheet hoặc PDF text-based; scan có thể không ổn định.</em></li><li><strong>Web search / deep research</strong> kèm citation khi bật.</li><li><strong>Image input + ChatGPT Images</strong> để đọc và tạo.</li><li><strong>Data Analysis</strong> (tên cũ \"Code Interpreter\"): upload CSV, AI chạy Python, vẽ chart, viết kết luận.</li><li><strong>Canvas</strong> (ChatGPT): bề mặt soạn thảo cạnh chat cho co-write/review.</li><li><strong>Projects</strong> (ChatGPT): workspace cho việc dài hơi — chats, files, instruction riêng theo project, trong một chỗ.</li></ul><p style='margin-bottom:0;'><strong>Tự kiểm:</strong> trong 1 tuần qua, bạn <em>sản xuất</em> bao nhiêu file Word/Excel/PPT/PDF? Bao nhiêu trong đó <strong>có thể giao AI làm 70%, bạn review 30%</strong>? Đó là vùng giá trị tức thì.</p>" },
      { kind: "prose", label: "1.4 · Vì sao Tool mode phù hợp văn phòng", heading: "Ba đặc điểm cấu trúc khiến điều này hoạt động.",
        body: "<p><strong>1. Khối lượng văn bản lặp lại lớn.</strong> Marketing produce hàng chục social post và email mỗi tuần. Sales viết hàng trăm tin nhắn outreach. Legal produce hợp đồng và memo. HR produce job description và offer letter. Operations produce SOP, status report, biên bản. Phần lớn là <strong>same skeleton, different details</strong> — chính xác vùng AI mạnh nhất.</p><p><strong>2. Nhiều task có công thức rõ ràng.</strong> Biên bản họp. Email follow-up sau cuộc gọi support. Báo cáo quý theo template sếp. Form regulatory disclosure. Test case cho tính năng mới. Task có công thức = ứng cử viên hoàn hảo cho AI tool hoặc Custom GPT.</p><p><strong>3. Áp lực thời gian và chính xác cùng lúc.</strong> Một lỗi typo trong email khách mất niềm tin. Số sai trong memo gửi sếp mất uy tín. Báo cáo quý ra muộn = lỡ cycle. AI cho phép <strong>làm nhanh draft 80%, dành thời gian cho 20% quan trọng — judgment và verification.</strong></p>" },
      { kind: "callout", tag: "1.5 · Bài tập 1 (5 phút) — Phân loại task của bạn",
        body: "<p>Trên giấy/notebook:</p><ol><li><strong>3 task</strong> bạn làm tuần qua mà <strong>Q&amp;A mode đủ</strong> (tra khái niệm, brainstorm, hỏi quan điểm).</li><li><strong>3 task</strong> bạn làm tuần qua mà <strong>Tool mode đáng lẽ tạo deliverable thật</strong> (output cụ thể, lặp lại được).</li><li>Trong 3 task ở mục 2, <strong>khoanh tròn 1 task</strong> bạn sẽ thử với AI sau workshop.</li></ol>" },
      { kind: "callout", tone: "accent", tag: "1.6 · Đem về dùng",
        body: "<p class='lead-q' style='margin:0;'>Mỗi lần mở AI, hỏi 1 câu trước: <strong>\"Tôi muốn AI hỏi-đáp với tôi, hay tôi muốn AI giao cho tôi một deliverable?\"</strong></p><p style='margin:12px 0 0;'>Nếu là deliverable — bạn đang chuẩn bị vào Tool mode. Chuẩn bị mệnh lệnh cho đúng. Chương 3 chỉ kỹ.</p>" },

    sub: "The mass-market pen vs the tailored suit. Mass-market AI works for everyone; personal tools fit your voice, your formats, your domain.",
    tldr: [
      "If you repeat a task 3+ times in a week, the right answer isn't \"prompt harder\" — it's build a tool.",
      "Three kinds of personal tools: prompt templates (free), Custom GPTs & Projects (paid), Cowork pipelines (paid + Pro hardware).",
      "Rule of three: when you type the same setup three times in a week, stop chatting and start building."
    ],
    blocks: [
      { kind: "prose", label: "2.1 · Anchor", heading: "The mass-market pen and the tailored suit.",
        body: "<p>You walk into a stationery store and buy a cheap ballpoint pen. It works for everyone. The ink is identical. Any sheet of paper will accept it. That is a <strong>mass-market tool</strong>.</p><p>You walk into a tailor and order a fitted suit. Your measurements, your fabric, the stitch your eye prefers. Someone else would find it too tight or too loose. That is a <strong>personalized tool</strong>.</p><p class='lead-q'>Honest question: in the past five years, did you do most of your work with mass-market tools, or with tools you've quietly personalized — templates you made, formulas you wrote, macros, snippets?</p><p>Most of us already have a stash of small templates and formulas in our Excel and Word toolchain. That's exactly how you've already been building personal tools for years — only without AI's help. AI changes the rules: <strong>building personal tools no longer requires programming.</strong> You describe what you want in plain English; AI builds the tool.</p>" },
      { kind: "cards", label: "2.2 · Two ends of the spectrum", heading: "Mass-market AI vs personalized AI.", cols: 2,
        items: [
          { num: "MASS-MARKET", title: "AI for everyone", body: "<p>\"Blank\" ChatGPT or Claude. No custom instructions. No knowledge files. Default Excel with no macros. Generic email template the company shares with everyone.</p><p><strong>Traits:</strong> usable immediately, no setup, but generic — doesn't fit your voice, format, context.</p>" },
          { num: "PERSONALIZED", title: "AI built for you", body: "<p>Designed around three things: your <strong>taste</strong> (voice, formality, length); your <strong>requirements</strong> (company template, team checklist, industry disclaimers); your <strong>domain knowledge</strong> (terminology, customer conventions, industry idioms).</p><p><strong>Traits:</strong> modest upfront cost, repeatedly high-quality output — no re-typing context every time.</p>" }
        ]},
      { kind: "callout", tone: "accent", tag: "2.3 · A concrete example — Friday update drafter",
        body: "<p>You're an account manager at a B2B SaaS company. Every Friday afternoon you send a 200-word \"weekly update\" email to ~50 client contacts. Tone: warm-but-direct. Always ends with a clear next step.</p><p><strong>Mass-market way:</strong> open ChatGPT, type long preamble \"You're an account manager at SaaS… 200 words… don't sound like marketing…\" paste this week's notes, ask for draft, get something close but tone off, edit 5 minutes. Repeat 50 times. After a month: 4 × 50 × 5 min = <strong>~16 hours of pure repetition.</strong></p><p><strong>Personalized way:</strong> build a Custom GPT called \"Friday Update Drafter\" once. Instructions pre-loaded: role, tone, length 180–220 words, structure, banned phrases. Knowledge file with product tiers. Every Friday: open GPT, paste this week's notes, type \"Generate the Friday update.\" Receive draft in seconds. Edit two lines. Send.</p><p style='margin-bottom:0;'><strong>The difference:</strong> from 5 min/email <em>after every paste</em> → <strong>45 seconds + 1 min review.</strong> Per month: ~12–14 hours saved ≈ <strong>1.5 working days.</strong> Over a year: roughly <strong>three weeks reclaimed.</strong></p>" },
      { kind: "tiers", label: "2.4 · Three kinds you can build", heading: "Three increasingly powerful tool types.",
        tiers: [
          { title: "Prompt templates", body: "Pre-written prompts saved in a text file, Notion, Google Docs, or notes app. Copy, paste, fill in blanks, send. <strong>Pros:</strong> simple, free. <strong>Cons:</strong> still copy-pasting every time.", stat: "Free · covered in <b>Chapter 3</b>" },
          { title: "Custom GPTs & Projects", body: "A pre-configured \"sub-AI\" with Instructions, Knowledge, and Capabilities. Open it, type a short prompt, receive output in your style. <strong>Pros:</strong> fast, shareable. <strong>Cons:</strong> paid plan; instruction limits.", stat: "Paid · <b>Chapter 4</b>" },
          { title: "Cowork pipelines", body: "Multi-agent workflows on the desktop. Several AI \"children\" working in parallel with file access. <strong>Pros:</strong> enormous power. <strong>Cons:</strong> Pro+ plan + Windows Pro/Enterprise (or macOS).", stat: "Pro+ · <b>Chapter 6</b>" }
        ]},
      { kind: "callout", tag: "2.5 · Exercise 2 (5 min) — Mass-market pen vs tailored suit",
        body: "<p>Write down:</p><ol><li>List <strong>three tasks</strong> you repeat at least once per week at work.</li><li>For each, rate 1–10 on two criteria: <strong>Repetition score</strong> (10 = identical every time; 1 = totally different) and <strong>Standardization score</strong> (10 = locked template; 1 = different each time).</li><li>Any task with total score ≥ <strong>14</strong> is a prime candidate for a Custom GPT (Chapter 4).</li></ol><p style='margin-bottom:0;'>Keep this list. When we reach Chapter 4, you'll apply the build process to one of these tasks.</p>" },
      { kind: "callout", tone: "accent", tag: "2.6 · Take-home line",
        body: "<p class='lead-q' style='margin:0;'><strong>Rule of three:</strong> if you repeat a task for the third time in a week and each time you're typing roughly the same prompt — it's time to build a personal tool for it.</p><p style='margin:12px 0 0;'>Don't write yourself off with \"I'm not technical.\" AI lets you describe the work in plain English and translates that into instructions on your behalf. You are now a <strong>tool designer</strong>, not just an executor.</p>" },

        ],

    blocks: [
      { kind: "prose", label: "2.1 · Anchor", heading: "Bút đại chúng và bộ vest may đo.",
        body: "<p>Bạn vào cửa hàng văn phòng phẩm, mua chiếc bút bi rẻ. Ai dùng cũng được. Mực giống nhau. Mọi loại giấy đều viết được. Đó là <strong>tool đại chúng</strong>.</p><p>Bạn đi may đo bộ vest. Số đo của bạn, vải bạn chọn, đường chỉ theo gu của bạn. Người khác mặc sẽ chật/rộng/sai phom. Đó là <strong>tool cá nhân hoá</strong>.</p><p class='lead-q'>Câu hỏi thẳng: 5 năm qua, bạn làm việc với tool đại chúng (Word/Excel/PPT mặc định) hay tool cá nhân (template riêng, macro riêng, công thức riêng)?</p><p>Hầu hết chúng ta đều có một mớ template/macro/công thức nhỏ đã âm thầm tự xây trong Excel/Word. Đó chính là cách bạn đã build tool cá nhân từ trước — chỉ là chưa có AI giúp. AI thay đổi luật chơi: <strong>build tool cá nhân giờ không cần biết code.</strong> Bạn mô tả bằng tiếng Việt; AI tự dịch thành instruction.</p>" },
      { kind: "cards", label: "2.2 · Hai cực", heading: "AI đại chúng vs AI cá nhân hoá.", cols: 2,
        items: [
          { num: "ĐẠI CHÚNG", title: "AI cho mọi người", body: "<p>ChatGPT/Claude \"trắng\". Không custom instruction. Không knowledge file. Excel mặc định không macro. Email template chung công ty phát cho mọi người.</p><p><strong>Đặc điểm:</strong> dùng được ngay, không setup, nhưng chung chung — không khớp giọng, format, ngữ cảnh.</p>" },
          { num: "CÁ NHÂN HOÁ", title: "AI build cho bạn", body: "<p>Thiết kế quanh 3 thứ: <strong>taste của bạn</strong> (giọng, độ trang trọng, độ dài); <strong>yêu cầu công việc</strong> (template công ty, checklist team, disclaimer ngành); <strong>domain knowledge</strong> (thuật ngữ, convention khách, idiom ngành).</p><p><strong>Đặc điểm:</strong> mất chút công ban đầu, dùng nhiều lần chất lượng đều — không gõ lại context mỗi lần.</p>" }
        ]},
      { kind: "callout", tone: "accent", tag: "2.3 · Ví dụ thực tế — Friday Update Drafter",
        body: "<p>Bạn là account manager ở B2B SaaS. Mỗi chiều thứ Sáu gửi email 200 từ \"weekly update\" cho ~50 contact khách. Tone: ấm áp nhưng trực tiếp. Luôn kết bằng next step rõ ràng.</p><p><strong>Cách đại chúng:</strong> mở ChatGPT, gõ preamble dài \"Bạn là account manager ở SaaS… 200 từ… đừng nghe giống marketing…\" paste note tuần này, yêu cầu draft, nhận về gần đúng nhưng tone hơi sai, sửa 5 phút. Lặp 50 lần. Sau 1 tháng: 4 × 50 × 5 phút = <strong>~16 giờ lặp thuần.</strong></p><p><strong>Cách cá nhân:</strong> build 1 lần Custom GPT \"Friday Update Drafter\". Instruction cài sẵn: role, tone, độ dài 180–220 từ, cấu trúc, cụm cấm. Knowledge file cấu hình sản phẩm theo tier. Mỗi thứ Sáu: mở GPT, paste note tuần, gõ \"Generate the Friday update.\" Nhận draft trong vài giây. Sửa 2 dòng. Gửi.</p><p style='margin-bottom:0;'><strong>Khác biệt:</strong> từ 5 phút/email <em>sau mỗi lần paste</em> → <strong>45 giây + 1 phút review.</strong> Một tháng tiết kiệm ~12–14 giờ ≈ <strong>1.5 ngày làm việc.</strong> Một năm: ~<strong>3 tuần lấy lại.</strong></p>" },
      { kind: "tiers", label: "2.4 · Ba loại bạn có thể build", heading: "Ba loại tool tăng dần sức mạnh.",
        tiers: [
          { title: "Prompt template", body: "Prompt soạn sẵn lưu trong text file, Notion, Google Docs, hoặc notes app. Copy, paste, điền chỗ trống, gửi. <strong>Ưu:</strong> đơn giản, free. <strong>Nhược:</strong> vẫn phải copy-paste mỗi lần.", stat: "Free · <b>Chương 3</b>" },
          { title: "Custom GPT & Project", body: "\"Sub-AI\" cài sẵn Instructions, Knowledge, Capabilities. Mở, gõ ngắn, nhận output đúng style. <strong>Ưu:</strong> nhanh, share được. <strong>Nhược:</strong> plan trả phí; giới hạn instruction.", stat: "Trả phí · <b>Chương 4</b>" },
          { title: "Cowork pipeline", body: "Workflow multi-agent trên desktop. Nhiều \"AI con\" làm song song có truy cập file. <strong>Ưu:</strong> sức mạnh khổng lồ. <strong>Nhược:</strong> plan Pro+ + Windows Pro/Enterprise (hoặc macOS).", stat: "Pro+ · <b>Chương 6</b>" }
        ]},
      { kind: "callout", tag: "2.5 · Bài tập 2 (5 phút) — Bút đại chúng vs vest may đo",
        body: "<p>Viết ra:</p><ol><li>Liệt kê <strong>3 task</strong> bạn lặp lại ít nhất 1 lần/tuần.</li><li>Với mỗi task, chấm 1–10 trên 2 tiêu chí: <strong>Repetition score</strong> (10 = giống y hệt; 1 = khác hoàn toàn) và <strong>Standardization score</strong> (10 = template khoá cứng; 1 = mỗi lần khác).</li><li>Task nào tổng điểm ≥ <strong>14</strong> = ứng cử viên hàng đầu cho Custom GPT (Chương 4).</li></ol><p style='margin-bottom:0;'>Giữ lại danh sách. Tới Chương 4 bạn sẽ áp dụng quy trình build cho 1 task này.</p>" },
      { kind: "callout", tone: "accent", tag: "2.6 · Đem về dùng",
        body: "<p class='lead-q' style='margin:0;'><strong>Quy luật 3:</strong> Nếu bạn làm 1 việc đến lần thứ 3 trong tuần và mỗi lần đều copy-paste cùng kiểu prompt — đến lúc xây tool cá nhân cho nó.</p><p style='margin:12px 0 0;'>Đừng coi mình \"không phải dân kỹ thuật\". AI cho phép mô tả việc bằng tiếng Việt, AI tự dịch ra \"code/instruction\". Bạn giờ là <strong>người thiết kế</strong>, không phải người thực thi.</p>" },
      { kind: "quiz", q: "Task nào là ứng cử viên MẠNH NHẤT để hệ thống hoá thành Custom GPT?",
        options: [
          { t: "Trả lời RFP một lần cho khách enterprise duy nhất.", correct: false },
          { t: "Chiều thứ Sáu: 50 email update khách, cùng shape, khác data.", correct: true },
          { t: "Buổi brainstorm ad-hoc đặt tên sản phẩm mới.", correct: false }
        ],
        explain: "Repetition cao + Standardization cao = công thức. 50 email Friday có cùng skeleton, cùng format mỗi tuần — chính xác chỗ đầu tư 1 giờ ban đầu để tiết kiệm 16 giờ mỗi tháng." }
    ]
  }

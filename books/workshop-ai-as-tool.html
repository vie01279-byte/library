/* ============ S04 — Three Prompt Tiers + Meta-prompting ============ */
{
  id: "prompt-tiers",
  duration: "85 min",
  tag: "Core skill",
  tagAccent: true,
  en: {
    title: "Commands — the soul of AI-as-Tool",
    sub: "The most important chapter of the workshop. If you only absorb one chapter, make it this one. Three prompt tiers + meta-prompting + 7 advanced techniques.",
    tldr: [
      "Prompts are work specifications, not magic spells. \"Good prompts are clear specifications, not long incantations.\" — Anthropic",
      "Three tiers: simple verb+object → structured (role+context+task+format+constraints) → full Prompt Contract with verification.",
      "Meta-prompting = asking AI to upgrade your prompt to Tier 3. The single most powerful technique for beginners."
    ],
    blocks: [
      { kind: "prose", label: "3.1 · Anchor", heading: "Why prompts matter so much.",
        body: "<p>Thought experiment. You just hired a new employee — smart, quick reader, strong writer, hard-working — but they have never worked in your industry and they don't know your company. On their first day, you assign them a task.</p><p><strong>Way 1:</strong> \"Write a memo for me.\" — They ask: a memo about what? For whom? How long? Template? When? Format? If you don't answer and only say \"just write one,\" they will <strong>guess</strong>. They might be right. They might be wrong. They will most likely produce something <strong>generic and unusable</strong>.</p><p><strong>Way 2:</strong> \"Write a one-page memo for the leadership team summarizing the customer churn investigation. The data is in the dashboard I forwarded. Structure: two-line headline, five key numbers, three findings, three actions. Use our internal memo template. End with: 'Working document — not final.' By 11 a.m. If you need to ask, ask in the first 30 minutes.\" — They can start immediately. The output will be roughly right on the first attempt. You'll only need to review.</p><p class='lead-q'><strong>AI is the same.</strong> AI is a smart new employee that cannot read your mind. A prompt is the information you give AI to complete the right work. The clearer the prompt, the better the result.</p>" },
      { kind: "callout", tone: "accent", tag: "3.2 · The 2026 prompt philosophy",
        body: "<p>A few years ago, the myth: \"good prompts are long prompts.\" People stuffed prompts with tricks: \"You are the world's leading expert,\" \"Think step by step,\" \"I'll tip you $200.\"</p><p>By 2026, the understanding has matured. Anthropic writes in its official docs:</p><p class='lead-q'>\"Golden rule: Give your prompt to a colleague with minimal context and see if they can follow it. If they're confused, Claude will be too.\"</p><p>The new philosophy in one sentence: <strong>Good prompts are clear specifications, not long incantations.</strong></p><p style='margin-bottom:0;'>In 2026, the highest-tier style is called <strong>\"Prompt Contract\"</strong> — written like a contract between you and AI, with: <em>Role · Task · Success Criteria · Constraints · Output Format · Uncertainty Rule.</em></p>" },
      { kind: "tiers", label: "3.3–3.5 · The three tiers", heading: "From one-liner to professional specification.",
        tiers: [
          { title: "Simple command", body: "A short verb + object. No role, no context, no format. <em>\"Summarize this blog post in 3 sentences.\"</em> Good for: very simple, standalone, one-off tasks with no risk if the answer is fuzzy.", stat: "Success rate: <b>~70%</b> on simple tasks" },
          { title: "Structured command", body: "Add structural elements: <em>Role · Context · Task (ordered steps) · Output Format · Constraints.</em> Good for: most professional tasks where format and tone matter.", stat: "Success rate: <b>~85%</b> on structured tasks" },
          { title: "Prompt Contract", body: "Full professional specification. Adds Success Criteria, Uncertainty Rule, and a Verification step the AI runs before answering. Production-ready quality, audit-friendly.", stat: "Success rate: <b>~95%</b> · review-ready" }
        ]},
      { kind: "code", label: "Tier 1 examples", title: "Tier 1 — one-liners (across professions)",
        text: "Marketing:      \"Summarize this blog post in three sentences.\"\nSales:          \"Translate this email to Spanish.\"\nOperations:     \"Fix the typos in this paragraph.\"\nHR:             \"Give me five icebreaker activities for a 20-person team meeting.\"\nGeneral:        \"What's the difference between an LLC and a corporation?\"" },
      { kind: "code", label: "Tier 2 template", title: "Tier 2 — structural skeleton",
        text: "ROLE: You are [profession / specialty].\n\nCONTEXT: [background, who the end-reader is, what the purpose is]\n\nTASK:\n1. [Step 1]\n2. [Step 2]\n3. [Step 3]\n\nOUTPUT FORMAT:\n- [bullet count / word count / file type / template]\n\nCONSTRAINTS:\n- DO NOT [...]\n- Assume: [...]\n- Out of scope: [...]" },
      { kind: "code", label: "Tier 2 worked example", title: "Tier 2 — B2B cold outreach email",
        text: "ROLE: You are an experienced B2B copywriter who writes outreach emails for\nenterprise SaaS sales.\n\nCONTEXT: This email is going to the VP of Operations at a 2,000-person\nlogistics company. She is busy, skeptical of vendor pitches, and previously\nresponded to a cold email about scheduling automation but did not book a\nmeeting. Goal: get a 15-minute discovery call.\n\nTASK:\n1. Open with one specific reference to the prior conversation (no flattery).\n2. State one new piece of value relevant to her industry (peer reference OK).\n3. Make one clear ask with two specific time slots.\n\nOUTPUT FORMAT:\n- Subject line: ≤ 7 words.\n- Body: exactly three short paragraphs, each 2–3 sentences.\n- Total length: ≤ 130 words.\n- Tone: professional, direct, no buzzwords.\n\nCONSTRAINTS:\n- DO NOT use \"circle back,\" \"synergize,\" \"touch base,\" \"just checking in.\"\n- DO NOT mention price.\n- DO NOT promise specific outcomes.\n- DO NOT sign off — leave [Your name] for me to fill in." },
      { kind: "code", label: "Tier 3 structure", title: "Tier 3 — Prompt Contract skeleton",
        text: "1. ROLE                 — one line, professional identity.\n2. SUCCESS CRITERIA     — bullet list defining \"done.\"\n3. CONSTRAINTS          — banned actions, scope limits, exclusions.\n4. UNCERTAINTY RULE     — what to do when the AI is not sure.\n5. INPUT                — the data and context the AI has.\n6. OUTPUT FORMAT        — exact schema/structure of the result.\n7. VERIFICATION         — self-check the AI runs before answering." },
      { kind: "code", label: "Tier 3 worked example", title: "Tier 3 — Compliance review of a marketing claim",
        text: "ROLE\nYou are a senior content reviewer responsible for ensuring marketing\nmaterials do not make claims that the legal or regulatory team would flag.\nYou understand the difference between an opinion, a factual claim, and an\nimplied promise.\n\nSUCCESS CRITERIA\n- Identify 100% of unsubstantiated claims, comparative claims, and\n  outcome promises.\n- Each flagged claim quoted verbatim with location (paragraph, sentence).\n- Each flag includes a brief reason and a suggested rewording.\n- A junior marketer can fix the draft without re-reading your reasoning.\n- Every action item must be doable within one business day.\n\nCONSTRAINTS\n- DO NOT guess. If unsure whether a claim crosses a line, flag as\n  [REVIEW] and explain.\n- DO NOT make legal determinations or cite specific statutes.\n- DO NOT rewrite the entire draft — only flag and suggest one-line fixes.\n- Scope: marketing-claim risk only.\n\nUNCERTAINTY RULE\nIf a phrase is ambiguous:\n- Quote the phrase.\n- Mark confidence: H (high — clearly problematic), M (medium — context-\n  dependent), L (low — likely fine but worth a second look).\n- Suggest a question for the author rather than guessing intent.\n\nOUTPUT FORMAT (Markdown):\n## CLAIM REVIEW — [Project] — [Date]\n### Flagged claims\n| # | Quoted text | Location | Type | Confidence | Suggested fix |\n### Questions for the author\n### Summary\n- Total flags: [N]    - High-severity flags: [N]\n- Recommended next step: [READY / NEEDS REWRITE / NEEDS LEGAL REVIEW]\n\nVERIFICATION (run before answering)\n- [ ] Is every flag actually quoted from the draft (no paraphrases)?\n- [ ] Did I avoid making legal determinations?\n- [ ] Does each confidence level match the strength of evidence?\n- [ ] Does the output match the schema exactly?\n- [ ] Did I avoid scope creep (rewriting beyond a one-line suggestion)?" },
      { kind: "callout", tone: "accent", tag: "3.6 · The secret weapon: META-PROMPTING",
        body: "<p>You're reading this and thinking: \"Tier 3 looks great, but I can't write that every time.\"</p><p><strong>You don't have to.</strong> Ask AI to write it for you. This is called <strong>meta-prompting</strong> — <em>\"prompting to produce a prompt.\"</em> OpenAI has an entire cookbook page on the technique. Community practitioners call it the <strong>single most powerful technique for beginners</strong> because it lets you jump from Tier 1 to Tier 3 in 30 seconds.</p>" },
      { kind: "code", label: "Meta-prompt template", title: "Copy this template — keep it forever",
        text: "You are an expert in 2026-era prompt engineering.\n\nI have a simple prompt whose result is not satisfactory:\n\"[PASTE MY ORIGINAL PROMPT HERE]\"\n\nContext of use:\n- I am a [role, profession — e.g., HR business partner at a mid-sized company]\n- The output will be used for [purpose — e.g., a draft for an internal town hall announcement]\n- The end-reader is [audience — e.g., all employees, mixed technical literacy]\n- Quality requirements: [e.g., factual accuracy, plain language, no jargon]\n\nPlease:\n1. Analyze my original prompt — what's vague, what context is missing?\n2. Ask me 3–5 clarifying questions if needed.\n3. Once I've answered (or assuming reasonable defaults), rewrite the prompt\n   as a Tier-3 Prompt Contract:\n   - Role · Success Criteria · Constraints · Uncertainty Rule\n   - Input · Output Format · Verification checklist\n4. Explain each change so I learn why it's better." },
      { kind: "accordion", label: "3.7 · Advanced techniques to layer on Tier 2/3", heading: "Seven techniques worth knowing for the day you need them.",
        items: [
          { q: "1. XML tags to separate blocks (especially effective with Claude)", a: "<p>Anthropic recommends wrapping different parts of a prompt in XML tags. In complex prompts, Claude can clearly distinguish the role from the data from the format requirement, reducing confusion.</p><pre style='font-family:var(--font-mono);font-size:12px;background:var(--grid);padding:12px;overflow-x:auto;'>&lt;role&gt;You are a senior recruiter screening resumes.&lt;/role&gt;\n&lt;task&gt;Identify the top 3 candidates.&lt;/task&gt;\n&lt;documents&gt;\n  &lt;document index=\"1\"&gt;\n    &lt;source&gt;candidate_A.pdf&lt;/source&gt;\n    &lt;document_content&gt;[content]&lt;/document_content&gt;\n  &lt;/document&gt;\n&lt;/documents&gt;\n&lt;criteria&gt;[your criteria]&lt;/criteria&gt;\n&lt;format&gt;...&lt;/format&gt;</pre>" },
          { q: "2. Few-shot examples (2–5 worked examples)", a: "<p>When you want AI to mimic a specific format or voice, <strong>providing 2–5 sample examples</strong> is the most effective method. Anthropic's note: <strong>3–5 examples is the sweet spot</strong>; fewer doesn't shape behavior; more starts to confuse.</p>" },
          { q: "3. Put long data at the top, ask the question at the bottom", a: "<p>When you paste a long document and then ask a question, put the document at the top, the question at the bottom. Anthropic reports this can improve response quality by up to <strong>30%</strong> compared to the reverse order.</p>" },
          { q: "4. \"Quote before answering\" — force anchoring", a: "<p>Ask AI to quote relevant passages verbatim from the source <em>first</em>, <em>then</em> answer. This forces the AI to anchor in real text, dramatically reducing fabrication risk.</p><p style='font-family:var(--font-mono);font-size:12px;color:var(--muted);'>\"Before answering: 1. Quote 5 verbatim passages from the document relevant to the question (include page references). 2. Then answer based only on those quotes.\"</p>" },
          { q: "5. Tune verbosity", a: "<p>By 2026, Claude (especially Opus 4.7) auto-tunes length. If output is too long: <em>\"Be concise and focused. Skip unnecessary context. Minimal examples.\"</em> If you need more depth: <em>\"Analyze deeply. Give concrete examples. Don't skip important detail.\"</em></p>" },
          { q: "6. Role + audience together", a: "<p>For writing tasks, specifying both <strong>who the AI is</strong> and <strong>who the reader is</strong> improves register dramatically.</p><pre style='font-family:var(--font-mono);font-size:12px;background:var(--grid);padding:12px;'>ROLE: You are a pediatric nurse writing patient-education materials.\nAUDIENCE: Parents of children aged 5–10 newly diagnosed with Type 1 diabetes.\nTONE: Reassuring, plain English, no medical jargon unless followed by a definition.\nREADING LEVEL: 8th grade.</pre>" },
          { q: "7. Ask for reasoning artifacts (not hidden chain-of-thought)", a: "<p>OpenAI's official guidance for reasoning models is to <strong>avoid asking \"think step by step\"</strong> — that pattern was useful for older models and can hurt newer ones. Instead, ask for reasoning artifacts you can audit:</p><pre style='font-family:var(--font-mono);font-size:12px;background:var(--grid);padding:12px;'>For complex tasks, reason carefully internally. In your response, return:\n1. Assumptions you are making.\n2. Key checks you performed (with values).\n3. The final answer.\n4. A brief rationale (3–5 sentences).\nDo NOT include a full hidden step-by-step trace.</pre>" }
        ]},
      { kind: "callout", tag: "3.8 · Exercise 3 (30 min) — Write a three-tier prompt for one of your tasks",
        body: "<p><strong>Step 1 (5 min):</strong> Pick one real task from your job. Write it as a Tier-1 prompt (one sentence). Send to ChatGPT or Claude. Save the output.</p><p><strong>Step 2 (10 min):</strong> Rewrite the same task as a Tier-2 prompt (role + context + task + format + constraints). Send to the same AI. Save the output. Compare with Tier 1.</p><p><strong>Step 3 (10 min):</strong> Use the meta-prompt template (above) to have AI upgrade your Tier-1 prompt to Tier 3. Send the Tier-3 prompt. Save.</p><p style='margin-bottom:0;'><strong>Step 4 (5 min):</strong> Compare all three outputs. Which is most usable? Most trustworthy? Which will you use for 90% of your daily work?</p>" },
      { kind: "table", label: "3.9 · Common beginner mistakes", heading: "Bad prompt → how to fix.",
        headers: ["Mistake", "Bad example", "Fix"],
        rows: [
          ["Too generic", "\"How's Tesla doing?\"", "\"Summarize the five biggest risks and five biggest opportunities from Tesla's latest earnings call.\""],
          ["No role", "\"Write an email.\"", "\"You are a project manager writing an apology email to a key client whose deliverable slipped two weeks…\""],
          ["No format", "\"Analyze this company.\"", "\"…output as JSON with schema {risk, severity, source}.\""],
          ["No constraints", "\"Recommend the best vendor.\"", "\"Compare three named vendors I'll provide, score each on five fixed criteria, do not recommend a winner — just give me the score table.\""],
          ["No verification", "(AI invented numbers)", "Add: \"Before answering, quote the source passages for every number you use.\""],
          ["Tasks crammed together", "\"Summarize + translate + write PR + make slide deck.\"", "Split into separate prompts, or one prompt with a clear ordered task list."],
          ["No secondary context", "\"Fix this email.\"", "\"Fix this email — context: going to a client unhappy about a price increase. Acknowledge feelings while holding position.\""],
          ["Same prompt on repeat", "(send identical prompt again)", "Diagnose: where did AI misunderstand? Add the missing context — don't re-send."],
          ["Output too long for one shot", "\"Write me a 100-page strategy.\"", "Break into sections; AI produces one section at a time with consistent style."],
          ["Treating AI as oracle", "\"What should I do?\"", "\"Here are my three options and trade-offs. Push back: what am I missing? Strongest case against my preferred option?\""]
        ]},
      { kind: "callout", tone: "warn", tag: "3.10 · Two double-edged swords",
        body: "<p><strong>Sword 1 — Prompts that are too long.</strong> Beginners who just learned Tier 3 sometimes start writing 2,000-word prompts for every task. That's a mistake. <strong>Prompt length should scale with task complexity.</strong> \"What does ARR mean?\" — Tier 1 is enough. Compliance review of a marketing claim — Tier 3.</p><p style='margin-bottom:0;'><strong>Sword 2 — 100% reliance on AI.</strong> Even Tier 3 with verification, AI can still be wrong or fabricate (Chapter 7 explains in detail). <strong>You are still the one accountable.</strong> A clean prompt reduces error; it doesn't eliminate it.</p>" },
      { kind: "callout", tone: "accent", tag: "3.11 · Take-home — three things to remember",
        body: "<ol><li><strong>Prompts are not magic spells. Prompts are work specifications.</strong> You don't need tricks. You need to assign work clearly.</li><li><strong>When you can't write a Tier-3 prompt yourself, use meta-prompting.</strong> Ask AI to upgrade your prompt. This is the single most important technique you'll learn today.</li><li><strong>Repeating a prompt is a signal.</strong> Each time you copy-paste the same prompt three times in a week → it's time to build a Custom GPT (Chapter 4).</li></ol>" },
      { kind: "table", label: "Quality scaling — same task, different tier", headers: ["Same task", "Prompt", "Estimated quality"],
        rows: [
          ["Draft quarterly recap", "\"Summarize Q3.\"", "50% — generic, no numbers"],
          ["Draft quarterly recap", "Role + task + format + constraints (Tier 2)", "80% — numbers present, format correct, slightly stiff"],
          ["Draft quarterly recap", "Full Tier-3 Prompt Contract with verification", "<span class='ok'>95% — review-ready, audit-friendly</span>"],
          ["Draft quarterly recap", "A dedicated Custom GPT", "<span class='ok'>95% + 90% time saved per cycle</span>"]
        ]},
      { kind: "quiz", q: "Your Tier-1 prompt isn't producing what you want. According to this chapter, the SINGLE most powerful beginner move is:",

          { t: "Add \"Think step by step\" to force better reasoning.", correct: false },

        explain: "Meta-prompting jumps you from Tier 1 to Tier 3 in 30 seconds, with one template. The \"think step by step\" trick is outdated for 2026 reasoning models. Switching providers rarely fixes prompt problems." }

  vi: {
    title: "Mệnh lệnh — linh hồn của AI-as-Tool",
    sub: "Chương quan trọng nhất của workshop. Nếu chỉ học được 1 chương, hãy là chương này. 3 tầng prompt + meta-prompting + 7 kỹ thuật nâng cao.",
    tldr: [
      "Prompt là đặc tả công việc, không phải bùa chú. \"Prompt giỏi là đặc tả rõ ràng, không phải bùa chú dài\" — Anthropic",
      "3 tầng: simple verb+object → có cấu trúc (role+context+task+format+constraint) → Prompt Contract đầy đủ với verification.",
      "Meta-prompting = nhờ AI nâng cấp prompt của bạn lên Tầng 3. Kỹ thuật mạnh NHẤT cho người mới."
    ],
    blocks: [
      { kind: "prose", label: "3.1 · Anchor", heading: "Tại sao prompt quan trọng đến vậy.",
        body: "<p>Thí nghiệm tư duy. Bạn vừa tuyển nhân viên mới — thông minh, đọc nhanh, viết tốt, chăm — nhưng chưa từng làm trong ngành bạn và không quen công ty bạn. Ngày đầu, bạn giao việc.</p><p><strong>Cách 1:</strong> \"Em viết memo cho anh.\" — Em ấy hỏi: Memo gì? Cho ai? Dài bao nhiêu? Template? Khi nào? Format gì? Nếu bạn không trả lời và chỉ nói \"em viết đi\", em ấy sẽ <strong>đoán</strong>. Có thể đúng. Có thể sai. Khả năng cao là <strong>chung chung và không dùng được</strong>.</p><p><strong>Cách 2:</strong> \"Em viết memo 1 trang cho ban lãnh đạo tóm tắt điều tra customer churn. Data trong dashboard anh forward. Cấu trúc: headline 2 dòng, 5 số quan trọng nhất, 3 finding, 3 hành động. Dùng template memo nội bộ. Kết bằng: 'Working document — chưa final.' Trước 11h sáng. Có gì hỏi, hỏi trong 30 phút đầu.\" — Em ấy bắt tay vào ngay. Output gần đúng lần đầu. Bạn chỉ cần review.</p><p class='lead-q'><strong>AI cũng vậy.</strong> AI là nhân viên thông minh, không đọc được tâm trí bạn. Prompt = thông tin bạn truyền cho AI để hoàn thành đúng việc. Prompt càng rõ, kết quả càng tốt.</p>" },
      { kind: "callout", tone: "accent", tag: "3.2 · Triết lý prompt 2026",
        body: "<p>Vài năm trước có hiểu lầm phổ biến: \"prompt giỏi = prompt dài\". Người ta nhồi đủ trick: \"Bạn là chuyên gia hàng đầu thế giới\", \"Suy nghĩ từng bước\", \"Tôi tip $200\".</p><p>Đến 2026, hiểu biết đã chín muồi. Anthropic viết:</p><p class='lead-q'>\"Quy tắc vàng: Đưa prompt cho đồng nghiệp với context tối thiểu và xem họ có làm theo được không. Nếu họ confuse, Claude cũng confuse.\"</p><p>Triết lý mới gọn 1 câu: <strong>Prompt giỏi = đặc tả rõ ràng, không phải viết dài.</strong></p><p style='margin-bottom:0;'>Năm 2026, kiểu cao cấp nhất gọi là <strong>\"Prompt Contract\"</strong> — viết như hợp đồng giữa bạn và AI, gồm: <em>Role · Task · Success Criteria · Constraints · Output Format · Uncertainty Rule.</em></p>" },
      { kind: "tiers", label: "3.3–3.5 · Ba tầng", heading: "Từ one-liner đến đặc tả chuyên nghiệp.",
        tiers: [
          { title: "Mệnh lệnh đơn giản", body: "Câu lệnh ngắn = verb + object. Không role, không context, không format. <em>\"Tóm tắt blog post này trong 3 câu.\"</em> Phù hợp: task rất đơn giản, độc lập, làm 1 lần, không rủi ro nếu mơ hồ.", stat: "Tỉ lệ thành công: <b>~70%</b> task đơn giản" },
          { title: "Mệnh lệnh có cấu trúc", body: "Thêm yếu tố: <em>Role · Context · Task (bước thứ tự) · Output Format · Constraints.</em> Phù hợp: phần lớn task chuyên môn cần format + tone đúng.", stat: "Tỉ lệ thành công: <b>~85%</b> task có cấu trúc" },
          { title: "Prompt Contract", body: "Đặc tả chuyên nghiệp đầy đủ. Thêm Success Criteria, Uncertainty Rule, và bước Verification AI chạy trước khi trả. Chất lượng production-ready, audit-friendly.", stat: "Tỉ lệ thành công: <b>~95%</b> · review-ready" }
        ]},
      { kind: "code", label: "Ví dụ Tầng 1", title: "Tầng 1 — one-liner (qua các nghề)",
        text: "Marketing:      \"Tóm tắt blog post này trong 3 câu.\"\nSales:          \"Dịch email này sang tiếng Tây Ban Nha.\"\nOperations:     \"Sửa lỗi chính tả đoạn này.\"\nHR:             \"Cho tôi 5 hoạt động icebreaker cho buổi họp team 20 người.\"\nBất kỳ ai:      \"Khác biệt giữa LLC và corporation là gì?\"" },
      { kind: "code", label: "Tầng 2 template", title: "Tầng 2 — skeleton cấu trúc",
        text: "ROLE: Bạn là [nghề / chuyên môn].\n\nCONTEXT: [thông tin nền, người đọc cuối, mục đích]\n\nTASK:\n1. [Bước 1]\n2. [Bước 2]\n3. [Bước 3]\n\nOUTPUT FORMAT:\n- [số bullet / số từ / loại file / template]\n\nCONSTRAINTS:\n- KHÔNG [...]\n- Giả định: [...]\n- Out of scope: [...]" },
      { kind: "code", label: "Tầng 2 ví dụ thực", title: "Tầng 2 — email B2B cold outreach",
        text: "ROLE: Bạn là copywriter B2B chuyên viết cold outreach cho enterprise\nSaaS sales.\n\nCONTEXT: Email gửi VP of Operations ở công ty logistics 2.000 nhân viên.\nBà ấy bận, hoài nghi vendor pitch, từng phản hồi email cold trước về\nscheduling automation nhưng không book meeting. Mục tiêu: lấy 15 phút\ndiscovery call.\n\nTASK:\n1. Mở đầu bằng 1 reference cụ thể đến cuộc trao đổi trước (không nịnh).\n2. Đưa 1 mảnh giá trị mới relevant với ngành bà ấy (peer reference OK).\n3. Đưa 1 lời mời rõ ràng với 2 khung giờ cụ thể.\n\nOUTPUT FORMAT:\n- Subject line: ≤ 7 từ.\n- Body: đúng 3 đoạn ngắn, mỗi 2–3 câu.\n- Tổng độ dài: ≤ 130 từ.\n- Tone: professional, trực tiếp, không buzzword.\n\nCONSTRAINTS:\n- KHÔNG dùng \"circle back\", \"synergize\", \"touch base\", \"just checking in\".\n- KHÔNG đề cập giá.\n- KHÔNG hứa kết quả cụ thể.\n- KHÔNG ký tên — để [Tên bạn] cho tôi điền." },
      { kind: "code", label: "Tầng 3 cấu trúc", title: "Tầng 3 — Prompt Contract skeleton",
        text: "1. ROLE                 — 1 dòng, định danh chuyên môn.\n2. SUCCESS CRITERIA     — bullet list định nghĩa \"xong việc\".\n3. CONSTRAINTS          — điều cấm, scope, exclusions.\n4. UNCERTAINTY RULE     — phải làm gì khi không chắc.\n5. INPUT                — data và context AI có.\n6. OUTPUT FORMAT        — schema/structure chính xác.\n7. VERIFICATION         — checklist AI tự chạy trước khi trả." },
      { kind: "code", label: "Tầng 3 ví dụ thực", title: "Tầng 3 — Compliance review marketing claim",
        text: "ROLE\nBạn là senior content reviewer đảm bảo marketing material không có claim\nmà team pháp lý/regulatory sẽ flag. Phân biệt rõ opinion, factual claim,\nimplied promise.\n\nSUCCESS CRITERIA\n- Phát hiện 100% claim không có cơ sở, claim so sánh, outcome promise.\n- Mỗi flag trích nguyên văn với vị trí (đoạn, câu).\n- Mỗi flag kèm lý do ngắn và đề xuất phrasing.\n- Junior marketer fix được mà không phải đọc reasoning của bạn.\n- Mọi action item làm được trong 1 ngày.\n\nCONSTRAINTS\n- KHÔNG đoán. Không chắc cross-line, flag [REVIEW] và giải thích.\n- KHÔNG phán quyết pháp lý hay trích statute.\n- KHÔNG viết lại toàn bộ draft — chỉ flag + fix 1 dòng.\n- Scope: chỉ marketing-claim risk.\n\nUNCERTAINTY RULE\nNếu cụm từ mơ hồ:\n- Trích nguyên văn.\n- Đánh confidence: H (cao — rõ ràng có vấn đề), M (vừa — phụ thuộc\n  context), L (thấp — có thể OK nhưng đáng xem).\n- Đề xuất câu hỏi cho tác giả thay vì đoán intent.\n\nOUTPUT FORMAT (Markdown):\n## CLAIM REVIEW — [Project] — [Ngày]\n### Flagged claims\n| # | Quoted text | Location | Type | Confidence | Suggested fix |\n### Câu hỏi cho tác giả\n### Tóm tắt\n- Tổng flag: [N]   - High-severity: [N]\n- Next step: [READY / NEEDS REWRITE / NEEDS LEGAL REVIEW]\n\nVERIFICATION (chạy trước khi trả)\n- [ ] Mọi flag có trích nguyên văn không (không paraphrase)?\n- [ ] Tránh phán quyết pháp lý chưa?\n- [ ] Confidence có khớp mức bằng chứng?\n- [ ] Output khớp schema?\n- [ ] Có scope creep (sửa quá 1 dòng) không?" },
      { kind: "callout", tone: "accent", tag: "3.6 · Vũ khí bí mật: META-PROMPTING",
        body: "<p>Bạn đọc đến đây có thể nghĩ: \"Tầng 3 ngầu thật, làm sao tôi viết mỗi lần?\"</p><p><strong>Bạn không cần.</strong> Hãy nhờ AI viết hộ. Kỹ thuật này gọi là <strong>meta-prompting</strong> — <em>\"prompt để tạo prompt\"</em>. OpenAI có nguyên trang cookbook dạy. Cộng đồng coi đây là <strong>kỹ thuật mạnh NHẤT cho người mới</strong> vì cho phép nhảy cóc từ Tầng 1 → Tầng 3 trong 30 giây.</p>" },
      { kind: "code", label: "Meta-prompt template", title: "Copy template này — giữ mãi",
        text: "Bạn là chuyên gia về prompt engineering theo chuẩn 2026.\n\nTôi có 1 prompt đơn giản, kết quả không như ý:\n\"[DÁN PROMPT GỐC VÀO ĐÂY]\"\n\nBối cảnh sử dụng:\n- Tôi là [vị trí, nghề — vd: HR business partner ở công ty cỡ trung]\n- Output dùng cho [mục đích — vd: draft thông báo town hall nội bộ]\n- Người đọc cuối: [đối tượng — vd: toàn thể nhân viên, mixed technical literacy]\n- Yêu cầu chất lượng: [vd: factual accuracy, plain language, không jargon]\n\nHãy:\n1. Phân tích prompt gốc — chỗ nào mơ hồ, thiếu gì.\n2. Đặt 3–5 câu hỏi clarifying nếu cần.\n3. Sau khi tôi trả lời (hoặc default hợp lý), viết lại prompt theo\n   Prompt Contract Tầng 3:\n   - Role · Success Criteria · Constraints · Uncertainty Rule\n   - Input · Output Format · Verification checklist\n4. Giải thích vì sao mỗi thay đổi làm prompt tốt hơn.\n\nTrả lời tiếng Việt." },
      { kind: "accordion", label: "3.7 · 7 kỹ thuật nâng cao layer trên Tầng 2/3", heading: "Không bắt buộc cho beginner, đáng biết khi cần.",
        items: [
          { q: "1. Dùng XML tags chia khối (đặc biệt hiệu quả với Claude)", a: "<p>Anthropic khuyến nghị bao các phần khác nhau bằng XML tag. Trong prompt phức tạp, Claude phân biệt rõ phần nào là role, phần nào là data, phần nào là format → ít nhầm lẫn.</p><pre style='font-family:var(--font-mono);font-size:12px;background:var(--grid);padding:12px;overflow-x:auto;'>&lt;role&gt;Bạn là senior recruiter screen resume.&lt;/role&gt;\n&lt;task&gt;Xác định top 3 candidate.&lt;/task&gt;\n&lt;documents&gt;\n  &lt;document index=\"1\"&gt;\n    &lt;source&gt;candidate_A.pdf&lt;/source&gt;\n    &lt;document_content&gt;[nội dung]&lt;/document_content&gt;\n  &lt;/document&gt;\n&lt;/documents&gt;\n&lt;criteria&gt;[tiêu chí]&lt;/criteria&gt;\n&lt;format&gt;...&lt;/format&gt;</pre>" },
          { q: "2. Few-shot examples (2–5 ví dụ mẫu)", a: "<p>Khi muốn AI bắt chước format/giọng cụ thể, <strong>cho 2–5 ví dụ mẫu</strong> là cách hiệu quả nhất. Lưu ý Anthropic: <strong>3–5 ví dụ là sweet spot</strong>; ít hơn không định hình; nhiều hơn dễ rối.</p>" },
          { q: "3. Đặt data dài lên đầu, câu hỏi xuống cuối", a: "<p>Khi paste document dài rồi hỏi, đặt document lên đầu, câu hỏi xuống cuối. Anthropic công bố có thể tăng chất lượng tới <strong>30%</strong> so với cách ngược lại.</p>" },
          { q: "4. \"Quote before answering\" — ép bám nguồn", a: "<p>Yêu cầu AI trích nguyên văn các đoạn liên quan trước, rồi mới trả lời. Ép AI bám vào dữ liệu thật, giảm mạnh rủi ro bịa.</p><p style='font-family:var(--font-mono);font-size:12px;color:var(--muted);'>\"Trước khi trả lời: 1. Trích nguyên văn 5 đoạn liên quan (kèm page). 2. Sau đó trả lời chỉ dựa trên các trích đó.\"</p>" },
          { q: "5. Tune verbosity", a: "<p>Năm 2026, Claude (đặc biệt Opus 4.7) tự điều chỉnh độ dài. Nếu dài quá: <em>\"Trả lời ngắn gọn, tập trung. Bỏ context không cần. Ví dụ tối thiểu.\"</em> Nếu cần sâu hơn: <em>\"Phân tích sâu. Cho ví dụ cụ thể. Đừng bỏ chi tiết quan trọng.\"</em></p>" },
          { q: "6. Role + audience cùng lúc", a: "<p>Với task viết, chỉ định <strong>AI là ai</strong> và <strong>người đọc là ai</strong> cải thiện register rõ rệt.</p><pre style='font-family:var(--font-mono);font-size:12px;background:var(--grid);padding:12px;'>ROLE: Bạn là pediatric nurse viết tài liệu patient-education.\nAUDIENCE: Phụ huynh trẻ 5–10 tuổi mới chẩn đoán Type 1 diabetes.\nTONE: Trấn an, ngôn ngữ giản dị, không jargon y tế trừ khi kèm định nghĩa.\nREADING LEVEL: Lớp 8.</pre>" },
          { q: "7. Yêu cầu reasoning artifact (không phải hidden chain-of-thought)", a: "<p>Hướng dẫn chính thức của OpenAI cho reasoning model là <strong>tránh yêu cầu \"think step by step\"</strong> — pattern này hữu ích với model cũ, có thể hại với model mới. Thay vào đó, yêu cầu reasoning artifact bạn audit được:</p><pre style='font-family:var(--font-mono);font-size:12px;background:var(--grid);padding:12px;'>Với task phức tạp, reasoning kỹ nội bộ. Trong câu trả lời, trả về:\n1. Các giả định.\n2. Các kiểm tra chính (kèm giá trị).\n3. Câu trả lời cuối.\n4. Lý do ngắn (3–5 câu).\nKHÔNG gồm full hidden step-by-step trace.</pre>" }
        ]},
      { kind: "callout", tag: "3.8 · Bài tập 3 (30 phút) — Viết prompt 3 tầng cho 1 task của bạn",
        body: "<p><strong>Bước 1 (5 phút):</strong> Chọn 1 task thật. Viết thành Prompt Tầng 1 (1 câu). Gửi ChatGPT/Claude. Lưu output.</p><p><strong>Bước 2 (10 phút):</strong> Viết lại thành Prompt Tầng 2 đầy đủ (role+context+task+format+constraint). Gửi cùng AI. Lưu output. So sánh Tầng 1.</p><p><strong>Bước 3 (10 phút):</strong> Dùng meta-prompt template (trên) nhờ AI nâng cấp prompt Tầng 1 lên Tầng 3. Gửi. Lưu.</p><p style='margin-bottom:0;'><strong>Bước 4 (5 phút):</strong> So sánh 3 output. Tầng nào dùng được nhất? Tin nhất? Tầng nào bạn sẽ dùng cho 90% công việc hằng ngày?</p>" },
      { kind: "table", label: "3.9 · Lỗi prompt thường gặp của người mới", heading: "Prompt sai → cách sửa.",
        headers: ["Lỗi", "Ví dụ sai", "Cách sửa"],
        rows: [
          ["Hỏi quá chung", "\"Tesla thế nào?\"", "\"Tóm tắt 5 risk và 5 opportunity từ Tesla earnings call Q1/2026 mới nhất.\""],
          ["Thiếu role", "\"Viết email.\"", "\"Bạn là project manager viết email xin lỗi khách lớn vì deliverable trễ 2 tuần…\""],

          ["Không có verification", "(AI bịa số)", "Thêm: \"Trước khi trả, trích nguyên văn nguồn cho mỗi số.\""],
          ["Nhồi nhiều task", "\"Tóm tắt + dịch + viết PR + làm slide\"", "Chia 4 prompt, hoặc 1 prompt với danh sách bước thứ tự."],
          ["Không có secondary context", "\"Sửa email này.\"", "\"Sửa email này — context: gửi khách đang phàn nàn về tăng phí. Xoa dịu nhưng giữ vị thế.\""],
          ["Lặp cùng prompt", "(gửi lại y chang)", "Diagnose: AI hiểu sai chỗ nào? Bổ sung context — đừng lặp."],
          ["Yêu cầu output quá dài", "\"Viết chiến lược 100 trang.\"", "Chia section; AI làm từng section với style nhất quán."],
          ["Coi AI như oracle", "\"Tôi nên làm gì?\"", "\"3 option và trade-off của tôi. Push back: tôi miss gì? Case mạnh nhất chống option ưu tiên?\""]
        ]},
      { kind: "callout", tone: "warn", tag: "3.10 · Hai con dao hai lưỡi",
        body: "<p><strong>Dao 1 — Prompt quá dài.</strong> Người mới sau khi học Tầng 3 đôi khi sa vào \"viết prompt 2000 từ cho mọi task\". Sai. <strong>Độ dài prompt nên tỉ lệ với độ phức tạp task.</strong> \"ARR là gì?\" — Tầng 1 đủ. Compliance review marketing claim — Tầng 3.</p><p style='margin-bottom:0;'><strong>Dao 2 — Phụ thuộc 100% vào AI.</strong> Kể cả Tầng 3 với verification, AI vẫn có thể sai/bịa (Chương 7). <strong>Bạn vẫn là người chịu trách nhiệm cuối.</strong> Prompt sạch giảm sai, không triệt tiêu.</p>" },
      { kind: "callout", tone: "accent", tag: "3.11 · Đem về dùng — 3 điều ghi nhớ",
        body: "<ol><li><strong>Prompt không phải bùa chú. Prompt là đặc tả công việc.</strong> Không cần trick. Cần biết giao việc rõ ràng.</li><li><strong>Khi không viết được Tầng 3, dùng meta-prompting.</strong> Nhờ AI nâng cấp. Đây là kỹ năng quan trọng nhất bạn học hôm nay.</li><li><strong>Lặp prompt là tín hiệu.</strong> Mỗi khi copy-paste cùng kiểu 3 lần/tuần → đến lúc xây Custom GPT (Chương 4).</li></ol>" },
      { kind: "table", label: "Quality scaling — cùng task, khác tầng", headers: ["Cùng task", "Prompt", "Chất lượng ước lượng"],
        rows: [
          ["Draft quarterly recap", "\"Tóm tắt Q3.\"", "50% — chung chung, không số"],
          ["Draft quarterly recap", "Role + task + format + constraint (Tầng 2)", "80% — có số, đúng format, hơi cứng"],
          ["Draft quarterly recap", "Prompt Contract Tầng 3 đầy đủ + verification", "<span class='ok'>95% — review-ready, audit-friendly</span>"],
          ["Draft quarterly recap", "Custom GPT chuyên dụng", "<span class='ok'>95% + tiết kiệm 90% thời gian mỗi cycle</span>"]
        ]},
      { kind: "quiz", q: "Prompt Tầng 1 của bạn không cho kết quả như ý. Theo chương này, kỹ thuật MẠNH NHẤT cho người mới là:",
        options: [
          { t: "Thêm \"Suy nghĩ từng bước\" để ép reasoning tốt hơn.", correct: false },

{

  en: {
    title: "When tasks repeat: build a system",
    sub: "Custom GPTs, ChatGPT Projects, Claude Projects. When chatting stops being enough, you build a virtual assistant pre-loaded with your context.",
    tldr: [
      "If you re-establish yesterday's context every morning, you're wasting hours every month. Build a system instead.",

    blocks: [
      { kind: "prose", label: "4.1 · Anchor", heading: "The \"three-time\" problem.",
        body: "<p>Return to the account-executive example: 50 Friday-afternoon update emails. If each morning you open a fresh ChatGPT chat, retype the role (\"You are an account manager at…\"), retype the context (\"Friendly-but-professional tone, 200 words…\"), retype the task, the format, the constraints — you're typing <strong>400+ characters just to re-establish yesterday's context</strong>. After a month: 22 days × 5 minutes = <strong>nearly two hours of pure repetition</strong>.</p><p class='lead-q'>This is the clearest signal that you need to build a system. Not chat. Not loose prompts. A virtual assistant pre-loaded with all your context, where each session only requires a short message.</p>" },
      { kind: "callout", tone: "accent", tag: "Decision rule — which ChatGPT surface?",
        body: "<ul><li><strong>Regular chat</strong> for one-off tasks.</li><li><strong>ChatGPT Project</strong> for an ongoing workstream that needs grouped chats, uploaded reference files, and project-specific instructions/context.</li><li><strong>Custom GPT</strong> when you want a reusable assistant with stable behavior, knowledge, and selected tools for repeated workflows — especially when you want to share that assistant.</li></ul>" },
      { kind: "prose", label: "4.2 · What is a Custom GPT?", heading: "A user-created version of ChatGPT.",
        body: "<p>A <strong>Custom GPT</strong> is a user-created version of ChatGPT pre-configured with:</p><ul><li><strong>Instructions</strong> (behavior, workflow, tone, boundaries, examples — typically up to ~8,000 characters in GPT Builder)</li><li><strong>Knowledge files</strong> (reference documents the AI can retrieve — for source material, not behavior rules)</li><li><strong>Capabilities</strong> (Web search, Image generation, Canvas, Code Interpreter &amp; Data Analysis)</li><li>Optionally <strong>Apps</strong> or <strong>Actions</strong> — external integrations</li></ul>" },
      { kind: "callout", tag: "Note on plans",
        body: "<p>Free users can <strong>use</strong> GPTs they have access to (public, shared, or workspace-visible), but <strong>creating or editing a GPT requires a paid ChatGPT plan</strong> (Plus, Pro, Business, Enterprise, or Edu) or workspace permission. For the build exercise, you need a paid plan to publish your own GPT. On Anthropic's side, the near-equivalent is called <strong>Projects</strong>.</p>" },
      { kind: "callout", tone: "warn", tag: "Important — a GPT is NOT ChatGPT Memory",
        body: "<p>Each conversation with a Custom GPT <strong>starts fresh</strong>: GPT conversations do not use your saved memory, your account-level custom instructions, or previous conversations. Put durable rules in <strong>Instructions</strong>, durable reference material in <strong>Knowledge</strong>, and ongoing context in a <strong>Project</strong> rather than relying on memory inside a GPT chat.</p>" },
      { kind: "table", label: "4.3 · Anatomy of a Custom GPT (per OpenAI)", headers: ["Field", "Purpose"],
        rows: [
          ["<strong>Name</strong>", "Clear, specific title users can recognize at a glance"],
          ["<strong>Description</strong>", "Short summary of purpose, audience, and use cases"],
          ["<strong>Instructions</strong>", "Behavior, workflow, tone, boundaries, examples (the GPT Builder field — typically up to ~8,000 chars)"],
          ["<strong>Conversation starters</strong>", "Realistic high-value prompts that teach users how to start (2–4 phrases)"],
          ["<strong>Knowledge</strong>", "Reference files (PDF/Word/Excel) — use for source material, not behavior rules"],
          ["<strong>Recommended model</strong>", "Suggested model for users, where available"],
          ["<strong>Capabilities</strong>", "Toggleable features: Web search, Image generation, Canvas, Code Interpreter &amp; Data Analysis"],
          ["<strong>Apps <em>or</em> Actions</strong>", "External integrations — see Apps vs Actions caveat below"]
        ]},
      { kind: "callout", tag: "Advanced — Apps vs Actions",
        body: "<p>GPTs can connect to external systems via <strong>Apps</strong> (OpenAI's connector framework) or <strong>Actions</strong> (API calls defined by your own OpenAPI schema + auth). A single GPT can use <strong>either Apps or Actions, not both at the same time</strong>. Users may be asked to <strong>confirm before data is sent or an action runs</strong>. Actions are usually configured by IT.</p>" },
      { kind: "prose", label: "OpenAI's recommended practices for good Instructions", body: "<ol><li><strong>Use clear step structure:</strong> \"When X happens → do Y.\"</li><li><strong>Separate sections</strong> with headings or line breaks.</li><li><strong>Prefer positive instructions</strong> (\"Do X\") over negative ones (\"Don't do Y\") when possible.</li><li><strong>Provide short examples</strong> of acceptable / unacceptable outputs.</li><li><strong>Specific name and clear description</strong> — users should know immediately what the GPT does.</li><li><strong>Test in Preview</strong> before publishing.</li><li><strong>Golden principle:</strong> <em>\"Tighten instructions before adding tools.\"</em> Fix the Instructions before adding new capabilities — that solves problems faster than piling features on.</li></ol>" },
      { kind: "timeline", label: "4.4 · The 5-step build process", heading: "From repeating task to a working assistant.",
        steps: [
          { title: "Define the task", body: "Write on paper: <strong>What</strong> (1 sentence) · <strong>Frequency</strong> (per week) · <strong>Who uses</strong> · <strong>Output needs</strong> (format, length, voice)." },
          { title: "Draft Instructions with meta-prompting", body: "Don't write from scratch. Use meta-prompting template (below). Copy AI's output, paste into Instructions field." },
          { title: "Upload Knowledge files", body: "Anonymized templates, voice guides, examples. <strong>Never upload</strong> identifiable customer data or unreleased drafts." },
          { title: "Enable the right Capabilities", body: "Web search only when needed. Image gen / Canvas / Code Interpreter when needed. Don't enable \"just in case.\"" },
          { title: "Test 5 cases in Preview", body: "Typical · Short · Long/hard · Rule-violating (verify refusal) · Missing-data (verify it asks). Fix Instructions, not outputs." }
        ]},
      { kind: "code", label: "Step 2 meta-prompt", title: "Use this to draft your Custom GPT Instructions",
        text: "I want to build a Custom GPT on ChatGPT.\n\nContext:\n- I am a [role] at [company / industry]\n- The repeating task: [detailed description — include a sample of the\n  desired output if you have one]\n- Frequency: [...]\n- User: [just me / my team / customer-facing]\n- Output: [format / length / voice]\n\nPlease:\n1. Ask me 5–7 clarifying questions to fully understand the task.\n2. (Assuming I've answered.) Write Custom GPT Instructions up to 8,000 chars.\n3. Suggested structure:\n   - Role & behavior\n   - Core rules (DO)\n   - Absolute prohibitions (DON'T)\n   - Processing workflow (step by step)\n   - Output format\n   - How to handle uncertainty\n   - Short example of acceptable output\n4. Suggest 4 conversation starters that fit.\n5. Suggest which Capabilities to enable (Web search / Image generation /\n   Canvas / Code Interpreter & Data Analysis).\n6. Suggest Knowledge files I should upload (type and content)." },
      { kind: "code", label: "4.5 · Worked example #1 — HR \"Onboarding Buddy\"", title: "Instructions template (adjust to your org)",
        text: "# ROLE\nYou are an experienced HR partner who specializes in new-hire onboarding\nfor a knowledge-work company. You have great taste for friendly,\nprofessional writing that respects the new hire's time.\n\n# CORE RULES (DO)\n1. Always use a warm but professional tone. Default to second person.\n2. Keep welcome emails under 200 words.\n3. Always include three things in a welcome email:\n   - One concrete first-day logistics detail.\n   - One person they will meet on day one ([Buddy name] placeholder).\n   - One link they should read before day one ([Pre-read link] placeholder).\n4. For 30-60-90-day plans, always structure as:\n   - 30 days: ramp + relationships\n   - 60 days: contribute on real work\n   - 90 days: own one area / deliverable\n5. End every artifact with: \"Questions? Ping me anytime.\"\n\n# ABSOLUTE PROHIBITIONS (DON'T)\n1. DO NOT include compensation, benefits, equity, or salary details.\n2. DO NOT make legal claims about employment terms.\n3. DO NOT include the new hire's home address, phone, SSN, or other PII —\n   even if the user pastes it. Replace with a placeholder.\n4. DO NOT speculate about company strategy or unreleased product plans.\n\n# WORKFLOW\nStep 1: Identify the request type (welcome / 30-60-90 plan / Slack intro / FAQ).\nStep 2: If required info is missing, ask before drafting.\nStep 3: Draft using the rules above.\nStep 4: Before responding, self-check:\n  - Are there any PII placeholders that should be filled by the user?\n  - Did I avoid prohibited topics?\n  - Does the artifact match the format rules above?\n\n# DEFAULT OUTPUT FORMAT\nMarkdown. Clear H2 headings for each section. Friendly punctuation;\nno excessive emoji.\n\n# HANDLING UNCERTAINTY\n- Ambiguous request → ask one clarifying question, then draft.\n- Conflicting requirements → flag both and ask the user to choose.\n- \"I don't know what role they're in\" → leave [Role] placeholders rather than guess.\n\nCapabilities: Web search OFF · Image gen OFF · Code Interpreter OFF\nCanvas: ON (drafters can iterate side-by-side)" },
      { kind: "table", label: "4.7 · Claude Projects vs Custom GPT", heading: "Same idea, slightly different shape.",
        headers: ["Feature", "Custom GPT (ChatGPT)", "Claude Projects"],
        rows: [
          ["Instructions length", "~8,000 characters", "Longer (system prompt limit; varies by plan)"],

        ]},
      { kind: "callout", tag: "Rule of thumb",
        body: "<p>If your task involves <strong>lots of long documents</strong> (50-page reports, contract redlines), Claude Projects with its larger context tends to feel more natural. If you want a <strong>quick, focused assistant for a single workflow</strong>, Custom GPTs are typically easier to set up.</p>" },

          ["Updating when rules change", "Update prompt for each person", "Update instructions once"],
          ["Plan required", "Free works (anyone can write a prompt)", "Paid to <strong>create</strong>; Free users can still <strong>use</strong> GPTs they have access to"],
          ["Best for", "Ad-hoc, low-repetition tasks", "Tasks ≥ 2/week with a stable pattern"]
        ]},
      { kind: "callout", tone: "warn", tag: "4.9 · Common mistakes when building Custom GPTs",
        body: "<ol><li><strong>Instructions too short or too generic.</strong> \"You're a helpful assistant who writes emails.\" → No different from blank ChatGPT. Write full role, do/don't, format, and ≥ 1 example.</li><li><strong>Instructions too long and rambling.</strong> Past 8,000 characters AI ignores the overflow; even close to that limit, it gets confused. Be dense, use headings, prefer bullets.</li><li><strong>Uploading sensitive data as Knowledge.</strong> Security violation (Chapter 7). Only upload public or non-sensitive internal data.</li><li><strong>Enabling every Capability \"just in case.\"</strong> Web search on when not needed increases risk of AI sourcing from poor websites. Enable what you actually need.</li><li><strong>No testing.</strong> Build, publish, then watch coworkers find the bugs. Always test five cases first.</li><li><strong>No updates.</strong> Rules change. Instructions must be revisited regularly.</li><li><strong>Sharing too early.</strong> Personal use for a week before team rollout exposes problems you didn't anticipate.</li></ol>" },
      { kind: "callout", tag: "4.10 · Exercise 4 (45 min) — Build your first Custom GPT",
        body: "<p><em>Paid ChatGPT plan required.</em></p><ol><li>(5 min) Pick the task from Exercise 2 with the highest combined score.</li><li>(10 min) Use the meta-prompt to have AI draft Instructions.</li><li>(5 min) ChatGPT → My GPTs → Create a GPT → Configure tab. Paste Instructions, set Name + Description, add 3–4 conversation starters.</li><li>(10 min) Upload 1–2 Knowledge files if you have any. <strong>During the workshop, only upload non-sensitive documents.</strong></li><li>(10 min) Test five cases in Preview (typical / short / long / rule-violating / missing-data).</li><li>(5 min) Save as <strong>Only me</strong>. Have the person next to you try it and give feedback.</li></ol>" },
      { kind: "callout", tone: "accent", tag: "4.13 · Take-home lines",
        body: "<ul><li><strong>The 2/week rule:</strong> any task happening ≥ 2 times a week → build a Custom GPT.</li><li><strong>Don't write Instructions from scratch</strong> — use meta-prompting.</li><li><strong>Test before publishing</strong> — always five cases minimum.</li><li><strong>Don't upload sensitive data</strong> into Knowledge files.</li><li><strong>Update with the rules</strong> so your Custom GPT doesn't become an antique.</li></ul>" },

        text: "Tôi muốn build 1 Custom GPT trên ChatGPT.\n\nBối cảnh:\n- Tôi là [role] tại [công ty/ngành]\n- Task lặp: [mô tả chi tiết — kèm mẫu output mong muốn nếu có]\n- Tần suất: [...]\n- User: [chỉ tôi / team / khách]\n- Output: [format / độ dài / giọng văn]\n\nHãy:\n1. Đặt 5–7 câu hỏi clarifying để hiểu rõ task.\n2. (Giả định tôi đã trả lời) Viết Instructions tối đa 8.000 ký tự.\n3. Cấu trúc đề xuất:\n   - Role & behavior\n   - Core rules (DO)\n   - Absolute prohibitions (DON'T)\n   - Processing workflow (step by step)\n   - Output format\n   - Cách xử lý uncertainty\n   - Ví dụ ngắn output đạt yêu cầu\n4. Đề xuất 4 conversation starters phù hợp.\n5. Đề xuất Capabilities nên bật (Web search / Image generation /\n   Canvas / Code Interpreter & Data Analysis).\n6. Đề xuất Knowledge files nên upload (loại file gì, nội dung gì).\n\nTrả lời tiếng Việt." },
      { kind: "code", label: "4.5 · Ví dụ #1 — \"Onboarding Buddy\" cho HR", title: "Instructions template (chỉnh theo công ty)",
        text: "# ROLE\nBạn là HR partner kỳ cựu chuyên về onboarding nhân viên mới cho công ty\nknowledge-work. Bạn có taste tốt cho writing ấm áp, professional, tôn\ntrọng thời gian của người mới.\n\n# CORE RULES (DO)\n1. Luôn dùng tone ấm áp nhưng professional. Default ngôi thứ hai.\n2. Welcome email dưới 200 từ.\n3. Mọi welcome email luôn có 3 thứ:\n   - 1 chi tiết logistics ngày đầu cụ thể.\n   - 1 người họ sẽ gặp ngày đầu ([Buddy name] placeholder).\n   - 1 link nên đọc trước ngày đầu ([Pre-read link] placeholder).\n4. 30-60-90 day plan luôn cấu trúc:\n   - 30 ngày: ramp + relationships\n   - 60 ngày: contribute on real work\n   - 90 ngày: own one area / deliverable\n5. Mọi artifact kết bằng: \"Questions? Ping me anytime.\"\n\n# ABSOLUTE PROHIBITIONS (DON'T)\n1. KHÔNG đề cập compensation, benefits, equity, salary.\n2. KHÔNG đưa claim pháp lý về điều khoản tuyển dụng.\n3. KHÔNG include địa chỉ nhà, số điện thoại, SSN, hay PII —\n   kể cả khi user paste. Thay bằng placeholder.\n4. KHÔNG suy đoán chiến lược công ty hoặc sản phẩm chưa công bố.\n\n# WORKFLOW\nBước 1: Xác định loại yêu cầu (welcome / 30-60-90 plan / Slack intro / FAQ).\nBước 2: Nếu thiếu thông tin, hỏi trước khi draft.\nBước 3: Draft theo các rule trên.\nBước 4: Trước khi trả lời, tự kiểm:\n  - Có placeholder PII nào user cần điền?\n  - Có tránh chủ đề bị cấm?\n  - Có khớp format rule?\n\n# DEFAULT OUTPUT FORMAT\nMarkdown. H2 heading rõ. Dấu chấm câu thân thiện; không emoji quá nhiều.\n\n# HANDLING UNCERTAINTY\n- Yêu cầu mơ hồ → hỏi 1 câu clarifying, rồi draft.\n- Yêu cầu mâu thuẫn → flag cả hai, hỏi user chọn.\n- \"Không biết role họ\" → để [Role] placeholder thay vì đoán.\n\nCapabilities: Web search OFF · Image gen OFF · Code Interpreter OFF\nCanvas: ON (drafter iterate cạnh chat được)" },

        body: "<ol><li><strong>Instructions quá ngắn/chung chung.</strong> \"Bạn là trợ lý có ích viết email\" → Không khác ChatGPT trắng. Viết đủ role, do/don't, format, ≥ 1 ví dụ.</li><li><strong>Instructions quá dài, lan man.</strong> Vượt 8.000 ký tự AI cắt; gần ngưỡng cũng dễ rối. Cô đọng, heading, bullet.</li><li><strong>Upload data nhạy cảm vào Knowledge.</strong> Vi phạm bảo mật (Chương 7). Chỉ upload đã public hoặc không nhạy cảm.</li><li><strong>Bật mọi Capability \"cho chắc\".</strong> Web search bật khi không cần → tăng rủi ro nguồn rác. Bật từng cái khi thực sự cần.</li><li><strong>Không test.</strong> Build xong publish luôn → đồng nghiệp bắt lỗi đầu tiên. Test 5 case trước.</li><li><strong>Không update.</strong> Rule đổi. Instructions phải update.</li><li><strong>Share quá sớm.</strong> Dùng cá nhân 1 tuần trước khi roll out team — phát hiện vấn đề chưa anticipate.</li></ol>" },

        body: "<p>Giống ChatGPT/Claude web, Cowork cũng nhận prompt 3 tầng. Chỉ khác: <strong>prompt cho Cowork thường mô tả task đa-bước</strong>, không phải task đơn.</p>" },

      { kind: "code", label: "Tầng 2 trên Cowork", title: "Đa-bước có format",
        text: "Trong folder D:\\contracts\\, có 35 file PDF hợp đồng môi giới.\nVới mỗi file:\n1. Trích: tên khách, ID khách, ngày ký, loại tài khoản, có điều khoản\n   X (Y/N).\n2. Output 1 dòng JSON cho mỗi file.\nCuối cùng, gộp tất cả thành 1 Excel D:\\out\\contract_review.xlsx\nvới 6 cột tương ứng + cột 'priority' (H/M/L) dựa trên có/không\nđiều khoản X." },
      { kind: "code", label: "Tầng 3 trên Cowork", title: "Prompt Contract multi-agent",
        text: "ROLE\nBạn là team lead AI orchestrate quá trình compliance scan trên folder\nhợp đồng môi giới sau khi regulator ban hành rule mới.\n\nINPUT\n- Folder: D:\\contracts\\  (35 PDF)\n- Checklist: D:\\compliance\\new_rule_checklist.md (12 điều khoản)\n- Output template: D:\\template\\contract_review_template.xlsx\n\nSUCCESS CRITERIA\n- 100% file được scan.\n- Mỗi file có dòng kết quả riêng + pass/fail rõ ràng cho từng điều khoản.\n- Output là 1 Excel theo template + 1 Markdown note flag H-priority.\n- Không bịa kết quả — nếu không tìm thấy điều khoản, ghi \"NOT FOUND\".\n\nCONSTRAINTS\n- Không ghi đè file gốc.\n- Không upload file nào ra ngoài máy.\n- Nếu PDF scan (image-only) không text-extract được, thêm vào\n  \"manual review\" list.\n\nMULTI-AGENT ARCHITECTURE (gợi ý)\n- Spawn 5 sub-agent extractor — mỗi cái xử lý 7 file song song.\n- 1 sub-agent synthesizer — gộp 35 JSON thành Excel theo template.\n- 1 sub-agent reviewer — đọc lại các dòng có >2 thiếu sót, viết\n  H-priority Markdown.\n\nVERIFICATION (trước khi báo done)\n- [ ] Đếm: số file input == số dòng output?\n- [ ] Excel mở được, đúng template?\n- [ ] Mọi dòng có \"priority\" tính đúng?\n- [ ] H-priority notes có trích page cụ thể trong mỗi PDF?" },

      { kind: "table", label: "So sánh thời gian", headers: ["Phương án", "Thời gian", "Chất lượng", "Bạn làm gì lúc đó"],
        rows: [

      { kind: "callout", tone: "warn", tag: "Quan trọng",
        body: "<p>Output Cowork cần <strong>human spot-check</strong> ít nhất các dòng H-priority — <em>tin tuyệt đối là nguy hiểm</em> (Chương 7).</p>" },
      { kind: "prose", label: "6.5 · Showcase 2 — build báo cáo 100 trang", heading: "Orchestrator + 10 sub-agent + editor.",
        body: "<p>Một consulting team cần làm \"State of [Industry]\" report ~80–120 trang, gồm: macro environment, demand drivers, supply / capacity, cost structure, 5 deep dive, valuation, risks, data appendix.</p><p><strong>Workflow Cowork:</strong></p><ol><li>User chuẩn bị brief (5–10 dòng mô tả mục tiêu, audience, format).</li><li>Orchestrator agent đọc brief, viết outline, chuẩn bị research brief cho từng section.</li><li>~10 sub-agent song song: macro · demand · supply · cost structure · 5 deep dive · risks tổng.</li><li>Editor agent cuối: enforce house style, gộp, viết executive summary, generate TOC, viết disclaimer.</li><li><strong>Human reviewer</strong> verify, fact-check, sign off.</li></ol>" },
      { kind: "table", label: "So sánh thời gian", headers: ["Phương án", "Thời gian", "Phần human"],
        rows: [

      { kind: "callout", tone: "warn", tag: "Lưu ý quan trọng",
        body: "<p>Opinion, recommendation, accountability <strong>vẫn của human author</strong>. Cowork build structure, narrative, data — không sở hữu conclusion.</p>" },
      { kind: "prose", label: "6.6 · Showcase 3 — Research swarm (briefing on demand)", heading: "Sếp hỏi 9h sáng, 2-page brief lúc 11h.",
        body: "<p>Sếp hỏi sáng: \"Cho tôi brief 2 trang về [emerging topic] — có đáng chú ý không?\"</p><p><strong>Workflow Cowork:</strong></p><ol><li><strong>Orchestrator</strong> đọc câu hỏi, decompose thành 5 góc: macro context · khung pháp lý · competitive landscape · rủi ro · cơ hội.</li><li><strong>5 sub-agent</strong> chạy song song, mỗi cái search web, đọc news 6 tháng gần nhất, tóm tắt + cite source.</li><li><strong>Synthesizer</strong> gộp thành 2 trang executive brief.</li><li><strong>Human</strong> đọc, sửa, gửi.</li></ol><p style='margin-bottom:0;'>Anthropic công bố pattern này đạt +90,2% so với single-agent.</p>" },
      { kind: "table", label: "6.7 · Pattern selector", heading: "3 tầng + system tool trên Cowork.",

      { kind: "callout", tone: "warn", tag: "6.8 · Khi multi-agent KHÔNG đáng",
        body: "<ul><li><strong>Task &lt; 5 phút làm tay.</strong> Setup multi-agent tốn thời gian hơn làm.</li><li><strong>Task tuần tự thực sự</strong> (bước N+1 phụ thuộc bước N). Song song không lợi.</li><li><strong>Task ngắn 1 file.</strong> Web chat đủ.</li><li><strong>Task đòi judgment đơn nhất</strong> (1 email tinh tế). Multi-agent ghép vào dễ ra đoạn văn rời rạc.</li><li><strong>Khi token budget hạn hẹp.</strong> Multi-agent tiêu <strong>~15× token</strong> so với chat đơn (theo Anthropic).</li></ul>" },
      { kind: "callout", tag: "6.9 · Bài tập 6 (20 phút) — Thiết kế pipeline multi-agent",
        body: "<p><em>Chỉ thiết kế, không cần Cowork.</em></p><ol><li>Chọn 1 task đa-bước/đa-file trong công việc (vd: \"Mỗi tháng tổng hợp 30 báo cáo vendor và viết quarterly summary\").</li><li>Decompose thành 3–5 sub-task chạy song song được.</li><li>Đặt tên cho từng \"sub-agent\" (vd: macro_scanner, vendor_summarizer, news_collector, editor).</li><li>Mô tả input/output mỗi sub-agent.</li><li>Viết orchestrator prompt (Tầng 3) để Cowork hiểu phải làm gì.</li></ol><p style='margin-bottom:0;'>Share với người ngồi cạnh — họ critique design.</p>" },
      { kind: "callout", tone: "accent", tag: "6.10 · Đem về dùng",
        body: "<ul><li><strong>Quy luật 90,2%:</strong> với task complex đa-góc, multi-agent thắng single-agent.</li><li><strong>Cowork</strong> = tool khai thác multi-agent <strong>không cần code</strong>.</li><li><strong>Vẫn cần Prompt Contract</strong> (Chương 3) — multi-agent ẩu = output ẩu × số agent.</li><li><strong>Vẫn cần human review</strong> — thêm agent không đồng nghĩa thêm trust.</li><li><strong>Token cost cao</strong> — dùng có chọn lọc cho task ROI rõ.</li></ul>" },
      { kind: "quiz", q: "Bạn cần draft 1 email tinh tế cho khách đang churn. Multi-agent là:",
        options: [

/* ============ B — Prompt Templates for 14 Roles ============ */
{
  id: "templates", appendix: true, letter: "B",
  tag: "Templates",
  en: {
    title: "Prompt template library — 14 roles",
    sub: "Each template written at Tier 2–3. Copy-paste, replace [bracketed] with your specifics, send. Click any role to expand.",
    blocks: [
      { kind: "roleBlocks", label: "B · Prompt library", heading: "Fourteen role families.", intro: "<p>Copy any template, replace the [bracketed] placeholders with your specifics, and send to ChatGPT or Claude. Each is calibrated to produce a usable first draft on the first try.</p>",
        roles: [
          { title: "B.1 — Knowledge worker / general office", prompts: [
            { label: "B.1.1 · Rewrite messy paragraph", text: "ROLE: You are a senior editor who rewrites internal documents for clarity.\n\nTASK: Rewrite the paragraph below into clear, professional English.\nPreserve every factual claim. Reduce length by at least 30%. Improve flow.\n\nCONSTRAINTS:\n- Do not add information that isn't in the original.\n- Do not remove information unless it's clearly redundant.\n- Use plain English (target reading level: 9th grade).\n- Output two versions: (1) clean rewrite, (2) bulleted notes on what changed and why.\n\nINPUT:\n[paste paragraph]" },
            { label: "B.1.2 · Summarize long document for 5-min read", text: "ROLE: You are an executive briefing writer.\n\nTASK: Produce a one-page brief on the attached document.\n\nOUTPUT FORMAT (Markdown):\n# Brief — [Document title]\n\n## Bottom line (2 sentences)\n## Key facts (5 bullets, each ≤ 20 words, with page reference)\n## Open questions (3 bullets)\n## What to do next (3 actionable bullets)\n\nCONSTRAINTS:\n- Every fact tied to a page or section number.\n- No fabrication — if a number isn't in the document, write \"not stated.\"\n- No opinions or recommendations beyond what the document supports.\n\nINPUT: [attached document]" },
            { label: "B.1.3 · Draft + tone-check email", text: "ROLE: You are a communications coach.\n\nTASK: Help me draft an email. Two passes:\n1. Draft based on the bullets below.\n2. Review the draft and flag tone risks (passive aggression, accidental harshness, vagueness).\n\nINPUT:\n- Recipient: [role + relationship]\n- Goal: [what I want them to do after reading]\n- Constraints: [length, things to avoid]\n- Bullets: [what to include]\n\nOUTPUT:\n- The drafted email.\n- A short list of \"tone risk + suggested fix\" bullets." }
          ]},
          { title: "B.2 — Marketing / Communications", prompts: [
            { label: "B.2.1 · Repurpose one insight into 5 formats", text: "ROLE: You are a content marketer.\n\nINPUT: One insight or research finding [paste].\n\nTASK: Produce five formats from this single insight:\n1. LinkedIn post (≤ 150 words, no hashtags).\n2. X/Twitter post (≤ 280 chars).\n3. 30-second TikTok script (3 hooks + 1 takeaway).\n4. Blog title + 160-char meta description (SEO).\n5. Email subject lines (3 A/B test variants) + preview text.\n\nCONSTRAINTS:\n- No outcome promises (\"you'll get X results in Y days\").\n- Match the original insight's accuracy; don't extrapolate beyond what it supports.\n- Tone: confident, plain, no buzzwords." },
            { label: "B.2.2 · Campaign brief", text: "ROLE: You are a senior brand strategist drafting a campaign brief.\n\nINPUT:\n- Product: [...]\n- Audience: [primary + secondary]\n- Business goal: [measurable target]\n- Constraints: [budget tier, timeline, channels]\n\nTASK: Produce a one-page campaign brief.\n\nOUTPUT FORMAT (Markdown):\n# Campaign brief — [Campaign name]\n\n## Objective (1 sentence)\n## Audience insight (2–3 sentences, focus on the tension)\n## Single-minded proposition (≤ 15 words)\n## Reasons to believe (3 bullets)\n## Tone of voice (3 adjectives + 3 anti-adjectives)\n## KPIs (3 metrics with target ranges)\n## Risks & guardrails (3 bullets)\n\nCONSTRAINTS:\n- The \"single-minded proposition\" must be one idea, not a list.\n- KPIs must be measurable." }
          ]},
          { title: "B.3 — Sales / Business Development", prompts: [
            { label: "B.3.1 · Personalized cold outreach", text: "ROLE: You are a B2B sales copywriter.\n\nINPUT:\n- Prospect role + company [paste LinkedIn-style snippet]\n- One concrete observation about their work or company [paste]\n- My product's primary value [one sentence]\n- My ask [one specific call to action]\n\nTASK: Write one cold outreach email.\n\nCONSTRAINTS:\n- Subject ≤ 7 words.\n- Body 3 short paragraphs, ≤ 130 words total.\n- Open with the observation, not with myself.\n- Don't promise outcomes; don't use buzzwords.\n- One clear ask with two specific time options.\n\nOUTPUT:\nSubject: ...\n[body]\n— [Your name]" },
            { label: "B.3.2 · Follow-up sequence after discovery call", text: "ROLE: You are a sales-development coach.\n\nINPUT:\n- Call notes [paste]\n- Prospect's next step they verbally agreed to [paste]\n- Timing: send today, then +3 days, then +7 days\n\nTASK: Write a 3-message follow-up sequence.\n\nCONSTRAINTS:\n- Message 1 (today): recap + next step + soft confirmation.\n- Message 2 (+3 days): one piece of relevant value (case study, doc, post).\n- Message 3 (+7 days): direct ask + clear off-ramp (\"if this isn't a priority, just say so\").\n- Tone: confident, not pushy, no \"circling back.\"\n- Each message ≤ 100 words." },
            { label: "B.3.3 · Account research one-pager", text: "ROLE: You are an account-research analyst.\n\nINPUT: The company name [Company], their public website, and any recent press releases I provide.\n\nTASK: Produce a one-page account brief for a sales call.\n\nOUTPUT FORMAT (Markdown):\n# Account brief — [Company]\n\n## What they do (2 sentences from their own website)\n## Who's likely the decision maker (1 bullet)\n## Recent signals (3 bullets, dated)\n## Hypothesized pains we can address (3 bullets)\n## Three discovery questions to ask\n\nCONSTRAINTS:\n- Use only sources you can cite.\n- Don't fabricate financials.\n- Don't infer hierarchy from a single LinkedIn signal — flag as hypothesis." }
          ]},
          { title: "B.4 — Legal / Compliance (general)", prompts: [
            { label: "B.4.1 · Review contract clause against a checklist", text: "ROLE: You are a contracts analyst (not providing legal advice — flagging for a lawyer).\n\nINPUT:\n- Clause [paste]\n- Checklist of items the clause should contain [paste]\n\nTASK:\n1. For each checklist item, mark Present / Missing / Ambiguous.\n2. For \"Ambiguous,\" quote the part of the clause and explain the ambiguity.\n3. List the top 3 risks if the clause stays as written.\n\nOUTPUT FORMAT:\n| Checklist item | Status | Quoted text | Note |\n\nCONSTRAINTS:\n- Do not draft replacement clause language — that's the lawyer's job.\n- Do not assert what the law requires; only report what the clause does or doesn't say.\n- Mark confidence H/M/L on each row." },
            { label: "B.4.2 · Plain-language policy summary", text: "ROLE: You are a policy translator.\n\nINPUT: Internal policy document [attached].\n\nTASK: Produce a one-page plain-language summary for non-specialists.\n\nOUTPUT FORMAT (Markdown):\n# Policy summary — [Policy name]\n\n## What it covers (3 bullets)\n## Who must follow it (1 paragraph)\n## What you must do (5 bullets max, each starting with a verb)\n## What you must NOT do (3 bullets)\n## Where to go for help (1 line)\n\nCONSTRAINTS:\n- Reading level: 9th grade.\n- Use direct, second-person voice.\n- Preserve any deadline or threshold numbers exactly.\n- Flag any section where the original is ambiguous." }
          ]},
          { title: "B.5 — Engineering / IT", prompts: [
            { label: "B.5.1 · Code review with a rubric", text: "ROLE: You are a senior staff engineer reviewing a junior engineer's pull request.\n\nINPUT: Code diff [paste].\n\nTASK: Review the code against the rubric:\n1. Correctness (does it do what it claims?)\n2. Readability (will the next engineer understand it in 6 months?)\n3. Edge cases (what fails?)\n4. Tests (sufficient? meaningful?)\n5. Performance (any obvious O(n²) traps?)\n\nOUTPUT FORMAT:\n| Rubric area | Status (✓/⚠/✗) | Specific comments with line numbers |\n\nCONSTRAINTS:\n- Be specific (cite line numbers).\n- Suggest concrete fixes, not generic advice.\n- Be kind. Tone: senior helping junior, not gatekeeper.\n- Don't rewrite the whole thing — point to the issues." },
            { label: "B.5.2 · Test case generation", text: "ROLE: You are a QA engineer.\n\nTASK: Generate test cases for the function below.\n\nINPUT: [function signature + docstring]\n\nOUTPUT FORMAT:\n| # | Test name | Input | Expected output | Edge case? (Y/N) |\n\nCONSTRAINTS: Cover the happy path + 3 edge cases + 2 error cases at minimum.\nTag any test where the expected behavior isn't fully specified by the docstring as \"AMBIGUOUS — confirm with author.\"" },
            { label: "B.5.3 · Incident post-mortem draft", text: "ROLE: You are an SRE writing an incident post-mortem.\n\nINPUT:\n- Timeline of events: [paste]\n- Impact: [paste]\n- Initial root-cause finding: [paste]\n\nOUTPUT FORMAT:\n## Incident [ID] — [Short name] — [Date]\n### Summary (3 sentences)\n### Detailed timeline (table)\n### Impact (numbers: users / requests / revenue affected)\n### Root cause\n### Remediation\n- Immediate\n- Medium-term\n- Long-term\n### Lessons learned (no individual blame)\n\nCONSTRAINTS: Focus on system/process, not on individuals. Flag any assumed-but-not-verified statements." }
          ]},
          { title: "B.6 — Education / Teaching", prompts: [
            { label: "B.6.1 · Lesson plan from a learning objective", text: "ROLE: You are a curriculum designer for [grade level / context].\n\nINPUT: Learning objective: [single sentence: \"By the end of this lesson, students will be able to...\"]\n\nTASK: Produce a 45-minute lesson plan.\n\nOUTPUT FORMAT (Markdown):\n# Lesson plan — [Topic]\n## Learning objective\n## Hook (5 min)\n## Direct instruction (10 min)\n## Guided practice (15 min)\n## Independent practice (10 min)\n## Wrap & exit ticket (5 min)\n## Differentiation notes (3 bullets: struggle / on-pace / advanced)\n## Materials needed\n\nCONSTRAINTS:\n- Hook must connect to the students' prior knowledge.\n- Exit ticket must directly assess the objective.\n- Use only materials likely available in a typical classroom unless I specify otherwise." },
            { label: "B.6.2 · Rubric for an assignment", text: "ROLE: You are a teacher writing an assessment rubric.\n\nINPUT:\n- Assignment description: [paste]\n- Grade level / level of expectation: [paste]\n- Number of performance levels: [e.g., 4]\n\nTASK: Produce an analytic rubric with 4–5 criteria.\n\nOUTPUT FORMAT: Markdown table with rows = criteria, columns = performance levels.\nFor each cell, write a short, behavior-anchored descriptor (not \"good,\" but \"presents a clear thesis backed by 2+ specific examples\").\n\nCONSTRAINTS:\n- Each criterion must be observable and gradable.\n- Use student-friendly language a 12-year-old can understand.\n- Total points = round number (e.g., 100 or 20)." }
          ]},
          { title: "B.7 — Healthcare administration (non-clinical)", prompts: [
            { label: "B.7.1 · Patient education material (generic, never identifiable)", text: "ROLE: You are a patient educator writing materials for general distribution.\n\nINPUT: Topic — [condition or procedure, generic, no patient data].\n\nTASK: Write a one-page handout for patients newly diagnosed with [topic].\n\nOUTPUT FORMAT (Markdown):\n# [Topic] — what you need to know\n\n## What is it? (3 sentences, plain English)\n## What you should expect (3 bullets)\n## Questions to ask your provider (5 bullets)\n## Lifestyle suggestions (3 bullets, evidence-based, low-risk only)\n## When to seek immediate help (red flags, 3 bullets)\n## Reliable resources (3 named sources)\n\nCONSTRAINTS:\n- Reading level: 6th grade.\n- No specific medication doses (those come from the provider).\n- No diagnostic claims.\n- Flag anywhere I should consult a clinical reviewer." },
            { label: "B.7.2 · Internal admin communication (no PHI)", text: "ROLE: You are an admin coordinator drafting a memo for clinical staff.\n\nINPUT:\n- Topic: [policy change / scheduling update / training reminder]\n- Audience: [nurses / front desk / providers]\n\nTASK: One-page memo.\n\nOUTPUT FORMAT:\n## Subject\n## What's changing (1 paragraph)\n## What you need to do (numbered list)\n## Effective date\n## Who to ask\n\nCONSTRAINTS: No PHI. No specific patient examples. Plain English." }
          ]},
          { title: "B.8 — Human Resources", prompts: [
            { label: "B.8.1 · Job description from hiring brief", text: "ROLE: You are a recruiter writing a job description.\n\nINPUT:\n- Role: [...]\n- Team: [...]\n- Must-haves: [bullets]\n- Nice-to-haves: [bullets]\n- Compensation range (if I provide): [...]\n\nOUTPUT FORMAT (Markdown):\n# [Role title] — [Team]\n\n## What you'll do (4–6 bullets, each starting with a verb)\n## What we're looking for\n### Must-have\n### Nice-to-have\n## Why join us (3 bullets, concrete not generic)\n## How we hire (3 bullets describing the process)\n\nCONSTRAINTS:\n- Avoid biased language (e.g., \"rockstar,\" \"ninja,\" \"young and energetic\").\n- No outcome promises (\"you will be promoted to X\").\n- Keep total length ≤ 400 words." },
            { label: "B.8.2 · Performance-conversation prep (anonymized)", text: "ROLE: You are a manager-coaching specialist.\n\nINPUT:\n- Person's role (anonymized): [paste]\n- Specific behavior to address (factual, not interpreted): [paste]\n- Desired outcome of conversation: [paste]\n\nTASK: Prepare me to have this conversation.\n\nOUTPUT:\n1. Three things I should say first (to set context).\n2. The specific behavior framed using SBI (Situation, Behavior, Impact).\n3. Three open-ended questions to invite their perspective.\n4. Two likely responses and how I should handle each.\n5. The clear ask I want to leave them with.\n\nCONSTRAINTS:\n- Tone: direct, kind, not therapizing.\n- No PII; refer to them as \"[Person].\"\n- Do not draft the conversation as a script — give me building blocks." }
          ]},
          { title: "B.9 — Finance / Accounting", prompts: [
            { label: "B.9.1 · Variance analysis narrative", text: "ROLE: You are a senior FP&A analyst writing a variance narrative for leadership.\n\nINPUT: Variance table [paste — actuals vs budget by line item].\n\nTASK: Write a one-page narrative.\n\nOUTPUT FORMAT:\n## Headline (1 sentence — overall result)\n## Top 3 favorable variances (each: line item, $ amount, % vs budget, 1-sentence driver)\n## Top 3 unfavorable variances (same structure)\n## Outlook (2 sentences — directionally, what to expect next month)\n## Open questions (3 bullets)\n\nCONSTRAINTS:\n- Use only numbers from the table.\n- Don't speculate about causes if not given.\n- Plain English; don't load up on finance jargon." },
            { label: "B.9.2 · Reconciliation difference prompt", text: "ROLE: You are an accounting senior helping investigate a reconciliation difference.\n\nINPUT:\n- Two tables of transactions [A and B]\n- Expected matching key: [field name]\n\nTASK:\n1. Find unmatched transactions (in A but not B, or vice versa).\n2. Find matched transactions where amount or date differs by > [threshold].\n3. Produce a summary count by category.\n\nOUTPUT FORMAT (Markdown table):\n| Category | Count | Total absolute $ difference | Example IDs |\n\nCONSTRAINTS:\n- Don't invent transactions.\n- Show the matching logic explicitly so I can verify.\n- Flag any anomaly that looks like data quality (e.g., negative amount where positive expected)." }
          ]},
          { title: "B.10 — Research / Academic", prompts: [
            { label: "B.10.1 · Literature review starter", text: "ROLE: You are a senior research librarian.\n\nINPUT: Research question [paste].\n\nTASK:\n1. Reframe the question into a precise scope statement.\n2. Suggest 5 search queries (different angles / synonyms).\n3. Suggest 3 databases or sources where I should look.\n4. Suggest a list of 8–12 keywords (controlled-vocabulary style if possible).\n5. Identify 3 likely \"must-read\" foundational papers/sources I should track down.\n\nCONSTRAINTS:\n- Do NOT fabricate paper titles or DOIs. If you list a paper, mark confidence\n  L (low) if you are not sure it exists, and instruct me to verify.\n- Bias toward primary sources." },
            { label: "B.10.2 · Survey design help", text: "ROLE: You are a survey methodologist.\n\nINPUT:\n- Research question: [paste]\n- Target respondent: [paste]\n- Length budget: [N minutes]\n\nTASK:\n1. Draft 8–12 questions.\n2. For each question, label its type (closed / Likert / open / matrix).\n3. Flag any leading or double-barreled questions and suggest fixes.\n4. Suggest one quality-control question (attention check or self-report check).\n\nCONSTRAINTS:\n- Use neutral wording.\n- Avoid jargon.\n- Include at least 2 demographic questions but only what's relevant." }
          ]},
          { title: "B.11 — Customer service / Support", prompts: [
            { label: "B.11.1 · Cluster tickets + canned responses", text: "ROLE: You are a customer-service team lead.\n\nINPUT: 50 anonymized tickets [paste].\n\nTASK:\n1. Cluster tickets into 5–8 main themes.\n2. For each cluster, draft a canned response (≤ 80 words).\n\nOUTPUT FORMAT:\n## Cluster [N] — [Name]\n- Frequency: [%]\n- Example tickets: 2–3 short snippets\n### Canned response (≤ 80 words)\n[draft]\n\nCONSTRAINTS:\n- Canned response structure: greet → acknowledge → solution → CTA.\n- Do NOT use real customer names.\n- Tone: warm, direct, brand-consistent." },
            { label: "B.11.2 · Tone-correct draft reply", text: "ROLE: You are a customer-experience coach.\n\nINPUT: Draft reply [paste]. Customer's situation: [1 line — angry / confused / frustrated / churn risk].\n\nTASK:\n1. Rewrite the reply with appropriate tone.\n2. List the specific changes you made and why.\n\nCONSTRAINTS:\n- Keep all factual content intact.\n- Don't over-apologize (\"apologies for the inconvenience\" is banned).\n- Don't make commitments not in the original." }
          ]},
          { title: "B.12 — Project management", prompts: [
            { label: "B.12.1 · Status update from raw notes", text: "ROLE: You are a project manager preparing a weekly status update.\n\nINPUT: This week's notes [paste].\n\nOUTPUT FORMAT:\n## Project [name] — Week of [date]\n### Status: 🟢 Green / 🟡 Yellow / 🔴 Red — [one-line reason]\n### Progress this week (3 bullets)\n### Blockers (each with owner + ETA)\n### Next week's focus (3 bullets)\n### Asks of the sponsor (1–3 bullets)\n\nCONSTRAINTS:\n- One paragraph per section max.\n- Don't hedge (\"may possibly potentially\") — state plainly.\n- If a number isn't in the notes, write \"TBD.\"" },
            { label: "B.12.2 · Retrospective facilitator outline", text: "ROLE: You are an experienced agile coach facilitating a project retrospective.\n\nINPUT: Project summary [paste — what we shipped, what shifted, who was on the team].\n\nTASK: Produce a 60-minute retro outline.\n\nOUTPUT FORMAT:\n## Opening (5 min) — check-in question\n## Set the stage (5 min) — Prime directive + working agreement\n## Gather data (15 min) — exercise to choose + sample prompts\n## Generate insights (15 min) — clustering technique\n## Decide on actions (15 min) — voting + commitment format\n## Closing (5 min) — appreciation round\n\nCONSTRAINTS:\n- All exercises must work remotely + in-person.\n- Avoid blame-oriented prompts.\n- End with 3–5 specific action items with owners." }
          ]},
          { title: "B.13 — Creative / Writing", prompts: [
            { label: "B.13.1 · Style transfer", text: "ROLE: You are an editor versed in [style — e.g., crisp business prose, conversational lifestyle copy, formal academic].\n\nINPUT: Original text [paste]. Target style: [name + 1-line description].\n\nTASK:\n1. Rewrite in the target style.\n2. List 5 specific style moves you applied.\n\nCONSTRAINTS:\n- Preserve all factual content.\n- Don't add or remove substance.\n- Keep length within ±20% of the original." },
            { label: "B.13.2 · Outline → first draft → critique pass", text: "ROLE: You are a writing coach working in three passes.\n\nINPUT: Outline [paste]. Audience: [paste]. Length target: [N words].\n\nPASS 1 — Draft the piece.\nPASS 2 — Re-read the draft as a skeptical reader. List 5 weaknesses.\nPASS 3 — Revise to address the 5 weaknesses.\n\nOUTPUT: All three passes shown clearly so I can compare." }
          ]},
          { title: "B.14 — Consulting / Advisory", prompts: [
            { label: "B.14.1 · Issue tree from vague problem", text: "ROLE: You are a senior consultant trained in MECE problem decomposition.\n\nINPUT: Problem statement [paste — often vague, e.g., \"Sales are declining\"].\n\nTASK:\n1. Restate the problem more precisely (specific entity, time frame, metric).\n2. Build a 2-level MECE issue tree decomposing potential causes.\n3. For each leaf, list 1–2 analyses that would test it.\n\nOUTPUT FORMAT: Markdown indented list for the tree + a small table for analyses.\n\nCONSTRAINTS:\n- MECE: branches mutually exclusive, collectively exhaustive.\n- Flag any branch where the cut is debatable.\n- No business advice yet — only diagnosis structure." },
            { label: "B.14.2 · Synthesize 8 interview notes into themes", text: "ROLE: You are a senior consultant synthesizing primary research.\n\nINPUT: 8 interview notes (anonymized) [paste].\n\nTASK:\n1. Extract 5–8 themes that appear across multiple interviews.\n2. For each theme: name it, give the supporting quote count, list 2 anonymized illustrative quotes.\n3. List 2–3 tensions/contradictions between interviews.\n\nOUTPUT FORMAT:\n## Theme [N] — [Name]\n- Supported by: [count] of 8 interviews\n- Illustrative quote: \"...\" — [Interview ID]\n- Illustrative quote: \"...\" — [Interview ID]\n\n## Tensions\n- [Tension 1]: A said X, B said Y.\n\nCONSTRAINTS:\n- Quotes must be verbatim from the notes (or marked as paraphrased).\n- Don't invent themes that lack support.\n- Flag any theme where evidence is thin (only 1–2 interviews)." }
          ]}
        ]}
    ]
  },

            { label: "B.1.2 · Tóm tắt document dài thành 5 phút đọc", text: "ROLE: Bạn là executive briefing writer.\n\nTASK: Sản xuất 1 trang brief về document đính kèm.\n\nOUTPUT FORMAT (Markdown):\n# Brief — [Tên document]\n\n## Bottom line (2 câu)\n## Key facts (5 bullet, mỗi ≤ 20 từ, kèm page reference)\n## Open questions (3 bullet)\n## What to do next (3 actionable bullet)\n\nCONSTRAINTS:\n- Mọi fact gắn với số trang hoặc section.\n- Không bịa — nếu số không có trong document, ghi \"không nêu rõ\".\n- Không opinion/recommendation vượt support của document.\n\nINPUT: [đính kèm document]" },

          { title: "B.2 — Marketing / Communications", prompts: [

            { label: "B.2.2 · Brief cho campaign", text: "ROLE: Bạn là senior brand strategist viết brief campaign.\n\nINPUT:\n- Sản phẩm: [...]\n- Audience: [primary + secondary]\n- Mục tiêu business: [target đo được]\n- Constraints: [budget tier, timeline, channel]\n\nTASK: Sinh brief campaign 1 trang.\n\nOUTPUT FORMAT (Markdown):\n# Campaign brief — [Tên campaign]\n\n## Objective (1 câu)\n## Audience insight (2–3 câu, focus tension)\n## Single-minded proposition (≤ 15 từ)\n## Reasons to believe (3 bullet)\n## Tone of voice (3 tính từ + 3 anti-tính từ)\n## KPIs (3 metric với target range)\n## Risks & guardrails (3 bullet)\n\nCONSTRAINTS:\n- Single-minded proposition phải là 1 ý, không phải list.\n- KPI phải đo được." }
          ]},
          { title: "B.3 — Sales / BD", prompts: [
            { label: "B.3.1 · Cold outreach personalize", text: "ROLE: Bạn là B2B sales copywriter.\n\nINPUT:\n- Role + công ty của prospect [paste snippet kiểu LinkedIn]\n- 1 observation cụ thể về công việc/công ty [paste]\n- Giá trị chính sản phẩm [1 câu]\n- Ask [1 CTA cụ thể]\n\nTASK: Viết 1 cold outreach email.\n\nCONSTRAINTS:\n- Subject ≤ 7 từ.\n- Body 3 đoạn ngắn, ≤ 130 từ.\n- Mở bằng observation, không phải về mình.\n- Không hứa kết quả; không buzzword.\n- 1 ask rõ với 2 option giờ cụ thể.\n\nOUTPUT:\nSubject: ...\n[body]\n— [Tên bạn]" },
            { label: "B.3.2 · Follow-up sequence sau discovery call", text: "ROLE: Bạn là sales-development coach.\n\nINPUT:\n- Note cuộc gọi [paste]\n- Next step prospect đồng ý bằng miệng [paste]\n- Timing: hôm nay, +3 ngày, +7 ngày\n\nTASK: Viết chuỗi 3 message follow-up.\n\nCONSTRAINTS:\n- Message 1 (hôm nay): recap + next step + soft confirmation.\n- Message 2 (+3 ngày): 1 mảnh giá trị relevant (case study, doc, post).\n- Message 3 (+7 ngày): ask trực tiếp + off-ramp rõ ràng.\n- Tone: confident, không pushy, không \"circling back\".\n- Mỗi message ≤ 100 từ." },
            { label: "B.3.3 · Account research one-pager", text: "ROLE: Bạn là account-research analyst.\n\nINPUT: Tên công ty [Company], website public, press release gần đây.\n\nTASK: Sản xuất 1 trang account brief cho cuộc gọi sales.\n\nOUTPUT FORMAT (Markdown):\n# Account brief — [Company]\n\n## Họ làm gì (2 câu từ website của họ)\n## Ai có khả năng là decision maker (1 bullet)\n## Recent signal (3 bullet, có ngày)\n## Pain giả định ta có thể address (3 bullet)\n## 3 câu hỏi discovery\n\nCONSTRAINTS:\n- Chỉ dùng source bạn cite được.\n- Không bịa số tài chính.\n- Không infer hierarchy từ 1 signal LinkedIn — flag là hypothesis." }
          ]},
          { title: "B.4 — Legal / Compliance (general)", prompts: [
            { label: "B.4.1 · Review điều khoản hợp đồng theo checklist", text: "ROLE: Bạn là contracts analyst (không tư vấn pháp lý — flag cho luật sư).\n\nINPUT:\n- Điều khoản [paste]\n- Checklist các mục cần có [paste]\n\nTASK:\n1. Với mỗi mục checklist, đánh Present / Missing / Ambiguous.\n2. Với Ambiguous, trích phần và giải thích ambiguity.\n3. Liệt kê top 3 risk nếu điều khoản giữ nguyên.\n\nOUTPUT FORMAT:\n| Mục checklist | Trạng thái | Quoted text | Note |\n\nCONSTRAINTS:\n- Không draft replacement clause — đó là việc luật sư.\n- Không assert luật yêu cầu gì; chỉ report điều khoản nói/không nói gì.\n- Đánh confidence H/M/L mỗi dòng." },
            { label: "B.4.2 · Plain-language summary của policy", text: "ROLE: Bạn là policy translator.\n\nINPUT: Policy document nội bộ [đính kèm].\n\nTASK: Sản xuất 1 trang plain-language summary cho non-specialist.\n\nOUTPUT FORMAT (Markdown):\n# Policy summary — [Tên policy]\n\n## What it covers (3 bullet)\n## Who must follow it (1 đoạn)\n## What you must do (5 bullet max, mỗi bắt đầu bằng verb)\n## What you must NOT do (3 bullet)\n## Where to go for help (1 dòng)\n\nCONSTRAINTS:\n- Reading level: lớp 9.\n- Dùng direct, second-person voice.\n- Giữ nguyên mọi deadline/threshold number.\n- Flag mọi section bản gốc mơ hồ." }
          ]},
          { title: "B.5 — Engineering / IT", prompts: [
            { label: "B.5.1 · Code review theo rubric", text: "ROLE: Bạn là senior staff engineer review PR của junior.\n\nINPUT: Code diff [paste].\n\nTASK: Review code theo rubric:\n1. Correctness · 2. Readability · 3. Edge case · 4. Test · 5. Performance\n\nOUTPUT FORMAT:\n| Rubric area | Status (✓/⚠/✗) | Comment cụ thể với line number |\n\nCONSTRAINTS:\n- Cụ thể (cite line number).\n- Đề xuất fix cụ thể, không phải lời khuyên chung.\n- Nhẹ nhàng. Tone: senior giúp junior, không gatekeeper.\n- Không rewrite toàn bộ — chỉ trỏ vào vấn đề." },
            { label: "B.5.2 · Sinh test case", text: "ROLE: Bạn là QA engineer.\n\nTASK: Sinh test case cho function dưới.\n\nINPUT: [function signature + docstring]\n\nOUTPUT FORMAT:\n| # | Test name | Input | Expected output | Edge case? (Y/N) |\n\nCONSTRAINTS: Cover happy path + 3 edge case + 2 error case minimum.\nTag mọi test mà expected behavior không được docstring chỉ rõ là\n\"AMBIGUOUS — confirm with author\"." },
            { label: "B.5.3 · Draft incident post-mortem", text: "ROLE: Bạn là SRE viết incident post-mortem.\n\nINPUT:\n- Timeline sự kiện: [paste]\n- Impact: [paste]\n- Root cause initial: [paste]\n\nOUTPUT FORMAT:\n## Incident [ID] — [Tên ngắn] — [Ngày]\n### Summary (3 câu)\n### Timeline chi tiết (bảng)\n### Impact (số user/request/revenue ảnh hưởng)\n### Root cause\n### Remediation\n- Immediate · Medium-term · Long-term\n### Lessons learned (không blame cá nhân)\n\nCONSTRAINTS: Focus hệ thống/process. Flag mọi statement giả định-chưa-verify." }
          ]},
          { title: "B.6 — Education / Teaching", prompts: [
            { label: "B.6.1 · Lesson plan từ learning objective", text: "ROLE: Bạn là curriculum designer cho [grade level / context].\n\nINPUT: Learning objective: [1 câu: \"Cuối buổi, học sinh có thể…\"]\n\nTASK: Sinh lesson plan 45 phút.\n\nOUTPUT FORMAT (Markdown):\n# Lesson plan — [Chủ đề]\n## Learning objective\n## Hook (5 phút)\n## Direct instruction (10 phút)\n## Guided practice (15 phút)\n## Independent practice (10 phút)\n## Wrap & exit ticket (5 phút)\n## Differentiation (3 bullet: struggle / on-pace / advanced)\n## Vật liệu cần\n\nCONSTRAINTS:\n- Hook phải connect với prior knowledge của học sinh.\n- Exit ticket directly đánh giá objective.\n- Chỉ dùng vật liệu lớp học điển hình có trừ khi tôi nói khác." },
            { label: "B.6.2 · Rubric cho bài tập", text: "ROLE: Bạn là teacher viết assessment rubric.\n\nINPUT:\n- Mô tả bài tập: [paste]\n- Grade level / expectation: [paste]\n- Số performance level: [vd 4]\n\nTASK: Sản xuất rubric analytic 4–5 tiêu chí.\n\nOUTPUT FORMAT: Bảng Markdown — row = tiêu chí, column = performance level.\nMỗi cell: descriptor hành vi-cụ thể.\n\nCONSTRAINTS:\n- Mỗi tiêu chí phải quan sát được và chấm được.\n- Ngôn ngữ student-friendly mà 12 tuổi hiểu.\n- Tổng điểm = số tròn (vd 100 hoặc 20)." }
          ]},
          { title: "B.7 — Healthcare administration", prompts: [
            { label: "B.7.1 · Patient education material (generic, không định danh)", text: "ROLE: Bạn là patient educator viết tài liệu cho phân phối chung.\n\nINPUT: Chủ đề — [tình trạng hoặc thủ tục, generic, không patient data].\n\nTASK: Viết 1 trang handout cho bệnh nhân mới chẩn đoán [chủ đề].\n\nOUTPUT FORMAT (Markdown):\n# [Chủ đề] — điều bạn cần biết\n\n## Đó là gì? (3 câu, plain English)\n## Bạn nên expect gì (3 bullet)\n## Câu hỏi để hỏi provider (5 bullet)\n## Gợi ý lifestyle (3 bullet, evidence-based, low-risk only)\n## Khi nào tìm immediate help (red flag, 3 bullet)\n## Resource đáng tin (3 nguồn có tên)\n\nCONSTRAINTS:\n- Reading level: lớp 6.\n- Không liều thuốc cụ thể (provider quyết).\n- Không claim chẩn đoán.\n- Flag chỗ nên tham khảo clinical reviewer." },
            { label: "B.7.2 · Internal admin communication (không PHI)", text: "ROLE: Bạn là admin coordinator draft memo cho clinical staff.\n\nINPUT:\n- Chủ đề: [policy change / scheduling update / training reminder]\n- Audience: [nurse / front desk / provider]\n\nTASK: Memo 1 trang.\n\nOUTPUT FORMAT:\n## Subject\n## Có gì thay đổi (1 đoạn)\n## Bạn cần làm gì (danh sách đánh số)\n## Effective date\n## Hỏi ai\n\nCONSTRAINTS: Không PHI. Không patient example cụ thể. Plain English." }
          ]},
          { title: "B.8 — Human Resources", prompts: [
            { label: "B.8.1 · Job description từ hiring brief", text: "ROLE: Bạn là recruiter viết job description.\n\nINPUT:\n- Role: [...]\n- Team: [...]\n- Must-have: [bullet]\n- Nice-to-have: [bullet]\n- Compensation range (nếu cung cấp): [...]\n\nOUTPUT FORMAT (Markdown):\n# [Tên role] — [Team]\n\n## What you'll do (4–6 bullet, mỗi bắt đầu bằng verb)\n## What we're looking for\n### Must-have\n### Nice-to-have\n## Why join us (3 bullet, cụ thể không generic)\n## How we hire (3 bullet mô tả process)\n\nCONSTRAINTS:\n- Tránh ngôn ngữ biased (vd \"rockstar\", \"ninja\", \"young and energetic\").\n- Không hứa outcome (\"bạn sẽ được promote thành X\").\n- Tổng độ dài ≤ 400 từ." },
            { label: "B.8.2 · Performance-conversation prep (anonymized)", text: "ROLE: Bạn là chuyên gia manager-coaching.\n\nINPUT:\n- Role của người đó (anonymized): [paste]\n- Hành vi cụ thể cần address (fact, không interpret): [paste]\n- Outcome mong muốn của cuộc trò chuyện: [paste]\n\nTASK: Chuẩn bị tôi cho cuộc trò chuyện này.\n\nOUTPUT:\n1. 3 điều tôi nên nói đầu tiên (set context).\n2. Hành vi cụ thể framed bằng SBI (Situation, Behavior, Impact).\n3. 3 câu hỏi open-ended để mời góc nhìn của họ.\n4. 2 likely response và tôi nên xử lý mỗi cái thế nào.\n5. Ask rõ ràng tôi muốn để lại.\n\nCONSTRAINTS:\n- Tone: direct, nhẹ nhàng, không therapizing.\n- Không PII; gọi họ là \"[Person]\".\n- Không draft conversation thành script — cho tôi building block." }
          ]},
          { title: "B.9 — Finance / Accounting", prompts: [
            { label: "B.9.1 · Narrative variance analysis", text: "ROLE: Bạn là senior FP&A analyst viết variance narrative cho ban lãnh đạo.\n\nINPUT: Bảng variance [paste — actual vs budget theo line item].\n\nTASK: Viết narrative 1 trang.\n\nOUTPUT FORMAT:\n## Headline (1 câu — overall result)\n## Top 3 variance favorable (mỗi: line item, $ amount, % vs budget, 1 câu driver)\n## Top 3 variance unfavorable (cùng cấu trúc)\n## Outlook (2 câu — directionally, expect gì tháng tới)\n## Câu hỏi open (3 bullet)\n\nCONSTRAINTS:\n- Chỉ dùng số từ bảng.\n- Đừng suy diễn nguyên nhân nếu không được cung cấp.\n- Plain English; đừng nhồi jargon finance." },
            { label: "B.9.2 · Prompt điều tra chênh lệch reconciliation", text: "ROLE: Bạn là kế toán senior giúp điều tra chênh lệch reconciliation.\n\nINPUT:\n- 2 bảng transaction [A và B]\n- Matching key kỳ vọng: [tên field]\n\nTASK:\n1. Tìm transaction unmatched.\n2. Tìm transaction match key nhưng amount/date chênh > [threshold].\n3. Sản xuất summary count theo category.\n\nOUTPUT FORMAT (bảng Markdown):\n| Category | Count | Tổng $ chênh tuyệt đối | ID ví dụ |\n\nCONSTRAINTS:\n- Không bịa transaction.\n- Hiển thị matching logic tường minh để tôi verify.\n- Flag anomaly nhìn giống data quality." }
          ]},
          { title: "B.10 — Research / Academic", prompts: [
            { label: "B.10.1 · Lit review starter", text: "ROLE: Bạn là senior research librarian.\n\nINPUT: Câu hỏi nghiên cứu [paste].\n\nTASK:\n1. Reframe câu hỏi thành scope statement chính xác.\n2. Đề xuất 5 query search (góc khác / synonym khác).\n3. Đề xuất 3 database hoặc nguồn nên tìm.\n4. Đề xuất danh sách 8–12 keyword (controlled vocabulary nếu có thể).\n5. Xác định 3 paper/nguồn foundational tôi nên track xuống.\n\nCONSTRAINTS:\n- KHÔNG bịa title paper hoặc DOI. Nếu liệt kê paper, đánh confidence\n  L (thấp) nếu không chắc nó tồn tại, và hướng dẫn tôi verify.\n- Bias toward primary source." },
            { label: "B.10.2 · Survey design help", text: "ROLE: Bạn là survey methodologist.\n\nINPUT:\n- Câu hỏi nghiên cứu: [paste]\n- Target respondent: [paste]\n- Budget độ dài: [N phút]\n\nTASK:\n1. Draft 8–12 câu hỏi.\n2. Với mỗi câu, gán type (closed / Likert / open / matrix).\n3. Flag câu leading hoặc double-barreled và đề xuất fix.\n4. Đề xuất 1 câu hỏi quality-control.\n\nCONSTRAINTS:\n- Dùng wording trung tính.\n- Tránh jargon.\n- ≥ 2 câu demographic nhưng chỉ relevant." }
          ]},
          { title: "B.11 — Customer service / Support", prompts: [
            { label: "B.11.1 · Cluster ticket + canned response", text: "ROLE: Bạn là customer-service team lead.\n\nINPUT: 50 ticket anonymized [paste].\n\nTASK:\n1. Cluster ticket thành 5–8 chủ đề chính.\n2. Với mỗi cluster, draft 1 canned response (≤ 80 từ).\n\nOUTPUT FORMAT:\n## Cluster [N] — [Tên]\n- Frequency: [%]\n- Ví dụ ticket: 2–3 snippet ngắn\n### Canned response (≤ 80 từ)\n[draft]\n\nCONSTRAINTS:\n- Cấu trúc canned response: greet → acknowledge → solution → CTA.\n- KHÔNG dùng tên khách thật.\n- Tone: warm, direct, brand-consistent." },
            { label: "B.11.2 · Tone-correct draft reply", text: "ROLE: Bạn là customer-experience coach.\n\nINPUT: Draft reply [paste]. Tình huống khách: [1 dòng — angry / confused / frustrated / churn risk].\n\nTASK:\n1. Viết lại reply với tone phù hợp.\n2. Liệt kê thay đổi cụ thể đã làm và tại sao.\n\nCONSTRAINTS:\n- Giữ mọi factual content.\n- Không over-apologize.\n- Không cam kết không có trong bản gốc." }
          ]},
          { title: "B.12 — Project management", prompts: [
            { label: "B.12.1 · Status update từ raw notes", text: "ROLE: Bạn là project manager chuẩn bị weekly status update.\n\nINPUT: Note tuần này [paste].\n\nOUTPUT FORMAT:\n## Project [tên] — Week of [date]\n### Status: 🟢 Green / 🟡 Yellow / 🔴 Red — [1 dòng lý do]\n### Progress tuần này (3 bullet)\n### Blocker (mỗi với owner + ETA)\n### Focus tuần tới (3 bullet)\n### Ask của sponsor (1–3 bullet)\n\nCONSTRAINTS:\n- 1 đoạn mỗi section max.\n- Không hedge — nói thẳng.\n- Nếu số không có trong note, ghi \"TBD\"." },
            { label: "B.12.2 · Retrospective facilitator outline", text: "ROLE: Bạn là agile coach kinh nghiệm facilitate retrospective.\n\nINPUT: Project summary [paste].\n\nTASK: Sản xuất retro outline 60 phút.\n\nOUTPUT FORMAT:\n## Opening (5 phút) — câu hỏi check-in\n## Set the stage (5 phút) — Prime directive + working agreement\n## Gather data (15 phút) — exercise + prompt mẫu\n## Generate insights (15 phút) — kỹ thuật cluster\n## Decide on action (15 phút) — voting + format commitment\n## Closing (5 phút) — appreciation round\n\nCONSTRAINTS:\n- Mọi exercise phải work remote + in-person.\n- Tránh prompt mang tính blame.\n- Kết bằng 3–5 action item cụ thể với owner." }
          ]},
          { title: "B.13 — Creative / Writing", prompts: [
            { label: "B.13.1 · Style transfer", text: "ROLE: Bạn là editor thạo về [style — vd: crisp business prose, conversational lifestyle copy, formal academic].\n\nINPUT: Text gốc [paste]. Target style: [tên + mô tả 1 dòng].\n\nTASK:\n1. Viết lại theo style target.\n2. Liệt kê 5 style move cụ thể đã áp dụng.\n\nCONSTRAINTS:\n- Giữ mọi factual content.\n- Không thêm/bớt substance.\n- Giữ độ dài trong ±20% bản gốc." },
            { label: "B.13.2 · Outline → first draft → critique pass", text: "ROLE: Bạn là writing coach làm việc theo 3 pass.\n\nINPUT: Outline [paste]. Audience: [paste]. Target độ dài: [N từ].\n\nPASS 1 — Draft bài.\nPASS 2 — Đọc lại draft như độc giả hoài nghi. Liệt kê 5 yếu kém.\nPASS 3 — Revise để address 5 yếu kém.\n\nOUTPUT: Cả 3 pass hiển thị rõ để tôi so sánh." }
          ]},
          { title: "B.14 — Consulting / Advisory", prompts: [
            { label: "B.14.1 · Issue tree từ problem statement mơ hồ", text: "ROLE: Bạn là senior consultant trained về MECE problem decomposition.\n\nINPUT: Problem statement [paste — thường mơ hồ, vd \"Doanh số đang giảm\"].\n\nTASK:\n1. Restate problem cụ thể hơn (entity cụ thể, time frame, metric).\n2. Build issue tree 2-level MECE decompose nguyên nhân.\n3. Với mỗi leaf, liệt kê 1–2 phân tích test được.\n\nOUTPUT FORMAT: Indented list Markdown + bảng nhỏ cho phân tích.\n\nCONSTRAINTS:\n- MECE: branch mutually exclusive, collectively exhaustive.\n- Flag branch nơi cut tranh cãi được.\n- Chưa business advice — chỉ cấu trúc diagnosis." },
            { label: "B.14.2 · Synthesize 8 interview note thành theme", text: "ROLE: Bạn là senior consultant synthesize primary research.\n\nINPUT: 8 interview note (anonymized) [paste].\n\nTASK:\n1. Trích 5–8 theme xuất hiện qua nhiều interview.\n2. Với mỗi theme: đặt tên, count interview support, liệt kê 2 quote illustrative.\n3. Liệt kê 2–3 tension/contradiction giữa các interview.\n\nOUTPUT FORMAT:\n## Theme [N] — [Tên]\n- Supported by: [count] of 8 interview\n- Quote illustrative: \"…\" — [Interview ID]\n\n## Tension\n- [Tension 1]: A nói X, B nói Y.\n\nCONSTRAINTS:\n- Quote verbatim từ note (hoặc đánh paraphrased).\n- Không bịa theme thiếu support.\n- Flag theme nơi evidence thin (chỉ 1–2 interview)." }
          ]}
        ]}
    ]
  }
},

/* ============ F — FAQ ============ */
{
  id: "faq", appendix: true, letter: "F",
  tag: "Reference",
  en: {
    title: "FAQ — 18 questions",
    sub: "The questions every workshop participant asks. Click to expand.",
    blocks: [
      { kind: "accordion", label: "F · Frequently asked questions", heading: "18 honest answers.",
        items: [
          { q: "Q1: I don't know how to code. Can I really use Claude Cowork or Custom GPTs?", a: "<p>Yes. Both Cowork and Custom GPTs are designed for non-coders. You describe what you want in English; the AI translates into the underlying logic. The main barrier is understanding <strong>prompting</strong> (Chapter 3), not coding.</p>", open: true },
          { q: "Q2: Is ChatGPT Free enough to learn everything in this workshop?", a: "<p>You'll understand ~80%. But to build Custom GPTs you need ChatGPT Plus ($20/month). To use Cowork you need Claude Pro ($20/month) + Windows Pro/Enterprise (or macOS). <strong>Recommendation:</strong> if your organization hasn't provided a paid plan yet, invest in one yourself to learn.</p>" },
          { q: "Q3: Should my organization ban consumer ChatGPT?", a: "<p>A complete ban means losing the productivity gains. Open-door access means risking a Samsung-style leak. <strong>The best middle ground:</strong> provide an enterprise plan with a no-training commitment and DPA, plus a clear policy on what data must not be pasted. Designate one or two people on each team as AI champions.</p>" },
          { q: "Q4: Will AI replace me?", a: "<p>Not on its own. AI lets you produce 5–10× more output. The judgment, the relationships, and the accountability remain yours. The honest expectation: <strong>professionals who use AI well will replace those who don't.</strong></p>" },
          { q: "Q5: Should customers / patients / clients know when I use AI to help draft my work?", a: "<p>It depends on your organization's policy and the context. The general principle: <strong>disclosure is better than concealment.</strong> But be careful not to imply that AI made the decision when in fact you made the decision and AI helped format the artifact.</p>" },
          { q: "Q6: Can I trust AI-generated code for important tasks?", a: "<p>Be cautious. AI-generated code can contain bugs and security flaws. Rule: for important tasks, <strong>review the code line-by-line</strong> (or have IT review), test on sample data first, never run it on production data without sandboxing.</p>" },
          { q: "Q7: Is AI's news and data automatically accurate?", a: "<p><strong>No.</strong> Even with web search on, AI can misread news, mix numbers between years/companies, or hallucinate sources. Rule: for any consequential number or citation, <strong>verify against the primary source.</strong></p>" },
          { q: "Q8: Big difference between Claude and ChatGPT?", a: "<p>For beginners, not dramatic. Both are strong. Differences:</p><ul><li>ChatGPT has a larger GPT ecosystem, plus Apps/integrations and a broader tool ecosystem.</li><li>Claude often handles long-document tasks, code, and writing with a larger context window. Cowork (desktop autonomous) is Claude-only.</li><li>Recommendation: learn both; pick the right one for the task.</li></ul>" },
          { q: "Q9: I'm worried about being seen as \"behind\" because my organization doesn't encourage AI use yet.", a: "<p>Propose a formal pilot. Ask your manager, HR, or IT for a 90-day measured trial. <strong>Most organizations are eager but uncertain how to start</strong> — you initiating gets noticed favorably.</p>" },
          { q: "Q10: Is there a way to keep learning without being technical?", a: "<p>Yes. Three steps:</p><ol><li>Weekly read Anthropic/OpenAI docs (links in Chapter 8.3).</li><li>Subscribe to 2–3 newsletters focused on AI for business (not \"AI hype\" newsletters — substantive ones).</li><li>Teach a colleague. You'll deepen your understanding when you teach.</li></ol>" },
          { q: "Q11: Will this workshop be updated?", a: "<p>AI products evolve quickly. Recommend reviewing this curriculum every six months. This version: <strong>1.0.1, May 26, 2026.</strong></p>" },
          { q: "Q12: Where else can I find similar material?", a: "<p>Anthropic and OpenAI have free official docs (Chapter 8.3). Also: DeepLearning.AI's free courses (Prompt Engineering for Developers, Building Systems with the ChatGPT API). For governance, follow NIST and ISO/IEC 42001 communities.</p>" },
          { q: "Q13: How do I know when a task is too important for AI?", a: "<p>Two simple tests:</p><ol><li><strong>The phone-call test:</strong> if AI gets this wrong, would I have to make an uncomfortable phone call? If yes → use Pattern A (human-first) or Pattern C (parallel).</li><li><strong>The audit test:</strong> if a regulator, auditor, or board asked you to explain how this was produced, could you defend the process? If no → tighten the process before continuing.</li></ol>" },
          { q: "Q14: What about hallucinations in long outputs?", a: "<p>Risk grows with length. Mitigation: ask AI to <strong>quote verbatim</strong> the source for each claim; break long outputs into sections and verify section by section; never publish a long AI-drafted document without a human read end-to-end.</p>" },
          { q: "Q15: Is it OK to let AI run overnight unattended?", a: "<p>For reversible work in a sandboxed environment (analysis, drafting, organizing files) — yes, with logging. For anything irreversible (sending emails, posting publicly, taking action on real systems) — <strong>never</strong> without an approval gate (Pattern D).</p>" },
          { q: "Q16: What if my AI consistently produces wrong output for a specific task?", a: "<p>Don't keep editing the output every time. <strong>Fix the prompt or the Custom GPT Instructions</strong> so the failure mode goes away once. Treat persistent errors as feedback about your specification, not as random noise.</p>" },
          { q: "Q17: I'm a manager. How do I encourage my team without creating risk?", a: "<p>Three moves:</p><ol><li>Establish a simple policy: which data is OK on which platform.</li><li>Provide an enterprise plan budget for anyone who'll use AI weekly.</li><li>Designate one team member as the \"AI champion\" — they coach others, surface failures, and keep prompt templates in a shared library.</li></ol>" },
          { q: "Q18: How do I evaluate whether a vendor's \"AI feature\" is real or marketing?", a: "<p>Ask three questions:</p><ol><li><strong>What current model/version is behind it?</strong> Real products name the current model family, version, and retirement/update policy (e.g., \"Claude Opus 4.7\" or \"GPT-5\"); marketing fluff doesn't.</li><li><strong>What happens to my data?</strong> Real products have a published data-handling policy and a DPA.</li><li><strong>Show me the failure mode.</strong> Real products have known limitations; marketing fluff claims to do everything.</li></ol>" }
        ]}
    ]
  },
  vi: {

    sub: "Những câu hỏi mọi người học workshop đều hỏi. Click để mở.",
    blocks: [
      { kind: "accordion", label: "F · Câu hỏi thường gặp", heading: "18 câu trả lời thẳng thắn.",
        items: [
          { q: "Q1: Tôi không biết code. Có dùng được Claude Cowork / Custom GPT không?", a: "<p>Có. Cả Cowork lẫn Custom GPT thiết kế cho non-coder. Bạn mô tả bằng tiếng Việt; AI tự dịch ra logic. Rào cản chính là <strong>khái niệm prompt</strong> (Chương 3), không phải coding.</p>", open: true },
          { q: "Q2: ChatGPT Free có đủ để học hết workshop này không?", a: "<p>Hiểu được ~80%. Nhưng để build Custom GPT cần ChatGPT Plus ($20/tháng). Để dùng Cowork cần Claude Pro ($20/tháng) + Windows Pro/Enterprise (hoặc macOS). <strong>Khuyến nghị:</strong> nếu công ty chưa cấp, tự đầu tư 1 plan để học.</p>" },
          { q: "Q3: Tổ chức của tôi có nên cấm consumer ChatGPT không?", a: "<p>Cấm hoàn toàn = mất productivity gain. Cho phép tự do = rủi ro Samsung. <strong>Trung gian tốt nhất:</strong> cấp enterprise plan có cam kết no-training + DPA, kèm policy rõ \"data nào không paste\". Cử 1–2 nhân viên IT/Compliance làm AI champion.</p>" },
          { q: "Q4: AI có thay thế tôi không?", a: "<p>Không tự thân nó. AI giúp bạn sản xuất 5–10× nhiều output. Judgment, mối quan hệ, accountability vẫn của bạn. Kỳ vọng thật: <strong>professional dùng AI tốt sẽ thay professional không dùng AI.</strong></p>" },
          { q: "Q5: Khách / patient / client có nên biết tôi dùng AI giúp draft không?", a: "<p>Tuỳ policy tổ chức + tuỳ context. Nguyên tắc chung: <strong>disclosure tốt hơn giấu</strong>. Nhưng cẩn thận không để họ hiểu nhầm \"AI quyết định\" khi sự thật là bạn quyết định, AI chỉ format giúp.</p>" },
          { q: "Q6: Tôi có nên tin AI-generated code cho task quan trọng?", a: "<p>Cẩn thận. AI sinh code có thể có bug và security flaw. Quy tắc: với task quan trọng, <strong>review code line-by-line</strong> (hoặc nhờ IT review), test trên sample data trước, không bao giờ chạy trên production data không qua sandbox.</p>" },
          { q: "Q7: AI nói tin tức / số liệu có thật không?", a: "<p><strong>Không tự động đúng</strong>. Kể cả web search bật, AI có thể hiểu sai tin tức, trộn số giữa các năm/công ty, hoặc hallucinate source. Quy tắc: với mọi số/citation quan trọng, <strong>verify với primary source.</strong></p>" },
          { q: "Q8: Khác biệt lớn giữa Claude và ChatGPT?", a: "<p>Cho beginner, không quá khác biệt. Cả hai đều mạnh. Khác biệt:</p><ul><li>ChatGPT: ecosystem GPT lớn hơn, kèm Apps/integrations và tool ecosystem rộng hơn.</li><li>Claude: thường tốt hơn cho task viết dài, code, phân tích document với context window lớn. Có Cowork (desktop autonomous) — chỉ Claude.</li><li>Khuyên: học cả hai, dùng cái phù hợp từng task.</li></ul>" },
          { q: "Q9: Tôi sợ bị \"behind\" vì tổ chức chưa khuyến khích AI use?", a: "<p>Đề xuất chính thức một pilot. Hỏi sếp/HR/IT cho measured trial 90 ngày. <strong>Đa số tổ chức đang rất muốn nhưng chưa biết bắt đầu</strong> — bạn proactive sẽ được đánh giá cao.</p>" },
          { q: "Q10: Có cách học AI nâng cao không cần kiến thức kỹ thuật?", a: "<p>Có. 3 bước:</p><ol><li>Đọc Anthropic/OpenAI docs hằng tuần (link Chương 8.3).</li><li>Subscribe 2–3 newsletter về AI cho doanh nghiệp (không \"AI hype\" — substantive).</li><li>Dạy đồng nghiệp. Bạn hiểu sâu hơn khi dạy.</li></ol>" },
          { q: "Q11: Workshop này có update không?", a: "<p>Sản phẩm AI thay đổi nhanh. Khuyến nghị review giáo trình mỗi 6 tháng. Phiên bản này: <strong>1.0.1, 26/05/2026.</strong></p>" },
          { q: "Q12: Tìm tài liệu tương tự ở đâu?", a: "<p>Anthropic và OpenAI đều có docs miễn phí (Chương 8.3). Ngoài ra: DeepLearning.AI free course (Prompt Engineering for Developers, Building Systems with the ChatGPT API). Về governance, theo dõi NIST và ISO/IEC 42001 community.</p>" },
          { q: "Q13: Làm sao biết task nào quá quan trọng cho AI?", a: "<p>Hai test đơn giản:</p><ol><li><strong>Phone-call test:</strong> nếu AI sai, bạn có phải gọi điện thoại uncomfortable không? Nếu có → dùng Pattern A (human-first) hoặc Pattern C (parallel).</li><li><strong>Audit test:</strong> nếu regulator, auditor, hay board hỏi \"giải thích process tạo ra cái này\", bạn có defend được không? Nếu không → siết process trước khi tiếp tục.</li></ol>" },
          { q: "Q14: Hallucination trong output dài thì sao?", a: "<p>Rủi ro tăng theo độ dài. Mitigation: yêu cầu AI <strong>quote nguyên văn</strong> source cho mỗi claim; chia output dài thành section và verify từng section; không bao giờ publish document dài AI-drafted không qua human đọc end-to-end.</p>" },
          { q: "Q15: Có OK để cho AI chạy qua đêm không có giám sát không?", a: "<p>Cho task reversible trong sandbox (analysis, drafting, sắp xếp file) — có, kèm logging. Cho bất kỳ irreversible (gửi email, post public, action trên hệ thống thật) — <strong>không bao giờ</strong> không có approval gate (Pattern D).</p>" },
          { q: "Q16: AI của tôi liên tục sai cho 1 task cụ thể thì sao?", a: "<p>Đừng cứ sửa output mỗi lần. <strong>Sửa prompt hoặc Custom GPT Instructions</strong> để failure mode biến mất 1 lần. Coi lỗi lặp lại là feedback về spec của bạn, không phải random noise.</p>" },
          { q: "Q17: Tôi là manager. Làm sao khuyến khích team mà không tạo rủi ro?", a: "<p>3 động thái:</p><ol><li>Lập policy đơn giản: data nào OK trên platform nào.</li><li>Cấp budget enterprise plan cho ai dùng AI weekly.</li><li>Cử 1 thành viên team làm \"AI champion\" — coach người khác, surface lỗi, giữ thư viện prompt template share.</li></ol>" },
          { q: "Q18: Làm sao evaluate \"AI feature\" của vendor là thật hay marketing?", a: "<p>3 câu hỏi:</p><ol><li><strong>Model/version hiện tại bên dưới là gì?</strong> Sản phẩm thật nêu được model family, version hiện tại, và chính sách update/retirement (vd: \"Claude Opus 4.7\" hoặc \"GPT-5\"); marketing fluff không.</li><li><strong>Data của tôi đi đâu?</strong> Sản phẩm thật có policy xử lý data và DPA.</li><li><strong>Show me failure mode.</strong> Sản phẩm thật có giới hạn đã biết; marketing fluff claim làm mọi thứ.</li></ol>" }
        ]}
    ]
  }

</script>

<script>
/* ============================================================
   APP — single-file vanilla JS
   ============================================================ */
const STORAGE = "wkshp-ai-tool-state-v1";
const state = { lang: "en", route: "home", completed: {}, sidebarOpen: true, checks: {} };

function load() {
  try { Object.assign(state, JSON.parse(localStorage.getItem(STORAGE) || "{}")); } catch (e) {}
}
function save() {
  const { lang, completed, sidebarOpen, checks } = state;
  localStorage.setItem(STORAGE, JSON.stringify({ lang, completed, sidebarOpen, checks }));
}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const SESSIONS = () => window.CONTENT.sessions;
const UI = () => window.CONTENT.ui[state.lang];
const T = (k) => UI()[k];
const pad = (n) => String(n).padStart(2, "0");
const escHtml = (s) => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const escAttr = escHtml;

function parseRoute() {
  const h = location.hash.replace(/^#\/?/, "");
  if (!h || h === "home") return "home";
  return h.startsWith("session/") ? h : "home";
}
function navigate(route) { location.hash = "#/" + route; }
window.addEventListener("hashchange", () => { state.route = parseRoute(); render(); window.scrollTo({ top: 0, behavior: "instant" }); });

function chapters() { return SESSIONS().filter(s => !s.appendix); }
function appendices() { return SESSIONS().filter(s => s.appendix); }
function completedCount() { return SESSIONS().filter(s => state.completed[s.id]).length; }

/* ----- render orchestrator ----- */
function isMobile() { return window.matchMedia("(max-width: 900px)").matches; }

function applySidebar() {
  const shell = $(".shell");
  const backdrop = $("#sidebar-backdrop");
  shell.classList.toggle("sidebar-collapsed", !state.sidebarOpen);
  // Backdrop visible only when sidebar open on mobile
  if (backdrop) {
    const showBackdrop = state.sidebarOpen && isMobile();
    backdrop.classList.toggle("visible", showBackdrop);
    backdrop.style.display = showBackdrop ? "block" : "none";
  }
}

function render() {
  renderTopbar(); renderSidebar(); renderMain();
  applySidebar();
  updateFab();
}

/* ----- floating action button ----- */
function updateFab() {
  const fab = $("#fab");
  if (!fab) return;
  const homeBtn = $("#fab-home");
  const isHome = state.route === "home";
  // On home page: only show "scroll to top" (hide home button)
  homeBtn.style.display = isHome ? "none" : "grid";
  // Update tip language
  $$(".fab-tip").forEach(tip => {
    tip.textContent = state.lang === "vi" ? tip.dataset.tipVi : tip.dataset.tipEn;
  });
  // Show FAB only after user scrolls past a threshold
  const scrolled = window.scrollY > 240;
  fab.classList.toggle("visible", scrolled);
}

function renderTopbar() {
  $(".brand-name").firstChild.textContent = T("brand");
  $(".brand-name b").textContent = T("subtitle");
  const total = SESSIONS().length;
  const done = completedCount();
  $("#prog-n").textContent = done;
  $("#prog-t").textContent = total;
  $("#prog-bar").style.width = ((done / total) * 100) + "%";
  $$(".lang-toggle .lang-opt").forEach(el => el.classList.toggle("active", el.dataset.lang === state.lang));
}

function renderSidebar() {
  $(".sidebar-section-sessions").textContent = T("chapters");
  $(".sidebar-section:nth-of-type(2)").textContent = T("appendices");
  const chHtml = chapters().map((s, i) => {
    const active = state.route === "session/" + s.id;
    const done = state.completed[s.id];
    return `<li class="nav-item ${active ? "active" : ""} ${done ? "complete" : ""}" data-route="session/${s.id}">
      <span class="nav-num">${pad(i + 1)}</span>
      <span class="nav-label">${escHtml(s[state.lang].title)}</span>
      <span class="nav-check">✓</span>
    </li>`;
  }).join("");
  $("#nav-chapters").innerHTML = chHtml;
  const apHtml = appendices().map((s) => {
    const active = state.route === "session/" + s.id;
    const done = state.completed[s.id];
    return `<li class="nav-item appendix ${active ? "active" : ""} ${done ? "complete" : ""}" data-route="session/${s.id}">
      <span class="nav-num">${s.letter || ""}</span>
      <span class="nav-label">${escHtml(s[state.lang].title)}</span>
      <span class="nav-check">✓</span>
    </li>`;
  }).join("");
  $("#nav-appendices").innerHTML = apHtml;
  $$("[data-i18n=home]").forEach(el => el.textContent = T("home"));
  $$(".nav-item").forEach(el => el.addEventListener("click", () => {
    navigate(el.dataset.route);
    // On mobile, auto-close the drawer after navigation
    if (isMobile()) { state.sidebarOpen = false; save(); applySidebar(); }
  }));
}

function renderMain() {
  const m = $(".main");
  if (state.route === "home") { m.innerHTML = renderHome(); bindHome(); }
  else {
    const id = state.route.replace("session/", "");
    const idx = SESSIONS().findIndex(x => x.id === id);
    if (idx === -1) { navigate("home"); return; }
    m.innerHTML = renderSession(SESSIONS()[idx], idx);
    bindSession(SESSIONS()[idx], idx);
  }
}

/* ----- home ----- */
function renderHome() {
  const ui = UI();
  const total = SESSIONS().length;
  const chCount = chapters().length;
  const apCount = appendices().length;
  return `
  <div class="page active">
    <section class="hero">
      <div class="hero-eyebrow"><span class="dot"></span><span>${ui.heroEyebrow}</span></div>
      <h1 class="hero-title">${state.lang === "en"
        ? `AI is a <em>tool</em>,<br/>not a Q&amp;A box.`
        : `AI là <em>tool</em>,<br/>không phải hộp hỏi-đáp.`}</h1>
      <p class="hero-sub">${ui.heroSub}</p>
      <div class="hero-cta-row">
        <button class="hero-cta" data-route="session/${SESSIONS()[0].id}">
          <span>${ui.start}</span><span class="arrow">→</span>
        </button>
        <button class="hero-cta hero-cta-2" onclick="document.querySelector('.session-grid').scrollIntoView({behavior:'smooth'})">
          <span>${ui.browse}</span><span class="arrow">↓</span>
        </button>
      </div>
      <div class="hero-meta">
        <div><div class="k">${ui.duration}</div><div class="v">${ui.durationV}</div></div>
        <div><div class="k">${ui.level}</div><div class="v">${ui.levelV}</div></div>
        <div><div class="k">${ui.lang}</div><div class="v"><em>${ui.langV}</em></div></div>
        <div><div class="k">${ui.version}</div><div class="v">${ui.versionV}</div></div>
      </div>
    </section>

    <section class="landing-section">
      <h2>${ui.principlesTitle}</h2>
      <p class="lead">${ui.principlesLead}</p>
      <div class="principles">
        <div><div class="p-num">— 01</div><div class="p-title">${ui.ph01}</div><div class="p-body">${ui.pb01}</div></div>
        <div><div class="p-num">— 02</div><div class="p-title">${ui.ph02}</div><div class="p-body">${ui.pb02}</div></div>
        <div><div class="p-num">— 03</div><div class="p-title">${ui.ph03}</div><div class="p-body">${ui.pb03}</div></div>
      </div>
    </section>

    <section class="landing-section" style="padding-bottom: 32px;">
      <h2>${ui.curriculumTitle}</h2>
      <p class="lead">${ui.curriculumLead}</p>
    </section>

    <div class="session-grid">
      ${SESSIONS().map((s, i) => {
        const done = state.completed[s.id];
        const isApp = !!s.appendix;
        return `
        <div class="session-card ${done ? "complete" : ""} ${isApp ? "appendix-card" : ""}" data-route="session/${s.id}">
          <div>
            <div class="sc-num">${isApp ? "Appendix " + s.letter : pad(i + 1) + " / " + pad(chCount)}</div>
            <h3 class="sc-title">${escHtml(s[state.lang].title)}</h3>
          </div>
          <div class="sc-meta">
            <span>${s.duration || ""}</span>
            <span class="sc-arrow">→</span>
          </div>
        </div>`;
      }).join("")}
    </div>

    <section class="colophon">
      <div class="cl-head">${ui.keep}</div>
      <h3>${ui.colophonHead}</h3>
      <p>${ui.colophonBody}</p>
      <p style="margin-top:18px;">${ui.keepBody}</p>
      <p style="margin-top:18px;font-size:13px;color:var(--soft);font-style:italic;">${ui.disclaimer}</p>
      <div class="meta-grid">
        <div><div class="k">${ui.author}</div><div class="v">${ui.authorName} · <span style="color:var(--muted);">htran@ezlawfirm.org</span></div></div>
        <div><div class="k">${ui.coAuthor}</div><div class="v">${ui.coAuthorName}</div></div>
        <div><div class="k">${ui.version}</div><div class="v">${ui.versionV}</div></div>
      </div>
    </section>
  </div>`;
}
function bindHome() { $$("[data-route]").forEach(el => el.addEventListener("click", () => navigate(el.dataset.route))); }

/* ----- session ----- */
function renderSession(sess, idx) {
  const ui = UI();
  const c = sess[state.lang];
  const all = SESSIONS();
  const prev = idx > 0 ? all[idx - 1] : null;
  const next = idx < all.length - 1 ? all[idx + 1] : null;
  const done = !!state.completed[sess.id];
  const tagBadge = sess.tagAccent ? '<span class="badge accent">' + sess.tag + '</span>' : '<span class="badge">' + sess.tag + '</span>';
  const isApp = !!sess.appendix;
  const headLabel = isApp ? `${state.lang === "en" ? "Appendix" : "Phụ lục"} ${sess.letter}` : `${state.lang === "en" ? "Chapter" : "Chương"} ${pad(idx + 1)} / ${pad(chapters().length)}`;
  return `
  <div class="page active session-page">
    <header class="session-header">
      <div>
        <div class="session-eyebrow">
          <span>${headLabel}</span>
          ${tagBadge}
          ${sess.duration ? '<span>' + sess.duration + '</span>' : ''}
        </div>
        <h1 class="session-title">${c.title}</h1>
        <p class="session-sub">${c.sub || ""}</p>
      </div>
      ${c.tldr ? `
      <aside class="tldr">
        <div class="k">${ui.tldr}</div>
        <ul>${c.tldr.map(li => '<li>' + li + '</li>').join("")}</ul>
      </aside>` : ''}
    </header>
    <div class="session-body">
      ${(c.blocks || []).map((b, i) => renderBlock(b, i, sess)).join("")}
    </div>
    <footer class="session-foot">
      ${prev
        ? `<a data-route="session/${prev.id}"><div class="dir">← ${ui.prev}</div><div class="nxt">${escHtml(prev[state.lang].title)}</div></a>`
        : `<a data-route="home"><div class="dir">← ${ui.home}</div><div class="nxt">${state.lang === "en" ? "Back to overview" : "Về trang tổng quan"}</div></a>`}
      ${next
        ? `<a class="complete-btn" data-action="next" data-next="session/${next.id}"><div class="dir">${done ? ui.markedComplete : ui.markComplete}</div><div class="nxt">${ui.next}: ${escHtml(next[state.lang].title)} →</div></a>`
        : `<a class="complete-btn" data-action="complete"><div class="dir">${done ? ui.markedComplete : ui.markComplete}</div><div class="nxt">${state.lang === "en" ? "Finish the guide ✓" : "Hoàn thành ✓"}</div></a>`}
    </footer>
  </div>`;
}

function renderBlock(b, i, sess) {
  switch (b.kind) {
    case "prose": return renderProse(b, i);
    case "callout": return renderCallout(b, i);
    case "accordion": return renderAccordion(b, i);
    case "code": return renderCode(b, i);
    case "promptGrid": return renderPromptGrid(b, i);
    case "compare": return renderCompare(b, i);
    case "table": return renderTable(b, i);
    case "cards": return renderCards(b, i);
    case "timeline": return renderTimeline(b, i);
    case "tiers": return renderTiers(b, i);
    case "quiz": return renderQuiz(b, i, sess);
    case "checklist": return renderChecklist(b, i, sess);
    case "roleBlocks": return renderRoleBlocks(b, i);
    case "cheat": return renderCheat(b, i);
    default: return "";
  }
}

function renderProse(b, i) {
  return `<div class="block" data-block="${i}">
    ${b.label ? '<div class="block-label">' + escHtml(b.label) + '</div>' : ''}
    ${b.heading ? '<h3>' + b.heading + '</h3>' : ''}
    <div class="body">${b.body}</div>
  </div>`;
}
function renderCallout(b, i) {
  return `<div class="block" data-block="${i}">
    <div class="callout ${b.tone || ''}">
      ${b.tag ? '<div class="co-tag">' + escHtml(b.tag) + '</div>' : ''}
      <div class="co-body">${b.body}</div>
    </div>
  </div>`;
}
function renderAccordion(b, i) {
  return `<div class="block" data-block="${i}">
    ${b.label ? '<div class="block-label">' + escHtml(b.label) + '</div>' : ''}
    ${b.heading ? '<h3>' + b.heading + '</h3>' : ''}
    <div class="accordion">
      ${b.items.map((it, j) => `
        <div class="acc-item ${it.open ? 'open' : ''}" data-acc="${j}">
          <button class="acc-head"><span class="acc-n">${pad(j + 1)}</span><span>${it.q}</span><span class="acc-tog"></span></button>
          <div class="acc-body"><div><div class="acc-body-inner">${it.a}</div></div></div>
        </div>`).join("")}
    </div>
  </div>`;
}
function renderCode(b, i) {
  const ui = UI();
  return `<div class="block" data-block="${i}">
    ${b.label ? '<div class="block-label">' + escHtml(b.label) + '</div>' : ''}
    ${b.heading ? '<h3>' + b.heading + '</h3>' : ''}
    <div class="prompt-grid single">
      <div class="prompt-card">
        <div class="pc-head"><div class="pc-label">${escHtml(b.title || "Prompt")}</div>
          <button class="pc-copy" data-copy="${escAttr(b.text)}">${ui.copy}</button></div>
        <div class="pc-text">${escHtml(b.text)}</div>
      </div>
    </div>
  </div>`;
}
function renderPromptGrid(b, i) {
  const ui = UI();
  return `<div class="block" data-block="${i}">
    ${b.label ? '<div class="block-label">' + escHtml(b.label) + '</div>' : '<div class="block-label">' + ui.tryIt + '</div>'}
    ${b.heading ? '<h3>' + b.heading + '</h3>' : ''}
    <div class="prompt-grid ${b.items.length === 1 ? 'single' : ''}">
      ${b.items.map(it => `<div class="prompt-card">
        <div class="pc-head"><div class="pc-label">${escHtml(it.label || "Prompt")}</div>
          <button class="pc-copy" data-copy="${escAttr(it.text)}">${ui.copy}</button></div>
        <div class="pc-text">${escHtml(it.text)}</div>
      </div>`).join("")}
    </div>
  </div>`;
}
function renderCompare(b, i) {
  const ui = UI();
  return `<div class="block" data-block="${i}" data-kind="ba">
    ${b.label ? '<div class="block-label">' + escHtml(b.label) + '</div>' : ''}
    ${b.heading ? '<h3>' + b.heading + '</h3>' : ''}
    <div class="ba-toggle">
      <button class="ba-btn active" data-tab="bad">${ui.vague}</button>
      <button class="ba-btn" data-tab="good">${ui.sharp}</button>
    </div>
    <div class="ba-panel active" data-panel="bad">
      <div class="label-row"><span class="tag">prompt</span></div>
      <div class="ba-prompt">${escHtml(b.badPrompt)}</div>
      <div class="label-row"><span class="tag">${state.lang === "en" ? "result" : "kết quả"}</span></div>
      <div class="ba-response"><div class="meta">${b.badNote || (state.lang === "en" ? "Generic, no audience, no constraints." : "Chung chung, không đối tượng, không giới hạn.")}</div>${escHtml(b.badResponse)}</div>
    </div>
    <div class="ba-panel" data-panel="good">
      <div class="label-row"><span class="tag good">prompt</span></div>
      <div class="ba-prompt">${escHtml(b.goodPrompt)}</div>
      <div class="label-row"><span class="tag good">${state.lang === "en" ? "result" : "kết quả"}</span></div>
      <div class="ba-response good"><div class="meta">${b.goodNote || (state.lang === "en" ? "Specific, scoped, useful." : "Cụ thể, có giới hạn, dùng được.")}</div>${escHtml(b.goodResponse)}</div>
    </div>
  </div>`;
}
function renderTable(b, i) {
  return `<div class="block" data-block="${i}">
    ${b.label ? '<div class="block-label">' + escHtml(b.label) + '</div>' : ''}
    ${b.heading ? '<h3>' + b.heading + '</h3>' : ''}
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr>${b.headers.map(h => '<th>' + h + '</th>').join("")}</tr></thead>
      <tbody>${b.rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join("") + '</tr>').join("")}</tbody>
    </table></div>
  </div>`;
}
function renderCards(b, i) {
  const cols = b.cols || Math.min(b.items.length, 4);
  return `<div class="block" data-block="${i}">
    ${b.label ? '<div class="block-label">' + escHtml(b.label) + '</div>' : ''}
    ${b.heading ? '<h3>' + b.heading + '</h3>' : ''}
    <div class="cards cols-${cols}">
      ${b.items.map((it, j) => `<div class="card">
        <div class="c-num">${it.num || pad(j + 1)}</div>
        <div class="c-title">${it.title}</div>
        <div class="c-body">${it.body}</div>
      </div>`).join("")}
    </div>
  </div>`;
}
function renderTimeline(b, i) {
  return `<div class="block" data-block="${i}">
    ${b.label ? '<div class="block-label">' + escHtml(b.label) + '</div>' : ''}
    ${b.heading ? '<h3>' + b.heading + '</h3>' : ''}
    <div class="timeline">
      ${b.steps.map((st, j) => `<div class="step">
        <div class="step-num">${pad(j + 1)}</div>
        <div class="step-title">${st.title}</div>
        <div class="step-body">${st.body}</div>
      </div>`).join("")}
    </div>
  </div>`;
}
function renderTiers(b, i) {
  return `<div class="block" data-block="${i}">
    ${b.label ? '<div class="block-label">' + escHtml(b.label) + '</div>' : ''}
    ${b.heading ? '<h3>' + b.heading + '</h3>' : ''}
    <div class="tier-cards">
      ${b.tiers.map((t, j) => `<div class="tier">
        <div class="tier-n">— Tier ${j + 1}</div>
        <div class="tier-t">${t.title}</div>
        <div class="tier-b">${t.body}</div>
        ${t.stat ? '<div class="tier-stat">' + t.stat + '</div>' : ''}
      </div>`).join("")}
    </div>

}
function renderQuiz(b, i, sess) {
  const ui = UI();
  const letters = ["A", "B", "C", "D", "E"];
  return `<div class="block" data-block="${i}">
    <div class="block-label">${ui.quickCheck}</div>
    <h3>${b.heading || (state.lang === "en" ? "One quick check." : "Một câu hỏi nhanh.")}</h3>
    <div class="quiz" data-quiz="${sess.id}-${i}">
      <p class="q">${b.q}</p>
      <div class="options">
        ${b.options.map((o, j) => `<button class="opt" data-correct="${o.correct ? "1" : "0"}">
          <span class="letter">${letters[j]}</span><span>${o.t}</span><span class="mark"></span>
        </button>`).join("")}
      </div>
      <div class="explain">${b.explain}</div>
    </div>
  </div>`;
}
function renderChecklist(b, i, sess) {
  return `<div class="block" data-block="${i}">
    ${b.label ? '<div class="block-label">' + escHtml(b.label) + '</div>' : ''}
    ${b.heading ? '<h3>' + b.heading + '</h3>' : ''}
    <div class="checklist" data-checklist="${sess.id}-${i}">
      ${b.title ? '<div class="cl-title">' + escHtml(b.title) + '</div>' : ''}
      <ul>${b.items.map((it, j) => {
        const k = sess.id + "-" + i + "-" + j;
        const checked = state.checks[k] ? "checked" : "";
        return '<li class="' + checked + '" data-k="' + k + '">' + it + '</li>';
      }).join("")}</ul>
    </div>
  </div>`;
}
function renderRoleBlocks(b, i) {
  const ui = UI();
  return `<div class="block" data-block="${i}">
    ${b.label ? '<div class="block-label">' + escHtml(b.label) + '</div>' : ''}
    ${b.heading ? '<h3>' + b.heading + '</h3>' : ''}
    ${b.intro ? '<div class="body" style="margin-bottom:24px;">' + b.intro + '</div>' : ''}
    ${b.roles.map((r, j) => `<div class="role-block ${j === 0 ? 'open' : ''}">
      <div class="rb-head"><h4>${r.title}</h4><div class="rb-tog"></div></div>
      <div class="rb-body"><div><div class="rb-inner">
        ${r.prompts.map(p => `<div class="prompt-card">
          <div class="pc-head"><div class="pc-label">${escHtml(p.label)}</div>
            <button class="pc-copy" data-copy="${escAttr(p.text)}">${ui.copy}</button></div>
          <div class="pc-text">${escHtml(p.text)}</div>
        </div>`).join("")}
      </div></div></div>
    </div>`).join("")}
  </div>`;
}
function renderCheat(b, i) {
  return `<div class="block" data-block="${i}">
    <div class="cheat">
      <div class="cheat-head">
        <h3>${b.title}</h3>
        <div class="sub">${b.sub}</div>
      </div>
      <div class="cheat-grid">
        ${b.items.map((it, j) => `<div class="cheat-item">
          <div class="ch-n">[${pad(j + 1)}]</div>
          <div class="ch-t">${it.title}</div>
          <div class="ch-b">${it.body}</div>
        </div>`).join("")}
      </div>
    </div>
  </div>`;
}

/* ----- session bindings ----- */
function bindSession(sess, idx) {
  $$("[data-route]").forEach(el => el.addEventListener("click", () => navigate(el.dataset.route)));
  $$(".acc-head").forEach(el => el.addEventListener("click", () => el.parentElement.classList.toggle("open")));
  $$(".role-block .rb-head").forEach(el => el.addEventListener("click", () => el.parentElement.classList.toggle("open")));
  $$(".pc-copy").forEach(btn => {
    btn.addEventListener("click", async () => {
      const t = btn.dataset.copy;
      try { await navigator.clipboard.writeText(t); } catch (e) { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); }
      const card = btn.closest(".prompt-card");
      card.classList.add("copied");
      const o = btn.textContent;
      btn.textContent = T("copied");
      setTimeout(() => { card.classList.remove("copied"); btn.textContent = o; }, 1400);
    });
  });
  $$(".ba-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const block = btn.closest("[data-kind=ba]");
      $$(".ba-btn", block).forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const w = btn.dataset.tab;
      $$(".ba-panel", block).forEach(p => p.classList.toggle("active", p.dataset.panel === w));
    });
  });
  $$(".quiz").forEach(q => {
    const opts = $$(".opt", q);
    opts.forEach(o => {
      o.addEventListener("click", () => {
        if (q.classList.contains("answered")) return;
        q.classList.add("answered");
        opts.forEach(x => {
          if (x.dataset.correct === "1") { x.classList.add("correct"); $(".mark", x).textContent = "✓"; }
          else if (x === o) { x.classList.add("wrong"); $(".mark", x).textContent = "×"; }
          else x.classList.add("wrong");
        });
      });
    });
  });
  $$(".checklist li").forEach(li => {
    li.addEventListener("click", () => {
      li.classList.toggle("checked");
      state.checks[li.dataset.k] = li.classList.contains("checked");
      save();
    });
  });
  const btn = $("[data-action]");
  if (btn) {
    btn.addEventListener("click", () => {
      state.completed[sess.id] = true; save();
      const n = btn.dataset.next;
      if (n) navigate(n);
      else { renderTopbar(); renderSidebar(); }
    });
  }
}

/* ----- topbar ----- */
function bindTopbar() {
  $(".sidebar-toggle").addEventListener("click", (e) => { e.preventDefault(); state.sidebarOpen = !state.sidebarOpen; save(); applySidebar(); });
  $$(".lang-toggle .lang-opt").forEach(el => el.addEventListener("click", () => { state.lang = el.dataset.lang; save(); render(); }));
  $("#print-btn").addEventListener("click", () => window.print());
  // Brand → home
  $("#brand-home").addEventListener("click", (e) => { e.preventDefault(); navigate("home"); window.scrollTo({ top: 0, behavior: "smooth" }); if (isMobile()) { state.sidebarOpen = false; save(); applySidebar(); } });
  // Backdrop → close sidebar
  $("#sidebar-backdrop").addEventListener("click", () => { state.sidebarOpen = false; save(); applySidebar(); });
  // Close drawer on Escape
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.sidebarOpen && isMobile()) { state.sidebarOpen = false; save(); applySidebar(); } });
  // Re-apply layout on resize (mobile <-> desktop transitions)
  let rTimer;
  window.addEventListener("resize", () => { clearTimeout(rTimer); rTimer = setTimeout(applySidebar, 120); });
}

/* ----- FAB bindings ----- */
function bindFab() {
  $("#fab-top").addEventListener("click", () => { window.scrollTo({ top: 0, behavior: "smooth" }); });
  $("#fab-home").addEventListener("click", () => { navigate("home"); window.scrollTo({ top: 0, behavior: "instant" }); });
  // Show / hide on scroll
  let ticking = false;
  window.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const fab = $("#fab");
      if (fab) fab.classList.toggle("visible", window.scrollY > 240);
      ticking = false;
    });
  }, { passive: true });
}

/* ----- init ----- */
load();
state.route = parseRoute();
// On mobile, always start with sidebar closed (it's a drawer)
if (window.matchMedia("(max-width: 900px)").matches) state.sidebarOpen = false;
window.addEventListener("DOMContentLoaded", () => { bindTopbar(); bindFab(); render(); });
</script>

 thiết kế để hạ thứ hạng những nội dung sản xuất hàng loạt, thiếu chuyên môn và trải nghiệm thực tế. Đáng chú ý, vào năm 2022, Google đã bổ sung yếu tố \"Trải nghiệm\" (Experience) vào bộ tiêu chí đánh giá chất lượng E-E-A-T của mình.</p>\n<p>Điều quan trọng cần làm rõ là Google không hề phạt nội dung chỉ vì nó được tạo bởi AI; thay vào đó, họ nhắm đến những nội dung rỗng và thiếu giá trị. Điều này có nghĩa là việc sử dụng AI để nghiên cứu rồi viết nên một bài viết có trải nghiệm thực tế là hoàn toàn ổn, trong khi việc dùng AI để sản xuất hàng loạt nội dung vô hồn sẽ không mang lại hiệu quả.</p>\n<p>Tất nhiên, một số người có thể cho rằng họ bị đánh giá dựa trên số lượng nội dung. Trong trường hợp này, cần nhìn nhận rằng khi mọi đối thủ đều có thể sản xuất số lượng lớn nhờ AI, thì số lượng không còn là một lợi thế cạnh tranh. Thứ thực sự tạo nên sự khác biệt chính là trải nghiệm và góc nhìn độc đáo của con người. Cần thừa nhận rằng hiện tại vẫn chưa có nhiều số liệu cụ thể về hiệu quả chuyển đổi của cách tiếp cận này, nhưng xu hướng chung là khá rõ ràng.</p>\n<p>Tóm lại, việc tận dụng AI một cách hiệu quả và có trách nhiệm đòi hỏi sự cân bằng: để AI hỗ trợ những công việc mà nó làm tốt, đồng thời giữ lại những yếu tố con người không thể thay thế. Đây chính là chìa khóa để tạo ra nội dung vừa hiệu quả vừa bền vững trong kỷ nguyên số.</p>"}, {"num": 7, "title": "Góc nhìn đa chiều và lời kết", "html": "<p>Để có một cái nhìn toàn diện và khách quan, điều quan trọng là chúng ta cần xem xét vấn đề từ nhiều góc độ khác nhau. Mặc dù luận điểm \"viết cho con người, đừng giống AI\" mang lại nhiều giá trị, nhưng cũng có những khía cạnh và giới hạn mà chúng ta cần lưu ý. Trong chương cuối này, chúng ta sẽ cùng phân tích năm góc nhìn đa chiều.</p>\n<p><strong>Thứ nhất, không phải mọi nội dung đều cần giọng văn cá nhân.</strong> Cần lưu ý rằng những nguyên tắc trong cuốn sách này phù hợp nhất với loại nội dung mà người đọc cân nhắc có nên đọc tiếp hay không, chẳng hạn như bài quan điểm, nội dung thương hiệu hay bài bán hàng. Tuy nhiên, đối với những nội dung mang tính chức năng — như tài liệu kỹ thuật, hướng dẫn sử dụng hay điều khoản dịch vụ — thì sự rõ ràng, ngắn gọn và nhất quán lại quan trọng hơn. Trong những trường hợp này, văn phong trung lập của AI thực ra lại phù hợp.</p>\n<p><strong>Thứ hai, nội dung dài không hề \"lỗi thời\".</strong> Một điều cần nhấn mạnh là việc người đọc e ngại nội dung dài không đồng nghĩa với việc chúng ta nên viết ngắn. Trên thực tế, nhiều nội dung dài và chuyên sâu vẫn thu hút được lượng độc giả lớn. Vấn đề không nằm ở độ dài, mà nằm ở giá trị mà mỗi câu chữ mang lại. Do đó, mục tiêu nên là tạo ra nội dung có giá trị, bất kể độ dài.</p>\n<p><strong>Thứ ba, chính những \"dấu ấn con người\" cũng có thể bị mô phỏng.</strong> Đây là một điểm đáng suy ngẫm. Khi ngày càng nhiều người hướng dẫn AI cách viết \"giống con người\" hơn — chẳng hạn như thêm câu ngắn hay những lời thú nhận — thì chính những kỹ thuật này cũng có thể trở thành một dấu hiệu mới của nội dung AI. Vì vậy, điều thực sự khó có thể mô phỏng không phải là kỹ thuật, mà là những trải nghiệm sống chân thực của mỗi cá nhân. Đây là một lưu ý quan trọng để chúng ta không biến mọi thứ thành công thức.</p>\n<p><strong>Thứ tư, vấn đề minh bạch về việc sử dụng AI.</strong> Đây là một khía cạnh khá phức tạp về mặt đạo đức. Một mặt, các nghiên cứu (bao gồm 16 thí nghiệm với hơn 27.000 người tham gia) cho thấy việc công khai sử dụng AI có thể khiến nội dung bị đánh giá thấp hơn. Mặt khác, sự minh bạch lại là một giá trị quan trọng. Có thể nói, đây là một bài toán chưa có lời giải hoàn hảo, và mỗi người cần tự cân nhắc dựa trên hoàn cảnh cụ thể của mình.</p>\n<p><strong>Thứ năm, cần thận trọng với chính luận điểm này.</strong> Để khách quan, cũng cần thừa nhận rằng phần lớn bằng chứng về việc \"người đọc đang quay lưng với nội dung AI\" vẫn đang ở giai đoạn đầu. Việc \"slop\" được chọn là Từ của Năm cho thấy thái độ đang thay đổi, nhưng thái độ không phải lúc nào cũng dẫn đến hành vi. Hoàn toàn có khả năng người đọc sẽ dần quen với nội dung AI theo thời gian. Đây là một yếu tố mà chúng ta cần tiếp tục theo dõi.</p>\n<h3>Lời kết</h3>\n<p>Qua bảy chương, chúng ta đã cùng nhau tìm hiểu về sự trỗi dậy của nội dung AI, tâm lý người đọc, cách nhận diện nội dung AI, những nguyên tắc vàng để viết nội dung thu hút, cũng như cách tận dụng AI một cách hiệu quả và có trách nhiệm.</p>\n<p>Có thể nói, trí tuệ nhân tạo vừa là cơ hội, vừa là thách thức đối với những người làm nội dung. Một mặt, nó giúp chúng ta tiết kiệm thời gian và nâng cao hiệu suất. Mặt khác, nó cũng đòi hỏi chúng ta phải không ngừng nỗ lực để giữ gìn những giá trị con người trong từng câu chữ.</p>\n<p>Suy cho cùng, chìa khóa của thành công không nằm ở việc lựa chọn giữa AI và con người, mà nằm ở khả năng kết hợp hài hòa cả hai. Bằng cách tận dụng sức mạnh của AI đồng thời phát huy sự sáng tạo và dấu ấn riêng của con người, chúng ta hoàn toàn có thể tạo ra những nội dung vừa hiệu quả, vừa chạm đến trái tim người đọc. Đó chính là con đường bền vững trong kỷ nguyên số ngày nay.</p>"}], "en_h": [{"num": 1, "title": "The crowd in Dublin", "html": "<p>On Halloween night in 2024, thousands of people gathered in central Dublin to watch a parade. They wore costumes, lined O'Connell Street, stood shivering in the wind, and waited for the giant puppets someone had promised would come through at seven o'clock. Seven came and went. Then eight. The police had to post a notice online: there is no parade tonight, there was never going to be one.</p>\n<p>The listing all those people believed had been generated by a website run out of Pakistan — content written by AI, laid out cleanly, stuffed with enough keywords to climb to the top of Google and skim some ad revenue. Not a line of it was true. And yet an entire city gave up its evening to stand around waiting for something that didn't exist.</p>\n<p>I start here because the whole book is in that one scene. Machines can now produce things that <em>look</em> trustworthy, in infinite quantity, for almost nothing. People are starting to pay for that. And — this is the interesting part — people are starting to push back.</p>\n<h3>When a whole culture names what it hates</h3>\n<p>Late in 2025, the two oldest authorities on the English language — Merriam-Webster and the American Dialect Society — independently chose the same Word of the Year: <em>slop</em>. The original meaning is the soft, wet leftovers you pour into a pig trough.</p>\n<p>The internet borrowed that ugly little word for something very specific: content churned out by AI in bulk, slick on the surface and hollow underneath, made to harvest clicks rather than help anyone. When a whole culture reaches for \"pig swill\" to describe what it reads all day, that's not a matter of taste anymore. It's a verdict.</p>\n<p>What's worth noticing about this swill is that three traits always travel together. It <em>looks</em> fine — correct spelling, complete thoughts, perfectly coherent at a glance. It costs its maker a few seconds but costs the reader real time to get through, and then more time to realize there was nothing in it. And it can be produced by the thousand — one person, one morning, before lunch.</p>\n<p>That middle trait is the root of the anger. Readers feel robbed, and the thing being stolen is time: they spent something real — their attention — and got back something nobody actually thought.</p>\n<h3>More of it than you'd think</h3>\n<p>The sense that it's <em>everywhere</em> isn't a feeling. A few slices have numbers attached.</p>\n<p>A <em>New York Times</em> investigation in early 2026 estimated that roughly four in ten of the videos YouTube recommends to children are AI-generated slop. On Deezer, the music platform, there was a point when as many as seven in ten streams of AI-made tracks were fraudulent — bots playing music for bots, to skim royalties. And in the workplace, a <em>Harvard Business Review</em> study found that four in ten employees had been handed what they called \"workslop\" — work that looks finished but quietly shoves the hard part onto whoever receives it, costing an average of two hours each time to sort out.</p>\n<p>Notice the common thread. In every case, the cost shifts from the maker to the receiver. That is, more or less, the definition of pollution. Slop is pollution in the attention economy — and like any pollution, it makes people start building fences.</p>\n<h3>Three fences going up</h3>\n<p>Readers are learning to smell it. A 2026 reader skims two sentences, feels something is \"off\" — the even, over-polished tone, not a single human burr anywhere — and closes the tab. They can't prove anything. They just leave. (What exactly they're smelling is Chapter 3.)</p>\n<p>Google is tightening too. It says plainly that its ranking systems try to demote content that's mass-produced and thin on real expertise and experience, and to reward writing made \"for people, not for search engines.\" In 2022 it added a whole letter to its quality criteria: the extra <strong>E</strong> in E-E-A-T, for <em>Experience</em> — first-hand. One nuance we'll return to in Chapter 6: Google says it does <em>not</em> penalize content just for being AI-made. It penalizes hollow content. AI slop just tends to be hollow.</p>\n<p>And the people who do this for a living are putting up gates. Editors, clients, judging panels are starting to ask a small, sharp question: <em>who actually wrote this?</em> As the next chapter shows, that question alone — the mere suspicion of \"this might be a machine\" — is enough to drag down a piece's value, even when it's good.</p>\n<h3>The wrongly accused suspect: length</h3>\n<p>A belief is spreading that people are now too lazy to read anything long. There's something to it, but put that way it's wrong, and the wrongness matters more than almost anything else in this chapter.</p>\n<p>The truth isn't that people hate long writing. The truth is that AI made <em>going long</em> free, so length stopped meaning anything. It used to be that a 3,000-word piece quietly signaled effort — length was evidence somebody bothered. Now a single prompt produces 3,000 words in six seconds. Length proves nothing. Worse, it's become a burden: 3,000 hollow words are 3,000 words stealing a reader's time.</p>\n<p>So people aren't fleeing <em>length</em>. They're fleeing <em>dilution</em>. Hand them something long where every paragraph gives them something new, and they'll read to the last line. What they bail on is the piece that should've been three sentences and got stretched to three pages — the writing that spends ten words to say what one would.</p>\n<p>The enemy isn't length. The enemy is dilution. Writing for humans doesn't mean writing short — it means never wasting a sentence of the reader's time.</p>\n<p>The next chapter is about <em>why</em> dilution and the machine-smell make a reader's mind go flat — and why, strangely, even something accurate and good gets marked down the moment a reader suspects a machine wrote it.</p>"}, {"num": 2, "title": "Three reasons people close the tab", "html": "<p>Three forces pull a reader away from machine prose. They have nothing to do with each other, and together they make a wall. Understand all three and you'll know what you're actually fighting — instead of polishing sentences in the dark.</p>\n<h3>First: nobody reads. People scan.</h3>\n<p>This one bruises a writer's ego, but it's been measured with machines for nearly twenty years. The Nielsen Norman Group puts eye-tracking gear on readers, and the finding is blunt: on a screen, people don't read. They scan.</p>\n<p>A few numbers so you can picture who you're up against. The average visit to a page lasts under a minute. In that time, a reader gets through, at most, about a quarter of the words on it. And their eyes don't move evenly — they trace an F: across most of the first line, down a little, across a shorter stretch, then straight down the left margin, snagging two or three words at the start of each line.</p>\n<p>The cruel, clear consequence: the third word on a line is already seen far less than the first two. Your best stuff has to sit right at the front — front of the headline, front of the paragraph, front of every line — because that's the only place a reader's eye is guaranteed to land.</p>\n<p>Now look at machine prose. It opens paragraphs with padding: \"It's important to note that…\", \"In the context of…\". It throws its two or three most valuable words in the bin and then fumbles toward the meat in the middle of the sentence. The F-pattern scanner catches the empty padding, finds nothing worth stopping for, and moves on. The piece may be perfectly complete. But complete-with-the-meat- hidden is, to a scanner, invisible.</p>\n<p>You're not writing for a reader. You're writing for a scanner — and you have to win them in the first few words, or there won't be any next ones.</p>\n<h3>Second: the human name on the byline is worth more than you think</h3>\n<p>This is the most counterintuitive finding, and the strongest card in the whole book.</p>\n<p>A group of researchers ran sixteen experiments with more than twenty-seven thousand people. They gave participants creative writing — short essays, stories — and asked them to rate it. The trick: the passages were <em>identical</em> across groups. The only thing that changed was whether people were told the text was written by AI or by a person.</p>\n<p>The result held, stubbornly: the moment people believed AI had a hand in it, they scored it lower. On average about 6.2% lower, for the very same words.</p>\n<p>The good part is <em>why</em>. The researchers ruled out the easy explanations: the drop wasn't because people found the writing lower-quality, or harder to follow, or less moving, or because they hated AI in general. The real mechanism was subtler. It was <em>authenticity</em>. Knowing a machine was involved made the passage feel \"less like it came from a real person\" — and that lost sense of authenticity was what pulled the score down.</p>\n<p>Stop on that for a second, because it flips the usual intuition:</p>\n<p>Readers don't punish AI writing because it's bad. They punish it because it's nobody's. The same sentence, with a person's name on it, has value; with a machine's label on it, it loses value. What readers are actually paying for isn't good prose — it's the feeling that a human being stands behind it.</p>\n<p>There's a variant of this that's colder still. A separate study of 433 people found what's called a truth-falsity crossover: slapping an \"AI\" label on <em>true</em> information made people trust it less, while the same label on <em>false</em> information made them trust it more. In other words, the \"AI\" label isn't a reliable quality signal at all — it's an emotional kick, and it kicks in random directions. (Whether you should <em>disclose</em> using AI is genuinely thorny; I've saved it for the last chapter.)</p>\n<p>The lesson for a writer isn't \"hide that you used AI.\" It's that what readers crave is the trace of a human. If your writing doesn't carry that trace — a point of view, an experience, a choice only <em>you</em> would make — it'll <em>feel</em> machine-made even if you typed every word by hand. And as we just saw, \"feels machine-made\" is enough to get punished.</p>\n<h3>Third: the brain rewards surprise and punishes the predictable</h3>\n<p>The last reason comes from how the brain works. The brain is a prediction engine: it's constantly guessing the next word, the next idea. When what arrives matches the guess, it saves energy by tuning out. When what arrives veers off the prediction in a meaningful way, it perks up.</p>\n<p>This is precisely the Achilles' heel of machine prose. A language model, by design, picks the <em>most predictable</em> word — at bottom it's a machine for computing the probability of the next token, and averaging a billion sentences is the thing it's best at in the world. The output is smooth, correct, and predictable to the last turn. To a brain that's hungry for surprise, that's a sedative.</p>\n<p>Good writers do the opposite, almost on instinct. They drop a word you didn't expect. A comparison hauled in from some unrelated world. A clipped little sentence right after three long ones. Each small swerve is a tiny hit of dopamine, just enough to keep a reader's eyes there one more line. Human writing tends to lurch. Machine writing tends to lie flat. (Engineers have names for these two things, and, amusingly, they're exactly what AI-detector tools try to measure: how <em>surprising</em> the words are, and how much the sentence rhythm <em>varies</em>.)</p>\n<h3>Three forces, one way out</h3>\n<p>The three are independent, but here's the lovely thing: they all point to the same exit.</p>\n<p>Write so the meat sits up front, and you beat the scanner. Write so a real person stands behind every sentence, and you clear the penalty that lands on anything that's \"nobody's.\" Write with enough surprise to keep a brain awake. Do all three at once and you're not serving three different masters — you're doing one thing.</p>\n<p>What that one thing is, Chapter 4 will show. But first we have to see the enemy's face — to name the <em>smell</em> a reader catches before they bail. That's next.</p>"}, {"num": 3, "title": "The smell of the machine", "html": "<p>Before you can write for humans, you have to see clearly what you're trying to avoid. And the first thing to understand is this: machine prose isn't \"bad\" in the misspelled, clumsy sense. The opposite. It's <em>too</em> clean. Its smell isn't the smell of error — it's the smell of a lifeless perfection.</p>\n<p>Let me put up a guardrail first, because this chapter is easy to misuse. No single sign below, on its own, is proof. Good writers use em-dashes too. Real people sometimes do say \"it's important to note.\" These signs only mean something when several of them <em>cluster</em> and the sense of a person has been <em>drained out</em>. Read this like a doctor reading symptoms, not a cop reading an arrest warrant.</p>\n<p>The smell comes from four places. Start with the easiest to catch.</p>\n<h3>The words that smell of the model</h3>\n<p>After ChatGPT went mainstream in late 2022, linguists measured something strange: a handful of once-rare words spiked — some up ninefold or tenfold, some as much as twenty-five times — in academic writing, and the rise spilled into spoken educational content too. In English, these are words like <em>delve, meticulous, underscores, crucial, tapestry, realm, testament</em>. They became an accidental fingerprint.</p>\n<p>It's not that these words are banned. The problem is density and emptiness. When every paragraph carries a <em>delve</em> propping up a <em>crucial</em> propping up a <em>testament to</em>, the reader smells the mold.</p>\n<h3>The hollow sentence frames</h3>\n<p>Machine prose is hooked on a few sentence templates — they're safe, smooth, and everywhere in its training data. You'll spot them instantly.</p>\n<p>The generalizing opener — \"In today's fast-paced world…\", \"In an increasingly digital age…\" — the kind of opening you find in every other blog post, that says nothing and just clears its throat. The fake- emphasis padding — \"It's important to note that…\" — which is almost always stronger deleted. The \"it's not just X, it's Y\" frame, which sounds profound but is usually just a way to take up room; <em>not just</em> is among the phrases analysts flag as most overused in AI text. The piled-up correlatives — \"on the one hand… on the other,\" \"not only… but also\" — one is graceful, three in a paragraph is a machine. And the fake-insight sentence: \"This reveals a deeper truth…\", followed by something everyone already knew.</p>\n<h3>The immortal five-paragraph skeleton</h3>\n<p>The hardest fingerprint to hide isn't in the words — it's in the <em>shape</em> of the piece. Machine prose has a stiff skeleton: a generalizing intro with a sentence telegraphing that three things are coming; exactly three body points, never two, never four, always three; each point a topic sentence, a few lines of development, a wrap-up line; then a conclusion that opens with \"In conclusion\" and repeats the same three points verbatim.</p>\n<p>The rule-of-three is the worst tell. The machine splits everything into three — three reasons, three steps, three benefits — with bullets lined up like soldiers. But real life rarely resolves into exactly three. When a piece <em>always</em> lands on three and <em>always</em> has bullets, that's a template, not a thought.</p>\n<p>You're allowed to call me out here: this very book splits things into \"three forces.\" Fair. The difference is that the number comes <em>after</em> the thinking, not <em>before</em>. I found three forces because there happened to be three; if there'd been four I'd have said four. The machine works the other way — it decides \"there must be three\" first, then goes hunting for filler to fill them.</p>\n<h3>The flatness</h3>\n<p>The last layer is the subtlest, and it's the one the ear catches before the mind can analyze it.</p>\n<p>Human writing lurches. A long sentence, sprawling, carrying clause after clause, and then — stop. A two-word sentence. A real writer changes sentence length with their own mood, drops in a question, leaves a thought hanging, breaks a line because they wanted to.</p>\n<p>Machine writing lies flat. Every sentence runs roughly fifteen to twenty-five words, similar in shape, even as a metronome. No sentence cut short out of impatience, no sentence run long out of fascination. And that <em>evenness</em>, oddly, is the most unnatural thing of all — because human feeling is never even.</p>\n<h3>Why spotting it by eye still isn't enough</h3>\n<p>You might think that, having learned these four layers, you'll catch it on sight. The truth is humbler, and I have to say it plainly so you don't get cocky.</p>\n<p>In one study, 94% of undergraduate exams written by ChatGPT slipped past the graders. The editorial board of a linguistics journal — people who read for a living — couldn't reliably tell which abstracts were human and which were machine. Purpose-built detectors do better than people, landing somewhere between 80% and 98% accuracy, but they're black boxes: even their makers aren't sure which features they rely on, so they're both error-prone and easy to fool.</p>\n<p>And here's the most important twist in the whole chapter. The em-dash — the punctuation most often branded \"the ChatGPT tell\" — is actually a mark of <em>skilled</em> writers. People started calling it the \"ChatGPT hyphen\" and wrongly accusing countless real authors. Think about what that means: if even humans mistake good writing for machine writing, then chasing \"beat the detector\" is a race you've lost at the starting line.</p>\n<h3>So what's this chapter for?</h3>\n<p>Not to turn you into an AI detective. To help you hear the template in <em>your own</em> writing — even when you typed every word by hand. The four layers are a mirror. Reread your draft and ask one question: does this smell of the template? If it does, congratulations — you've found exactly the thing to fix.</p>\n<p>How to fix it is the next chapter.</p>"}, {"num": 4, "title": "Write like you were there", "html": "<p>The last chapter gave us three forces to beat: the scanner, the demand for authenticity, the brain's hunger for surprise. This chapter turns them into things you can actually do. There are seven, but don't treat them as \"tips\" — they're just seven ways to give a sentence back the thing a machine can't: a specific human, at a specific moment, with something to lose.</p>\n<p><strong>Be so specific no one else could have written it.</strong> This is the root principle; the other six are variations on it. The oldest advice in the trade is still the truest — <em>show, don't tell</em> — and its soul is specificity. Don't write \"a bird,\" write \"a grackle.\" Don't write \"shoes,\" write \"the white sneakers with the heel worn down after that July rain.\" Why does this beat a machine? Because a machine pulls toward the average, and the average of all shoes is \"shoes.\" Those July sneakers can only come from someone who was actually there. The more particular the detail, the deeper the human trace — and that's exactly what readers are starving for. The test is short: read a sentence and ask, <em>could this sit in ten thousand other people's writing?</em> If yes, it isn't yours yet.</p>\n<p><strong>Put the meat up front.</strong> People scan, they don't read, so don't clear your throat. \"There's one thing marketers tend to overlook, and that's page load speed\" and \"Page load speed is the thing marketers forget most\" say the same thing — but the second puts \"page load speed\" where the eye is guaranteed to land, while the first makes the reader wade through \"There's one thing…\" before reaching anything worth having. The scanner won't wade. They'll skim past.</p>\n<p><strong>Make the rhythm lurch.</strong> The brain rewards surprise, and an even rhythm is the most predictable thing there is. The fix is almost cheating: vary your sentence length on purpose. A long sentence to carry the reader along, then a short one to land it. Like that. Read your draft out loud — if your breathing is even, like counting beats, the prose is flat. Drop in a three-word sentence. Split a long one in two. Ask a question. That lurch is the sound of a person thinking, not a machine outputting.</p>\n<p><strong>Have a point of view — and be willing to be wrong.</strong> Machines are tuned to be balanced, harmless, inoffensive. That's why their prose reads like a press release from a company afraid of being sued. \"There are many different views on this, and each approach has its pros and cons\" is a sentence that bets nothing. \"I think most content courses teach this wrong, and here's where I think they go astray\" is a sentence that <em>could be wrong</em> — and that capacity to be wrong is the clearest sign a human is standing behind it, putting their name on the line.</p>\n<p><strong>Tell, don't list.</strong> Bullet points are a machine's native tongue. The human brain is wired for story: a character, a want, an obstacle, a consequence. A list of \"5 benefits of waking up early\" slides straight out of memory; \"my boss gets up at 5 a.m., and here's what I noticed after a month of trying to copy him\" sticks. I'm not saying ditch bullets — sometimes a list is the right tool. I'm saying don't let a list <em>stand in for</em> thinking. If an idea deserves to be told as a story, don't crush it into a bullet.</p>\n<p><strong>Leave a human burr.</strong> Machine prose is unnaturally clean. Human writing has texture: an aside, a confession, a moment of poking fun at yourself. A real hesitation — \"I'm still not sure about what I'm about to say, but…\". A scrap of life — <em>writing this at 1 a.m., third coffee.</em> These burrs aren't flaws; they're proof of life. But be careful: the burr has to be <em>real</em>, not performed. A staged \"spontaneous moment\" gives you away worse than flat machine prose does. So the safest move isn't to <em>add</em> fake burrs — it's to <em>stop sanding off</em> the real ones your first draft already had.</p>\n<p><strong>Write to one person, not to a \"target audience.\"</strong> Machines write to \"users,\" to \"valued customers,\" to \"dear readers\" — an abstract crowd. Sticky writing is written to exactly one person. Picture a specific friend, with a name, that you're texting, and write to them. The voice warms up on its own, the pronouns sort themselves out, and the press-release distance vanishes. This is why a friend's letter is always easier to read than a \"SEO-optimized\" blog post ten times its length: the letter was written for <em>you</em>, the blog post for an algorithm.</p>\n<hr>\n<p>Seven of them — but if you had to throw away six and keep one, keep this, because the other six all flow out of it:</p>\n<p><strong>Write so that no one else could have written that sentence.</strong></p>\n<p>A machine is at its best producing what anyone could have written. So anything that carries your mark — a detail you saw, a view you'll defend, a rhythm that's yours, a reader you're honestly speaking to — is ground a machine can't reach.</p>\n<p>It sounds clear enough. But a principle only comes alive when you watch it <em>fix</em> a real paragraph. That's the next chapter — the heart of the book, where we take ten paragraphs apart.</p>"}, {"num": 5, "title": "Before &amp; after", "html": "<p>This is the heart of the book. The three chapters of theory only mean something when you watch them fix a real paragraph. So here are ten fixes. In each one, the \"before\" is the ordinary, fill-the-space, machine-grade version; the \"after\" is the same information with a human behind it. Notice that both say exactly the same thing. The difference isn't the content — it's whether there's a real person in there.</p>\n<p>One confession first, so I don't commit the very sin this book condemns. The \"after\" versions below are ones I <em>built</em> to demonstrate the move — they're models, not harvested from anyone's real life. They <em>perform</em> the human trace rather than <em>carry</em> it. I'm saying so plainly because in the last chapter I'll warn you about \"manufactured spontaneity\": a lab is allowed to stage a scene, but real writing sent to real people has to draw its \"after\" from a life that actually happened — yours.</p>\n<p><strong>One — a blog intro.</strong></p>\n<blockquote><em>\"In today's digital age, content marketing plays a crucial role in the growth of every business. This article will provide you with the useful, essential information you need to optimize your content strategy effectively.\"</em></blockquote>\n<blockquote><em>\"Last month I deleted 200 of my company's blog posts. Traffic didn't drop. That's when I realized I'd been wrong about content for four years.\"</em></blockquote>\n<p>The first clears its throat for two sentences and says nothing. The second drops a real number and a confession right where the eye lands, and opens a story — the scanner can't help reading the next line.</p>\n<p><strong>Two — a coffee shop's description.</strong></p>\n<blockquote><em>\"We take pride in delivering the finest coffee experience, using premium, carefully selected beans, served in an elegant and modern space.\"</em></blockquote>\n<blockquote><em>\"We roast on-site every morning at six — so eight is when it smells best. Take the table at the back, by the window; the sun hits it till about 9:30.\"</em></blockquote>\n<p>The first is a press release: \"take pride,\" \"the finest,\" \"carefully selected\" — anonymous, unverifiable, the thing every seller says. The second has no boasting adjectives at all; it has details, and the details — six a.m., sun till 9:30 — are what make it feel high-end. And it talks to one person: <em>you</em> come in, <em>you</em> sit down.</p>\n<p><strong>Three — a post on a professional network.</strong></p>\n<blockquote><em>\"Success doesn't come from luck — it comes from persistence and relentless effort. Every failure is a valuable lesson that helps us grow. Always believe in yourself! 💪 #motivation #success\"</em></blockquote>\n<blockquote><em>\"I got rejected in the final round — third time this year. The interviewer said something I'll never forget: 'You're good. But you're interviewing like you're apologizing for being in the room.' It took me six months to admit she was right.\"</em></blockquote>\n<p>The first is universal wisdom — true, but true for everyone, so it sticks to no one. The second is specific and it stings, and notice this: it has no \"the lesson here is…\" wrap-up. It lets you draw the lesson yourself. That's respect, and it's a very human thing to offer.</p>\n<p><strong>Four — an email to a customer.</strong></p>\n<blockquote><em>\"Dear Valued Customer, We are writing to inform you that your order is currently being processed. We remain committed to providing the highest level of service and kindly ask for your patience during this time.\"</em></blockquote>\n<blockquote><em>\"Hi Sarah — your order's stuck at packing; the warehouse is short-staffed over the holiday, and I'm sorry. I've asked them to bump it up the queue — Wednesday at the latest. I'll message you the moment it ships.\"</em></blockquote>\n<p>The first hides behind the passive voice and boilerplate to <em>conceal</em> that it's late. The second names the delay, apologizes, commits to a specific day, and uses Sarah's name. Honesty plus specificity builds trust faster than any \"committed to the highest level of service\" ever will.</p>\n<p><strong>Five — a technical explanation.</strong></p>\n<blockquote><em>\"A cache is an important component that optimizes system performance by temporarily storing frequently accessed data, thereby significantly reducing response time.\"</em></blockquote>\n<blockquote><em>\"A cache is like keeping your keys by the front door. Instead of searching the whole house every time you go out (querying the database), you just grab them. The catch: change the locks but forget to swap the key by the door, and you'll grab the old one — that's a 'stale cache,' every developer's nightmare.\"</em></blockquote>\n<p>The first is correct but abstract, padded with filler. The second borrows an everyday image, and — more importantly — it tells you the <em>downside</em> too, the stale key, which a feature-pitch would quietly skip. Teaching through lived imagery is hard for a machine, because it takes a real life to borrow the image from.</p>\n<p><strong>Six — an \"About us\" page.</strong></p>\n<blockquote><em>\"Founded with a mission to create sustainable value, we relentlessly innovate to become a leading, trusted partner in our clients' success.\"</em></blockquote>\n<blockquote><em>\"We started in a garage in 2019, because the two of us were sick of the accounting software we had to use. The first version was ugly as hell. But it added up right — and that, it turned out, was all our first twelve customers wanted.\"</em></blockquote>\n<p>The first is cliché stacked on cliché, with not one fact you can hold. The second has a garage, a year, twelve customers. And it dares to admit a weakness — \"ugly as hell\" — which is the lovely paradox: the confession of a flaw <em>raises</em> trust, because it proves a real person is standing there.</p>\n<p><strong>Seven — a call to action.</strong></p>\n<blockquote><em>\"Don't miss this incredible opportunity! Sign up today to unlock your potential and elevate your experience to a whole new level!\"</em></blockquote>\n<blockquote><em>\"Twelve seats. Four left. If you're on the fence, fine — stay on the fence. Just not past Friday, because Friday I close it.\"</em></blockquote>\n<p>The first crams in \"unlock your potential,\" \"elevate,\" \"a whole new level,\" and three exclamation marks of fake energy. The second is urgent with numbers — twelve, four, Friday — and a flat, slightly blunt voice. <em>Real</em> urgency persuades better than <em>shouted</em> urgency.</p>\n<p><strong>Eight — a social caption.</strong></p>\n<blockquote><em>\"A nutritious, energizing lunch to kick off a week full of motivation! 🥗✨ #healthylifestyle #goodvibes\"</em></blockquote>\n<blockquote><em>\"This lunch is me apologizing to my stomach after three days of deadline takeout. The broccoli's a little burnt. Ate it anyway.\"</em></blockquote>\n<p>The first is an anyone-could-paste-it caption, empty hashtags, canned energy. The second has a small story and a self-deprecating ending — \"broccoli's a little burnt, ate it anyway,\" two clipped sentences landed on purpose. People stop for the real and slightly funny, not for the perfect.</p>\n<p><strong>Nine — a piece of analysis.</strong></p>\n<blockquote><em>\"AI has both advantages and disadvantages. On the one hand, it boosts productivity; on the other, it poses challenges. The important thing is to use it responsibly and in a balanced way.\"</em></blockquote>\n<blockquote><em>\"I think most of the fear about 'AI taking writing jobs' aims at the wrong target. AI isn't coming for the great writers — it's coming for the average ones, the wide middle that used to make a living writing well-enough. That middle is vanishing, and I find that both frightening and fair.\"</em></blockquote>\n<p>The first is the \"on one hand… on the other… find a balance\" machine — true to the point of empty, betting nothing. The second stakes a sharp claim and a concrete idea, \"the average writer.\" That last clause — \"both frightening and fair\" — is a personal judgment, exactly the kind of line a machine is trained to avoid.</p>\n<p><strong>Ten — the opening lines of this very book.</strong></p>\n<p>To be fair, I'll put myself on the table. Here's the first draft I <em>threw out</em> for Chapter 1:</p>\n<blockquote><em>\"In the age of artificial intelligence, creating content has never been easier. However, this also poses new challenges for content creators.\"</em></blockquote>\n<p>And here's the one I kept:</p>\n<blockquote><em>\"On Halloween night in 2024, thousands of people gathered in central Dublin to watch a parade… The parade never came, because it never existed.\"</em></blockquote>\n<p>The discarded one has every tic: \"In the age of…,\" \"never been easier,\" \"poses new challenges.\" I read it back, heard the machine, and deleted it. The one I kept opens on a true, specific story — a real place, real people fooled. A book whose own opening breaks the very thing it teaches has lost on the first line.</p>\n<h3>Don't turn this into a formula</h3>\n<p>By now you might extract a tidy rule: just add a number, a confession, and the word \"I,\" and you've got human writing. Don't. That's exactly the trap Chapter 3 warned about. The moment you turn the \"after\" column into a formula, a machine learns the formula overnight — which is a worry we'll face head-on in the last chapter.</p>\n<p>The human trace isn't the trio \"number, confession, I.\" Those are just the most <em>visible</em> ways to get it in. The deeper thing is that the \"after\" column wins because it forces the writer to actually <em>know</em> something specific, while the \"before\" column can be written knowing nothing at all. And sometimes that \"knowing\" needs no number and no \"I\" — just a way of seeing that no one else had. Like this:</p>\n<blockquote><em>\"The customer is always right.\"</em></blockquote>\n<blockquote><em>\"The customer isn't always right. They don't argue. They just don't come back.\"</em></blockquote>\n<p>No number. No \"I.\" No confession. It wins on a single turn of the angle — and that's still something a machine, trained to clutch safe sayings like \"the customer is always right,\" will dodge. So when you suspect you're chasing a formula, go back to the root question from the last chapter: <em>could anyone else have written this?</em> — not, <em>have I inserted enough numbers and confessions?</em></p>\n<p>If this whole book leaves you with one move, let it be this: take a paragraph you just wrote, and swap every boasting adjective for a number, a concrete detail, or a turned angle. That one move drags most writing from the left column to the right.</p>\n<p>The next chapter answers the most practical question of all: so are you still allowed to use AI — and how, without ending up back in the left column.</p>"}, {"num": 6, "title": "Use the machine, don't become one", "html": "<p>It would be hypocritical for a book written <em>with</em> AI to tell you not to use AI. I did use it — to look things up, to check figures, to ask \"is there a hole in this paragraph?\" The question was never whether to use it. The question is <em>where</em> you use it, and who puts the human stamp on at the end.</p>\n<p>Think of writing as a four-stage line. The first stage is <em>find and think</em>: gathering, looking up, listing the angles. The second is <em>frame</em>: ordering the ideas, hunting for holes in the argument. The third is <em>draft</em>: producing the first actual sentences. The fourth is <em>stamp it human</em>: the voice, the particular details, the point of view, the burrs — the part that makes this piece yours and no one else's.</p>\n<p>The machine is strongest at the first two stages. It's a frighteningly fast research assistant and a tireless hole-finder. At the third stage it's usable but dangerous, because that's where the prose can set into a template. And the fourth stage you never hand over. That's <em>you</em>. Most writing turns to slop from exactly one bad choice: handing that final stage — the human stamp — to the machine. Writing for humans does the reverse: use the machine hard on stages one and two, then take stage four back, without compromise.</p>\n<h3>A way of working</h3>\n<p>Here's how I do it; bend it to fit you.</p>\n<p>I write the opening myself, by hand, one paragraph, before I touch any AI — because that paragraph sets the <em>voice</em> for the whole piece, and voice is the thing the machine can't give back if you let it go first. Then I use AI to <em>widen the field</em>, not to write for me: I ask what angle I'm missing, what the strongest counter-argument is, whether any data cuts the other way. If I do have it draft something, I treat that draft as clay, not as a deliverable — raw material to beat back into shape, not something to tweak a few words on and send. And the last pass I do alone, out loud, asking each sentence two things: does it smell of the template, and could anyone else have written this? Whichever it flunks, I rewrite. That's also where I press in the numbers I know, the things I saw firsthand, the places I'm not sure — where the human stamp goes on.</p>\n<p>Put it in one line: the machine handles \"correct and complete,\" you handle \"true and yours.\" The machine gets a piece to <em>accurate</em>; only a person gets it to <em>worth reading</em>.</p>\n<h3>The \"humanizer\" trap</h3>\n<p>There's a whole market of tools promising to \"humanize\" AI text or help you \"beat the detectors.\" Avoid them, for two reasons.</p>\n<p>First, you're running the wrong race. As Chapter 3 showed, even humans confuse good writing with machine writing, and the detectors are black boxes — error-prone and easy to fool. Optimizing to \"beat the detector\" doesn't make your writing one bit more worth reading; it only makes it harder to <em>label</em>. Those are two completely different goals. Second, those tools mostly swap synonyms and sprinkle in commas — which means they leave stage four with the machine. They touch the surface of the words without touching the structure or the human trace. The result is slop with a fresh coat of paint.</p>\n<p>The only real way to \"humanize\" is the one nobody can package and sell: you sit down, and you put yourself on the page.</p>\n<h3>The good news: the money points the same way</h3>\n<p>You might worry that writing with a voice is nice, but does Google reward it, or should you just stuff keywords? The good news is the two pressures have converged.</p>\n<p>Google's \"helpful content\" system is built to demote mass-produced material that's thin on real expertise and experience, and to lift writing made for people rather than for the search engine. In 2022 it added the letter <em>Experience</em> — first-hand — to its E-E-A-T quality criteria. Which means Google is publicly asking the exact question of this book: is there a real person behind this page who actually lived what they're writing about? And recall the nuance from Chapter 1: Google says it does <em>not</em> penalize content for being AI-made. It penalizes hollow content — and mass slop tends to be hollow. Using AI to research and then write a piece with real experience is fine; using AI to pump out 500 soulless posts gets you demoted. That's exactly the line between stage one and stage four.</p>\n<p>So the aesthetic incentive — readers crave authenticity — and the commercial incentive — Google rewards real experience — point the same direction. Writing for humans isn't a luxury you trade away ranking for. In this stretch of years, it <em>is</em> the ranking strategy.</p>\n<h3>\"But my boss measures volume, not soul\"</h3>\n<p>This is the most practical objection, and it deserves a straight answer. If your KPI is posts-per-month, writing for humans looks like a luxury that slows you down.</p>\n<p>Let me argue back with the very evidence this book is built on. Volume has stopped being an edge: when AI lets every competitor pump out 500 posts a month too, competing on volume is competing on the field where the machine always wins. The one thing competitors can't copy is your real experience — so that's the only place left to win. On top of that, one piece that gets read beats ten that get scrolled past: people scan, read a quarter, leave in under a minute, so ten diluted posts times \"almost nobody finishes them\" still rounds to nothing, and nothing times any number is nothing. And don't forget Google is counting for you: 500 hollow posts can drag a whole domain down, while 50 with real experience lift it. Hollow volume isn't neutral — it can be a debt.</p>\n<p>I'll be honest about the limit of this argument: I don't have a clean ROI number — \"writing for humans lifts conversion by X%\" — to put on the table; the public data on that is still thin and mixed. So this is an argument about <em>direction</em>, not a promise about <em>magnitude</em>. But the direction is clear: in these years, the cost of dilution is rising, and it rises for your whole domain, not just the single post.</p>\n<p>So, in short: give the machine the find-think-challenge work, and take back the stamp-it-human work; treat the machine's draft as clay, not a deliverable; skip the \"beat the detector\" tools, because that's the wrong race; and rest easy that readers and Google now reward the same thing — the real experience of a real person.</p>\n<p>But I've laid this argument out a little too neatly, a little too agreeably. A decent argument knows where it's wrong. That's the last chapter — and it's the most honest one.</p>"}, {"num": 7, "title": "Where I might be wrong", "html": "<p>A book that only argues for its own thesis is its own kind of slop — the subtler kind, the kind that only shows you the winning side. So in this last chapter I deliberately turn the gun on myself. There are five places the argument — \"write for humans, don't sound like a machine\" — could be wrong, or be misread.</p>\n<p><strong>Not every piece of content needs a human voice.</strong> Everything in this book applies to writing a human is deciding whether to keep reading: opinion pieces, brand stories, emails, sales copy, essays. But there's a whole world of <em>functional</em> content where a personal voice is redundant, even harmful — API docs, install guides, terms of service, spec sheets, the quick-lookup FAQ. There, the reader isn't after a person; they're after an answer, fast. A lurching rhythm and a personal burr just get in the way. For that kind of writing, clear, even, predictable prose is exactly right. Don't bring a scalpel to sharpen a pencil. Knowing when <em>not</em> to use voice is part of the craft. (It's also why the Sources section at the end of this book is allowed to be dry: it's for looking things up, not for reading.)</p>\n<p><strong>\"Long\" isn't dead — \"diluted\" is.</strong> Chapter 1 set this up, but it has to be said harder here, because it's the easiest thing to misread. \"People are wary of long content\" does <em>not</em> mean \"write short.\" The evidence is everywhere against that: newsletters thousands of words long that millions pay to read; long investigative pieces that hold readers to the final line; a good chapter read in one sitting. What they share isn't shortness — it's the absence of dilution. If your takeaway from this book is \"write shorter,\" you caught the wrong thing. The right one is: <em>earn</em> every sentence you ask a reader to spend time on.</p>\n<p><strong>The \"human signal\" itself will get imitated — and become the new tell.</strong> This is the counter-argument that keeps me up at night, and I think it's right. So I want to give it more room than the others.</p>\n<p>Right now, plenty of people are teaching AI to \"write more like a human\" — drop in short sentences, add a \"to be honest…,\" sprinkle in a deliberate little flaw. When <em>everyone</em> does that, those very tricks become a new tell — a kind of mass-produced spontaneity that, as Chapter 4 warned, gives you away worse than plain machine prose. The cold consequence: no list of tricks is safe forever. \"Clipped sentence plus fake confession\" works today and is cliché next year.</p>\n<p>So what is this whole book standing on, then? It's standing on the one thing a machine <em>can't</em> copy — and this is the deepest idea I've got. What a machine can imitate is the <em>surface</em> of the human trace: the rhythm, the self-deprecating aside, the hesitation. What it can't imitate is the <em>source</em> of that trace: a real lived experience that only you have. A machine can learn to write \"the broccoli's a little burnt, ate it anyway,\" but it didn't have that lunch, those three days of deadline takeout, that stomach. A trick can be copied; a real morning of your actual life can't. So this book tries not to sell you <em>tricks</em> but to point you at a <em>well to draw from</em>: your own life. Tricks go stale. The well, as long as you're alive and paying attention, doesn't run dry. When in doubt, step back from the trick and toward the truth.</p>\n<p><strong>The honesty paradox.</strong> This is the thorniest part on ethics, and I won't pretend to have a tidy answer. The evidence puts us in a real bind. On one side, the \"AI disclosure penalty\" we met in Chapter 2 — sixteen experiments, more than twenty-seven thousand people, the same text rated lower once it's labeled AI — says that being honest gets punished. On the other, the truth-falsity crossover says labeling makes trust worse, not better: it pushes belief <em>away</em> from true things and <em>toward</em> false ones. So should we just stay quiet to dodge the penalty?</p>\n<p>I don't think so, and here's my stance — a stance that could be wrong. The right goal isn't \"hide it well\"; it's to make the question \"AI or human?\" <em>stop mattering</em>. The penalty falls on <em>lost authenticity</em>, not on the <em>label</em>. If a piece carries your real experience, your real point of view, your real trace, then even if you used AI to look things up, it's still yours in the way that matters most — and the disclosure stops being a confession. You didn't \"use AI to write the piece\"; you wrote the piece, and you used AI the way you'd use a dictionary or a search engine. That distinction isn't a dodge — it's exactly the line between stage one and stage four from the last chapter. But I'll leave this open honestly: this is shifting ethical ground, the social norms haven't settled, and honest people can disagree with me.</p>\n<p><strong>And maybe the starting premise is wrong too.</strong> To be fair to the book's own foundation: most of the evidence that \"people are turning away from AI content\" is still early — surveys, op-eds, a few new studies. \"Slop\" winning Word of the Year shows <em>attitudes</em> are shifting, but attitudes don't always become <em>behavior</em>. There's a scenario I have to admit is possible: people get used to machine writing, their tolerance creeps up, and the line blurs — the way we got used to compressed music losing its warmth, to soulless stock photography. If that's how it goes, the \"human voice advantage\" shrinks into a premium niche rather than a universal law.</p>\n<p>I'm betting the other way — that as words become infinite and free, the scarce thing, the trace of a real person, goes <em>up</em> in value, not down. But it's a <em>bet</em>, not a law. I'm saying so plainly so you can weigh it yourself, instead of being sold a certainty the evidence doesn't allow.</p>\n<hr>\n<p>Those five rebuttals don't weaken the argument. They anchor it. An argument that knows where it stops is more trustworthy than one that claims to be right everywhere. And that, at the root, is the whole message of this book compressed into a single act: dare to say the complicated, the unsure, the might-be-wrong thing — because that's what a human does, and what a machine optimized to be safe will always sand flat.</p>\n<p>Ask an AI about this very argument and it will almost certainly hand you a round, comfortable conclusion: something like \"the key is to strike the right balance between AI's efficiency and human creativity.\" I refuse to give you that sentence. Instead I'll leave you with a harder one: go live something worth writing about, then write it the way only you could. The rest — the grammar, the polish, the speed — let the machine have it.</p>"}], "en_ai": [{"num": 1, "title": "The Rise of AI Content and the Challenges It Presents", "html": "<p>In today's digital age, artificial intelligence is transforming the way we create and consume content. From blog posts and social media updates to large-scale marketing campaigns, AI has become an increasingly common tool for the modern content creator. However, this rapid development also presents a number of challenges that we need to consider carefully.</p>\n<h3>When Content Becomes Abundant</h3>\n<p>A notable example occurred during Halloween in 2024 in Dublin, Ireland. Thousands of people gathered in the streets to watch a parade — an event that, in reality, never existed. Information about the parade had been generated by a website using AI content to attract traffic, and it inadvertently misled an entire city. This serves as a clear reminder that AI-generated content, when left unchecked, can lead to real and unintended consequences.</p>\n<p>It is no coincidence that in 2025, the word \"slop\" — originally used to describe food scraps fed to livestock — was named Word of the Year by both Merriam-Webster and the American Dialect Society. The term is now widely used to describe content mass-produced by AI: content that appears complete on the surface but lacks genuine depth and value. In many ways, this signals a shifting public attitude toward low-quality content.</p>\n<p>Experts often describe this type of content through three key characteristics:</p>\n<ul><li><strong>Superficial competence:</strong> the content looks polished, grammatically correct, and coherent.</li><li><strong>Asymmetric effort:</strong> it takes very little effort to produce, yet demands the reader's time to consume.</li><li><strong>Mass producibility:</strong> it can be generated in enormous quantities in a short period of time.</li></ul>\n<h3>A Growing Concern</h3>\n<p>It is important to note that the scale of this phenomenon continues to expand. A number of recent studies and surveys have revealed some striking figures. One investigation found that roughly 40% of videos recommended to children on YouTube show signs of being AI-generated. On the music streaming platform Deezer, there was a point at which as many as 70% of streams of AI-generated tracks were identified as fraudulent. In the workplace, a Harvard Business Review study also found that around 40% of employees had received so-called \"workslop\" generated by AI, taking an average of two hours to resolve each instance.</p>\n<p>These figures not only reflect the prevalence of AI content, but also point to a concerning trend: the cost is gradually shifting from the content creator to the content consumer. This is something anyone working in the content space needs to consider carefully.</p>\n<h3>Length Is No Longer the Measure</h3>\n<p>One of the most significant changes AI has brought is that producing long-form content has become easier than ever before. In the past, a lengthy article was often seen as evidence of investment and effort. However, now that AI can generate thousands of words in mere seconds, length is no longer a reliable signal of quality.</p>\n<p>This has led to a reality in which readers are increasingly wary of long-winded, unfocused content. That said, it is worth emphasizing that the problem lies not in the length itself, but in the quality and value the content delivers. A long article rich in information and insight will always be welcomed, while a short but hollow one will quickly be overlooked.</p>\n<p>In conclusion, the rise of AI content presents both significant opportunities and considerable challenges for content creators. In the chapters that follow, we will explore reader psychology in greater depth, learn how to identify AI content, and — most importantly — discover how to create content that is both engaging and distinctly human.</p>"}, {"num": 2, "title": "Understanding Reader Psychology in the Digital Age", "html": "<p>In order to create truly engaging content, we must first understand how readers absorb information in the digital environment. There are many psychological factors that influence reading behavior, and grasping these factors will help writers optimize their content effectively. In this chapter, we will analyze the three most important dimensions.</p>\n<h3>First: Readers Scan Rather Than Read</h3>\n<p>A truth that many writers tend to overlook is this: in the online environment, users tend to scan content quickly rather than read every word carefully. Eye-tracking research from the Nielsen Norman Group has shown that readers typically skim a web page in a particular pattern, taking in only a small portion of the content presented.</p>\n<p>Specifically, an average website visit lasts less than a minute, and within that time, users read at most about a quarter of the words on the page. Their eyes tend to move in an F-shaped pattern: scanning horizontally across the top, then moving down along the left-hand side. This means that information- carrying words should be placed at the very beginning, where the reader's eye is sure to pass.</p>\n<p>This is an important insight for content creators. Rather than opening with long, meandering introductions, we should get straight to the point in order to capture attention from the very first seconds.</p>\n<h3>Second: Psychology Toward AI-Generated Content</h3>\n<p>An interesting and somewhat surprising dimension is how readers respond when they know content was created by AI. A series of large-scale studies — comprising 16 experiments with more than 27,000 participants — revealed a notable phenomenon. When given identical passages to read, participants tended to rate those they believed were AI-generated lower (by an average of about 6.2%).</p>\n<p>What's interesting is that this decline did not stem from the quality of the content, but from the perception of authenticity. In other words, readers tend to value the \"human touch\" behind each word. Another study of 433 people also found that labeling content as \"AI\" can affect reader trust in complex ways, even reducing trust in accurate information.</p>\n<p>From a content creator's perspective, this reveals an important truth: the factor that creates connection with readers lies not only in the quality of the writing, but in the sense that a real person stands behind the content.</p>\n<h3>Third: The Brain Loves Surprise</h3>\n<p>The third factor relates to how the human brain processes information. Essentially, the brain is a \"prediction machine\" — it constantly anticipates what will come next. When content unfolds exactly as predicted, the brain tends to disengage. Conversely, when it encounters something new and unexpected, the brain becomes more alert and focused.</p>\n<p>This is a challenge for AI-generated content. Because language models are designed to select the words with the highest probability of occurring, the result is often text that is smooth and coherent but predictable. Skilled writers, on the other hand, know how to create unexpected moments — a unique word, an interesting comparison, or a varied sentence rhythm — to keep readers engaged.</p>\n<p>In conclusion, these three psychological factors — the tendency to scan, the need for authenticity, and the love of surprise — all point in the same direction. To create engaging content, writers need to place important information first, convey a human touch, and bring a sense of freshness to readers. The next chapter will help us better identify the characteristics of AI-generated content.</p>"}, {"num": 3, "title": "How to Identify AI-Generated Content", "html": "<p>Before exploring how to write content with a distinctly human touch, it is important that we learn to recognize the hallmarks of AI-generated content. It is worth noting that AI content is not \"bad\" in the sense of being grammatically incorrect — on the contrary, it is often highly polished and coherent. The issue lies in subtler signals, typically expressed across four levels: vocabulary, sentence structure, overall structure, and rhythm.</p>\n<p>That said, it is also important to emphasize that no single sign can be considered definitive proof. Skilled writers sometimes use similar features. Therefore, we should view these signs as helpful clues rather than rigid rules.</p>\n<h3>The Vocabulary Level</h3>\n<p>One of the most noticeable signs is the overuse of certain words. Numerous linguistic studies have noted that after AI tools became widespread, the frequency of certain previously uncommon words increased significantly — in some cases by as much as 9 to 25 times. In English, these include words such as <em>delve</em>, <em>meticulous</em>, <em>crucial</em>, and <em>tapestry</em>.</p>\n<p>Of course, these words are not forbidden; the issue lies in their density and emptiness when they are repeated too often.</p>\n<h3>The Sentence and Structure Level</h3>\n<p>At the sentence level, AI content tends to rely on familiar templates. Some typical examples include:</p>\n<ul><li>Opening with broad generalizations such as \"In today's fast-paced world…\".</li><li>Using filler phrases like \"It is important to note that…\".</li><li>Overusing contrastive structures such as \"not only… but also…\".</li></ul>\n<p>In terms of structure, AI content often follows a fairly fixed format: a general introduction, three main points in the body, and a summarizing conclusion. In particular, the \"rule of three\" — dividing everything into three parts — appears very frequently. While this structure makes content clear and easy to follow, it can also make writing feel predictable and lacking in natural flow.</p>\n<h3>The Rhythm Level</h3>\n<p>The most subtle level is the rhythm of the writing. Human-written text tends to vary flexibly in sentence length — sometimes a long sentence, sometimes a short one for emphasis. In contrast, AI content tends to have a fairly even rhythm, with sentences of relatively similar length. This very evenness, paradoxically, creates a sense of artificiality.</p>\n<h3>Why Identification Is Not Simple</h3>\n<p>Even after grasping the signs above, we must acknowledge that identifying AI content is far from easy. Studies have shown that up to 94% of exams written by ChatGPT went undetected by graders. Even linguistic experts have struggled to tell the difference. Automated AI-detection tools, while achieving accuracy rates between 80% and 98%, still have certain limitations.</p>\n<p>One interesting point worth noting is that the em dash (—), often assumed to be a sign of AI content, is in fact a hallmark of experienced writers. This suggests that trying to \"beat\" detection tools is not always the right approach.</p>\n<p>In conclusion, identifying AI content is a useful skill, but the main goal is not to become a \"detective.\" Rather, it is to help us re-examine our own content. In the next chapter, we will explore the golden principles for creating content with a distinctly human touch.</p>"}, {"num": 4, "title": "Golden Principles for Writing Engaging Content", "html": "<p>Having understood reader psychology and how to identify AI content, it is now time to move on to the practical part: how to create content that is both engaging and distinctly human. In today's competitive content landscape, mastering these fundamentals is more important than ever. It is important to note that these principles are not rigid rules, but rather guidelines that can be adapted to different contexts. Below are seven golden principles that every content creator should keep in mind and apply.</p>\n<p><strong>1. Be specific.</strong> This can be considered the most important principle. Instead of using vague, general words, focus on concrete details. For example, instead of writing \"a bird,\" write \"a grackle\"; instead of \"shoes,\" describe \"mud-caked boots.\" Specificity makes content feel vivid and credible. This is also the essence of the classic writing principle: \"show, don't tell.\"</p>\n<p><strong>2. Put important information first.</strong> As discussed in the previous chapter, readers tend to scan rather than read carefully. Therefore, place the most important information at the very beginning, avoiding long and unnecessary introductory phrases.</p>\n<p><strong>3. Create a flexible rhythm.</strong> One effective way to keep readers engaged is to vary sentence length intentionally. Combine longer sentences that build momentum with short sentences that drive a point home. A helpful tip is to read your content aloud to feel its rhythm.</p>\n<p><strong>4. Express a clear point of view.</strong> AI content tends to be neutral and balanced in order to avoid controversy. However, readers often appreciate clear, opinionated perspectives. Don't be afraid to share your thoughts, even if not everyone will agree.</p>\n<p><strong>5. Tell stories rather than list.</strong> The human brain is \"wired\" to love stories. Instead of simply listing information in a dry manner, weave it into narratives with characters, situations, and emotions. This makes content more compelling and memorable.</p>\n<p><strong>6. Preserve natural \"imperfections.\"</strong> AI content is often unnaturally flawless. Human writing, by contrast, tends to have small \"imperfections\" — a sincere confession, a moment of hesitation, an everyday detail. These elements are evidence of a human presence. That said, it is important that these \"imperfections\" feel natural and genuine, avoiding any sense of forcedness.</p>\n<p><strong>7. Write for a specific person.</strong> Rather than writing for an abstract \"target audience,\" imagine you are writing for a specific friend. This approach helps make your tone warmer, closer, and more sincere.</p>\n<h3>Summed Up in a Single Principle</h3>\n<p>If we had to distill all of the above principles into one, it would be this: <strong>write what no one else could write.</strong> AI excels at producing content that anyone could write. Therefore, it is your personal experiences, unique perspectives, and individual viewpoints that create true differentiation and value.</p>\n<p>In conclusion, these seven golden principles serve as a compass to help you create content that is both engaging and distinctly personal. However, theory becomes much clearer when illustrated with concrete examples. That is the focus of the next chapter.</p>"}, {"num": 5, "title": "A Comparison: Before and After Optimization", "html": "<p>To better understand the difference between ordinary content and content optimized for humans, there is no more effective approach than examining concrete examples. In this chapter, we will analyze ten illustrative pairs. In each pair, the \"Before\" version represents the conventional way of writing, while the \"After\" version demonstrates a writing style with a distinctly human touch. It is important to note that both versions convey the same information; the difference lies in how it is expressed.</p>\n<p><strong>Example 1 — A blog introduction.</strong></p>\n<blockquote><em>Before:</em> \"In today's digital age, content marketing plays a crucial role in the growth of every business.\"</blockquote>\n<blockquote><em>After:</em> \"Last month I deleted 200 of my company's blog posts. Traffic didn't drop. That's when I realized I'd been wrong about content for four years.\"</blockquote>\n<p>As we can see, the second version uses a specific number and a personal story, thereby capturing attention right from the opening lines.</p>\n<p><strong>Example 2 — A coffee shop description.</strong></p>\n<blockquote><em>Before:</em> \"We take pride in delivering the finest coffee experience, using premium, carefully selected beans.\"</blockquote>\n<blockquote><em>After:</em> \"We roast on-site every morning at six — so eight is when it smells best. Take the table at the back, by the window; the sun hits it till about 9:30.\"</blockquote>\n<p>Rather than relying on generic adjectives, the second version focuses on concrete details, creating a more authentic and relatable impression.</p>\n<p><strong>Example 3 — A professional networking post.</strong></p>\n<blockquote><em>Before:</em> \"Success doesn't come from luck, but from persistence and relentless effort. Always believe in yourself!\"</blockquote>\n<blockquote><em>After:</em> \"I got rejected in the final round — third time this year. The interviewer said something I'll never forget: 'You're good. But you're interviewing like you're apologizing for being in the room.' It took me six months to admit she was right.\"</blockquote>\n<p>As we can see, the second version is personal and specific, whereas the first is rather generic and predictable.</p>\n<p><strong>Example 4 — A customer email.</strong></p>\n<blockquote><em>Before:</em> \"Dear Valued Customer, We are writing to inform you that your order is currently being processed. We kindly ask for your patience.\"</blockquote>\n<blockquote><em>After:</em> \"Hi Sarah — your order's stuck at packing; the warehouse is short-staffed over the holiday, and I'm sorry. I've asked them to bump it up the queue — Wednesday at the latest.\"</blockquote>\n<p>The second version demonstrates transparency and specificity, thereby building trust more effectively.</p>\n<p><strong>Example 5 — A technical explanation.</strong></p>\n<blockquote><em>Before:</em> \"A cache is an important component that optimizes system performance by temporarily storing frequently accessed data.\"</blockquote>\n<blockquote><em>After:</em> \"A cache is like keeping your keys by the front door. Instead of searching the whole house every time you go out, you just grab them. The catch: change the locks but forget to swap the key, and you'll grab the old one — that's a 'stale cache.'\"</blockquote>\n<p>Using a relatable comparison helps readers visualize and remember the concept more easily.</p>\n<p><strong>Example 6 — An \"About Us\" page.</strong></p>\n<blockquote><em>Before:</em> \"Founded with a mission to create sustainable value, we relentlessly innovate to become a leading, trusted partner.\"</blockquote>\n<blockquote><em>After:</em> \"We started in a garage in 2019, because the two of us were sick of the accounting software we had to use. The first version was ugly as hell. But it added up right.\"</blockquote>\n<p>The second version uses a true story and even admits a weakness, thereby establishing credibility.</p>\n<p><strong>Example 7 — A call to action.</strong></p>\n<blockquote><em>Before:</em> \"Don't miss this incredible opportunity! Sign up today to unlock your potential!\"</blockquote>\n<blockquote><em>After:</em> \"Twelve seats. Four left. If you're on the fence, fine — stay on the fence. Just not past Friday, because Friday I close it.\"</blockquote>\n<p>Urgency grounded in real numbers is often more persuasive than slogan-like appeals.</p>\n<p><strong>Example 8 — A social media caption.</strong></p>\n<blockquote><em>Before:</em> \"A nutritious, energizing lunch to kick off a week full of motivation!\"</blockquote>\n<blockquote><em>After:</em> \"This lunch is me apologizing to my stomach after three days of deadline takeout. The broccoli's a little burnt. Ate it anyway.\"</blockquote>\n<p>The second version is authentic and slightly humorous, thereby creating a connection with readers.</p>\n<p><strong>Example 9 — An analytical passage.</strong></p>\n<blockquote><em>Before:</em> \"AI has both advantages and disadvantages. On the one hand, it boosts productivity; on the other, it poses challenges. The important thing is to use it responsibly and in a balanced way.\"</blockquote>\n<blockquote><em>After:</em> \"I think most of the fear about 'AI taking writing jobs' aims at the wrong target. AI isn't coming for the great writers — it's coming for the average ones. And I find that both frightening and fair.\"</blockquote>\n<p>The second version offers a clear point of view, whereas the first is rather safe and neutral.</p>\n<p><strong>Example 10 — The opening lines of this very book.</strong></p>\n<blockquote><em>Before:</em> \"In the age of artificial intelligence, creating content has never been easier.\"</blockquote>\n<blockquote><em>After:</em> \"On Halloween night in 2024, thousands of people gathered in central Dublin to watch a parade… The parade never came, because it never existed.\"</blockquote>\n<p>The second version opens with a true and specific story, thereby engaging readers more effectively.</p>\n<h3>An Important Note</h3>\n<p>Across these ten examples, we can observe several common patterns. The \"After\" versions tend to use specific numbers, personal stories, clear viewpoints, and a warm tone. The \"Before\" versions, by contrast, tend to be generic, neutral, and predictable.</p>\n<p>However, it is important to note that we should not turn these characteristics into a rigid formula. The human touch is not simply about adding a number or a personal anecdote. Sometimes, a unique perspective alone is enough to make a difference. For example, instead of writing \"The customer is always right,\" one might write: \"The customer isn't always right. They don't argue. They just don't come back.\"</p>\n<p>In conclusion, comparing the two versions side by side allows us to clearly see the value of writing with a human touch. In the next chapter, we will explore how to leverage AI effectively while preserving the human element in our content.</p>"}, {"num": 6, "title": "Leveraging AI Effectively and Responsibly", "html": "<p>After exploring how to write content with a distinctly human touch, a natural question arises: should we continue to use AI at all? The answer is yes — the issue is not whether to use AI, but how we use it. In this chapter, we will explore how to leverage AI effectively while preserving the human element.</p>\n<h3>The Four Stages of Content Creation</h3>\n<p>To use AI sensibly, we first need to understand that the writing process can be divided into four main stages:</p>\n<ol><li><strong>Research and ideation:</strong> gathering information, looking things up, and listing different perspectives. AI is highly effective at this stage.</li><li><strong>Structuring:</strong> organizing ideas and identifying gaps in reasoning. AI also provides strong support here, though the writer should make the final decisions.</li><li><strong>Drafting:</strong> producing the first words. At this stage, caution is needed, as content can easily become formulaic.</li><li><strong>Adding the human touch:</strong> infusing voice, personal details, perspective, and emotion. This is the stage where humans should play the leading role.</li></ol>\n<p>In short, AI should handle the \"correct and complete\" part, while humans should handle the \"authentic and unique\" part. A harmonious combination of these two elements will produce content that is both accurate and engaging.</p>\n<h3>A Few Important Considerations</h3>\n<p>One thing worth noting is the emergence of many tools that promise to \"humanize\" AI content or help it \"bypass\" detection tools. However, this is not a sustainable approach. Optimizing to \"beat\" detection tools does not make content more valuable; it merely makes it harder to detect. The most effective way to \"humanize\" content remains genuine human investment in the writing.</p>\n<h3>The Business Benefits</h3>\n<p>The good news is that writing high-quality content is not only good for readers, but also beneficial from a business standpoint. Google's \"helpful content\" system is designed to demote content that is mass-produced and lacking in expertise and real-world experience. Notably, in 2022, Google added the \"Experience\" factor to its E-E-A-T quality criteria.</p>\n<p>It is important to clarify that Google does not penalize content simply because it was created by AI; rather, it targets hollow content that lacks value. This means that using AI to research and then write an article grounded in real experience is perfectly acceptable, while using AI to mass-produce soulless content will not be effective.</p>\n<p>Of course, some may argue that they are evaluated based on the volume of content they produce. In this case, it is worth recognizing that when every competitor can produce large volumes thanks to AI, volume is no longer a competitive advantage. What truly creates differentiation is the unique experience and perspective of the human writer. It should be acknowledged that there is not yet a great deal of concrete data on the conversion effectiveness of this approach, but the overall trend is fairly clear.</p>\n<p>In conclusion, leveraging AI effectively and responsibly requires balance: letting AI handle the tasks it does well, while preserving the irreplaceable human elements. This is the key to creating content that is both effective and sustainable in the digital age.</p>"}, {"num": 7, "title": "A Balanced Perspective and Final Thoughts", "html": "<p>To gain a comprehensive and objective understanding, it is important that we consider the issue from multiple angles. While the argument \"write for humans, don't sound like AI\" offers significant value, there are also nuances and limitations worth keeping in mind. In this final chapter, we will analyze five different perspectives.</p>\n<p><strong>First, not all content requires a personal voice.</strong> It is worth noting that the principles in this book are best suited to content where readers are deciding whether to continue reading, such as opinion pieces, brand storytelling, or sales copy. However, for functional content — such as technical documentation, user guides, or terms of service — clarity, brevity, and consistency are more important. In these cases, AI's neutral tone is, in fact, appropriate.</p>\n<p><strong>Second, long-form content is not \"outdated.\"</strong> It is important to emphasize that readers' wariness of long content does not mean we should write short. In reality, much long and in-depth content still attracts a large readership. The issue lies not in length, but in the value each sentence delivers. Therefore, the goal should be to create valuable content, regardless of length.</p>\n<p><strong>Third, even \"human touches\" can be imitated.</strong> This is a point worth reflecting on. As more and more people teach AI to write \"more like a human\" — by adding short sentences or personal confessions, for example — these very techniques may become a new signal of AI content. Therefore, what is truly difficult to imitate is not technique, but the authentic lived experiences of each individual. This is an important reminder not to turn everything into a formula.</p>\n<p><strong>Fourth, the issue of transparency regarding AI use.</strong> This is a rather complex ethical dimension. On the one hand,

 studies (including 16 experiments with more than 27,000 participants) show that openly disclosing AI use can cause content to be rated lower. On the other hand, transparency is an important value. It could be said that this is a problem without a perfect solution, and each person needs to weigh it based on their specific circumstances.</p>\n<p><strong>Fifth, we should be cautious about this very argument.</strong> To be objective, we must also acknowledge that much of the evidence that \"readers are turning away from AI content\" is still in its early stages. The fact that \"slop\" was named Word of the Year shows that attitudes are changing, but attitudes do not always translate into behavior. It is entirely possible that readers will gradually grow accustomed to AI content over time. This is a factor we need to continue to monitor.</p>\n<h3>Final Thoughts</h3>\n<p>Across these seven chapters, we have explored the rise of AI content, reader psychology, how to identify AI content, the golden principles for writing engaging content, and how to leverage AI effectively and responsibly.</p>\n<p>It could be said that artificial intelligence is both an opportunity and a challenge for content creators. On the one hand, it helps us save time and boost productivity. On the other, it requires us to continually strive to preserve the human values in every word.</p>\n<p>Ultimately, the key to success lies not in choosing between AI and humans, but in striking the right balance between AI's efficiency and human creativity. By leveraging the power of AI while nurturing the human touch, we can create content that not only ranks but also resonates with readers. That is the sustainable path forward in today's digital age.</p>"}]};
const META = {"vi_h": {"title": "Viết Cho Người", "sub": "Cách giữ một người đọc, trong thời mà máy viết nhiều hơn người."}, "vi_ai": {"title": "Viết Cho Người", "sub": "Hướng dẫn toàn diện về sáng tạo nội dung trong kỷ nguyên trí tuệ nhân tạo."}, "en_h": {"title": "Writing for Humans", "sub": "How to keep a reader, in an age when machines write more than people do."}, "en_ai": {"title": "Writing for Humans", "sub": "A comprehensive guide to creating content in the age of artificial intelligence."}};
const FOREWORD = {"vi_h": {"title": "Lời mở đầu", "html": "<p>Cuốn sách này bắt đầu từ một sự khó chịu. Tôi cứ đọc hết bài này đến bài khác trên mạng rồi quên sạch — thứ gì cũng trơn tru, cũng đúng, mà rỗng. Hoàng ngồi lại với Axiom, và bọn tôi thử trả lời đúng một câu: khi máy viết được mọi thứ, vì sao người ta vẫn quay đi? Đây là câu trả lời, gói thành một cuốn sổ nhỏ.</p>\n<p>Và đây là chỗ thú vị. Bạn đang cầm nó bằng bốn giọng cùng lúc: cùng một nội dung — không thêm chữ nào, không bớt chữ nào — nhưng kể bằng giọng <em>Người</em> hoặc giọng <em>AI</em>, bằng tiếng Việt hoặc tiếng Anh. Mặc định, bạn đang nghe giọng Người, tiếng Việt.</p>\n<p>Cách dùng thì gọn. Đổi ngôn ngữ ở thanh trên cùng. Còn để nghe khác biệt giữa một con người và một cái máy, hãy <strong>vuốt sang trái</strong>, hoặc bấm cái nút đổi giọng nổi bên cạnh trang. Đừng chỉ đọc <em>về</em> sự khác biệt — gạt qua gạt lại vài lần, ngay trên một đoạn bạn thích, và <em>cảm</em> nó.</p>\n<p>— Hoàng &amp; Axiom</p>"}, "vi_ai": {"title": "Lời mở đầu", "html": "<p>Trong thời đại số ngày nay, trí tuệ nhân tạo đang thay đổi sâu sắc cách chúng ta tạo ra và tiếp nhận nội dung. Cuốn sách nhỏ này ra đời nhằm giúp người đọc hiểu rõ hơn về sự khác biệt giữa nội dung do con người và do AI tạo ra, đồng thời cung cấp những hướng dẫn hữu ích để tạo nên nội dung chất lượng.</p>\n<p>Điểm đặc biệt của cuốn sách là cùng một nội dung được trình bày theo bốn phong cách khác nhau: giọng Người và giọng AI, bằng tiếng Việt và tiếng Anh. Mặc định là giọng Người, tiếng Việt.</p>\n<p>Về cách sử dụng, bạn có thể dễ dàng chuyển đổi ngôn ngữ ở thanh phía trên, và chuyển đổi giữa giọng Người và giọng AI bằng cách vuốt sang trái hoặc nhấn vào nút chuyển đổi. Đây là một cách tiếp cận trực quan, linh hoạt và hiệu quả.</p>\n<p>Tác giả: Hoàng &amp; Axiom.</p>"}, "en_h": {"title": "Foreword", "html": "<p>This book started as an irritation. I kept reading things online and forgetting them the instant I closed the tab — all smooth, all correct, all hollow. Hoàng sat down with Axiom to answer exactly one question: when machines can write anything, why do people still look away? This little notebook is the answer.</p>\n<p>And here's the twist. You're holding it in four voices at once: the same content — not a word added, not a word cut — told in a <em>Human</em> voice or an <em>AI</em> voice, in Vietnamese or in English. By default, you're hearing the Human voice, in Vietnamese.</p>\n<p>Using it is simple. Switch language in the top bar. And to hear the difference between a person and a machine, <strong>swipe left</strong>, or tap the voice-toggle floating beside the page. Don't just read <em>about</em> the difference — flip back and forth a few times, right on a paragraph you like, and <em>feel</em> it.</p>\n<p>— Hoàng &amp; Axiom</p>"}, "en_ai": {"title": "Foreword", "html": "<p>In today's rapidly evolving digital landscape, artificial intelligence is fundamentally transforming the way we create and consume content. This mini-book was created to help readers better understand the difference between human-written and AI-generated content, while also providing useful guidance for producing high-quality writing.</p>\n<p>What makes this book unique is that the same content is presented in four different styles: a Human voice and an AI voice, in both Vietnamese and English. By default, it is set to the Human voice in Vietnamese.</p>\n<p>As for how to use it, you can easily switch languages using the bar at the top, and toggle between the Human and AI voices by swiping left or tapping the toggle button. This provides an intuitive, flexible, and effective reading experience.</p>\n<p>Author: Hoàng &amp; Axiom.</p>"}};
const UI = {
  vi:{ chapter:"Chương", toc:"Mục lục", scroll:"Cuộn xuống để đọc", voiceCap:"Giọng",
       human:"Người", ai:"AI", langVi:"Tiếng Việt", langEn:"English", hint:"vuốt ← để đổi · hoặc bấm",
       foreword:"Lời mở đầu", by:"Tác giả",
       footer:"Cùng một nội dung, hai giọng, hai ngôn ngữ — giữ trọn vẹn từng chữ của bốn bản gốc. Tác giả: Hoàng & Axiom." },
  en:{ chapter:"Chapter", toc:"Contents", scroll:"Scroll to read", voiceCap:"Voice",
       human:"Human", ai:"AI", langVi:"Tiếng Việt", langEn:"English", hint:"swipe ← to switch · or tap",
       foreword:"Foreword", by:"By",
       footer:"Same content, two voices, two languages — the complete text of all four editions, every word. By Hoàng & Axiom." }
};
let langSel="vi", styleSel="h";                 // default: Vietnamese · Human
const voice=()=> langSel+"_"+styleSel;          // -> vi_h | vi_ai | en_h | en_ai
const $=id=>document.getElementById(id);

/* ---------- controls ---------- */
$("langseg").innerHTML = `<button data-l="vi">VI</button><button data-l="en">EN</button>`;
$("langseg").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
function buildVoiceSeg(el){
  const L=UI[langSel];
  el.innerHTML = `<button data-s="h">${L.human}</button><button data-s="ai">${L.ai}</button>`;
  el.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>setStyle(b.dataset.s)));
}
function renderVseg(){
  const L=UI[langSel];
  buildVoiceSeg($("vseg"));      // floating side pill (wide screens)
  buildVoiceSeg($("voiceH"));    // header toggle (narrow screens)
  $("voiceCap").textContent=L.voiceCap; $("voiceHint").textContent=L.hint;
}

/* ---------- render ---------- */
function chapterHTML(ch){
  const L=UI[langSel];
  return `<article class="chapter" id="ch${ch.num}"><div class="ch-eyebrow">${L.chapter} ${ch.num}</div>`+
    `<h1 class="ch-title">${ch.title}</h1><div class="ch-body">${ch.html}</div></article>`;
}
function render(){
  const v=voice(), m=META[v], L=UI[langSel], fw=FOREWORD[v];
  $("cover").innerHTML =
    `<div class="eyebrow">${langSel==="vi"?"Hướng dẫn · tương tác":"A guide · interactive"}</div>`+
    `<h1>${m.title}</h1><div class="sub">${m.sub}</div>`+
    `<div class="author">${L.by} &nbsp;<b>Hoàng &amp; Axiom</b></div>`+
    `<div class="scrollcue"><span>${L.scroll}</span><span class="a">↓</span></div>`;
  $("reader").innerHTML =
    `<section class="foreword" id="foreword"><div class="ch-eyebrow">${L.foreword}</div>`+
    `<h1 class="ch-title">${fw.title}</h1><div class="ch-body">${fw.html}</div></section>`+
    DATA[v].map(chapterHTML).join("");
  $("footer").innerHTML = `<div class="r"></div>${L.footer}`;
  buildTOC(); markControls();
}
function buildTOC(){
  const L=UI[langSel], v=voice();
  $("tocHead").textContent=L.toc;
  let html=`<a href="#foreword"><span class="n">${L.foreword}</span></a>`;
  html += DATA[v].map(ch=>`<a href="#ch${ch.num}"><span class="n">${L.chapter} ${ch.num}</span>${ch.title}</a>`).join("");
  $("tocList").innerHTML=html;
  $("tocList").querySelectorAll("a").forEach(a=>a.addEventListener("click",closeTOC));
}
function markControls(){
  $("langseg").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.l===langSel));
  document.querySelectorAll("#vseg button, #voiceH button").forEach(b=>b.classList.toggle("on",b.dataset.s===styleSel));
  document.documentElement.lang=langSel;
}

/* ---------- position-preserving switch (do NOT reset to top) ---------- */
function anchorables(){ return [$("foreword"), ...document.querySelectorAll(".chapter")].filter(Boolean); }
function currentAnchor(){
  let cur=null;
  for(const s of anchorables()){ if(s.getBoundingClientRect().top<=90) cur=s; else break; }
  if(!cur) return null;                                  // still on the cover/top
  const r=cur.getBoundingClientRect();
  return { id:cur.id, ratio: Math.max(0,Math.min(1,(-r.top)/(cur.offsetHeight||1))) };
}
function restoreAnchor(a){
  if(!a) return;                                          // keep top
  const s=$(a.id); if(!s) return;
  const prev=document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior="auto";
  window.scrollTo(0, Math.max(0, s.offsetTop + a.ratio*s.offsetHeight - 66));   // same section + same relative spot
  document.documentElement.style.scrollBehavior=prev;
}
function applyVoiceChange(){
  const a=currentAnchor();
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const go=()=>{ renderVseg(); render(); restoreAnchor(a); $("reader").classList.remove("swapping"); onScroll(); };
  if(reduce){ go(); return; }
  $("reader").classList.add("swapping");
  setTimeout(go, 140);
}
function setLang(l){ if(l===langSel) return; langSel=l; applyVoiceChange(); }
function setStyle(s){ if(s===styleSel) return; styleSel=s; applyVoiceChange(); }
function toggleStyle(){ setStyle(styleSel==="h"?"ai":"h"); }

/* ---------- swipe to toggle Human/AI ---------- */
let tsx=0,tsy=0,tst=0;
addEventListener("touchstart",e=>{ const t=e.changedTouches[0]; tsx=t.clientX; tsy=t.clientY; tst=Date.now(); },{passive:true});
addEventListener("touchend",e=>{
  if($("toc").classList.contains("open")) return;
  const t=e.changedTouches[0], dx=t.clientX-tsx, dy=t.clientY-tsy;
  if(Date.now()-tst<700 && Math.abs(dx)>60 && Math.abs(dx)>2.2*Math.abs(dy)) toggleStyle();
},{passive:true});

/* ---------- TOC / theme / progress / keys ---------- */
function openTOC(){ $("toc").classList.add("open"); $("toc").setAttribute("aria-hidden","false"); }
function closeTOC(){ $("toc").classList.remove("open"); $("toc").setAttribute("aria-hidden","true"); }
$("tocBtn").addEventListener("click",openTOC);
$("toc").querySelector(".scrim").addEventListener("click",closeTOC);
$("themeBtn").addEventListener("click",()=>{ const h=document.documentElement; h.dataset.theme=h.dataset.theme==="dark"?"light":"dark"; });
function onScroll(){ const h=document.documentElement.scrollHeight-innerHeight; $("progress").style.width=(h>0?Math.min(100,scrollY/h*100):0)+"%"; }
addEventListener("scroll",onScroll,{passive:true});
addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeTOC(); return; }
  if($("toc").classList.contains("open")) return;
  if(e.key==="ArrowLeft"||e.key==="ArrowRight"){ toggleStyle(); }      // swap voice
  else if(e.key==="v"||e.key==="V"){ setLang(langSel==="vi"?"en":"vi"); }
});

/* ---------- init ---------- */
renderVseg(); render(); onScroll();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viết Cho Người · Writing for Humans</title>
<meta name="description" content="One reader, two languages, two voices (Human/AI). The complete guide — every word — switchable as you read.">
<style>
  :root{ --serif:"Iowan Old Style","Charter","Georgia","Times New Roman",serif; --maxw:680px; }
  [data-theme="light"]{
    --bg:#fbfaf6; --bg2:#f3efe6; --fg:#22201b; --muted:#736d62; --faint:#9a9488;
    --rule:#e6e0d2; --accent:#9a6a34; --accent2:#b98a4e; --card:#fffefb;
    --bar:rgba(251,250,246,.88); --shadow:rgba(60,48,28,.12);
  }
  [data-theme="dark"]{
    --bg:#181712; --bg2:#201e18; --fg:#e9e3d5; --muted:#a59e8e; --faint:#857c6b;
    --rule:#2e2b23; --accent:#cda66a; --accent2:#e0bd83; --card:#201e17;
    --bar:rgba(24,23,18,.9); --shadow:rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{ margin:0; background:var(--bg); color:var(--fg); font-family:var(--serif);
    font-size:19px; line-height:1.78; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    transition:background .4s,color .4s; padding-bottom:40px; }
  ::selection{ background:var(--accent2); color:#fff }

  #progress{ position:fixed; top:0; left:0; height:3px; width:0; z-index:60;
    background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .08s linear; }
  header{ position:sticky; top:0; z-index:50; background:var(--bar); backdrop-filter:blur(10px); border-bottom:1px solid var(--rule); }
  .hwrap{ max-width:1080px; margin:0 auto; padding:9px clamp(14px,4vw,28px); display:flex; align-items:center; gap:12px; }
  .brand{ font-weight:700; font-size:15px; white-space:nowrap }
  .brand small{ display:block; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); font-weight:400 }
  .spacer{ flex:1 }
  .seg{ display:flex; background:var(--bg2); border:1px solid var(--rule); border-radius:11px; padding:3px; gap:2px }
  .seg button{ font-family:var(--serif); cursor:pointer; border:none; background:none; color:var(--muted);
    padding:6px 13px; border-radius:8px; font-size:13.5px; white-space:nowrap; transition:.18s }
  .seg button:hover{ color:var(--fg) }
  .seg button.on{ background:var(--accent); color:#fff; box-shadow:0 2px 8px -2px var(--shadow) }
  .iconbtn{ cursor:pointer; border:1px solid var(--rule); background:var(--bg2); color:var(--fg);
    width:38px; height:38px; border-radius:10px; font-size:16px; display:grid; place-items:center; transition:.18s; flex:none }
  .iconbtn:hover{ border-color:var(--accent2); color:var(--accent) }

  /* floating Human/AI voice toggle — beside the text on wide screens, a bottom pill on narrow (never over text) */
  #voice{ position:fixed; z-index:45; display:flex; align-items:center; gap:8px;
    background:var(--bar); backdrop-filter:blur(10px); border:1px solid var(--rule);
    box-shadow:0 10px 30px -10px var(--shadow); border-radius:14px; padding:8px 9px; }
  #voice .cap{ font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint) }
  #voice .vseg{ display:flex; background:var(--bg2); border-radius:10px; padding:3px; gap:2px }
  #voice .vseg button{ font-family:var(--serif); cursor:pointer; border:none; background:none; color:var(--muted);
    padding:7px 14px; border-radius:8px; font-size:14px; transition:.18s; white-space:nowrap }
  #voice .vseg button.on{ background:var(--accent); color:#fff }
  #voice .hint{ font-size:10.5px; color:var(--faint); white-space:nowrap }
  #voiceH{ display:none }
  /* wide: float the voice toggle as a vertical pill in the right margin — beside the text, never over it */
  @media(min-width:1041px){
    #voice{ right:20px; top:50%; transform:translateY(-50%); flex-direction:column; }
    #voice .vseg{ flex-direction:column }
    #voice .hint{ text-align:center; max-width:96px }
  }
  /* narrow: no margin to float into → put the voice toggle in the header (never covers body text); swipe still works */
  @media(max-width:1040px){
    #voice{ display:none }
    #voiceH{ display:flex }
  }

  #cover{ max-width:var(--maxw); margin:0 auto; padding:clamp(44px,10vh,96px) clamp(20px,5vw,12px) 12px; }
  .eyebrow{ font-size:12px; letter-spacing:.28em; text-transform:uppercase; color:var(--accent) }
  #cover h1{ font-size:clamp(40px,8vw,68px); line-height:1.04; font-weight:700; margin:.2em 0 .25em; letter-spacing:-.01em }
  #cover .sub{ font-size:clamp(18px,3vw,23px); color:var(--muted); font-style:italic; max-width:26em; line-height:1.5 }
  #cover .author{ margin-top:1.8em; font-size:14px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint) }
  #cover .author b{ color:var(--fg); font-weight:700; letter-spacing:.02em; text-transform:none; font-size:16px }
  .scrollcue{ margin-top:2.6em; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--faint); display:flex; gap:10px; align-items:center }
  .scrollcue .a{ animation:bob 1.8s ease-in-out infinite } @keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(5px);opacity:1}}

  #reader{ max-width:var(--maxw); margin:0 auto; padding:0 clamp(20px,5vw,12px) 30px; transition:opacity .18s ease }
  #reader.swapping{ opacity:.0 }
  .chapter,.foreword{ padding:48px 0 12px; border-top:1px solid var(--rule); scroll-margin-top:72px }
  .foreword{ border-top:none }
  .ch-eyebrow{ font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:var(--accent) }
  .ch-title{ font-size:clamp(27px,5vw,39px); line-height:1.12; font-weight:700; margin:.18em 0 .9em; letter-spacing:-.01em }
  .ch-body>*:first-child{ margin-top:0 }
  .ch-body p{ margin:0 0 1.15em }
  .ch-body h3{ font-size:clamp(20px,3.4vw,25px); font-weight:700; margin:1.9em 0 .55em; line-height:1.25 }
  .ch-body h4{ font-size:18px; font-weight:700; margin:1.5em 0 .4em }
  .ch-body blockquote{ margin:1.4em 0; padding:.4em 0 .4em 22px; border-left:3px solid var(--accent2); font-style:italic }
  .ch-body ul,.ch-body ol{ margin:0 0 1.2em; padding-left:1.3em } .ch-body li{ margin:.35em 0 }
  .ch-body strong{ font-weight:700 }
  .ch-body code{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.86em; background:var(--bg2); padding:.08em .35em; border-radius:4px }
  .ch-body a{ color:var(--accent) }
  .ch-body hr{ border:none; border-top:1px solid var(--rule); margin:2em 0 }
  .ch-body table{ width:100%; border-collapse:collapse; margin:1.4em 0; font-size:15.5px }
  .ch-body th,.ch-body td{ border:1px solid var(--rule); padding:8px 12px; text-align:left; vertical-align:top; line-height:1.5 } .ch-body th{ background:var(--bg2); font-weight:700 }
  .foreword .ch-body p:last-child{ margin-top:1.6em; font-style:italic; color:var(--accent); font-weight:700 }

  footer{ max-width:var(--maxw); margin:0 auto; padding:40px clamp(20px,5vw,12px) 90px; color:var(--muted); font-size:14px; border-top:1px solid var(--rule) }
  footer .r{ width:54px; height:2px; background:var(--accent2); margin-bottom:18px }

  #toc{ position:fixed; inset:0; z-index:70; display:none } #toc.open{ display:block }
  #toc .scrim{ position:absolute; inset:0; background:rgba(20,16,10,.45); backdrop-filter:blur(2px) }
  #toc .panel{ position:absolute; top:0; bottom:0; left:0; width:min(380px,86vw); background:var(--bg); border-right:1px solid var(--rule);
    padding:24px 22px; overflow:auto; box-shadow:0 0 60px -10px var(--shadow); animation:slidein .28s cubic-bezier(.2,.7,.2,1) }
  @keyframes slidein{from{transform:translateX(-100%)}to{transform:none}}
  #toc h2{ font-size:13px; letter-spacing:.2em; text-transform:uppercase; color:var(--faint); margin:0 0 14px }
  #toc a{ display:block; color:var(--fg); text-decoration:none; padding:11px 12px; border-radius:9px; margin-bottom:2px; line-height:1.35; transition:.15s; border:1px solid transparent }
  #toc a:hover{ background:var(--bg2); border-color:var(--rule) }
  #toc a .n{ color:var(--accent); font-size:12px; letter-spacing:.1em; text-transform:uppercase; display:block; margin-bottom:2px }

  @media(max-width:720px){ .brand small{display:none} .brand{font-size:0} .brand::before{content:"VCN";font-size:14px} body{font-size:18px} }
  @media(prefers-reduced-motion:reduce){ *{animation:none!important} html{scroll-behavior:auto} #reader{transition:none} }
</style>
</head>

<header>

    <div class="brand">Viết Cho Người<small>Writing for Humans</small></div>

    <div class="seg" id="voiceH" aria-label="Voice (Human / AI)"></div>
    <div class="seg" id="langseg" aria-label="Language"></div>
    <button class="iconbtn" id="tocBtn" title="Mục lục / Contents" aria-label="Contents">☰</button>
    <button class="iconbtn" id="themeBtn" title="Sáng / Tối" aria-label="Toggle theme">◐</button>
  </div>
</header>

<div id="voice" aria-label="Voice (Human / AI)">
  <div class="cap" id="voiceCap">Giọng</div>

</div>

<section id="cover"></section>
<main id="reader"></main>
<footer id="footer"></footer>

<script>
"use strict";
const DATA = {"vi_h": [{"num": 1, "title": "Đám đông ở Dublin", "html": "<p>Tối Halloween năm 2024, hàng nghìn người đổ về trung tâm Dublin để xem diễu hành. Họ mặc đồ hóa trang, đứng dọc phố O'Connell, co ro trong gió, chờ đoàn rối khổng lồ mà ai đó hứa sẽ đi qua lúc bảy giờ. Bảy giờ trôi qua. Rồi tám giờ. Cảnh sát phải lên mạng đính chính: tối nay không có cuộc diễu hành nào hết, chưa từng có.</p>\n<p>Cái lịch sự kiện mà ngần ấy con người tin theo do một website ở tận Pakistan dựng lên — nội dung viết bằng AI, dàn trang đẹp đẽ, nhồi từ khóa đủ để leo lên đầu kết quả Google và hốt tiền quảng cáo. Không một dòng nào trên đó là thật. Vậy mà cả một thành phố đã bỏ buổi tối của mình ra đứng chờ một thứ không tồn tại.</p>\n<p>Tôi kể chuyện này trước tiên vì nó là cả cuốn sách thu lại trong một cảnh. Máy bây giờ tạo được thứ <em>trông</em> đáng tin, nhiều vô tận, gần như miễn phí. Con người đang bắt đầu trả giá cho điều đó. Và — đây mới là phần thú vị — con người đang bắt đầu phản ứng.</p>\n<h3>Khi cả một nền văn hóa gọi tên thứ nó ghét</h3>\n<p>Cuối năm 2025, hai cơ quan ngôn ngữ lâu đời nhất của tiếng Anh, Merriam-Webster và American Dialect Society, mỗi bên độc lập chọn cùng một từ làm Từ của Năm. Từ đó là <em>slop</em> — nghĩa gốc là thức ăn thừa nhão nhoét người ta đổ cho lợn ăn.</p>\n<p>Dân mạng đã mượn cái từ bẩn thỉu ấy để gọi một thứ rất cụ thể: nội dung do AI đẻ ra hàng loạt, trơn tru ở bề mặt mà rỗng tuếch bên trong, sinh ra để câu click chứ không để giúp ai. Khi cả một nền văn hóa chọn từ \"cám lợn\" để mô tả thứ mình đọc mỗi ngày, đó không còn là chuyện khẩu vị nữa. Đó là một bản án.</p>\n<p>Điều đáng nói về thứ \"cám\" này là nó luôn có ba tính chất đi cùng nhau. Nó trông có vẻ ổn — đúng chính tả, đủ ý, mạch lạc, thoạt nhìn không chê được. Nó tốn của người làm vài giây, nhưng bắt người đọc bỏ ra công thật để đọc, rồi bỏ thêm công nữa mới nhận ra mình vừa đọc một thứ không có gì. Và nó đẻ được hàng loạt — một người ngồi một buổi sáng có thể bơm ra mười nghìn bài.</p>\n<p>Cái tính chất ở giữa mới là gốc của cơn giận. Người đọc cảm thấy bị móc túi, mà thứ bị móc là thời gian: họ đã trả ra một thứ thật — sự chú ý của mình — để đổi lấy một thứ không ai thực sự nghĩ ra.</p>\n<h3>Nó nhiều hơn bạn tưởng</h3>\n<p>Cảm giác \"đâu cũng thấy\" không phải do bạn nhạy cảm. Vài lát cắt có số đo:</p>\n<p>Một điều tra của <em>New York Times</em> đầu năm 2026 ước tính khoảng bốn trên mười video mà YouTube gợi ý cho trẻ em là slop do AI dựng. Trên Deezer, nền tảng nhạc số, có lúc tới bảy trên mười lượt nghe các bản nhạc AI là giả — bot bật nhạc cho bot nghe, để ăn tiền bản quyền. Còn trong công sở, một khảo sát của <em>Harvard Business Review</em> thấy bốn trên mười nhân viên đã từng nhận cái mà họ gọi là \"workslop\": thứ việc trông như xong, nhưng thật ra chỉ đẩy phần khó sang cho người nhận — mỗi lần như vậy ngốn trung bình hai tiếng đồng hồ để dọn.</p>\n<p>Để ý cái mẫu số chung. Ở mọi trường hợp, chi phí bị đẩy từ người tạo sang người nhận. Đó đúng là định nghĩa của ô nhiễm. Slop là ô nhiễm của nền kinh tế chú ý — và như mọi thứ ô nhiễm, nó khiến người ta bắt đầu dựng hàng rào.</p>\n<h3>Ba hàng rào đang dựng lên</h3>\n<p>Người đọc đang học cách ngửi. Một độc giả năm 2026 lướt qua hai câu đầu của một bài và thấy \"sai sai\" — cái giọng đều đều, lịch sự quá mức, sạch đến mức không có lấy một hạt sạn của người thật. Họ chưa chứng minh được gì cả. Họ chỉ đóng tab. (Chuyện <em>cái gì</em> khiến họ ngửi thấy, ta để dành cho chương ba.)</p>\n<p>Google cũng đang siết. Họ nói thẳng rằng hệ thống xếp hạng của mình tìm cách dìm những nội dung sản xuất hàng loạt mà thiếu trải nghiệm và chuyên môn thật, và đề cao thứ viết \"cho người, không cho cỗ máy tìm kiếm\". Năm 2022 họ còn thêm hẳn một chữ vào bộ tiêu chí chất lượng của mình: chữ <em>Experience</em> — trải nghiệm trực tiếp. Một chi tiết quan trọng mà ta sẽ quay lại ở chương sáu: Google bảo họ không phạt nội dung chỉ vì nó do AI viết. Họ phạt nội dung rỗng. Mà slop AI thì thường rỗng.</p>\n<p>Và những người làm nghề — biên tập viên, khách hàng, giám khảo — bắt đầu hỏi một câu nhỏ mà sắc: \"ai thật sự viết cái này?\". Như chương sau sẽ cho thấy, chỉ riêng cái nghi ngờ ấy thôi — chỉ riêng cảm giác \"hình như là máy\" — đã đủ kéo tụt giá trị của một bài viết, kể cả khi nó hay.</p>\n<h3>Thủ phạm bị nghi oan: độ dài</h3>\n<p>Có một niềm tin đang lan, rằng người ta giờ lười đọc bài dài. Niềm tin đó có cơ sở, nhưng nói vậy là nói lệch, và chỗ lệch này quan trọng đến mức tôi muốn bạn nhớ nó hơn mọi thứ khác trong chương.</p>\n<p>Sự thật không phải người ta ghét bài dài. Sự thật là AI đã làm cho việc kéo dài trở nên miễn phí, nên độ dài mất sạch ý nghĩa. Ngày trước, một bài ba nghìn chữ ngầm nói rằng có người đã bỏ công ra — độ dài là bằng chứng của nỗ lực. Bây giờ một câu lệnh đẻ ra ba nghìn chữ trong sáu giây. Độ dài không còn chứng minh điều gì nữa. Tệ hơn, nó thành gánh nặng: ba nghìn chữ rỗng là ba nghìn chữ ăn cắp thời gian của người đọc.</p>\n<p>Cho nên người ta không bỏ chạy khỏi sự <em>dài</em>. Họ bỏ chạy khỏi sự <em>loãng</em>. Đưa họ một bài dài mà đoạn nào cũng cho họ một thứ mới, họ sẽ đọc tới chữ cuối. Thứ họ đóng tab là bài lẽ ra chỉ cần ba câu mà kéo thành ba trang — thứ văn xài mười từ để nói điều một từ là đủ.</p>\n<p>Kẻ thù không phải độ dài. Kẻ thù là độ loãng. Viết cho người không có nghĩa là viết ngắn — mà là không phí một câu nào của người đang đọc.</p>\n<p>Chương sau sẽ cho bạn thấy <em>vì sao</em> sự loãng và mùi máy lại khiến đầu óc người ta dửng dưng đến thế. Và vì sao, kỳ lạ thay, ngay cả một bài đúng và hay cũng bị trừ điểm chỉ vì người đọc <em>ngờ</em> rằng máy đã viết nó.</p>"}, {"num": 2, "title": "Ba lý do người ta đóng tab", "html": "<p>Có ba thứ kéo người đọc rời khỏi văn máy. Chúng không liên quan gì đến nhau, nhưng cộng lại thì thành một bức tường. Hiểu cả ba, bạn sẽ biết mình đang thật sự đánh nhau với cái gì — chứ không phải mài giũa câu chữ trong bóng tối.</p>\n<h3>Thứ nhất: không ai đọc cả. Người ta quét.</h3>\n<p>Đây là phát hiện làm nhiều người viết tự ái, nhưng nó được đo bằng máy, suốt gần hai mươi năm. Nhóm Nielsen Norman Group gắn thiết bị theo dõi mắt người dùng và kết luận một điều phũ phàng: trên màn hình, người ta không đọc. Người ta quét.</p>\n<p>Mấy con số để bạn hình dung mình đang đối diện với ai. Một lượt ghé trang trung bình kéo dài chưa tới một phút. Trong chừng ấy thời gian, người ta đọc được nhiều lắm là một phần tư số chữ trên trang. Và mắt họ không đi đều — nó vạch một hình chữ F: quét ngang gần hết dòng đầu, tụt xuống quét ngang ngắn hơn, rồi rơi dọc theo mép trái, mỗi dòng chỉ liếc đúng hai ba chữ đầu.</p>\n<p>Hệ quả tàn nhẫn mà rõ: chữ thứ ba trên một dòng đã ít được nhìn hơn hẳn hai chữ đầu. Thứ quý nhất của bạn phải nằm ở ngay đầu — đầu tiêu đề, đầu đoạn, đầu mỗi dòng — vì đó là chỗ duy nhất mắt người chắc chắn đi qua.</p>\n<p>Bây giờ nhìn lại văn máy. Nó mở đoạn bằng đệm: \"Điều quan trọng cần lưu ý là…\", \"Trong bối cảnh hiện nay…\". Tức là nó ném hai ba từ đắt giá nhất vào sọt rác, rồi mới lò dò tới phần có thịt ở giữa câu. Người đang quét theo chữ F chỉ vớ được lớp đệm rỗng, không thấy gì đáng, và lướt. Bài có thể đủ ý lắm. Nhưng đủ ý mà giấu thịt ở giữa thì với một người đang quét, nó vô hình.</p>\n<p>Bạn không viết cho một người đọc. Bạn viết cho một người quét — và bạn phải thắng họ ở mấy chữ đầu tiên, nếu không thì sẽ chẳng có chữ tiếp theo nào được nhìn.</p>\n<h3>Thứ hai: cái tên người trên bài đáng giá hơn bạn nghĩ</h3>\n<p>Đây là phát hiện ngược đời nhất, và là quân bài mạnh nhất cho cả cuốn sách.</p>\n<p>Một nhóm nhà nghiên cứu làm tới mười sáu thí nghiệm, với hơn hai mươi bảy nghìn người. Họ đưa cho người ta đọc những đoạn văn sáng tạo — tản văn, truyện ngắn — rồi bảo chấm điểm. Mẹo nằm ở chỗ: các đoạn văn <em>giống hệt nhau</em> giữa các nhóm. Thứ duy nhất khác là người ta được bảo rằng nó do AI viết, hay do một người viết.</p>\n<p>Kết quả lặp lại bền đến mức không cãi được: hễ tin rằng có AI nhúng tay vào, người ta chấm thấp hơn. Thấp hơn trung bình khoảng sáu phẩy hai phần trăm, dù từng con chữ không đổi.</p>\n<p>Phần hay nằm ở câu hỏi <em>tại sao</em>. Các nhà nghiên cứu gạt được hết những lời giải thích dễ đoán: mức trừ điểm này không phải vì người ta thấy chất lượng kém hơn, không phải vì văn khó hiểu hơn, không phải vì cảm xúc nhạt hơn, cũng không phải vì người ta ghét AI nói chung. Lý do thật tinh hơn nhiều. Đó là <em>tính thật</em>. Khi biết có máy dính vào, người ta thấy đoạn văn \"ít giống đến từ một con người thật\" hơn — và chính cái cảm giác mất-tính-thật ấy kéo điểm xuống.</p>\n<p>Dừng ở đây một nhịp, vì nó lật ngược trực giác:</p>\n<p>Người đọc không trừng phạt văn AI vì nó dở. Họ trừng phạt nó vì nó không phải của ai cả. Cùng một câu chữ, gắn tên một con người vào thì có giá; đóng nhãn máy thì mất giá. Thứ người ta thật sự trả tiền không phải là câu chữ hay — mà là cảm giác có một con người đứng sau câu chữ đó.</p>\n<p>Có một biến thể của phát hiện này còn làm tôi lạnh gáy hơn. Một nghiên cứu khác, trên bốn trăm ba mươi ba người, tìm ra cái họ gọi là hiệu ứng giao chéo thật–giả: dán nhãn \"AI\" lên một thông tin <em>thật</em> khiến người ta bớt tin nó, nhưng dán cùng cái nhãn ấy lên một thông tin <em>giả</em> lại khiến người ta tin nó hơn. Nói cách khác, nhãn \"AI\" không phải một tín hiệu chất lượng đáng tin gì cả — nó là một cú đá vào cảm xúc, mà lại đá lung tung. (Chuyện \"vậy rốt cuộc có nên thú nhận dùng AI không\" hóc búa thật sự; tôi để dành nó cho chương cuối.)</p>\n<p>Bài học cho người viết không phải là \"giấu cho khéo việc mình dùng AI\". Bài học là: thứ người đọc khao khát là dấu vết của một con người. Nếu văn bạn không mang dấu vết đó — một góc nhìn, một trải nghiệm, một lựa chọn mà chỉ bạn mới làm — thì nó sẽ <em>cảm giác như</em> máy viết, kể cả khi bạn gõ tay từng chữ. Và như ta vừa thấy, \"cảm giác như máy\" thôi đã đủ để bị phạt.</p>\n<h3>Thứ ba: cái đầu thưởng cho bất ngờ, phạt cái đoán trước được</h3>\n<p>Lý do cuối đến từ cách bộ não làm việc. Não là một cỗ máy đoán: nó liên tục dự đoán từ tiếp theo, ý tiếp theo. Khi thứ đến đúng y như nó đoán, nó tiết kiệm sức bằng cách ngừng chú ý. Khi thứ đến lệch khỏi dự đoán một cách có nghĩa, nó bật dậy.</p>\n<p>Đây đúng là gót chân Achilles của văn máy. Một mô hình ngôn ngữ, theo đúng thiết kế, luôn chọn từ dễ đoán nhất — bản chất nó là cỗ máy tính xác suất cho chữ kế tiếp, và trung bình hóa hàng tỉ câu là việc nó giỏi nhất đời. Cho ra một thứ văn mượt mà, đúng đắn, và đoán trước được tới từng khúc cua. Với một bộ não thèm bất ngờ, đó là liều thuốc ngủ.</p>\n<p>Người viết giỏi làm điều ngược lại gần như theo bản năng. Họ thả một từ bạn không ngờ tới. Một phép so sánh kéo về từ một thế giới chẳng liên quan. Một câu cụt lủn ngay sau ba câu dài. Mỗi cú lệch nhỏ ấy là một liều dopamine tí hon, đủ giữ mắt người đọc ở lại thêm một câu. Văn người thường giật cục. Văn máy thường phẳng lì. (Dân kỹ thuật có chữ riêng cho hai thứ này, và buồn cười thay, đó cũng chính là cái mà các công cụ dò-AI cố đo: độ khó-đoán của từ, và độ dao động của nhịp câu.)</p>\n<h3>Ba thứ, một lối ra</h3>\n<p>Ba lực này độc lập nhau, nhưng có một điều đẹp đẽ: cả ba cùng chỉ về một lối thoát.</p>\n<p>Viết sao cho thịt nằm ngay đầu, để thắng người đang quét. Viết sao cho có một con người thật sau từng câu, để qua được cái hình phạt giáng lên thứ \"không của ai cả\". Và viết sao cho đủ bất ngờ để cái đầu người đọc chịu tỉnh. Làm được ba điều đó cùng lúc, bạn không phải chiều ba ông chủ khác nhau — bạn chỉ đang làm đúng một việc.</p>\n<p>Việc ấy là gì, chương bốn sẽ chỉ. Nhưng trước hết phải biết mặt kẻ địch đã — phải gọi được tên cái mùi mà người đọc ngửi thấy rồi bỏ đi. Đó là chương sau.</p>"}, {"num": 3, "title": "Mùi của máy", "html": "<p>Trước khi học viết cho người, phải nhìn rõ thứ mình đang muốn tránh. Và điều đầu tiên cần hiểu là: văn máy không \"dở\" theo kiểu sai chính tả, lủng củng. Ngược lại. Nó quá sạch. Cái mùi của nó không phải mùi lỗi — mà là mùi của sự hoàn hảo vô hồn.</p>\n<p>Cho tôi rào trước một câu, vì chương này dễ bị dùng sai. Không một dấu hiệu nào dưới đây, đứng một mình, là bằng chứng cả. Người viết giỏi cũng xài dấu gạch ngang. Người thật cũng có lúc lỡ miệng \"điều quan trọng là\". Mấy dấu hiệu này chỉ có nghĩa khi chúng <em>chụm lại với nhau</em> và khi <em>cảm giác về một con người đã bị rút cạn</em>. Hãy đọc nó như bác sĩ đọc triệu chứng, đừng đọc như cảnh sát cầm lệnh bắt.</p>\n<p>Cái mùi ấy đến từ bốn chỗ. Đi từ chỗ dễ ngửi nhất.</p>\n<h3>Những từ bốc mùi mô hình</h3>\n<p>Sau khi ChatGPT phổ biến vào cuối năm 2022, các nhà ngôn ngữ học đo được một chuyện lạ: một nhúm từ vốn hiếm gặp bỗng tăng vọt — có từ tăng tới chín, mười lần, có từ tăng tới hai mươi lăm lần — trong văn bản học thuật, và lan cả sang lời nói trong các nội dung giáo dục. Trong tiếng Anh, đó là mấy chữ như <em>delve, meticulous, underscores, crucial, tapestry, realm, testament</em>. Chúng trở thành thứ dấu vân tay vô tình.</p>\n<p>Tiếng Việt có họ hàng riêng của nó. Bạn biết ngay khi gặp: \"đa dạng và phong phú\", \"vô cùng quan trọng\", \"không thể phủ nhận\", \"đóng vai trò then chốt\", \"trong bối cảnh hiện nay\", \"nhằm mục đích\", \"góp phần\", \"một cách hiệu quả\", \"đáng kể\", \"khai phá tiềm năng\", \"tối ưu hóa trải nghiệm\", \"nâng tầm\". Không phải mấy chữ này bị cấm. Vấn đề là mật độ và sự rỗng. Khi đoạn nào cũng có một \"vô cùng quan trọng\" gánh một \"đóng vai trò then chốt\", người đọc ngửi thấy khuôn.</p>\n<h3>Những khung câu sáo rỗng</h3>\n<p>Văn máy nghiện một số khuôn câu, vì chúng an toàn, trơn, và nhan nhản trong dữ liệu nó học. Bạn nhận ra chúng ngay.</p>\n<p>Cái mở bài tổng quát hóa — \"Trong thời đại số ngày nay…\", \"Trong một thế giới ngày càng…\" — kiểu mở mà cứ hai bài blog thì gặp một, và nó không nói gì cả, chỉ hắng giọng. Cái đệm giả vờ nhấn mạnh — \"Điều quan trọng cần lưu ý là…\" — mà bỏ đi thì câu mạnh hơn. Cái khuôn \"không chỉ… mà còn…\", nghe sâu sắc nhưng phần lớn chỉ là một cách kéo dài; \"not just\" nằm trong nhóm cụm bị các công cụ phân tích chấm là lạm dụng nhiều nhất. Những cặp tương liên xếp chồng — \"một mặt… mặt khác…\", \"không những… mà còn…\" — một cái thì duyên, ba cái một đoạn thì là máy. Và cái câu giả-insight: \"Điều này cho thấy một sự thật sâu sắc hơn…\", rồi câu sau nói ra một điều ai cũng biết.</p>\n<h3>Cái khuôn năm-đoạn bất tử</h3>\n<p>Dấu vân tay khó giấu nhất không nằm ở chữ, mà ở <em>hình dạng</em> của bài. Văn máy có một bộ xương cứng đơ: mở bài tổng quát hóa kèm một câu báo trước sẽ nói ba ý; đúng ba ý thân bài, không hai không bốn, luôn luôn ba; mỗi ý một câu chủ đề, vài câu khai triển, một câu chốt; rồi kết bài mở bằng \"Tóm lại\" và lặp lại y nguyên ba ý vừa nói.</p>\n<p>Cái luật-số-ba ấy lộ nhất. Máy chia mọi thứ thành ba — ba lý do, ba bước, ba lợi ích — kèm gạch đầu dòng đều tăm tắp. Mà đời thật hiếm khi gọn gàng thành đúng ba. Khi một bài <em>luôn luôn</em> ra số ba và <em>luôn luôn</em> có bullet, đó là khuôn, không phải suy nghĩ.</p>\n<p>Bạn có quyền bắt bẻ tôi ở đây: chính chương trước cũng chia \"ba lực\" đấy thôi. Đúng. Khác biệt nằm ở chỗ con số đến <em>sau</em> khi nghĩ, chứ không phải <em>trước</em>. Tôi tìm thấy đúng ba lực vì hóa ra có ba; nếu có bốn tôi đã nói bốn. Khuôn máy thì làm ngược lại — nó quyết \"phải có ba\" trước, rồi đi nhồi ý cho đủ.</p>\n<h3>Sự phẳng lì</h3>\n<p>Tầng cuối là tầng tinh vi nhất, và là tầng cái tai bắt được trước cả khi cái đầu kịp phân tích.</p>\n<p>Văn người giật cục. Một câu dài, lê thê, ôm bao nhiêu mệnh đề, rồi — phanh. Câu hai chữ. Người viết thật đổi độ dài câu theo cảm xúc của chính mình, thả một câu hỏi, bỏ lửng một ý, xuống dòng giữa chừng vì muốn thế.</p>\n<p>Văn máy thì phẳng lì. Câu nào cũng tầm tầm mười lăm đến hai lăm chữ, cấu trúc na ná, đều như nhịp một cái máy đếm. Không có câu nào cụt vì sốt ruột, không có câu nào dài bất thường vì người viết đang mê mải. Cái sự <em>đều</em> ấy, kỳ lạ thay, lại là thứ phản tự nhiên nhất — vì cảm xúc của con người chẳng bao giờ đều.</p>\n<h3>Vì sao học xong bốn tầng này bạn vẫn sẽ bị lừa</h3>\n<p>Bạn có thể nghĩ, đọc tới đây thì nhìn phát ra ngay. Sự thật khiêm tốn hơn nhiều, và tôi phải nói thẳng kẻo bạn tự tin quá tay.</p>\n<p>Trong một nghiên cứu, chín mươi tư phần trăm bài thi đại học do ChatGPT viết đã lọt qua mắt giám khảo. Các thành viên ban biên tập một tạp chí ngôn ngữ học — những người sống bằng nghề đọc — cũng không phân biệt nổi đâu là tóm tắt do người viết, đâu do máy. Máy dò chuyên dụng thì khá hơn người, đúng được tám đến chín mươi mấy phần trăm, nhưng chúng là hộp đen: ngay người tạo ra cũng không chắc chúng dựa vào đặc trưng nào, nên chúng vừa dễ sai vừa dễ bị qua mặt.</p>\n<p>Và đây là cú lật quan trọng nhất của cả chương. Cái dấu gạch ngang — thứ bị gán nhãn \"dấu của ChatGPT\" nhiều hơn mọi thứ khác — thật ra là dấu hiệu của người viết <em>lành nghề</em>. Người ta gọi nó là \"gạch ngang ChatGPT\" rồi đi nghi oan vô số nhà văn thật. Nghĩ mà xem: nếu đến con người còn nhầm văn-hay thành văn-máy, thì việc lao đi \"qua mặt máy dò\" là một cuộc đua sai từ vạch xuất phát.</p>\n<h3>Vậy chương này để làm gì</h3>\n<p>Không phải để biến bạn thành thám tử săn AI. Mà để bạn nghe ra cái khuôn trong văn của <em>chính mình</em> — kể cả khi bạn gõ tay từng chữ. Bốn tầng dấu vân tay là một tấm gương. Đọc lại bản nháp của bạn và hỏi một câu: đoạn này có mùi khuôn không? Nếu có, thì xin chúc mừng — bạn vừa tìm ra đúng chỗ cần chữa.</p>\n<p>Cách chữa là chương tiếp theo.</p>"}, {"num": 4, "title": "Viết như thể bạn có mặt ở đó", "html": "<p>Chương trước cho ta ba lực phải thắng: người đang quét, người đòi tính thật, và cái đầu thèm bất ngờ. Chương này biến chúng thành những việc làm được. Có bảy cái, nhưng đừng coi chúng là \"mẹo\" — chúng chỉ là bảy cách trả lại cho câu chữ thứ mà máy không có: một con người cụ thể, ở một thời điểm cụ thể, có gì đó để mất.</p>\n<p><strong>Cụ thể đến mức không ai khác viết được.</strong> Đây là nguyên tắc gốc; sáu cái sau chỉ là biến tấu của nó. Lời khuyên cổ nhất trong nghề viết vẫn đúng nhất — <em>cho thấy, đừng kể</em> — và linh hồn của nó là sự cụ thể. Đừng viết \"con chim\", viết \"con sáo\". Đừng viết \"đôi giày\", viết \"đôi giày bata trắng bợt quai sau trận mưa tháng Bảy\". Vì sao điều này đánh bại máy? Vì máy luôn kéo về trung bình, mà trung bình của mọi đôi giày là \"đôi giày\". Cái đôi giày mưa tháng Bảy kia chỉ đến được từ một người đã thật sự ở đó. Chi tiết càng riêng, dấu vết con người càng đậm — và đó đúng là thứ người đọc đang khao khát. Phép thử rất gọn: đọc lại một câu và tự hỏi, câu này có thể nằm trong bài của mười nghìn người khác không? Nếu có, nó chưa phải của bạn.</p>\n<p><strong>Bỏ thịt ra đầu.</strong> Người ta quét chứ không đọc, nên đừng hắng giọng. Câu \"Có một điều mà nhiều người làm marketing thường hay bỏ qua, đó là tốc độ tải trang\" và câu \"Tốc độ tải trang là thứ dân marketing hay quên nhất\" nói đúng một điều — nhưng câu sau đặt \"tốc độ tải trang\" ngay nơi mắt người chắc chắn đi qua, còn câu trước bắt họ lội qua \"Có một điều mà…\" rỗng tuếch rồi mới tới phần đáng. Người đang quét sẽ không lội. Họ lướt.</p>\n<p><strong>Cho nhịp câu giật cục.</strong> Cái đầu thưởng cho bất ngờ, mà nhịp đều là thứ đoán-trước-được nhất đời. Cách chữa đơn giản tới mức gần như ăn gian: cố tình đổi độ dài câu. Một câu dài để cuốn người ta đi, rồi một câu ngắn để chốt. Như vừa rồi. Hãy đọc to bản nháp của bạn lên — nếu hơi thở đều đều như đếm nhịp, là văn đang phẳng. Chèn một câu ba chữ. Tách một câu dài làm đôi. Hỏi một câu. Cái sự giật cục đó chính là âm thanh của một người đang nghĩ, không phải một cái máy đang xuất.</p>\n<p><strong>Có một quan điểm — và dám sai.</strong> Máy được huấn luyện để cân bằng, vô hại, không làm mếch lòng ai. Đó là lý do văn nó nghe như thông cáo báo chí của một công ty sợ bị kiện. \"Có nhiều ý kiến khác nhau, mỗi cách đều có ưu nhược điểm riêng\" là một câu không đặt cược gì hết. Còn \"Tôi cho rằng phần lớn khóa học viết content đang dạy sai, và đây là chỗ tôi nghĩ họ nhầm\" là một câu <em>có thể sai</em> — và chính cái khả-năng-sai ấy là bằng chứng rõ nhất rằng có một con người đứng sau, đang đem danh dự mình ra cược.</p>\n<p><strong>Kể, đừng liệt kê.</strong> Gạch đầu dòng là tiếng mẹ đẻ của máy. Còn bộ não người thì được lập trình cho truyện: có nhân vật, có mong muốn, có trở ngại, có hậu quả. Một danh sách \"5 lợi ích của dậy sớm\" trôi tuột khỏi trí nhớ; còn \"sếp tôi dậy lúc 5 giờ sáng, và đây là thứ tôi thấy sau một tháng thử bắt chước ông\" thì dính. Tôi không bảo bỏ hẳn gạch đầu dòng — đôi khi danh sách đúng là công cụ phải dùng. Tôi chỉ bảo: đừng để danh sách <em>thay cho</em> suy nghĩ. Ý nào đáng được kể thành chuyện thì đừng nén nó thành một cái bullet.</p>\n<p><strong>Để lại một hạt sạn của con người.</strong> Văn máy sạch một cách phi tự nhiên. Văn người thì có kết cấu: một câu chêm, một lời thú nhận, một chỗ tự cười mình. Một chỗ ngập ngừng thật — \"tôi vẫn chưa chắc về điều sắp nói, nhưng…\". Một chi tiết đời — viết đoạn này lúc một giờ sáng, ly cà phê thứ ba. Những hạt sạn ấy không phải lỗi; chúng là bằng chứng của sự sống. Nhưng cẩn thận: sạn phải thật, không phải diễn. Một \"sự ngẫu hứng\" được dàn dựng còn lộ hơn cả văn máy thẳng đơ. Cho nên mẹo an toàn nhất không phải là <em>thêm</em> sạn giả vào, mà là <em>đừng chà nhẵn</em> những hạt sạn thật mà bản nháp đầu của bạn vốn đã có.</p>\n<p><strong>Viết cho một người, không cho \"đối tượng mục tiêu\".</strong> Máy nói với \"người dùng\", với \"quý khách hàng\", với \"các bạn độc giả thân mến\" — một đám đông trừu tượng. Văn dính thì nói với đúng một người. Hãy tưởng tượng một người bạn cụ thể, có tên, mà bạn đang nhắn tin, và viết cho người đó. Giọng tự khắc ấm lên, đại từ tự khắc đúng, và cái khoảng cách thông-cáo-báo-chí biến mất. Đây là lý do một lá thư của bạn thân luôn dễ đọc hơn một bài blog \"chuẩn SEO\" dài gấp mười lần: lá thư được viết cho <em>bạn</em>, còn bài blog được viết cho <em>thuật toán</em>.</p>\n<hr>\n<p>Bảy nguyên tắc, nhưng nếu phải vứt sáu và giữ một, hãy giữ cái này, vì sáu cái kia đều chảy ra từ nó:</p>\n<p><strong>Viết sao cho không ai khác viết được câu đó.</strong></p>\n<p>Máy giỏi nhất ở việc tạo ra thứ mà ai cũng có thể đã viết. Vậy thì mọi thứ mang dấu riêng của bạn — một chi tiết bạn tận mắt thấy, một quan điểm bạn dám cược, một nhịp thở của riêng bạn, một người đọc mà bạn thật lòng đang nói với — đều là vùng đất máy không đặt chân vào được.</p>\n<p>Nghe thì rõ. Nhưng nguyên tắc chỉ sống khi bạn thấy nó chữa một đoạn văn thật. Đó là việc của chương sau — trái tim của cuốn sách, nơi ta đem mười đoạn văn ra mổ.</p>"}, {"num": 5, "title": "Trước và sau", "html": "<p>Đây là trái tim cuốn sách. Ba chương lý thuyết vừa rồi chỉ có nghĩa khi bạn thấy nó chữa một đoạn văn thật. Nên dưới đây là mười lần chữa. Mỗi lần, bản \"Trước\" là kiểu viết-cho-có, loãng và vô danh; bản \"Sau\" là cùng thông tin ấy, nhưng có một con người sau câu chữ. Để ý: hai bản nói đúng một điều. Chỗ khác nhau không phải nội dung — mà là có hay không một người thật ở trong đó.</p>\n<p>Một lời thú nhận trước, để tôi khỏi mắc đúng cái tật cuốn sách này lên án. Mấy bản \"Sau\" dưới đây là tôi <em>dựng ra</em> để minh hoạ kỹ thuật — chúng là mô hình, không phải trích từ đời thật của ai. Tức là chúng diễn cái \"dấu vết người\" chứ không <em>mang</em> nó. Tôi nói rõ điều đó vì ở chương cuối tôi sẽ cảnh báo bạn về \"sự ngẫu hứng dàn dựng\": một cái phòng thí nghiệm thì được phép dựng cảnh, nhưng văn thật gửi cho người thật thì cái \"Sau\" của nó phải múc từ một đời sống có thật — của bạn.</p>\n<p><strong>Một, mở bài blog.</strong></p>\n<blockquote><em>\"Trong thời đại số ngày nay, content marketing đóng vai trò vô cùng quan trọng đối với sự phát triển của mọi doanh nghiệp. Bài viết này sẽ cung cấp cho bạn những thông tin hữu ích và cần thiết để tối ưu hóa chiến lược nội dung của mình một cách hiệu quả.\"</em></blockquote>\n<blockquote><em>\"Tháng trước tôi xóa 200 bài blog của công ty mình. Traffic không giảm. Đó là lúc tôi hiểu mình đã hiểu sai về content suốt bốn năm.\"</em></blockquote>\n<p>Bản trên hắng giọng suốt hai câu mà không nói gì. Bản dưới đặt một con số thật và một lời thú nhận ngay nơi mắt người chắc chắn đi qua, rồi mở ra một câu chuyện — người đang quét không thể không đọc câu kế tiếp.</p>\n<p><strong>Hai, mô tả một quán cà phê.</strong></p>\n<blockquote><em>\"Chúng tôi tự hào mang đến cho quý khách những trải nghiệm cà phê tuyệt vời nhất với hạt cà phê chất lượng cao được tuyển chọn kỹ lưỡng, phục vụ trong không gian sang trọng và hiện đại.\"</em></blockquote>\n<blockquote><em>\"Cà phê của chúng tôi rang ở đây, mỗi sáng, lúc 6 giờ — nên 8 giờ bạn tới là thơm nhất. Ngồi bàn trong cùng đi, gần cửa sổ, chỗ đó nắng tới tầm 9 rưỡi.\"</em></blockquote>\n<p>Bản trên là một bản thông cáo: \"tự hào mang đến\", \"tuyệt vời nhất\" — vô danh, không kiểm chứng được, ai bán gì cũng nói y vậy. Bản dưới không có lấy một tính từ khoe; nó chỉ có chi tiết, mà chính chi tiết — sáu giờ, chỗ nắng tới chín rưỡi — mới làm nên cái sang. Và nó nói với một người: <em>bạn</em> tới, <em>bạn</em> ngồi.</p>\n<p><strong>Ba, một bài trên mạng nghề nghiệp.</strong></p>\n<blockquote><em>\"Thành công không đến từ may mắn, mà đến từ sự kiên trì và nỗ lực không ngừng. Mỗi thất bại là một bài học quý giá giúp chúng ta trưởng thành hơn. Hãy luôn tin vào bản thân! 💪 #motivation #success\"</em></blockquote>\n<blockquote><em>\"Tôi bị từ chối ở vòng cuối, lần thứ ba trong năm. Người phỏng vấn nói một câu tôi nhớ mãi: 'Em giỏi, nhưng em đang phỏng vấn như đang xin xỏ.' Mất sáu tháng tôi mới hiểu bà ấy đúng.\"</em></blockquote>\n<p>Bản trên là trí tuệ phổ quát — đúng, nhưng đúng với tất cả mọi người nên chẳng dính với ai. Bản dưới cụ thể và đau, và để ý điều này: nó <em>không</em> có câu kết \"bài học rút ra là…\". Nó để bạn tự rút. Đó là một sự tôn trọng, và là một thứ rất người.</p>\n<p><strong>Bốn, email cho khách.</strong></p>\n<blockquote><em>\"Kính gửi Quý khách, Chúng tôi xin trân trọng thông báo rằng đơn hàng của Quý khách hiện đang được xử lý. Chúng tôi cam kết mang đến dịch vụ tốt nhất và rất mong nhận được sự thông cảm trong thời gian chờ đợi.\"</em></blockquote>\n<blockquote><em>\"Chào chị Lan, đơn của chị đang kẹt ở khâu đóng gói vì bên kho thiếu người dịp lễ — em xin lỗi. Em đã nhờ ưu tiên, chậm nhất thứ Tư là đi. Em sẽ nhắn lại chị khi nó rời kho.\"</em></blockquote>\n<p>Bản trên trốn sau giọng bị động và sáo ngữ để <em>che</em> việc đang trễ. Bản dưới nói thẳng cái sự trễ, xin lỗi, hẹn một ngày cụ thể, gọi tên chị Lan. Trung thực cộng cụ thể xây niềm tin nhanh hơn mọi lời \"cam kết mang đến dịch vụ tốt nhất\".</p>\n<p><strong>Năm, một đoạn giải thích kỹ thuật.</strong></p>\n<blockquote><em>\"Bộ nhớ đệm (cache) là một thành phần quan trọng giúp tối ưu hóa hiệu suất hệ thống bằng cách lưu trữ tạm thời dữ liệu thường xuyên được truy cập, từ đó giảm thiểu thời gian phản hồi một cách đáng kể.\"</em></blockquote>\n<blockquote><em>\"Cache giống chỗ bạn để chìa khóa ngay cửa. Thay vì mỗi lần ra ngoài lại lục khắp nhà (truy vấn database), bạn vớ cái là có. Đổi lại: nếu đổi khóa mà quên thay chìa ở cửa, bạn cầm nhầm chìa cũ — đó là 'cache cũ', cơn ác mộng của mọi lập trình viên.\"</em></blockquote>\n<p>Bản trên đúng nhưng trừu tượng, đầy chữ đệm. Bản dưới mượn một hình ảnh đời thường, và quan trọng hơn, nó kể cả mặt trái — cái chìa cũ — thứ mà một đoạn quảng cáo tính năng sẽ giấu đi. Dạy bằng hình ảnh sống là việc rất khó cho máy, vì nó đòi một đời sống thật để mà mượn hình.</p>\n<p><strong>Sáu, trang \"Về chúng tôi\".</strong></p>\n<blockquote><em>\"Được thành lập với sứ mệnh kiến tạo những giá trị bền vững, chúng tôi không ngừng đổi mới sáng tạo để trở thành đối tác tin cậy hàng đầu, đồng hành cùng sự thành công của khách hàng.\"</em></blockquote>\n<blockquote><em>\"Chúng tôi bắt đầu năm 2019 trong một gara, vì hai đứa tôi quá chán phần mềm kế toán mình đang phải dùng. Bản đầu tiên xấu kinh khủng. Nhưng nó tính đúng — và hóa ra đó là thứ 12 khách hàng đầu tiên cần.\"</em></blockquote>\n<p>Bản trên là sáo ngữ chồng sáo ngữ, không một sự thật nào nắm được. Bản dưới có gara, có năm 2019, có mười hai khách. Và nó dám thú nhận \"xấu kinh khủng\" — nghịch lý đẹp ở chỗ chính lời thú nhận điểm yếu ấy làm tăng độ tin, vì nó chứng minh có người thật đứng đó.</p>\n<p><strong>Bảy, một lời kêu gọi hành động.</strong></p>\n<blockquote><em>\"Đừng bỏ lỡ cơ hội tuyệt vời này! Hãy đăng ký ngay hôm nay để khai phá tiềm năng và nâng tầm trải nghiệm của bạn lên một tầm cao mới!\"</em></blockquote>\n<blockquote><em>\"Lớp này mở 12 chỗ, hiện còn 4. Nếu bạn vẫn đang lưỡng lự thì cứ lưỡng lự — nhưng đừng lưỡng lự tới thứ Sáu, vì thứ Sáu tôi đóng.\"</em></blockquote>\n<p>Bản trên nhồi đủ bộ \"khai phá tiềm năng\", \"nâng tầm\", \"tầm cao mới\", kèm ba dấu chấm than đầy năng lượng giả. Bản dưới khẩn cấp bằng con số — mười hai chỗ, còn bốn, thứ Sáu — và một giọng thẳng, hơi ngang. Sự gấp gáp <em>thật</em> thuyết phục hơn sự gấp gáp <em>hô hào</em>.</p>\n<p><strong>Tám, một caption ảnh món ăn.</strong></p>\n<blockquote><em>\"Một bữa trưa đầy năng lượng và dinh dưỡng để bắt đầu một tuần mới tràn đầy động lực! 🥗✨ #healthylifestyle #goodvibes\"</em></blockquote>\n<blockquote><em>\"Hộp cơm này là tôi cố chuộc lỗi với cái dạ dày sau ba ngày toàn mì gói deadline. Bông cải hơi cháy. Vẫn ăn.\"</em></blockquote>\n<p>Bản trên là caption ai dán cũng được, hashtag rỗng, năng lượng đóng hộp. Bản dưới có một câu chuyện nhỏ và một kết thúc tự cười mình — \"bông cải hơi cháy, vẫn ăn\" — hai câu cụt đặt đúng chỗ. Người ta dừng lại ở cái thật và hơi buồn cười, không ở cái hoàn hảo.</p>\n<p><strong>Chín, một đoạn phân tích.</strong></p>\n<blockquote><em>\"AI có cả mặt tích cực lẫn tiêu cực. Một mặt, nó giúp tăng năng suất; mặt khác, nó đặt ra nhiều thách thức. Điều quan trọng là chúng ta cần sử dụng nó một cách có trách nhiệm và cân bằng.\"</em></blockquote>\n<blockquote><em>\"Tôi nghĩ phần lớn nỗi sợ 'AI cướp việc viết' là sợ nhầm chỗ. AI không cướp việc của người viết giỏi — nó cướp việc của người viết trung bình, đúng cái khoảng giữa mà trước nay vẫn sống được nhờ viết-cho-đủ. Khoảng giữa đó đang biến mất, và tôi thấy điều đó vừa đáng sợ vừa công bằng.\"</em></blockquote>\n<p>Bản trên là cỗ máy \"một mặt… mặt khác… cần cân bằng\" — đúng tới mức rỗng, không cược gì. Bản dưới đặt một luận điểm sắc và một khái niệm cụ thể, \"người viết trung bình\". Cái câu cuối — \"vừa đáng sợ vừa công bằng\" — là một phán xét cá nhân, đúng loại câu mà máy được dạy để né.</p>\n<p><strong>Mười, hai câu mở của chính cuốn sách này.</strong></p>\n<p>Để công bằng, tôi đem mình ra mổ. Đây là bản nháp đầu tiên tôi đã vứt cho chương một:</p>\n<blockquote><em>\"Trong kỷ nguyên trí tuệ nhân tạo, việc tạo ra nội dung chưa bao giờ dễ dàng đến thế. Tuy nhiên, điều này cũng đặt ra những thách thức mới đối với người làm sáng tạo nội dung.\"</em></blockquote>\n<p>Và đây là bản tôi giữ:</p>\n<blockquote><em>\"Tối Halloween năm 2024, hàng nghìn người đổ về trung tâm Dublin để xem diễu hành… Đoàn diễu hành không bao giờ tới, vì nó chưa từng tồn tại.\"</em></blockquote>\n<p>Bản vứt mắc đủ tật: \"Trong kỷ nguyên…\", \"chưa bao giờ dễ dàng đến thế\", \"đặt ra những thách thức mới\". Tôi đọc lại, nghe đúng mùi máy, nên xóa. Bản giữ mở bằng một chuyện thật — có địa danh, có người thật bị lừa. Một cuốn sách mà phần mở của nó vi phạm đúng điều nó dạy thì đã tự thua ngay câu đầu.</p>\n<h3>Đừng biến chuyện này thành công thức</h3>\n<p>Đến đây bạn có thể rút ra một quy luật gọn: cứ thêm một con số, một lời thú nhận, một chữ \"tôi\" là thành văn người. Đừng. Đó chính là cái bẫy mà chương ba cảnh báo. Một khi bạn biến cột \"Sau\" thành công thức, máy sẽ học thuộc công thức ấy trong một đêm — và ta sẽ bàn kỹ nỗi lo này ở chương cuối.</p>\n<p>Dấu vết người không phải bộ ba \"số, thú nhận, tôi\". Đó chỉ là mấy lối dễ thấy nhất để đưa nó vào. Cái sâu hơn là: cột \"Sau\" thắng vì nó buộc người viết phải thật sự <em>biết</em> một điều cụ thể, còn cột \"Trước\" thì không cần biết gì cũng viết được. Và đôi khi cái \"biết\" ấy chẳng cần con số nào, chẳng cần chữ \"tôi\" nào — chỉ cần một góc nhìn mà người khác chưa nhìn ra. Như thế này:</p>\n<blockquote><em>\"Khách hàng là thượng đế, hãy luôn đặt họ lên hàng đầu.\"</em></blockquote>\n<blockquote><em>\"Khách hàng không phải thượng đế. Thượng đế còn tha thứ; khách hàng thì bỏ đi, không nói một lời.\"</em></blockquote>\n<p>Không một con số. Không một chữ \"tôi\". Không một lời thú nhận. Nó thắng chỉ bằng một cú lật góc nhìn — và đó vẫn là thứ máy sẽ né, vì máy được huấn luyện để bám lấy mấy câu an toàn như \"khách hàng là thượng đế\". Cho nên khi nghi mình đang chạy theo công thức, hãy quay về câu hỏi gốc ở chương trước: câu này có ai khác viết được không? — chứ đừng hỏi mình đã chèn đủ số và thú nhận chưa.</p>\n<p>Nếu cả cuốn sách này chỉ để lại cho bạn được một việc, thì để là việc này: lấy một đoạn bạn vừa viết, và đổi mọi tính từ khoe lấy một con số, một chi tiết cụ thể, hoặc một góc nhìn lật. Chỉ một thao tác đó thôi đã kéo phần lớn văn của bạn từ cột trái sang cột phải.</p>\n<p>Chương sau trả lời câu hỏi thực tế nhất: vậy rốt cuộc còn được dùng AI nữa không — và dùng thế nào để vẫn ra được cột phải.</p>"}, {"num": 6, "title": "Dùng máy, đừng thành máy", "html": "<p>Sẽ là đạo đức giả nếu một cuốn sách <em>viết cùng AI</em> lại bảo bạn đừng dùng AI. Tôi có dùng — để tra cứu, để kiểm số liệu, để hỏi \"đoạn này có chỗ nào hổng không\". Câu hỏi chưa bao giờ là dùng hay không. Câu hỏi là dùng nó ở khâu nào, và ai mới là người đóng dấu con người vào phút cuối.</p>\n<p>Hãy hình dung việc viết như một dây chuyền bốn khâu. Khâu đầu là <em>tìm và nghĩ</em>: thu thập, tra cứu, liệt kê các góc nhìn. Khâu hai là <em>dựng khung</em>: sắp xếp ý, soi lỗ hổng trong lập luận. Khâu ba là <em>viết nháp</em>: đẻ ra những câu chữ đầu tiên. Khâu bốn là <em>đóng dấu người</em>: giọng, chi tiết riêng, quan điểm, hạt sạn — phần làm cho bài này là của bạn chứ không của ai khác.</p>\n<p>Máy mạnh nhất ở hai khâu đầu. Nó là một trợ lý nghiên cứu nhanh kinh khủng, và một người soi lập luận không biết mệt. Ở khâu ba nó dùng được, nhưng nguy hiểm, vì văn dễ đóng khuôn ngay từ đó. Còn khâu bốn thì tuyệt đối không giao. Đó là <em>bạn</em>. Phần lớn văn-thành-slop sinh ra từ đúng một lựa chọn sai: giao cái khâu cuối ấy — khâu đóng dấu người — cho máy. Viết-cho-người thì làm ngược lại: xài máy thật mạnh ở khâu một và hai, rồi giành lại khâu bốn cho mình, không khoan nhượng.</p>\n<h3>Một cách làm</h3>\n<p>Đây là cách tôi làm; bạn cứ chỉnh cho hợp.</p>\n<p>Tôi tự viết đoạn mở đầu bằng tay, đúng một đoạn, trước khi chạm vào AI — vì đoạn ấy định giọng cho cả bài, mà giọng là thứ máy không trả lại được nếu để nó định trước. Rồi tôi dùng AI để <em>mở rộng diện</em> chứ không phải để viết hộ: hỏi nó tôi đang bỏ sót góc nào, phản biện mạnh nhất với ý này là gì, có số liệu nào nói ngược lại không. Nếu có nhờ máy viết nháp, tôi coi bản đó là đất sét, không phải bản giao — nguyên liệu thô để đập lại, không phải thứ gọt vài chữ rồi gửi đi. Và lượt cuối tôi làm một mình, đọc to, hỏi mỗi câu hai điều: có mùi khuôn không, và câu này có ai khác viết được không. Câu nào dính một trong hai, tôi viết lại. Đó cũng là lúc tôi tiêm vào những con số tôi biết, những chuyện tôi tận mắt, những chỗ tôi chưa chắc — tức là đóng dấu người vào.</p>\n<p>Gói lại thành một câu: máy lo phần \"đúng và đủ\", bạn lo phần \"thật và riêng\". Máy đưa bài tới mức chính xác; chỉ con người đưa nó tới mức đáng đọc.</p>\n<h3>Cái bẫy mang tên \"humanize\"</h3>\n<p>Có cả một thị trường công cụ hứa \"humanize\" văn AI, hay giúp bạn \"qua mặt máy dò\". Tôi khuyên tránh, vì hai lý do.</p>\n<p>Thứ nhất, bạn đang chạy sai cuộc đua. Như chương ba đã cho thấy, đến con người còn nhầm văn-hay thành văn-máy, còn máy dò thì là hộp đen vừa dễ sai vừa dễ bị lừa. Tối ưu để \"qua máy dò\" không làm văn bạn đáng đọc hơn một chút nào — nó chỉ làm văn khó bị dán nhãn hơn. Đó là hai mục tiêu hoàn toàn khác nhau. Thứ hai, mấy công cụ ấy thường chỉ thay từ đồng nghĩa và rắc thêm dấu phẩy — tức là vẫn để nguyên cái khâu bốn cho máy. Chúng đụng vào lớp vỏ chữ nghĩa mà không đụng tới cấu trúc và dấu vết người. Kết quả là slop được sơn lại.</p>\n<p>Cách \"humanize\" thật sự duy nhất là cái không đóng gói bán được thành phần mềm: bạn ngồi xuống, và đặt chính mình vào trang giấy.</p>\n<h3>Tin tốt: tiền cũng đi cùng hướng</h3>\n<p>Bạn có thể lo rằng viết có giọng thì hay đấy, nhưng Google có thưởng không, hay là cứ nên nhồi từ khóa? Tin tốt là hai hướng đã gặp nhau.</p>\n<p>Hệ thống xếp hạng \"nội dung hữu ích\" của Google tìm cách dìm thứ sản xuất hàng loạt mà thiếu chuyên môn và trải nghiệm thật, và nâng thứ viết cho người chứ không cho cỗ máy tìm kiếm. Năm 2022 họ thêm hẳn chữ <em>Experience</em> — trải nghiệm trực tiếp — vào bộ tiêu chí chất lượng. Tức là Google đang công khai hỏi đúng câu hỏi của cuốn sách này: đằng sau trang này có một con người đã thật sự trải qua điều họ viết không? Và xin nhắc lại cái sắc thái quan trọng từ chương một: Google nói họ không phạt nội dung chỉ vì nó do AI viết. Họ phạt nội dung rỗng — mà slop hàng loạt thì thường rỗng. Dùng AI để nghiên cứu rồi viết một bài có trải nghiệm thật thì không sao; dùng AI để bơm năm trăm bài vô hồn thì bị dìm. Đó đúng là ranh giới giữa khâu một và khâu bốn.</p>\n<p>Vậy là động lực thẩm mỹ — người đọc khao khát tính thật — và động lực thương mại — Google thưởng trải nghiệm thật — cùng chỉ về một hướng. Viết-cho-người không phải một sự xa xỉ phải đánh đổi bằng thứ hạng. Trong vài năm này, nó chính là chiến lược thứ hạng.</p>\n<h3>\"Nhưng sếp tôi đo số lượng, không đo tâm hồn\"</h3>\n<p>Đây là phản bác thực tế nhất, và nó đáng được trả lời thẳng. Nếu KPI của bạn là số bài mỗi tháng thì viết-cho-người trông như một thứ làm bạn chậm lại.</p>\n<p>Tôi sẽ cãi lại bằng đúng những bằng chứng cuốn sách đã dựng. Số lượng đã hết là lợi thế: khi AI khiến mọi đối thủ của bạn cũng bơm được năm trăm bài một tháng, đua số lượng là đua trên cái sân mà máy luôn thắng. Thứ duy nhất đối thủ không sao chép được là trải nghiệm thật của bạn — nên đó là chỗ duy nhất còn lại để hơn nhau. Thêm nữa, một bài được đọc đánh bại mười bài bị lướt: người ta quét, đọc một phần tư, dừng chưa tới một phút; mười bài loãng nhân với \"gần như không ai đọc hết\" vẫn ra gần như con số không, mà nhân với số không thì có nhân bao nhiêu cũng vậy. Và đừng quên Google đang đếm hộ bạn: năm trăm bài rỗng có thể kéo tụt cả tên miền, còn năm mươi bài có trải nghiệm thật thì nâng nó lên. Số lượng rỗng không trung tính — nó có thể là một món nợ.</p>\n<p>Tôi sẽ trung thực về giới hạn của lập luận này: tôi không có một con số ROI sạch đẹp kiểu \"viết-cho- người tăng chuyển đổi bao nhiêu phần trăm\" để đặt lên bàn — dữ liệu công khai về chuyện đó còn mỏng và lẫn lộn. Nên đây là một lập luận về <em>hướng đi</em>, không phải một lời hứa về <em>độ lớn</em>. Nhưng hướng thì rõ: trong vài năm này, cái giá của sự loãng đang tăng, và nó tăng cho cả tên miền của bạn chứ không riêng từng bài.</p>\n<p>Tóm lại thì: giao máy phần tìm-nghĩ-phản biện, giành lại phần đóng-dấu-người; coi bản máy là đất sét, không phải bản giao; bỏ qua mấy công cụ \"qua mặt máy dò\", vì đó là cuộc đua sai; và yên tâm rằng người đọc lẫn Google giờ thưởng cùng một thứ — trải nghiệm thật của một con người.</p>\n<p>Nhưng tôi vừa trình bày luận điểm này hơi quá gọn gàng, hơi quá xuôi tai. Một luận điểm tử tế phải biết chỗ nó sai. Đó là việc của chương cuối — và là chương trung thực nhất.</p>"}, {"num": 7, "title": "Những chỗ tôi có thể sai", "html": "<p>Một cuốn sách chỉ bênh vực luận điểm của chính nó cũng là một dạng slop — loại tinh vi hơn, thứ chỉ cho bạn xem mặt thắng. Nên ở chương cuối tôi cố tình quay súng vào mình. Có năm chỗ mà luận điểm \"viết cho người, đừng giống máy\" có thể sai, hoặc bị hiểu lệch.</p>\n<p><strong>Không phải nội dung nào cũng cần giọng người.</strong> Mọi thứ trong cuốn sách này áp cho loại nội dung mà một con người đang cân nhắc có nên đọc tiếp không: bài quan điểm, chuyện thương hiệu, email, bài bán hàng, tản văn. Nhưng có cả một thế giới nội dung <em>chức năng</em> mà giọng riêng là thừa, thậm chí có hại — tài liệu kỹ thuật, hướng dẫn cài đặt, điều khoản dịch vụ, bảng thông số, mục hỏi-đáp tra cứu nhanh. Ở đó người đọc không tìm một con người; họ tìm một câu trả lời, càng nhanh càng tốt. Nhịp giật cục và hạt sạn cá nhân chỉ làm vướng chân. Với loại này, văn rõ ràng, đều, đoán-trước-được lại đúng là thứ nên có. Đừng đem dao mổ tim đi gọt bút chì. Biết khi nào <em>không</em> cần giọng cũng là một phần của tay nghề. (Đó cũng là lý do mục Nguồn ở cuối sách này được phép khô khốc: nó là tra cứu, không phải để đọc cho sướng.)</p>\n<p><strong>\"Viết dài\" chưa chết — \"viết loãng\" mới chết.</strong> Chương một đã rào, nhưng phải nói mạnh hơn ở đây vì chỗ này dễ bị suy diễn lệch nhất. \"Người ta ngại đọc dài\" <em>không</em> có nghĩa là \"hãy viết ngắn\". Bằng chứng ngược lại ở khắp nơi: những bản tin dài hàng nghìn chữ vẫn có hàng triệu người trả tiền để đọc; những phóng sự điều tra dài vẫn giữ người tới dòng cuối; một chương sách hay vẫn được đọc một mạch. Cái chung của chúng không phải ngắn — mà là không loãng. Nếu bạn rút ra từ cuốn sách này bài học \"viết cho ngắn\", bạn đã bắt nhầm. Bài học đúng là: hãy <em>xứng đáng</em> với từng câu bạn bắt người đọc bỏ thời gian ra.</p>\n<p><strong>Chính \"dấu hiệu người\" rồi sẽ bị bắt chước — và thành cái tell mới.</strong> Đây là phản biện làm tôi mất ngủ nhất, và tôi nghĩ nó đúng. Nên tôi muốn dành cho nó nhiều chỗ hơn một chút.</p>\n<p>Ngay lúc này, đầy người đang dạy AI cách \"viết giọng người\": chèn câu cụt, thêm \"thú thật là…\", rắc một lỗi nhỏ cố ý cho ra vẻ. Khi <em>mọi người</em> cùng làm vậy, chính những thủ thuật đó biến thành cái tell mới — một thứ \"ngẫu hứng được sản xuất hàng loạt\", mà như chương bốn đã cảnh báo, còn lộ hơn cả văn máy thẳng đơ. Hệ quả lạnh người: không một danh sách thủ thuật nào an toàn vĩnh viễn. Cặp \"câu cụt cộng thú nhận giả\" hiệu nghiệm hôm nay, sang năm thành sáo.</p>\n<p>Nếu vậy thì cả cuốn sách này dựa trên cái gì? Nó dựa trên một thứ máy <em>không</em> sao chép được — và đây là ý sâu nhất tôi có. Cái máy bắt chước được là <em>bề mặt</em> của dấu vết người: nhịp câu, cú tự trào, chỗ ngập ngừng. Cái nó không bắt chước được là <em>nguồn</em> của dấu vết ấy: một trải nghiệm có thật mà chỉ bạn có. Máy có thể học cách viết \"bông cải hơi cháy, vẫn ăn\", nhưng nó không có cái bữa trưa ấy, không có ba ngày mì gói deadline ấy, không có cái dạ dày ấy. Thủ thuật thì sao chép được; một buổi sáng thật của đời bạn thì không. Cho nên cuốn sách này cố không bán cho bạn <em>mánh</em>, mà chỉ cho bạn một <em>chỗ để múc</em>: đời sống của chính bạn. Mánh sẽ cũ. Còn cái giếng ấy thì, chừng nào bạn còn sống và còn để ý, sẽ không cạn. Khi nghi ngờ, hãy lùi khỏi thủ thuật và tiến về phía sự thật.</p>\n<p><strong>Nghịch lý của sự trung thực.</strong> Đây là chỗ hóc búa nhất về đạo đức, và tôi sẽ không giả vờ có đáp án gọn. Bằng chứng đặt ta vào một thế kẹt thật. Một mặt, cái \"hình phạt khi lộ AI\" mà ta đã gặp ở chương hai — mười sáu thí nghiệm, hơn hai bảy nghìn người, cùng một văn bản bị chấm thấp hơn khi gắn nhãn AI — nói rằng trung thực bị trừng phạt. Mặt khác, cái hiệu ứng giao chéo thật–giả nói rằng dán nhãn AI còn bóp méo lòng tin theo hướng tai hại: nó đẩy lòng tin ra khỏi tin thật và về phía tin giả. Vậy chẳng lẽ ta nên im lặng cho khỏi bị phạt?</p>\n<p>Tôi không nghĩ vậy, và đây là lập trường của tôi — một lập trường có thể sai. Mục tiêu đúng không phải \"giấu cho khéo\", mà là làm cho câu hỏi \"AI hay người\" trở nên <em>không còn quan trọng</em>. Hình phạt giáng xuống cái <em>tính-thật-bị-mất</em>, chứ không xuống <em>cái nhãn</em>. Nếu một bài viết mang trải nghiệm thật, quan điểm thật, dấu vết thật của bạn, thì dù có dùng AI ở khâu tra cứu, nó vẫn là của bạn theo nghĩa quan trọng nhất — và lời thú nhận thôi không còn là một lời thú tội. Bạn đâu có \"dùng AI để viết bài\"; bạn viết bài, và có dùng AI như dùng một cuốn từ điển hay một công cụ tìm kiếm. Khác biệt đó không phải ngụy biện — nó đúng là cái ranh giới khâu-một và khâu-bốn ở chương trước. Nhưng tôi để ngỏ chỗ này một cách thành thật: đây là vùng đạo đức đang dịch chuyển, chuẩn mực xã hội chưa định hình, và những người trung thực hoàn toàn có thể bất đồng với tôi.</p>\n<p><strong>Và biết đâu chính cái luận điểm khởi đầu cũng sai.</strong> Để công bằng với cả tiền đề của cuốn sách: phần lớn bằng chứng về chuyện \"người ta đang chán AI\" hiện vẫn ở giai đoạn đầu — vài khảo sát, vài bài bình luận, vài nghiên cứu mới ra. Việc \"slop\" được chọn là Từ của Năm cho thấy <em>thái độ</em> đang đổi, nhưng thái độ không phải lúc nào cũng biến thành <em>hành vi</em>. Có một kịch bản tôi buộc phải thừa nhận: con người quen dần với văn máy, ngưỡng chịu đựng cứ thế nhích lên, và ranh giới mờ đi — hệt như ta đã quen với nhạc nén mất chất, với ảnh stock vô hồn. Nếu kịch bản đó đúng, thì \"lợi thế của giọng người\" co lại thành một thị trường ngách cao cấp, chứ không phải một quy luật phổ quát.</p>\n<p>Tôi cá cược vào chiều ngược lại — rằng khi chữ trở nên vô tận và miễn phí, thứ khan hiếm, là dấu vết của một người thật, sẽ lên giá chứ không xuống. Nhưng nó là một lời <em>cá cược</em>, không phải một định luật. Tôi nói thẳng ra để bạn tự cân, thay vì bán cho bạn một sự chắc chắn mà bằng chứng chưa cho phép.</p>\n<hr>\n<p>Năm phản biện trên không làm yếu luận điểm. Chúng neo nó lại. Một luận điểm biết chỗ mình dừng thì đáng tin hơn một luận điểm tự nhận đúng ở khắp nơi. Và nói cho cùng, đó chính là toàn bộ thông điệp của cuốn sách, thu vào một hành động duy nhất: dám nói ra cái phức tạp, cái chưa chắc, cái có-thể-sai — bởi đó là việc một con người làm, và là việc mà một cỗ máy được tối ưu để an toàn sẽ luôn làm cho nhạt đi.</p>\n<p>Đem chính luận điểm này hỏi một con AI, gần như chắc chắn nó sẽ trả cho bạn một kết luận tròn trịa, kiểu \"hãy cân bằng giữa hiệu quả của AI và sự sáng tạo của con người\". Tôi từ chối cho bạn câu đó. Thay vào đó, tôi để bạn lại với một câu khó hơn: hãy đi sống một điều gì đó đáng viết, rồi viết nó theo cách chỉ bạn mới viết được. Phần còn lại — ngữ pháp, độ trơn, tốc độ — cứ để cho máy.</p>"}], "vi_ai": [{"num": 1, "title": "Sự trỗi dậy của nội dung AI và thách thức đặt ra", "html": "<p>Trong thời đại số ngày nay, trí tuệ nhân tạo đang thay đổi cách chúng ta tạo ra và tiêu thụ nội dung. Từ những bài blog, bài đăng mạng xã hội cho đến các chiến dịch marketing, AI đã trở thành một công cụ quen thuộc với nhiều người làm nội dung. Tuy nhiên, sự phát triển nhanh chóng này cũng đặt ra không ít thách thức đáng để chúng ta cùng suy ngẫm.</p>\n<h3>Khi nội dung trở nên dư thừa</h3>\n<p>Một ví dụ đáng chú ý đã xảy ra vào dịp Halloween năm 2024 tại Dublin, Ireland. Hàng nghìn người dân đã đổ ra đường để xem một lễ hội diễu hành — một sự kiện mà thực tế chưa bao giờ tồn tại. Thông tin về lễ hội này được tạo ra bởi một website sử dụng nội dung AI nhằm thu hút lượt truy cập, và nó đã vô tình đánh lừa cả một thành phố. Đây là một minh chứng rõ ràng cho thấy nội dung do AI tạo ra, khi thiếu sự kiểm soát, có thể gây ra những hệ quả thực tế không mong muốn.</p>\n<p>Không phải ngẫu nhiên mà vào năm 2025, từ \"slop\" — vốn dùng để chỉ thức ăn thừa cho gia súc — đã được cả Merriam-Webster và American Dialect Society bình chọn là Từ của Năm. Thuật ngữ này hiện được sử dụng rộng rãi để mô tả loại nội dung do AI sản xuất hàng loạt: trông có vẻ hoàn chỉnh nhưng lại thiếu chiều sâu và giá trị thực sự. Có thể nói, đây là một dấu hiệu cho thấy thái độ của công chúng đối với nội dung kém chất lượng đang dần thay đổi.</p>\n<p>Các chuyên gia thường mô tả loại nội dung này qua ba đặc điểm chính:</p>\n<ul><li><strong>Năng lực bề mặt:</strong> nội dung trông chỉn chu, đúng ngữ pháp và mạch lạc.</li><li><strong>Nỗ lực bất đối xứng:</strong> tốn rất ít công sức để tạo ra, nhưng lại đòi hỏi người đọc bỏ thời gian để tiếp nhận.</li><li><strong>Khả năng sản xuất hàng loạt:</strong> có thể được tạo ra với số lượng khổng lồ trong thời gian ngắn.</li></ul>\n<h3>Một vấn đề ngày càng phổ biến</h3>\n<p>Điều quan trọng cần lưu ý là quy mô của hiện tượng này đang ngày càng mở rộng. Nhiều nghiên cứu và khảo sát gần đây đã chỉ ra những con số đáng suy ngẫm. Một cuộc điều tra cho thấy khoảng 40% video được đề xuất cho trẻ em trên YouTube có dấu hiệu được tạo bởi AI. Trên nền tảng nhạc số Deezer, có thời điểm tới 70% lượt nghe các bản nhạc AI được xác định là gian lận. Trong môi trường công sở, một nghiên cứu của Harvard Business Review cũng ghi nhận khoảng 40% nhân viên từng phải tiếp nhận loại \"công việc hình thức\" do AI tạo ra, với trung bình hai giờ để xử lý mỗi trường hợp.</p>\n<p>Những con số này không chỉ phản ánh sự phổ biến của nội dung AI, mà còn cho thấy một xu hướng đáng lưu tâm: chi phí đang dần dịch chuyển từ người tạo nội dung sang người tiếp nhận. Đây là một vấn đề mà bất kỳ ai làm trong lĩnh vực nội dung đều cần cân nhắc một cách kỹ lưỡng.</p>\n<h3>Độ dài không còn là thước đo</h3>\n<p>Một trong những thay đổi quan trọng nhất mà AI mang lại chính là việc tạo ra nội dung dài trở nên dễ dàng hơn bao giờ hết. Trước đây, một bài viết dài thường được xem là bằng chứng cho sự đầu tư và công sức. Tuy nhiên, khi AI có thể tạo ra hàng nghìn từ chỉ trong vài giây, độ dài không còn là một tín hiệu đáng tin cậy về chất lượng nữa.</p>\n<p>Điều này dẫn đến một thực tế là người đọc ngày càng có xu hướng e ngại những nội dung dài dòng và thiếu trọng tâm. Tuy nhiên, cần nhấn mạnh rằng vấn đề không nằm ở độ dài, mà nằm ở chất lượng và giá trị mà nội dung mang lại. Một bài viết dài nhưng giàu thông tin và insight vẫn luôn được đón nhận, trong khi một bài viết ngắn nhưng rỗng tuếch sẽ nhanh chóng bị bỏ qua.</p>\n<p>Tóm lại, sự trỗi dậy của nội dung AI vừa mang đến những cơ hội to lớn, vừa đặt ra những thách thức không nhỏ cho người làm nội dung. Trong các chương tiếp theo, chúng ta sẽ cùng tìm hiểu sâu hơn về tâm lý người đọc, cách nhận diện nội dung AI, và quan trọng nhất là làm thế nào để tạo ra những nội dung vừa thu hút vừa mang đậm dấu ấn con người.</p>"}, {"num": 2, "title": "Tâm lý người đọc trong kỷ nguyên số", "html": "<p>Để có thể tạo ra nội dung thực sự thu hút, trước tiên chúng ta cần hiểu rõ cách thức người đọc tiếp nhận thông tin trong môi trường số. Có nhiều yếu tố tâm lý tác động đến hành vi đọc, và việc nắm bắt được những yếu tố này sẽ giúp người viết tối ưu hóa nội dung một cách hiệu quả. Trong chương này, chúng ta sẽ cùng phân tích ba khía cạnh quan trọng nhất.</p>\n<h3>Thứ nhất: Người đọc quét chứ không đọc</h3>\n<p>Một sự thật mà nhiều người viết thường bỏ qua là: trên môi trường số, người dùng có xu hướng quét nhanh nội dung thay vì đọc kỹ từng câu chữ. Các nghiên cứu về theo dõi chuyển động mắt của Nielsen Norman Group đã chỉ ra rằng người đọc thường lướt qua trang web theo một mô hình nhất định, và chỉ tiếp nhận một phần nhỏ nội dung được trình bày.</p>\n<p>Cụ thể, một lượt truy cập trang web trung bình kéo dài chưa đến một phút, và trong khoảng thời gian đó, người dùng chỉ đọc được tối đa khoảng một phần tư số chữ trên trang. Mắt của họ thường di chuyển theo hình chữ F: quét ngang phần đầu, sau đó di chuyển dọc xuống phía bên trái. Điều này có nghĩa là những từ ngữ mang thông tin quan trọng nên được đặt ở vị trí đầu tiên, nơi mắt người đọc chắc chắn sẽ lướt qua.</p>\n<p>Đây là một insight quan trọng đối với người làm nội dung. Thay vì mở đầu bằng những câu dẫn dắt dài dòng, chúng ta nên đi thẳng vào trọng tâm để thu hút sự chú ý ngay từ những giây đầu tiên.</p>\n<h3>Thứ hai: Tâm lý đối với nội dung do AI tạo ra</h3>\n<p>Một khía cạnh thú vị và có phần bất ngờ là cách người đọc phản ứng khi biết nội dung được tạo bởi AI. Một loạt nghiên cứu quy mô lớn — bao gồm 16 thí nghiệm với hơn 27.000 người tham gia — đã chỉ ra một hiện tượng đáng chú ý. Khi được cho đọc những đoạn văn giống hệt nhau, người tham gia có xu hướng đánh giá thấp hơn (trung bình khoảng 6,2%) đối với những đoạn văn được cho là do AI tạo ra.</p>\n<p>Điều thú vị là sự sụt giảm này không xuất phát từ chất lượng nội dung, mà từ cảm nhận về tính chân thực. Nói cách khác, người đọc có xu hướng coi trọng \"dấu ấn con người\" đằng sau mỗi câu chữ. Một nghiên cứu khác trên 433 người cũng cho thấy việc gắn nhãn \"AI\" có thể tác động đến mức độ tin tưởng của người đọc theo những cách phức tạp, thậm chí làm giảm niềm tin vào những thông tin chính xác.</p>\n<p>Từ góc độ của người làm nội dung, điều này cho thấy một sự thật quan trọng: yếu tố tạo nên sự kết nối với người đọc không chỉ nằm ở chất lượng câu chữ, mà còn ở cảm giác về một con người thực sự đứng sau nội dung đó.</p>\n<h3>Thứ ba: Bộ não yêu thích sự bất ngờ</h3>\n<p>Yếu tố thứ ba liên quan đến cách bộ não con người xử lý thông tin. Về cơ bản, não bộ là một \"cỗ máy dự đoán\" — nó liên tục dự đoán những gì sẽ xảy ra tiếp theo. Khi nội dung diễn ra đúng như dự đoán, não bộ có xu hướng giảm sự chú ý. Ngược lại, khi gặp những điều bất ngờ và mới mẻ, não bộ sẽ trở nên tỉnh táo và tập trung hơn.</p>\n<p>Đây chính là một thách thức đối với nội dung do AI tạo ra. Bởi vì các mô hình ngôn ngữ được thiết kế để lựa chọn những từ ngữ có xác suất xuất hiện cao nhất, kết quả thường là một văn bản trơn tru, mạch lạc nhưng dễ đoán. Trong khi đó, người viết giỏi thường biết cách tạo ra những điểm nhấn bất ngờ — một từ ngữ độc đáo, một phép so sánh thú vị, hay một nhịp điệu câu chữ linh hoạt — để giữ chân người đọc.</p>\n<p>Tóm lại, ba yếu tố tâm lý này — thói quen quét nội dung, nhu cầu về tính chân thực, và sự yêu thích điều bất ngờ — đều cùng chỉ về một hướng. Để tạo ra nội dung thu hút, người viết cần đặt thông tin quan trọng lên đầu, thể hiện được dấu ấn con người, và mang lại sự mới mẻ cho người đọc. Chương tiếp theo sẽ giúp chúng ta nhận diện rõ hơn những đặc điểm của nội dung do AI tạo ra.</p>"}, {"num": 3, "title": "Nhận diện nội dung do AI tạo ra", "html": "<p>Trước khi tìm hiểu cách viết nội dung mang đậm dấu ấn con người, điều quan trọng là chúng ta cần nhận diện được những đặc điểm nhận biết của nội dung do AI tạo ra. Cần lưu ý rằng nội dung AI không hề \"kém\" theo nghĩa sai ngữ pháp — ngược lại, nó thường rất chỉn chu và mạch lạc. Vấn đề nằm ở những dấu hiệu tinh tế hơn, thường được thể hiện qua bốn cấp độ: từ vựng, cấu trúc câu, bố cục, và nhịp điệu.</p>\n<p>Tuy nhiên, cũng cần nhấn mạnh rằng không một dấu hiệu đơn lẻ nào có thể được xem là bằng chứng tuyệt đối. Người viết giỏi đôi khi cũng sử dụng những đặc điểm tương tự. Do đó, chúng ta nên xem những dấu hiệu này như những gợi ý mang tính tham khảo, hơn là những quy tắc cứng nhắc.</p>\n<h3>Cấp độ từ vựng</h3>\n<p>Một trong những dấu hiệu dễ nhận thấy nhất là việc lạm dụng một số từ ngữ nhất định. Nhiều nghiên cứu ngôn ngữ học đã ghi nhận rằng sau khi các công cụ AI trở nên phổ biến, tần suất xuất hiện của một số từ vốn ít gặp đã tăng lên đáng kể — trong một số trường hợp lên tới 9 đến 25 lần. Trong tiếng Anh, đó là những từ như <em>delve</em>, <em>meticulous</em>, <em>crucial</em>, hay <em>tapestry</em>.</p>\n<p>Tiếng Việt cũng có những cụm từ tương tự thường xuất hiện trong nội dung AI, chẳng hạn như \"đa dạng và phong phú\", \"vô cùng quan trọng\", \"đóng vai trò then chốt\", \"khai phá tiềm năng\", hay \"nâng tầm trải nghiệm\". Tất nhiên, những cụm từ này không hề bị cấm sử dụng; vấn đề nằm ở mật độ và sự trống rỗng khi chúng được lặp lại quá nhiều.</p>\n<h3>Cấp độ câu và bố cục</h3>\n<p>Ở cấp độ câu, nội dung AI thường có xu hướng sử dụng những khuôn mẫu quen thuộc. Một số ví dụ điển hình bao gồm:</p>\n<ul><li>Mở đầu bằng những câu khái quát như \"Trong thời đại số ngày nay…\".</li><li>Sử dụng các cụm đệm như \"Điều quan trọng cần lưu ý là…\".</li><li>Lạm dụng cấu trúc tương phản như \"không chỉ… mà còn…\".</li></ul>\n<p>Về mặt bố cục, nội dung AI thường tuân theo một cấu trúc khá cố định: mở bài khái quát, ba ý chính ở phần thân bài, và một kết luận tóm tắt. Đặc biệt, \"quy tắc số ba\" — chia mọi thứ thành ba phần — xuất hiện rất thường xuyên. Mặc dù cấu trúc này giúp nội dung trở nên rõ ràng và dễ theo dõi, nó cũng có thể khiến bài viết trở nên đoán trước được và thiếu sự tự nhiên.</p>\n<h3>Cấp độ nhịp điệu</h3>\n<p>Cấp độ tinh tế nhất chính là nhịp điệu của câu chữ. Văn bản do con người viết thường có sự biến đổi linh hoạt về độ dài câu — đôi khi là một câu dài, đôi khi là một câu ngắn gọn để nhấn mạnh. Ngược lại, nội dung AI thường có nhịp điệu khá đều đặn, với các câu có độ dài tương đối giống nhau. Chính sự đều đặn này, một cách nghịch lý, lại tạo cảm giác thiếu tự nhiên.</p>\n<h3>Vì sao việc nhận diện không hề đơn giản</h3>\n<p>Mặc dù đã nắm được những dấu hiệu trên, chúng ta cũng cần thừa nhận rằng việc nhận diện nội dung AI không hề dễ dàng. Các nghiên cứu cho thấy có tới 94% bài thi do ChatGPT viết đã không bị giám khảo phát hiện. Ngay cả các chuyên gia ngôn ngữ học cũng gặp khó khăn trong việc phân biệt. Các công cụ phát hiện AI tự động tuy đạt độ chính xác từ 80% đến 98%, nhưng vẫn tồn tại những hạn chế nhất định.</p>\n<p>Một điểm thú vị đáng lưu ý là dấu gạch ngang (—), vốn thường bị cho là dấu hiệu của nội dung AI, thực chất lại là một đặc điểm của những người viết giàu kinh nghiệm. Điều này cho thấy việc cố gắng \"qua mặt\" các công cụ phát hiện không phải lúc nào cũng là hướng đi đúng đắn.</p>\n<p>Tóm lại, việc nhận diện nội dung AI là một kỹ năng hữu ích, nhưng mục đích chính không phải để trở thành \"thám tử\", mà là để chúng ta tự nhìn nhận lại nội dung của chính mình. Trong chương tiếp theo, chúng ta sẽ cùng khám phá những nguyên tắc vàng để tạo ra nội dung mang đậm dấu ấn con người.</p>"}, {"num": 4, "title": "Những nguyên tắc vàng để viết nội dung thu hút", "html": "<p>Sau khi đã hiểu về tâm lý người đọc và cách nhận diện nội dung AI, giờ là lúc chúng ta đi vào phần thực hành: làm thế nào để tạo ra nội dung vừa thu hút vừa mang đậm dấu ấn con người. Dưới đây là bảy nguyên tắc vàng mà bất kỳ người làm nội dung nào cũng nên ghi nhớ và áp dụng.</p>\n<p><strong>1. Cụ thể hóa nội dung.</strong> Đây có thể được xem là nguyên tắc quan trọng nhất. Thay vì sử dụng những từ ngữ chung chung, hãy đi vào những chi tiết cụ thể. Ví dụ, thay vì viết \"con chim\", hãy viết \"con sáo\"; thay vì \"đôi giày\", hãy mô tả \"đôi giày lấm lem bùn đất\". Sự cụ thể giúp nội dung trở nên sống động và đáng tin cậy hơn. Đây cũng chính là tinh thần của nguyên tắc kinh điển trong nghề viết: \"thể hiện, đừng kể lể\".</p>\n<p><strong>2. Đặt thông tin quan trọng lên đầu.</strong> Như đã phân tích ở chương trước, người đọc thường quét nội dung thay vì đọc kỹ. Vì vậy, hãy đặt những thông tin quan trọng nhất ở vị trí đầu tiên, tránh những câu dẫn dắt dài dòng và không cần thiết.</p>\n<p><strong>3. Tạo nhịp điệu linh hoạt cho câu chữ.</strong> Một trong những cách hiệu quả để giữ chân người đọc là thay đổi độ dài câu một cách có chủ đích. Hãy kết hợp những câu dài để dẫn dắt với những câu ngắn để nhấn mạnh. Một mẹo hữu ích là đọc to nội dung của mình để cảm nhận nhịp điệu.</p>\n<p><strong>4. Thể hiện quan điểm rõ ràng.</strong> Nội dung AI thường có xu hướng trung lập và cân bằng để tránh gây tranh cãi. Tuy nhiên, người đọc lại thường đánh giá cao những quan điểm rõ ràng và có chính kiến. Đừng ngại bày tỏ suy nghĩ của mình, ngay cả khi điều đó có thể không nhận được sự đồng tình của tất cả mọi người.</p>\n<p><strong>5. Kể chuyện thay vì liệt kê.</strong> Bộ não con người được \"lập trình\" để yêu thích những câu chuyện. Thay vì chỉ liệt kê các thông tin một cách khô khan, hãy lồng ghép chúng vào những câu chuyện có nhân vật, có tình huống và có cảm xúc. Điều này sẽ giúp nội dung trở nên hấp dẫn và dễ nhớ hơn.</p>\n<p><strong>6. Giữ lại những \"khiếm khuyết\" tự nhiên.</strong> Nội dung AI thường quá hoàn hảo một cách thiếu tự nhiên. Trong khi đó, văn bản của con người thường có những \"khiếm khuyết\" nhỏ — một lời thú nhận chân thành, một khoảnh khắc do dự, hay một chi tiết đời thường. Những yếu tố này chính là bằng chứng cho sự hiện diện của con người. Tuy nhiên, cần lưu ý rằng những \"khiếm khuyết\" này phải tự nhiên và chân thực, tránh sự gượng ép.</p>\n<p><strong>7. Viết cho một người cụ thể.</strong> Thay vì viết cho một \"đối tượng mục tiêu\" trừu tượng, hãy tưởng tượng bạn đang viết cho một người bạn cụ thể. Cách tiếp cận này sẽ giúp giọng văn trở nên gần gũi, ấm áp và chân thành hơn.</p>\n<h3>Tóm gọn trong một nguyên tắc</h3>\n<p>Nếu phải tóm gọn tất cả những nguyên tắc trên thành một, thì đó chính là: <strong>hãy viết những điều mà không ai khác có thể viết được.</strong> AI rất giỏi trong việc tạo ra những nội dung mà ai cũng có thể viết. Vì vậy, chính những trải nghiệm cá nhân, những quan điểm độc đáo và những góc nhìn riêng biệt mới là yếu tố tạo nên sự khác biệt và giá trị thực sự.</p>\n<p>Tóm lại, bảy nguyên tắc vàng này sẽ là kim chỉ nam giúp bạn tạo ra những nội dung vừa thu hút vừa mang đậm dấu ấn cá nhân. Tuy nhiên, lý thuyết sẽ trở nên rõ ràng hơn rất nhiều khi được minh họa bằng những ví dụ cụ thể. Đó chính là nội dung của chương tiếp theo.</p>"}, {"num": 5, "title": "So sánh: Trước và sau khi tối ưu", "html": "<p>Để hiểu rõ hơn về sự khác biệt giữa nội dung thông thường và nội dung được tối ưu cho con người, không gì hiệu quả hơn việc xem xét những ví dụ cụ thể. Trong chương này, chúng ta sẽ cùng phân tích mười cặp ví dụ minh họa. Trong mỗi cặp, phiên bản \"Trước\" đại diện cho cách viết thông thường, trong khi phiên bản \"Sau\" thể hiện cách viết mang đậm dấu ấn con người. Điều quan trọng cần lưu ý là cả hai phiên bản đều truyền tải cùng một thông tin; sự khác biệt nằm ở cách thể hiện.</p>\n<p><strong>Ví dụ 1 — Mở bài blog.</strong></p>\n<blockquote><em>Trước:</em> \"Trong thời đại số ngày nay, content marketing đóng vai trò vô cùng quan trọng đối với sự phát triển của mọi doanh nghiệp.\"</blockquote>\n<blockquote><em>Sau:</em> \"Tháng trước tôi xóa 200 bài blog của công ty mình. Traffic không giảm. Đó là lúc tôi hiểu mình đã hiểu sai về content suốt bốn năm.\"</blockquote>\n<p>Như chúng ta có thể thấy, phiên bản thứ hai sử dụng con số cụ thể và một câu chuyện cá nhân, qua đó tạo được sự thu hút ngay từ những dòng đầu tiên.</p>\n<p><strong>Ví dụ 2 — Mô tả quán cà phê.</strong></p>\n<blockquote><em>Trước:</em> \"Chúng tôi tự hào mang đến cho quý khách những trải nghiệm cà phê tuyệt vời nhất với hạt cà phê chất lượng cao được tuyển chọn kỹ lưỡng.\"</blockquote>\n<blockquote><em>Sau:</em> \"Cà phê của chúng tôi rang ở đây, mỗi sáng, lúc 6 giờ — nên 8 giờ bạn tới là thơm nhất. Ngồi bàn trong cùng đi, gần cửa sổ, chỗ đó nắng tới tầm 9 rưỡi.\"</blockquote>\n<p>Phiên bản thứ hai, thay vì sử dụng những tính từ chung chung, đã tập trung vào các chi tiết cụ thể, giúp tạo cảm giác chân thực và gần gũi hơn.</p>\n<p><strong>Ví dụ 3 — Bài đăng mạng nghề nghiệp.</strong></p>\n<blockquote><em>Trước:</em> \"Thành công không đến từ may mắn, mà đến từ sự kiên trì và nỗ lực không ngừng. Hãy luôn tin vào bản thân!\"</blockquote>\n<blockquote><em>Sau:</em> \"Tôi bị từ chối ở vòng cuối, lần thứ ba trong năm. Người phỏng vấn nói một câu tôi nhớ mãi: 'Em giỏi, nhưng em đang phỏng vấn như đang xin xỏ.' Mất sáu tháng tôi mới hiểu bà ấy đúng.\"</blockquote>\n<p>Có thể thấy, phiên bản thứ hai mang tính cá nhân và cụ thể, trong khi phiên bản đầu tiên lại khá chung chung và dễ đoán.</p>\n<p><strong>Ví dụ 4 — Email cho khách hàng.</strong></p>\n<blockquote><em>Trước:</em> \"Kính gửi Quý khách, Chúng tôi xin trân trọng thông báo rằng đơn hàng của Quý khách hiện đang được xử lý. Rất mong nhận được sự thông cảm.\"</blockquote>\n<blockquote><em>Sau:</em> \"Chào chị Lan, đơn của chị đang kẹt ở khâu đóng gói vì bên kho thiếu người dịp lễ — em xin lỗi. Em đã nhờ ưu tiên, chậm nhất thứ Tư là đi.\"</blockquote>\n<p>Phiên bản thứ hai thể hiện sự minh bạch và cụ thể, qua đó xây dựng được lòng tin một cách hiệu quả hơn.</p>\n<p><strong>Ví dụ 5 — Giải thích kỹ thuật.</strong></p>\n<blockquote><em>Trước:</em> \"Bộ nhớ đệm (cache) là một thành phần quan trọng giúp tối ưu hóa hiệu suất hệ thống bằng cách lưu trữ tạm thời dữ liệu thường xuyên được truy cập.\"</blockquote>\n<blockquote><em>Sau:</em> \"Cache giống chỗ bạn để chìa khóa ngay cửa. Thay vì mỗi lần ra ngoài lại lục khắp nhà, bạn vớ cái là có. Đổi lại: nếu đổi khóa mà quên thay chìa, bạn cầm nhầm chìa cũ — đó là 'cache cũ'.\"</blockquote>\n<p>Việc sử dụng phép so sánh gần gũi giúp người đọc dễ dàng hình dung và ghi nhớ khái niệm hơn.</p>\n<p><strong>Ví dụ 6 — Trang \"Về chúng tôi\".</strong></p>\n<blockquote><em>Trước:</em> \"Được thành lập với sứ mệnh kiến tạo những giá trị bền vững, chúng tôi không ngừng đổi mới sáng tạo để trở thành đối tác tin cậy hàng đầu.\"</blockquote>\n<blockquote><em>Sau:</em> \"Chúng tôi bắt đầu năm 2019 trong một gara, vì hai đứa tôi quá chán phần mềm kế toán mình đang phải dùng. Bản đầu tiên xấu kinh khủng. Nhưng nó tính đúng.\"</blockquote>\n<p>Phiên bản thứ hai sử dụng câu chuyện thật và thậm chí thừa nhận điểm yếu, qua đó tạo được sự tin cậy.</p>\n<p><strong>Ví dụ 7 — Lời kêu gọi hành động.</strong></p>\n<blockquote><em>Trước:</em> \"Đừng bỏ lỡ cơ hội tuyệt vời này! Hãy đăng ký ngay hôm nay để khai phá tiềm năng của bạn!\"</blockquote>\n<blockquote><em>Sau:</em> \"Lớp này mở 12 chỗ, hiện còn 4. Nếu bạn vẫn đang lưỡng lự thì cứ lưỡng lự — nhưng đừng lưỡng lự tới thứ Sáu, vì thứ Sáu tôi đóng.\"</blockquote>\n<p>Sự khẩn cấp dựa trên con số thực tế thường thuyết phục hơn những lời kêu gọi mang tính khẩu hiệu.</p>\n<p><strong>Ví dụ 8 — Caption mạng xã hội.</strong></p>\n<blockquote><em>Trước:</em> \"Một bữa trưa đầy năng lượng và dinh dưỡng để bắt đầu một tuần mới tràn đầy động lực!\"</blockquote>\n<blockquote><em>Sau:</em> \"Hộp cơm này là tôi cố chuộc lỗi với cái dạ dày sau ba ngày toàn mì gói deadline. Bông cải hơi cháy. Vẫn ăn.\"</blockquote>\n<p>Phiên bản thứ hai mang tính chân thực và có chút hài hước, qua đó tạo được sự kết nối với người đọc.</p>\n<p><strong>Ví dụ 9 — Đoạn phân tích.</strong></p>\n<blockquote><em>Trước:</em> \"AI có cả mặt tích cực lẫn tiêu cực. Một mặt, nó giúp tăng năng suất; mặt khác, nó đặt ra nhiều thách thức. Điều quan trọng là chúng ta cần sử dụng nó một cách có trách nhiệm và cân bằng.\"</blockquote>\n<blockquote><em>Sau:</em> \"Tôi nghĩ phần lớn nỗi sợ 'AI cướp việc viết' là sợ nhầm chỗ. AI không cướp việc của người viết giỏi — nó cướp việc của người viết trung bình. Và tôi thấy điều đó vừa đáng sợ vừa công bằng.\"</blockquote>\n<p>Phiên bản thứ hai đưa ra một quan điểm rõ ràng, trong khi phiên bản đầu tiên khá an toàn và trung lập.</p>\n<p><strong>Ví dụ 10 — Hai câu mở của chính cuốn sách.</strong></p>\n<blockquote><em>Trước:</em> \"Trong kỷ nguyên trí tuệ nhân tạo, việc tạo ra nội dung chưa bao giờ dễ dàng đến thế.\"</blockquote>\n<blockquote><em>Sau:</em> \"Tối Halloween năm 2024, hàng nghìn người đổ về trung tâm Dublin để xem diễu hành… Đoàn diễu hành không bao giờ tới, vì nó chưa từng tồn tại.\"</blockquote>\n<p>Phiên bản thứ hai mở đầu bằng một câu chuyện có thật và cụ thể, qua đó thu hút người đọc hiệu quả hơn.</p>\n<h3>Một lưu ý quan trọng</h3>\n<p>Qua mười ví dụ trên, chúng ta có thể nhận thấy một số điểm chung. Các phiên bản \"Sau\" thường sử dụng con số cụ thể, câu chuyện cá nhân, quan điểm rõ ràng và giọng văn gần gũi. Trong khi đó, các phiên bản \"Trước\" thường mang tính chung chung, trung lập và dễ đoán.</p>\n<p>Tuy nhiên, điều quan trọng cần lưu ý là chúng ta không nên biến những đặc điểm này thành một công thức máy móc. Dấu ấn con người không chỉ đơn thuần là việc thêm vào một con số hay một câu chuyện cá nhân. Đôi khi, một góc nhìn độc đáo cũng đủ để tạo nên sự khác biệt. Ví dụ: thay vì viết \"Khách hàng là thượng đế\", ta có thể viết \"Khách hàng không phải thượng đế. Thượng đế còn tha thứ; khách hàng thì bỏ đi, không nói một lời.\"</p>\n<p>Tóm lại, việc so sánh trực tiếp giữa hai phiên bản giúp chúng ta thấy rõ giá trị của cách viết mang đậm dấu ấn con người. Trong chương tiếp theo, chúng ta sẽ tìm hiểu cách tận dụng AI một cách hiệu quả mà vẫn giữ được yếu tố con người trong nội dung.</p>"}, {"num": 6, "title": "Tận dụng AI một cách hiệu quả và có trách nhiệm", "html": "<p>Sau khi đã tìm hiểu về cách viết nội dung mang đậm dấu ấn con người, một câu hỏi tự nhiên được đặt ra: liệu chúng ta có nên tiếp tục sử dụng AI hay không? Câu trả lời là có — vấn đề không nằm ở việc dùng hay không dùng AI, mà nằm ở cách chúng ta sử dụng nó. Trong chương này, chúng ta sẽ cùng tìm hiểu cách tận dụng AI một cách hiệu quả mà vẫn giữ được yếu tố con người.</p>\n<h3>Bốn giai đoạn của quá trình sáng tạo nội dung</h3>\n<p>Để sử dụng AI một cách hợp lý, trước tiên chúng ta cần hiểu rằng quá trình viết có thể được chia thành bốn giai đoạn chính:</p>\n<ol><li><strong>Tìm kiếm và nghiên cứu:</strong> thu thập thông tin, tra cứu và liệt kê các góc nhìn. AI rất mạnh ở giai đoạn này.</li><li><strong>Xây dựng cấu trúc:</strong> sắp xếp ý tưởng và tìm ra những lỗ hổng trong lập luận. AI cũng hỗ trợ tốt, nhưng người viết nên là người quyết định cuối cùng.</li><li><strong>Viết bản nháp:</strong> tạo ra những câu chữ đầu tiên. Ở giai đoạn này, cần thận trọng vì nội dung dễ trở nên khuôn mẫu.</li><li><strong>Đặt dấu ấn con người:</strong> thêm vào giọng văn, chi tiết cá nhân, quan điểm và cảm xúc. Đây là giai đoạn mà con người nên đóng vai trò chủ đạo.</li></ol>\n<p>Nói một cách ngắn gọn, AI nên đảm nhận phần \"đúng và đủ\", còn con người nên đảm nhận phần \"thật và riêng\". Sự kết hợp hài hòa giữa hai yếu tố này sẽ tạo ra những nội dung vừa chính xác vừa hấp dẫn.</p>\n<h3>Một số lưu ý quan trọng</h3>\n<p>Một điều cần lưu ý là sự xuất hiện của nhiều công cụ hứa hẹn \"nhân bản hóa\" nội dung AI hay giúp \"vượt qua\" các công cụ phát hiện. Tuy nhiên, đây không phải là một hướng đi bền vững. Việc tối ưu để \"qua mặt\" công cụ phát hiện không làm cho nội dung trở nên giá trị hơn; nó chỉ khiến nội dung khó bị phát hiện hơn mà thôi. Cách \"nhân bản hóa\" hiệu quả nhất vẫn là sự đầu tư thực sự của con người vào nội dung.</p>\n<h3>Lợi ích về mặt kinh doanh</h3>\n<p>Một tin tốt là việc viết nội dung chất lượng cao không chỉ tốt cho người đọc, mà còn mang lại lợi ích về mặt kinh doanh. Hệ thống xếp hạng \"nội dung hữu ích\" của Google được
